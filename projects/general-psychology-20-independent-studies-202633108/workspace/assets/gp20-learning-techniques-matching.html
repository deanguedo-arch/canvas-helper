<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Techniques (Matching)</title>
    <style>
      body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f5f7fb; color: #1f2b3f; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
      .card { background: #fff; border: 1px solid #ccd4e1; border-radius: 12px; padding: 1.1rem; }
      h1 { margin: 0 0 0.35rem; font-size: 1.8rem; }
      p.sub { margin: 0 0 1rem; color: #4d5c76; }
      .grid { display: grid; grid-template-columns: 1fr; gap: 0.65rem; }
      .row { border: 1px solid #d8dfeb; border-radius: 10px; padding: 0.65rem; background: #fafcff; }
      .term { font-weight: 700; margin-bottom: 0.4rem; }
      select { width: 100%; max-width: 720px; padding: 0.5rem; border-radius: 8px; border: 1px solid #b8c4d8; background: #fff; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 1rem; }
      button { border: 1px solid #2a4469; background: #2d4b75; color: #fff; border-radius: 8px; font-weight: 700; padding: 0.56rem 0.9rem; cursor: pointer; }
      button.secondary { background: #f7fafc; color: #1f2d44; border-color: #9fb0c8; }
      #report { margin-top: 1rem; border: 1px dashed #9db0c8; border-radius: 10px; background: #f8fbff; padding: 0.85rem; white-space: pre-wrap; font-size: 0.92rem; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>Learning Techniques (Matching)</h1>
        <p class="sub">Match each term to its definition/description, then generate a report for submission.</p>
        <div class="grid" id="grid"></div>
        <div class="actions">
          <button id="generate" type="button">Generate report</button>
          <button id="print" class="secondary" type="button">Print / Save PDF</button>
        </div>
        <div id="report">No report generated yet.</div>
      </section>
    </main>
    <script>
      const key = "gp20-learning-techniques-matching-v1";
      const terms = [
        "distributed practice",
        "Primacy effect",
        "Diminishing returns",
        "serial learning",
        "plateau",
        "Trial and Error",
        "Latent Learning",
        "simulation",
        "Advanced organizer"
      ];
      const choices = [
        "A. First items are remembered more easily",
        "B. Extra studying done following over-learning",
        "C. Trying many alternatives until the correct answer is found",
        "D. Discovering learning has occurred when the information is required",
        "E. Several learning sessions at spaced intervals",
        "F. An imitation of a learning situation",
        "G. A period of no apparent progress in learning",
        "H. Following a definite sequence in the learning process",
        "I. Information that prepares the learner for the main concept of the lesson"
      ];
      const grid = document.getElementById("grid");
      const reportEl = document.getElementById("report");
      terms.forEach((term, idx) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <div class="term">${idx + 1}. ${term}</div>
          <select id="m${idx}">
            <option value="">Select a definition...</option>
            ${choices.map((c) => `<option value="${c}">${c}</option>`).join("")}
          </select>
        `;
        grid.appendChild(row);
      });
      function saveDraft() {
        const data = {};
        terms.forEach((_, idx) => { data[`m${idx}`] = document.getElementById(`m${idx}`).value; });
        localStorage.setItem(key, JSON.stringify(data));
      }
      function restoreDraft() {
        try {
          const data = JSON.parse(localStorage.getItem(key) || "{}");
          terms.forEach((_, idx) => { document.getElementById(`m${idx}`).value = data[`m${idx}`] || ""; });
        } catch {}
      }
      function buildReport() {
        const lines = ["Learning Techniques (Matching) Report", `Generated: ${new Date().toLocaleString()}`, ""];
        terms.forEach((term, idx) => {
          lines.push(`${idx + 1}. ${term} -> ${document.getElementById(`m${idx}`).value || "(no response)"}`);
        });
        return lines.join("\n");
      }
      document.getElementById("generate").addEventListener("click", () => { saveDraft(); reportEl.textContent = buildReport(); });
      document.getElementById("print").addEventListener("click", () => { saveDraft(); reportEl.textContent = buildReport(); window.print(); });
      document.querySelectorAll("select").forEach((el) => el.addEventListener("change", saveDraft));
      restoreDraft();
    </script>
  </body>
</html>
