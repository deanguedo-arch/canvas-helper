    r.revealed.push(id);r.predictionLocked=true;r.tokens--;if(!m.seen.includes(id))m.seen.push(id);r.feedback=null;return true;
  }
  function select(r,id,checked) {
    if(r.phase!=='draft'||!r.revealed.includes(id))return false;
    if(checked&&!r.selected.includes(id)){if(r.selected.length>=2)return false;r.selected.push(id);}
    if(!checked)r.selected=r.selected.filter(x=>x!==id);
    r.feedback=null;return true;
  }
  function validate(s,r,m) {
    const fail=(code,message,field='conclusion',complete=true)=>({ok:false,uncertain:false,complete,code,message,field});
    if(s.stage==='practice'&&!r.prediction)return fail('prediction','Make a provisional prediction before investigating. It is not scored.','prediction',false);
    if(!['physical','chemical','insufficient'].includes(r.conclusion))return fail('missing-conclusion','Choose what the evidence supports.','conclusion',false);
    if(s.stage==='practice'&&(r.selected.length!==2||new Set(r.selected).size!==2||!r.selected.every(id=>r.revealed.includes(id)&&s.evidence.some(e=>e.id===id))))return fail('missing-evidence','Select two revealed records as evidence. Reopen the investigation to choose different records.','evidence',false);
    if(s.stage!=='transfer'&&r.conclusion==='chemical'&&!r.reaction)return fail('missing-reaction','Choose the reaction type for your chemical-change claim.','reaction',false);
    if(s.application&&!r.response)return fail('missing-response','Make the practical or environmental decision.','response',false);
    if(r.explanation.trim().length<15)return fail('missing-explanation','Add an explanation of at least 15 characters. This is only an input check, not a grade for your reasoning.','explanation',false);
    const uncertain=s.id==='P01'&&!m.seen.includes(s.uncertaintyRecord)&&r.conclusion==='insufficient';
    if(uncertain)return {ok:false,uncertain:true,complete:true,code:'uncertainty',message:'Your caution is justified: these records do not establish substance identity. Read the identity follow-up, then finish the case with a supported classification.',field:'feedback'};
    if(r.conclusion!==s.conclusion){
      if(r.conclusion==='insufficient'&&s.stage==='practice'&&!s.requiredEvidence.every(id=>m.seen.includes(id)))return fail('evidence-gap','Your caution is reasonable with the records you have opened. Reopen the investigation and look for identity evidence to finish this case.','evidence');
      return fail('conclusion',s.misconception,'conclusion');
    }
    if(s.stage==='practice'){
      const pair=[...r.selected].sort().join('|');
      if(!s.allowedPairs.some(p=>[...p].sort().join('|')===pair)){
        const weak=s.evidence.find(e=>r.selected.includes(e.id)&&e.role==='weak');
        return fail('evidence',weak?`${weak.why} Choose a pair that directly supports the claim.`:'Your pair needs the substance-identity evidence. Compare the relevant before-and-after records.','evidence');
      }
      if(s.reaction!=='none'&&r.reaction!==s.reaction)return fail('reaction','The chemical-change claim is supported. Now compare the reactants and products with the reaction-type descriptions.','reaction');
    }
    if(s.application&&r.response!==s.application.answer)return fail('response',s.application.feedback,'response');
    return {ok:true,uncertain:false,complete:true,code:'correct',message:'The structured choices are supported by the record. Your written explanation is submitted, not automatically graded. Review it below before continuing.',field:'feedback'};
  }
  function submit(s,r,m) {
    if(r.phase!=='draft')return r.feedback;
    const result=validate(s,r,m);r.feedback=result;
    if(!result.complete)return result;
    const attempt=freeze({number:m.attempts.length+1,caseId:s.id,version:s.version,prediction:r.prediction,conclusion:r.conclusion,reaction:r.reaction,evidence:[...r.selected],revealed:[...r.revealed],response:r.response,explanation:r.explanation,structuredOK:result.ok,uncertaintyJustified:result.uncertain,hints:m.hints,reopens:m.reopens,followup:m.followup});
    m.attempts.push(attempt);if(!m.firstAttempt)m.firstAttempt=attempt;
    if(result.ok||result.uncertain){r.phase=result.ok?'submitted':'uncertain';r.submission=freeze({attempt,fingerprint:fingerprint(r),ok:result.ok});r.rubric=[false,false,false,false];}
    return result;
  }
  function revise(r) {if(r.phase==='draft')return false;r.phase='draft';r.submission=null;r.feedback=null;r.rubric=[false,false,false,false];return true;}
  function hint(s,r,m) {if(r.phase!=='draft'||!m.attempts.some(a=>!a.structuredOK)||m.hints>=s.hints.length||s.stage==='transfer')return null;return s.hints[m.hints++];}
  function reopen(s,r,m) {
    if(s.stage!=='practice')return false;
    m.reopens++;r.phase='draft';r.submission=null;r.feedback=null;r.tokens=2;r.revealed=[];r.selected=[];r.rubric=[false,false,false,false];return true;
  }
  function followup(s,r,m) {
    if(s.id!=='P01'||r.phase!=='uncertain')return false;
    const id=s.uncertaintyRecord;m.followup=true;
    if(!m.seen.includes(id))m.seen.push(id);if(!r.revealed.includes(id))r.revealed.push(id);
    revise(r);return true;
  }
  function canAdvance(r) {return r.phase==='submitted'&&!!r.submission?.ok&&r.submission.fingerprint===fingerprint(r)&&r.rubric.length===4&&r.rubric.every(x=>x===true);}
  function finalize(s,r,m) {
    if(!canAdvance(r))return null;
    return freeze({caseId:s.id,version:s.version,completed:true,structuredOK:true,explanationStatus:'submitted — not automatically graded',rubricReviewed:true,submission:clone(r.submission.attempt),firstAttempt:clone(m.firstAttempt),hints:m.hints,reopens:m.reopens,followup:m.followup,visits:m.visits,attempts:clone(m.attempts)});
  }
  const engine={memory,round,edit,reveal,select,validate,submit,revise,hint,reopen,followup,canAdvance,finalize,fingerprint};
  root.RD_ENGINE=engine;if(typeof module!=='undefined'&&module.exports)module.exports=engine;
})(typeof window!=='undefined'?window:globalThis);

rted claim','Classify the change and connect it to evidence—not appearance alone.'],['03','Take it beyond the game','Finish with a new, exam-style record without hints or investigation tokens.']].map(([n,t,p])=>`<article class="route-card"><span class="route-num">${n}</span><div><h3>${t}</h3><p>${p}</p></div></article>`).join('')}</section><div class="case-line"><span><strong>Your casebook:</strong> peroxide · cooling solution · workshop tool · antacid · furnace · transfer</span><span>Virtual records only · Not instructions for real experiments</span></div>`;}
  function worked(){const s=D.scenarios[0];return `${masthead(1,'Worked example · Follow the reasoning before trying it yourself.')}<div class="workspace">${panel('The Case','01',`<div class="panel-content case-body"><div class="case-labels"><p class="case-kicker">W01 · Worked example</p><h3 class="case-heading" id="case-heading" tabindex="-1">${esc(s.displayTitle)}</h3></div>${image(s)}<p class="case-copy">${esc(s.caseText)}</p>${table(s.base)}</div>`)}${panel('The Evidence','02',`<div class="panel-content worked-evidence"><p class="helper">Compare substance identities first. Then consider the supporting observations.</p><div class="evidence-grid">${s.evidence.map((e,i)=>`<article class="evidence-card ${i<2?'selected':''}"><div class="evidence-heading"><span class="evidence-letter">${String.fromCharCode(65+i)}</span><h3>${esc(e.label)}</h3></div><div class="record-symbol">${icon(e.icon)}</div><p>${esc(e.detail)}</p>${i<2?'<span class="helper"><strong>Identity evidence</strong></span>':''}</article>`).join('')}</div><div class="word-equation">Hydrogen peroxide → water + oxygen</div></div>`)}${panel('The Reasoning','03',`<div class="panel-content"><ol class="worked-list"><li><div><strong>Make the claim</strong><span>A chemical change is supported.</span></div></li><li><div><strong>Use records A and B</strong><span>Water and oxygen are different substances from hydrogen peroxide. The identities—not just the bubbles—support the claim.</span></div></li><li><div><strong>Classify the pattern</strong><span>One compound forms simpler products: decomposition. A catalyst is not consumed in the overall change.</span></div></li><li><div><strong>Explain the energy observation</strong><span>${esc(s.scienceNote)}</span></div></li></ol><div class="callout"><strong>Why not just “there were bubbles”?</strong><p>Bubbles can also appear in physical processes. The identity records are the stronger evidence.</p></div><p class="worked-note">This is a demonstrated solution, not independent evidence of your understanding.</p></div>`)}</div><section class="feedback-zone"><div class="feedback-strip"><div class="feedback-cell"><span class="feedback-mark">${icon('hint')}</span><div><h2>Key idea</h2><p>${esc(s.keyIdea)}</p></div></div><div class="feedback-key">${btn('practice',`Your turn: investigate ${icon('arrow')}`,'full')}<p class="helper" style="margin-top:7px">Choose evidence, then make your own explanation.</p></div></div></section>`;}
  function casePanel(s,r){const locked=r.phase!=='draft';return panel('The Case','01',`<div class="panel-content case-body"><div class="case-labels"><p class="case-kicker">${esc(s.id)} · ${esc(s.scaffold)}</p><h3 class="case-heading" id="case-heading" tabindex="-1">${esc(s.displayTitle)}</h3></div>${image(s)}<p class="case-copy">${esc(s.caseText)}</p>${table(s.base)}<div class="predictions" id="prediction-group">${r.predictionLocked?`<p class="helper"><strong>Initial prediction:</strong> ${esc(D.conclusions.find(([v])=>v===r.prediction)?.[1])}</p><p class="helper">Keep the prediction; revise your final claim as the evidence changes.</p>`:`<label for="prediction" class="field-title">Before investigating: your prediction</label><select id="prediction" name="prediction"><option value="">Choose a provisional claim…</option>${D.conclusions.map(([v,l])=>`<option value="${v}" ${r.prediction===v?'selected':''}>${esc(l)}</option>`).join('')}</select><p class="helper">Not scored. Choose before opening records.</p>`}</div></div>`);}
  function evidencePanel(s,r,m){const locked=r.phase!=='draft';return panel('The Evidence','02',`<div class="panel-content"><div class="evidence-toolbar"><div class="tokens"><span class="token-dot ${r.tokens<2?'used':''}" aria-hidden="true"></span><span class="token-dot ${r.tokens<1?'used':''}" aria-hidden="true"></span><span>${r.tokens} ${r.tokens===1?'record':'records'} left</span></div><span class="evidence-status" id="selected-count">${r.selected.length} of 2 selected</span></div><p class="helper" id="evidence-instruction" style="margin-bottom:13px">${r.prediction?'Open up to two records. Select two that support your claim.':'Make a prediction first to unlock the records.'}</p><div class="evidence-grid" id="evidence-group" tabindex="-1">${s.evidence.map((e,i)=>{const revealed=r.revealed.includes(e.id),selected=r.selected.includes(e.id);return `<article id="evidence-${e.id}" tabindex="-1" class="evidence-card ${revealed?'':'locked'} ${selected?'selected':''}"><div class="evidence-heading"><span class="evidence-letter">${String.fromCharCode(65+i)}</span><h3>${esc(e.label)}</h3></div><div class="record-symbol">${icon(e.icon)}</div><p>${revealed?esc(e.detail):'Open this supplied record to examine the evidence.'}</p>${!revealed&&m.seen.includes(e.id)?'<span class="seen">Read earlier in this session</span>':''}${revealed?`<label class="checkline"><input id="select-${e.id}" type="checkbox" data-evidence="${e.id}" aria-label="Use record ${String.fromCharCode(65+i)}: ${esc(e.label)}" ${selected?'checked':''} ${locked?'disabled':''}><span>Use as evidence</span></label>`:btn('reveal',`Open record ${String.fromCharCode(65+i)}`,'secondary',`data-id="${e.id}" ${locked||!r.prediction||r.tokens<=0?'disabled':''}`)}</article>`;}).join('')}</div>${s.id==='P01'?'<div class="evidence-help">Choose records that tell you whether substance identity changed. A dramatic observation is not always the useful one.</div>':''}${m.reopens>0?`<details class="disclosure"><summary>Records you read earlier</summary><ul>${s.evidence.filter(e=>m.seen.includes(e.id)).map(e=>`<li><strong>${esc(e.label)}:</strong> ${esc(e.detail)}</li>`).join('')}</ul><p>Earlier records stay available here. A new investigation does not make you forget them.</p></details>`:''}</div>`);}
  function reactionSelect(s,r,locked){return `<div class="field" id="reaction-wrap" ${r.conclusion!=='chemical'?'hidden':''}><label for="reaction" class="field-title">Reaction type</label><select id="reaction" name="reaction" ${locked?'disabled':''}><option value="">Choose a reaction type…</option>${D.reactions.map(([value,label])=>`<option value="${value}" ${r.reaction===value?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`;}
  function explanation(r,locked,transfer=false){return `<div class="field"><label for="explanation" class="field-title">${transfer?'Explain using the record':'Explain your reasoning'}</label><textarea id="explanation" name="explanation" maxlength="3000" rows="4" aria-describedby="explanation-note" ${locked?'disabled':''} placeholder="${transfer?'Write your explanation here.':'Connect specific evidence to your claim.'}">${esc(r.explanation)}</textarea><span id="explanation-note" class="helper">Required · Not automatically graded · Up to 3,000 characters</span></div>`;}
  function reasoningPanel(s,r,m){const locked=r.phase!=='draft';return panel('Your Reasoning','03',`<div class="panel-content"><div class="reasoning-fields">${locked?'<p class="locked-answer"><strong>Submitted answer locked.</strong> Choose “Revise answer” to make changes.</p>':''}<fieldset id="conclusion-group"><legend>What does the evidence support?</legend>${choices('conclusion',r.conclusion,locked)}</fieldset>${reactionSelect(s,r,locked)}${s.application?`<div class="field"><label class="field-title" for="response">${esc(s.application.prompt)}</label><select id="response" name="response" ${locked?'disabled':''}><option value="">Choose a response…</option>${s.application.options.map(([value,label])=>`<option value="${value}" ${r.response===value?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`:''}${explanation(r,locked)}${s.starter&&!locked?`<p class="helper">Sentence starter: ${esc(s.starter)}</p>`:''}${s.id==='P02'&&!locked?'<p class="helper">Name the evidence, explain its connection, and avoid claiming more than the record shows.</p>':''}</div><div class="field-actions">${locked?btn('revise',`${icon('retry')} Revise answer`,'secondary full'):btn('submit',`Check claim ${icon('arrow')}`,'',`id="check-claim"`)}</div>${!locked?`<div class="field-actions">${btn('hint',`${icon('hint')} ${m.hints>=s.hints.length?'All hints used':`Hint ${m.hints+1} of ${s.hints.length}`}`,'quiet',`id="hint-button" ${!m.attempts.some(a=>!a.structuredOK)||m.hints>=s.hints.length?'disabled':''}`)}<span class="helper">After an attempt</span></div>`:''}</div>`);}
  const rubric=[['Claim','I state the change or reaction clearly.'],['Evidence','I name the relevant records.'],['Reasoning','I explain how the evidence supports my claim.'],['Limits','I avoid claiming more than the record shows.']];
  function attempts(s,m){return m.attempts.length?`<details class="disclosure attempts-box"><summary>Your attempt record (${m.attempts.length})</summary>${m.attempts.map(a=>`<article class="attempt"><strong>Attempt ${a.number}</strong> · <span class="result-label">${a.structuredOK?'Structured choices supported':a.uncertaintyJustified?'Uncertainty justified':'Needs revision'}</span><p>Claim: ${esc(D.conclusions.find(([v])=>v===a.conclusion)?.[1]||a.conclusion)}${a.reaction?` · Type: ${esc(D.reactions.find(([v])=>v===a.reaction)?.[1]||a.reaction)}`:''}</p>${a.evidence.length?`<p>Evidence: ${a.evidence.map(id=>esc(s.evidence.find(e=>e.id===id)?.label||id)).join('; ')}</p>`:''}<blockquote>${esc(a.explanation)}</blockquote><p class="helper">${a.hints} hints read · ${a.reopens} investigation restarts · Explanation submitted, not automatically graded.</p></article>`).join('')}</details>`:'';}
  function feedbackMarkup(s,r,m){const f=r.feedback,isTransfer=s.stage==='transfer',good=r.phase==='submitted',uncertain=r.phase==='uncertain';
    const title=good?'Structured choices supported':uncertain?'Uncertainty is justified':f?(f.complete?'Revise this attempt':'Finish this attempt'):'Your investigation';
    const message=f?.message||(isTransfer?'Use the supplied record. No hints or model answer are available before submission.':'Your choices have not been checked yet. Open relevant records, select evidence and explain your claim.');
    const key=good?s.keyIdea:isTransfer?'This is a new task. Your first complete structured response is kept separately from any later corrections.':'Use the records rather than the illustration. Your explanation must connect the evidence to the claim.';
    return `<div class="feedback-strip"><div class="feedback-cell"><span class="feedback-mark">${icon(good?'check':uncertain?'observe':f?'warn':'message')}</span><div><h2 id="feedback-title" tabindex="-1">${title}</h2><p>${esc(message)}</p></div></div><div class="feedback-cell feedback-key"><span class="feedback-mark">${icon(good?'hint':'record')}</span><div><h2>${good?'Key idea':isTransfer?'Independent record':'Keep in mind'}</h2><p>${esc(key)}</p></div></div></div>${uncertain?`<div class="uncertainty-followup">${btn('followup',`Read the identity follow-up ${icon('arrow')}`)}<p class="helper" style="margin-top:8px">Your justified uncertainty is recorded. This supported follow-up lets you finish the classification without erasing that attempt.</p></div>`:''}${good?`<div class="review-explanation"><div><h3>Your submitted explanation</h3><blockquote>${esc(r.explanation)}</blockquote><details class="disclosure"><summary>Compare with a model explanation</summary><p class="model-copy">${esc(s.model)}</p></details><p class="review-note">The model is a comparison tool. It is not a grade for your writing.</p></div><div><h3>Review your explanation</h3><div class="rubric-grid">${rubric.map(([a,b],i)=>`<label class="checkline"><input type="checkbox" data-rubric="${i}" ${r.rubric[i]?'checked':''}><span><strong>${a}</strong>${b}</span></label>`).join('')}</div><p class="review-note">Check each item after reviewing it. Revise your answer when a connection is missing.</p><div class="review-actions">${btn('revise','Revise answer','secondary')}${btn('advance',`${S.replay||isTransfer?'Review results':'Next case'} ${icon('arrow')}`,'',`id="next-case" ${!E.canAdvance(r)?'disabled':''}`)}</div></div></div>`:''}${S.hintText?`<div class="hint-box" id="hint-text" tabindex="-1"><strong>Hint ${m.hints} of ${s.hints.length}</strong>${esc(S.hintText)}</div>`:''}${attempts(s,m)}`;
  }
  function feedbackClass(r){return r.phase==='submitted'?'correct':r.phase==='uncertain'?'correct':r.feedback?'revise':'';}
  function feedback(s,r,m){return `<section id="feedback-zone" class="feedback-zone ${feedbackClass(r)} ${s.stage==='transfer'?'transfer-feedback':''}" aria-label="Feedback and next steps">${feedbackMarkup(s,r,m)}</section>`;}
  function tools(s,r){return `<div class="workspace-tools"><div class="workspace-nav">${previousButton()}${S.replay?btn('back-review','Back to review','secondary'):''}</div><p class="helper">${s.stage==='transfer'?'This is practice, not a secure or official exam. Written explanations are not automatically graded.':'Virtual records only. No real mixing, tasting, ignition or chemical-handling steps are part of this activity.'} Your current work is kept when you move back. Reloading clears this session.</p>${s.stage==='practice'?btn('reopen',`${icon('retry')} Choose different records`,'secondary',`${r.revealed.length===0?'disabled':''}`):''}</div>`;}
  function practice(){const s=scenario(),r=S.round,m=mem();return `${masthead(r.phase==='submitted'?3:2,`${s.scaffold} · ${S.replay?'Revisiting a completed case':'Case '+S.index+' of 4'}`)}<div class="workspace">${casePanel(s,r)}${evidencePanel(s,r,m)}${reasoningPanel(s,r,m)}</div>${feedback(s,r,m)}${tools(s,r)}`;}
  function transfer(){const s=scenario(),r=S.round,m=mem(),locked=r.phase!=='draft';return `${masthead(4,'Independent transfer · Apply the idea without the investigation board.')}<article class="exam-paper"><div class="exam-meta"><span class="mode-label">T01 · No hints · No tokens</span><span class="helper">${m.firstAttempt?'A first response is already on record. Further attempts are practice.':'Your first complete response will be kept.'}</span></div><h2 id="case-heading" tabindex="-1">A new situation</h2><p class="exam-passage">${esc(s.caseText)}</p>${table(s.base)}<p class="exam-question">${esc(s.prompt)}</p>${locked?'<p class="locked-answer">Submitted answer locked. Choose “Revise answer” to change it.</p>':''}<fieldset id="conclusion-group"><legend>What type of change is supported?</legend>${choices('conclusion',r.conclusion,locked)}</fieldset>${explanation(r,locked,true)}<div class="field-actions">${locked?btn('revise','Revise answer','secondary'):btn('submit',`Submit transfer ${icon('arrow')}`,'',`id="check-claim"`)}</div></article>${feedback(s,r,m)}${tools(s,r)}`;}
  function review(){const results=Object.values(S.results),t=S.results.T01;const first=t?.firstAttempt?.structuredOK;return `${masthead(5,'Your record · Separate supported choices from explanation quality.')}<section class="summary-heading"><div><p class="overline">Investigation complete</p><h2>Evidence. Explanation. Next steps.</h2><p>You completed ${results.length} of 5 learner tasks, following the worked example. Completion is not the same as mastery.</p></div><div class="summary-badge">${t?first?'Transfer: first structured answer supported':'Transfer: corrected after feedback':'Transfer not yet completed'}</div></section><section class="results-list" aria-label="Your case record">${D.scenarios.filter(s=>s.stage!=='worked').map(s=>{const r=S.results[s.id];return `<article class="result-card"><div class="result-main">${icon(r?'check':'record')}<div><p class="case-kicker">${esc(s.id)} · ${s.stage==='transfer'?'Independent transfer':'Practice'}</p><h3>${esc(s.title)}</h3><p class="result-meta">${r?`${r.attempts.length} complete ${r.attempts.length===1?'attempt':'attempts'} · ${r.hints} hints · ${r.reopens} investigation restarts${r.followup?' · Identity follow-up used':''}${r.visits>1?' · Practised again':''}`:'Not completed'}</p><p class="result-meta"><strong>${r?'Structured choices: supported. Explanation: submitted, not automatically graded.':'No completed response.'}</strong></p></div>${r?btn('replay',`${icon('retry')} Practise again`,'secondary',`data-id="${s.id}"`):''}</div>${r?`<details class="disclosure"><summary>Read your explanation and first-response record</summary><p><strong>Most recent submitted explanation</strong></p><blockquote>${esc(r.submission.explanation)}</blockquote><p><strong>First complete response:</strong> ${r.firstAttempt.structuredOK?'structured choices supported':r.firstAttempt.uncertaintyJustified?'uncertainty justified; identity follow-up needed':'structured choices needed revision'}.</p><blockquote>${esc(r.firstAttempt.explanation)}</blockquote><p>Self-check: reviewed. Written reasoning still needs your own careful comparison or teacher review.</p></details>`:''}</article>`;}).join('')}</section><div class="summary-bottom"><section><h3>Your next useful practice</h3><p>${!first?'Revisit the before-and-after identity record in Boiling Water. A corrected answer is progress, but not evidence of first-attempt independent success.':results.some(r=>r.hints||r.reopens||r.attempts.length>1)?'Return to a case where you used support. Explain the evidence in your own words before reopening a model answer.':'Explain one case aloud without the game, then solve a fresh question from your Unit A course.'}</p></section><section><h3>What this does—and does not—show</h3><p>You practised evidence selection, reaction classification and selected applications. This is not full Unit A coverage, a course grade or a guarantee of exam performance. No work is sent to a teacher or LMS.</p></section></div><div class="workspace-tools"><div class="workspace-nav">${previousButton()}${btn('print',`${icon('print')} Print your review`,'secondary')}</div><span class="helper">Go back to the transfer or an earlier case at any time; your session work is kept. Print only when you want a personal copy.</span>${btn('restart','Start a new session','secondary')}</div>`;}
  function render(options={}){
    const scrollY=window.scrollY;
    app.innerHTML=S.screen==='intro'?intro():S.screen==='worked'?worked():S.screen==='review'?review():scenario().stage==='transfer'?transfer():practice();
    if(options.top)window.scrollTo({top:0,behavior:'auto'});else window.scrollTo({top:scrollY,behavior:'auto'});
    if(options.focus)focus(options.focus,!!options.scroll);
  }
  function updateFeedback(){if(S.screen!=='case')return;const box=document.getElementById('feedback-zone');if(box){box.className=`feedback-zone ${feedbackClass(S.round)} ${scenario().stage==='transfer'?'transfer-feedback':''}`;box.innerHTML=feedbackMarkup(scenario(),S.round,mem());}}
  function sync(){const r=S.round;app.querySelectorAll('.option').forEach(label=>label.classList.toggle('selected',!!label.querySelector('input')?.checked));const wrap=document.getElementById('reaction-wrap');if(wrap){wrap.hidden=r.conclusion!=='chemical';document.getElementById('reaction').value=r.reaction;}app.querySelectorAll('[data-action=reveal]').forEach(b=>b.disabled=r.phase!=='draft'||!r.prediction||r.tokens<=0);const inst=document.getElementById('evidence-instruction');if(inst&&r.prediction)inst.textContent='Open up to two records. Select two that support your claim.';const count=document.getElementById('selected-count');if(count)count.textContent=`${r.selected.length} of 2 selected`;app.querySelectorAll('[data-evidence]').forEach(c=>c.closest('.evidence-card').classList.toggle('selected',c.checked));updateFeedback();}
  function openModal(title,content,callback=null,confirmText='Continue'){
    lastModalTrigger=document.activeElement;modalAction=callback;document.getElementById('dialog-content').innerHTML=`<h2 id="dialog-title">${esc(title)}</h2>${content}<div class="actions">${btn('modal-close',callback?'Keep working':'Close','secondary',`autofocus`)}${callback?btn('modal-confirm',esc(confirmText)):''}</div>`;dialog.showModal();
  }
  function closeModal(run=false){const fn=modalAction;modalAction=null;dialog.close();if(run&&fn)fn();else if(lastModalTrigger?.isConnected)lastModalTrigger.focus();}
  function errorFocus(f){const fields={prediction:'prediction',conclusion:'conclusion-physical',evidence:'evidence-group',reaction:'reaction',response:'response',explanation:'explanation'};const id=fields[f.field];const n=document.getElementById(id);if(n){n.setAttribute('aria-invalid','true');focus(id,true);}else focus('feedback-title',true);}
  function handleAction(button){const a=button.dataset.action;if(button.disabled)return;
    if(a==='modal-close')return closeModal();if(a==='modal-confirm')return closeModal(true);
    if(a==='previous')return goPrevious();
    if(a==='help')return openModal('How the investigation works',`<ol><li>Read the base observations and make a provisional prediction.</li><li>Open up to two records. Choose two relevant records as evidence.</li><li>Make your final claim and write the connection between evidence and claim.</li><li>Use feedback to revise. Review your explanation before moving on.</li></ol><p>Use <strong>Previous step</strong> whenever you want to return to an earlier case or the worked example. Your current draft and submitted work are kept in this session, so you can move back and then continue forward without starting over.</p><p>Keyboard: Tab moves between controls; arrow keys select radio choices; Space selects a checkbox. No dragging, timing or sound is required.</p><p>All examples are fictional records, not real-world experiment instructions. Work stays in memory and is lost on reload.</p>`);
    if(a==='start')return navigate('worked',0);
    if(a==='practice')return navigate('case',1);
    if(a==='restart')return openModal('Start a new session?',`<p>This clears all answers, attempts and results in this session. Nothing has been saved or sent anywhere. Print the review first to keep a personal copy.</p>`,()=>{S=fresh();render({focus:'activity-heading',top:true});},'Clear and restart');
    if(a==='print'){const details=[...app.querySelectorAll('details')],was=details.map(d=>d.open);details.forEach(d=>d.open=true);window.addEventListener('afterprint',()=>details.forEach((d,i)=>d.open=was[i]),{once:true});window.print();return;}
    if(a==='replay'){const index=D.scenarios.findIndex(s=>s.id===button.dataset.id);if(index>0&&S.results[button.dataset.id])navigate('case',index,true);return;}
    if(S.screen!=='case')return;
    const s=scenario(),r=S.round,m=mem();
    if(a==='reveal'){if(E.reveal(s,r,m,button.dataset.id)){render({focus:'evidence-'+button.dataset.id});announce(`Record opened. ${r.tokens} records left to open.`);}return;}
    if(a==='submit'){
      const f=E.submit(s,r,m);render({focus:'feedback-title',scroll:true});
      if(!f.complete)errorFocus(f);announce(f.message);return;
    }
    if(a==='revise'){if(E.revise(r)){S.hintText=null;render({focus:'conclusion-physical',scroll:true});announce('Revision opened. The previous submission is kept; check the revised answer again before continuing.');}return;}
    if(a==='hint'){const text=E.hint(s,r,m);if(text){S.hintText=text;render({focus:'hint-text',scroll:true});announce(`Hint ${m.hints}: ${text}`);}return;}
    if(a==='followup'){if(E.followup(s,r,m)){S.hintText=null;render({focus:'evidence-'+s.uncertaintyRecord,scroll:true});announce('Identity follow-up opened. Revise your claim using this record.');}return;}
    if(a==='reopen')return openModal('Choose different records?',`<p>You will have two record openings again. Your prediction, explanation, earlier attempts and hints stay in this session. Earlier evidence remains available in the history.</p><p>Your current submission, evidence selection and explanation self-check will be cleared. Check the revised answer before continuing.</p>`,()=>{E.reopen(s,r,m);S.hintText=null;render({focus:'evidence-group',scroll:true});announce('Investigation reopened. Two record openings are available. Previous attempts were kept.');},'Reopen investigation');
    if(a==='advance'){
      const result=E.finalize(s,r,m);if(!result){announce('Review each explanation item and check your latest answer before continuing.');return;}
      S.results[s.id]=result;if(S.replay||s.stage==='transfer')navigate('review');else navigate('case',S.index+1);return;
    }
    if(a==='back-review')return openModal('Return to your review?',`<p>The current uncompleted draft will not replace your earlier case result. Submitted attempts remain in this session.</p>`,()=>navigate('review'),'Return to review');
  }
  app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handleAction(b);});
  document.getElementById('dialog-content').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handleAction(b);});
  dialog.addEventListener('cancel',e=>{e.preventDefault();closeModal();});
  app.addEventListener('change',e=>{
    if(S.screen!=='case')return;const el=e.target,r=S.round;
    if(el.matches('[data-rubric]')){r.rubric[Number(el.dataset.rubric)]=el.checked;const next=document.getElementById('next-case');if(next)next.disabled=!E.canAdvance(r);return;}
    if(el.matches('[data-evidence]')){if(!E.select(r,el.dataset.evidence,el.checked)){el.checked=r.selected.includes(el.dataset.evidence);announce('Select at most two evidence records. Unselect one before choosing another.');}sync();return;}
    if(['prediction','conclusion','reaction','response'].includes(el.name)){E.edit(r,el.name,el.value);el.removeAttribute('aria-invalid');sync();}
  });
  app.addEventListener('input',e=>{if(S.screen==='case'&&e.target.id==='explanation'){E.edit(S.round,'explanation',e.target.value);e.target.removeAttribute('aria-invalid');updateFeedback();}});
  // Decorative art failures must never remove evidence or block a task.
  document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement){const frame=e.target.closest('.scene-frame');if(frame)frame.classList.add('unavailable');else e.target.style.display='none';}},true);
  render();
})();

</script>
</body>
</html>
