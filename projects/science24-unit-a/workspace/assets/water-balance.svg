<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#146c60"/></marker></defs><rect width="900" height="330" fill="#f7f8f5"/><g font-family="Arial,sans-serif" fill="#171b1b"><text x="55" y="63" font-size="31" font-weight="700">2H₂ + O₂ → 2H₂O</text><rect x="45" y="112" width="355" height="110" rx="5" fill="white" stroke="#b6c6ba"/><text x="222.5" y="150" text-anchor="middle" font-size="23" font-weight="700">Reactant atom count</text><text x="222.5" y="180" text-anchor="middle" font-size="18">H = 4     O = 2</text><path d="M418,162 L484,162" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><rect x="506" y="112" width="355" height="110" rx="5" fill="white" stroke="#b6c6ba"/><text x="683.5" y="150" text-anchor="middle" font-size="23" font-weight="700">Product atom count</text><text x="683.5" y="180" text-anchor="middle" font-size="18">H = 4     O = 2</text><text x="55" y="285" font-size="23">Same atoms; different molecular arrangement.</text></g></svg>