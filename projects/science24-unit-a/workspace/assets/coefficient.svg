<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#146c60"/></marker></defs><rect width="900" height="330" fill="#f7f8f5"/><g font-family="Arial,sans-serif" fill="#171b1b"><text x="360" y="150" font-size="76" font-weight="700">3H₂O</text><path d="M170,60 L365,115" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><path d="M625,235 L464,162" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="53" font-size="24">3 whole water molecules</text><text x="510" y="280" font-size="23">2 H atoms in each molecule</text><text x="45" y="310" font-size="21">Totals: H = 3 × 2 = 6; O = 3 × 1 = 3</text></g></svg>