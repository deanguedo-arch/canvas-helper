<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660" role="img" aria-labelledby="title desc"><title id="title">Connect the Unit A explanations</title><desc id="desc">Material properties inform a choice. Chemical reactions form new substances. Word equations name substances; balanced formulas account for atoms. Energy is transferred across the system boundary. Evidence supports environmental and protection claims.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="660" fill="#fff"/><rect x="35" y="20" width="530" height="94" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="58.333333333333336" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Material properties</text><text x="300" y="94.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Choose a product for its job</text><line x1="300" y1="114" x2="300" y2="139" stroke="#087d75" stroke-width="4" /><path d="M 291 127 L 300 139 L 309 127" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 139)"/><rect x="35" y="146" width="530" height="94" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="184.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Chemical change</text><text x="300" y="220.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Use evidence of new substances</text><line x1="300" y1="240" x2="300" y2="265" stroke="#087d75" stroke-width="4" /><path d="M 291 253 L 300 265 L 309 253" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 265)"/><rect x="35" y="272" width="530" height="94" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="310.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Equations and atoms</text><text x="300" y="346.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Keep an account of matter</text><line x1="300" y1="366" x2="300" y2="391" stroke="#087d75" stroke-width="4" /><path d="M 291 379 L 300 391 L 309 379" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 391)"/><rect x="35" y="398" width="530" height="94" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="436.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">System and surroundings</text><text x="300" y="472.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Trace the net energy transfer</text><line x1="300" y1="492" x2="300" y2="517" stroke="#087d75" stroke-width="4" /><path d="M 291 505 L 300 517 L 309 505" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 517)"/><rect x="35" y="524" width="530" height="94" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="562.3333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Environmental claims</text><text x="300" y="598.3333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Explain pathways and limitations</text></svg>
