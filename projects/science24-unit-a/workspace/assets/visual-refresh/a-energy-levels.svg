<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc"><title id="title">Energy changes across the reacting system</title><desc id="desc">Exothermic: products have lower chemical energy than reactants and net energy leaves. Endothermic: products have higher chemical energy and net energy enters. Schematic, not measured.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="430" fill="#fff"/><text x="155" y="40" font-size="32" fill="#174c24" font-weight="700" text-anchor="middle">Exothermic</text><text x="450" y="40" font-size="32" fill="#087d75" font-weight="700" text-anchor="middle">Endothermic</text><rect x="18" y="65" width="270" height="330" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><rect x="312" y="65" width="270" height="330" rx="5" fill="#eff7f6" stroke="#cbd9d2" stroke-width="2"/><text x="155" y="108" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Reactants</text><line x1="48" y1="133" x2="166" y2="133" stroke="#174c24" stroke-width="5" /><line x1="252" y1="142" x2="252" y2="292" stroke="#925900" stroke-width="4" /><path d="M 243 280 L 252 292 L 261 280" fill="none" stroke="#925900" stroke-width="4" transform="rotate(0 252 292)"/><text x="135" y="226" font-size="28" fill="#925900" font-weight="700" text-anchor="middle">Net energy</text><text x="135" y="262" font-size="28" fill="#925900" font-weight="700" text-anchor="middle">out</text><line x1="48" y1="314" x2="166" y2="314" stroke="#174c24" stroke-width="5" /><text x="155" y="363" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Products</text><text x="450" y="108" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Products</text><line x1="340" y1="133" x2="458" y2="133" stroke="#087d75" stroke-width="5" /><line x1="545" y1="292" x2="545" y2="143" stroke="#087d75" stroke-width="4" /><path d="M 536 131 L 545 143 L 554 131" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(-180 545 143)"/><text x="429" y="226" font-size="28" fill="#087d75" font-weight="700" text-anchor="middle">Net energy</text><text x="429" y="262" font-size="28" fill="#087d75" font-weight="700" text-anchor="middle">in</text><line x1="340" y1="314" x2="458" y2="314" stroke="#087d75" stroke-width="5" /><text x="450" y="363" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Reactants</text><text x="300" y="418" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">Higher on the page = more chemical energy</text></svg>
