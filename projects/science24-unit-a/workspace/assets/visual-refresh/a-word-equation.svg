<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Read a word equation</title><desc id="desc">Magnesium plus oxygen produces magnesium oxide. The two starting substances are reactants; magnesium oxide is the product. The arrow indicates the direction of the reaction.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="420" fill="#fff"/><text x="300" y="45" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">Reactants: starting substances</text><rect x="18" y="75" width="252" height="86" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="144" y="127.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">magnesium</text><text x="300" y="130" font-size="42" fill="#087d75" font-weight="700" text-anchor="middle">+</text><rect x="330" y="75" width="252" height="86" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="456" y="127.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">oxygen</text><line x1="300" y1="171" x2="300" y2="237" stroke="#087d75" stroke-width="4" /><path d="M 291 225 L 300 237 L 309 225" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 237)"/><text x="327" y="207" font-size="26" fill="#087d75" font-weight="400" text-anchor="start">produces</text><rect x="145" y="252" width="310" height="92" rx="5" fill="#fff5e1" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="307.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">magnesium oxide</text><text x="300" y="393" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">Product: substance formed</text></svg>
