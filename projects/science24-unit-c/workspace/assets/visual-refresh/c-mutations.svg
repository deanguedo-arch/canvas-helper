<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">Compare three changes to a DNA sequence</title><desc id="desc">The reference single-strand sequence is ACTGAC. Substitution gives ACAGAC, insertion gives ACGTGAC, and deletion gives ACGAC. These schematic changes do not by themselves determine the effect on an organism.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="600" fill="#fff"/><text x="300" y="35" font-size="28" fill="#174c24" font-weight="700" text-anchor="middle">Reference sequence</text><rect x="117" y="52" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="145" y="95" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">A</text><rect x="179" y="52" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="207" y="95" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">C</text><rect x="241" y="52" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="269" y="95" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">T</text><rect x="303" y="52" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="331" y="95" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">G</text><rect x="365" y="52" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="393" y="95" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">A</text><rect x="427" y="52" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="455" y="95" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">C</text><text x="300" y="161" font-size="27" fill="#174c24" font-weight="700" text-anchor="middle">Substitution: one base replaced</text><rect x="117" y="179" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="145" y="222" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">A</text><rect x="179" y="179" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="207" y="222" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">C</text><rect x="241" y="179" width="56" height="62" rx="5" fill="#fff5e1" stroke="#cbd9d2" stroke-width="2"/><text x="269" y="222" font-size="32" fill="#925900" font-weight="700" text-anchor="middle">A</text><rect x="303" y="179" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="331" y="222" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">G</text><rect x="365" y="179" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="393" y="222" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">A</text><rect x="427" y="179" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="455" y="222" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">C</text><text x="300" y="288" font-size="27" fill="#174c24" font-weight="700" text-anchor="middle">Insertion: one base added</text><rect x="86" y="306" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="114" y="349" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">A</text><rect x="148" y="306" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="176" y="349" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">C</text><rect x="210" y="306" width="56" height="62" rx="5" fill="#fff5e1" stroke="#cbd9d2" stroke-width="2"/><text x="238" y="349" font-size="32" fill="#925900" font-weight="700" text-anchor="middle">G</text><rect x="272" y="306" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="349" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">T</text><rect x="334" y="306" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="362" y="349" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">G</text><rect x="396" y="306" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="424" y="349" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">A</text><rect x="458" y="306" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="486" y="349" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">C</text><text x="300" y="415" font-size="27" fill="#174c24" font-weight="700" text-anchor="middle">Deletion: one base removed</text><rect x="148" y="433" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="176" y="476" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">A</text><rect x="210" y="433" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="238" y="476" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">C</text><rect x="272" y="433" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="476" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">G</text><rect x="334" y="433" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="362" y="476" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">A</text><rect x="396" y="433" width="56" height="62" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="424" y="476" font-size="32" fill="#192522" font-weight="700" text-anchor="middle">C</text><text x="300" y="564" font-size="27" fill="#087d75" font-weight="700" text-anchor="middle">The effect depends on 