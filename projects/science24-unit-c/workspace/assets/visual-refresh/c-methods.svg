<svg xmlns="http://www.w3.org/2000/svg" width="600" height="770" viewBox="0 0 600 770" role="img" aria-labelledby="title desc"><title id="title">Match infection control to its target</title><desc id="desc">Cleaning removes material. Disinfection reduces specified microbes on suitable non-living surfaces. Antisepsis reduces microbes on living tissue. Sterilization is a validated process eliminating viable microorganisms on equipment. Aseptic practice prevents contamination.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="770" fill="#fff"/><text x="300" y="43" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">Target and intended outcome</text><rect x="25" y="75" width="550" height="116" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="124.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Cleaning</text><text x="300" y="160.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Remove visible material</text><rect x="25" y="213" width="550" height="116" rx="5" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="262.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Disinfection: suitable surfaces</text><text x="300" y="297.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Reduce specified microorganisms</text><rect x="25" y="351" width="550" height="116" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="400.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Antisepsis: living tissue</text><text x="300" y="435.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Use the product as directed</text><rect x="25" y="489" width="550" height="138" rx="5" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="532" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Sterilization: equipment</text><text x="300" y="567" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Validated elimination of</text><text x="300" y="602" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">viable microorganisms</text><text x="300" y="685" font-size="28" fill="#087d75" font-weight="700" text-anchor="middle">Aseptic practice prevents</text><text x="300" y="721" font-size="28" fill="#087d75" font-weight="700" text-anchor="middle">contamination during a task.</text></svg>
