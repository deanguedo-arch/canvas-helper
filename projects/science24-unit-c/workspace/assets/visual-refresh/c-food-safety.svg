<svg xmlns="http://www.w3.org/2000/svg" width="600" height="534" viewBox="0 0 600 534" role="img" aria-labelledby="title desc"><title id="title">Four complementary food-safety controls</title><desc id="desc">Clean hands and tools; separate raw and ready-to-eat food; cook to a safe temperature; chill to slow microbial growth. These are prevention controls, not sterilization or a guarantee that unsafe food becomes safe.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="534" fill="#fff"/><rect x="35" y="20" width="530" height="94" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="58.333333333333336" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Clean</text><text x="300" y="94.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Hands, surfaces and tools</text><line x1="300" y1="114" x2="300" y2="139" stroke="#087d75" stroke-width="4" /><path d="M 291 127 L 300 139 L 309 127" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 139)"/><rect x="35" y="146" width="530" height="94" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="184.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Separate</text><text x="300" y="220.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Raw and ready-to-eat food</text><line x1="300" y1="240" x2="300" y2="265" stroke="#087d75" stroke-width="4" /><path d="M 291 253 L 300 265 L 309 253" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 265)"/><rect x="35" y="272" width="530" height="94" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="310.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Cook</text><text x="300" y="346.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Use an appropriate safe temperature</text><line x1="300" y1="366" x2="300" y2="391" stroke="#087d75" stroke-width="4" /><path d="M 291 379 L 300 391 L 309 379" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 391)"/><rect x="35" y="398" width="530" height="94" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="436.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Chill</text><text x="300" y="472.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Slow microbial growth</text></svg>
