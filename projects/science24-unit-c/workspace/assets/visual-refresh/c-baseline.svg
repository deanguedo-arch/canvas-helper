<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title desc"><title id="title">Compare the same place and period</title><desc id="desc">In the existing authored example, a town usually reports about two cases per week but reports 25 this week. This excess signals a need to investigate. It is not real surveillance data or proof of a pandemic.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="490" fill="#fff"/><text x="300" y="44" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">Reported cases in one week</text><line x1="88" y1="94" x2="88" y2="358" stroke="#192522" stroke-width="3" /><line x1="88" y1="358" x2="565" y2="358" stroke="#192522" stroke-width="3" /><text x="60" y="366" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">0</text><line x1="88" y1="358" x2="565" y2="358" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="60" y="281" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">10</text><line x1="88" y1="273" x2="565" y2="273" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="60" y="196" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">20</text><line x1="88" y1="188" x2="565" y2="188" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="60" y="111" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">30</text><line x1="88" y1="103" x2="565" y2="103" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><rect x="145" y="341" width="118" height="17" rx="0" fill="#edf5ef" stroke="#087d75" stroke-width="2"/><text x="204" y="326" font-size="32" fill="#087d75" font-weight="700" text-anchor="middle">≈ 2</text><rect x="380" y="145.5" width="118" height="212.5" rx="0" fill="#edf5ef" stroke="#174c24" stroke-width="2"/><text x="439" y="131" font-size="32" fill="#174c24" font-weight="700" text-anchor="middle">25</text><text x="204" y="404" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">Usual weekly</text><text x="204" y="438" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">baseline</text><text x="439" y="404" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">This week’s</text><text x="439" y="438" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">reports</text></svg>
