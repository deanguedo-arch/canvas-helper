<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc"><title id="title">Selection changes a bacterial population</title><desc id="desc">A bacterial population contains some resistant bacteria before treatment. A suitable antibiotic removes susceptible bacteria; resistant survivors can reproduce. The treatment selects survivors rather than purposefully changing all bacteria.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="650" fill="#fff"/><text x="300" y="42" font-size="32" fill="#174c24" font-weight="700" text-anchor="middle">Before treatment</text><text x="300" y="83" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">Resistance is already present in some.</text><g transform="translate(70 140)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#087d75" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(135 140)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#087d75" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(200 140)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(265 140)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#087d75" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(330 140)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#087d75" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(395 140)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#087d75" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(460 140)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(525 140)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#087d75" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><line x1="300" y1="191" x2="300" y2="254" stroke="#087d75" stroke-width="4" /><path d="M 291 242 L 300 254 L 309 242" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 254)"/><text x="340" y="227" font-size="26" fill="#087d75" font-weight="400" text-anchor="start">Antibiotic</text><text x="300" y="297" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">Resistant survivors</text><g transform="translate(245 353)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(355 353)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><line x1="300" y1="396" x2="300" y2="454" stroke="#087d75" stroke-width="4" /><path d="M 291 442 L 300 454 L 309 442" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 454)"/><text x="340" y="432" font-size="26" fill="#087d75" font-weight="400" text-anchor="start">Reproduction</text><text x="300" y="494" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">Later population</text><g transform="translate(70 553)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(135 553)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(200 553)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(265 553)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(330 553)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(395 553)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(460 553)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><g transform="translate(525 553)"><rect x="-12" y="-27" width="24" height="54" rx="12" fill="#925900" transform="rotate(25)"/><circle r="4" fill="#fff"/></g><text x="300" y="622" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">Selection, not a purposeful change.</text></svg>
