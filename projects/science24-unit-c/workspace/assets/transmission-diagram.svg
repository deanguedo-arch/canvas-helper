<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Infection pathway</title><desc id="desc">Trace an exposure before choosing a control.</desc><rect width="960" height="340" fill="#f8fbfa"/><text x="35" y="49" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#173b39">Infection pathway</text><rect x="32" y="93" width="198" height="155" rx="4" fill="#ffffff" stroke="#bdd2ce" stroke-width="2"/><rect x="32" y="93" width="198" height="8" fill="#006a60"/><circle cx="63" cy="129" r="17" fill="#006a60"/><text x="63" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">A</text><text x="48" y="170" font-family="Arial,sans-serif" font-size="17" fill="#203230">Person with respiratory</text><text x="48" y="193" font-family="Arial,sans-serif" font-size="17" fill="#203230">infection</text><path d="M234 170 h22" stroke="#006a60" stroke-width="3"/><path d="M256 170 l-9 -6 v12 z" fill="#006a60"/><rect x="263" y="93" width="198" height="155" rx="4" fill="#ffffff" stroke="#bdd2ce" stroke-width="2"/><rect x="263" y="93" width="198" height="8" fill="#006a60"/><circle cx="294" cy="129" r="17" fill="#006a60"/><text x="294" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">B</text><text x="279" y="170" font-family="Arial,sans-serif" font-size="17" fill="#203230">Exhaled droplets</text><path d="M465 170 h22" stroke="#006a60" stroke-width="3"/><path d="M487 170 l-9 -6 v12 z" fill="#006a60"/><rect x="494" y="93" width="198" height="155" rx="4" fill="#ffffff" stroke="#bdd2ce" stroke-width="2"/><rect x="494" y="93" width="198" height="8" fill="#006a60"/><circle cx="525" cy="129" r="17" fill="#006a60"/><text x="525" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">C</text><text x="510" y="170" font-family="Arial,sans-serif" font-size="17" fill="#203230">Shared air or close</text><text x="510" y="193" font-family="Arial,sans-serif" font-size="17" fill="#203230">contact</text><path d="M696 170 h22" stroke="#006a60" stroke-width="3"/><path d="M718 170 l-9 -6 v12 z" fill="#006a60"/><rect x="725" y="93" width="198" height="155" rx="4" fill="#ffffff" stroke="#bdd2ce" stroke-width="2"/><rect x="725" y="93" width="198" height="8" fill="#006a60"/><circle cx="756" cy="129" r="17" fill="#006a60"/><text x="756" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">D</text><text x="741" y="170" font-family="Arial,sans-serif" font-size="17" fill="#203230">Mouth and nose of</text><text x="741" y="193" font-family="Arial,sans-serif" font-size="17" fill="#203230">another person</text><text x="35" y="304" font-family="Arial,sans-serif" font-size="17" fill="#3c5752">Trace an exposure before choosing a control.</text></svg>