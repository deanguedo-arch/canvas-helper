<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Tt by tt Punnett square</title><desc id="desc">Parent one gametes T and t across the top; parent two gametes t and t down the left. Cells are Tt, tt, Tt, tt. Model predicts one half Tt and one half tt.</desc><rect width="960" height="520" fill="#f8fbfa"/><text x="42" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#173b39">Tt × tt: combine one allele from each parent</text><text x="334" y="104" font-family="Arial,sans-serif" font-size="18" fill="#335b57">A · Parent 1 gametes</text><text x="345" y="147" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#006a60">T</text><text x="539" y="147" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#006a60">t</text><text x="71" y="242" font-family="Arial,sans-serif" font-size="18" fill="#335b57">B · Parent 2</text><text x="152" y="271" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#006a60">t</text><text x="152" y="359" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#006a60">t</text><rect x="227" y="166" width="380" height="212" fill="white" stroke="#48716d" stroke-width="3"/><path d="M417 166v212 M227 272h380" stroke="#48716d" stroke-width="2"/><text x="322" y="237" font-family="Arial,sans-serif" font-size="30" text-anchor="middle" fill="#173b39">Tt</text><text x="512" y="237" font-family="Arial,sans-serif" font-size="30" text-anchor="middle" fill="#173b39">tt</text><text x="322" y="343" font-family="Arial,sans-serif" font-size="30" text-anchor="middle" fill="#173b39">Tt</text><text x="512" y="343" font-family="Arial,sans-serif" font-size="30" text-anchor="middle" fill="#173b39">tt</text><text x="641" y="234" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#006a60">C · Four combinations</text><text x="641" y="272" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#006a60">D · 2 Tt : 2 tt</text><text x="42" y="450" font-family="Arial,sans-serif" font-size="18" fill="#335b57">The model gives probabilities; four cells do not promise exactly four offspring.</text></svg>