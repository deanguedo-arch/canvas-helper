<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
<title id="title">Water safety uses several barriers from source to tap</title>
<desc id="desc">A: source water can carry hazards. B: treatment removes particles and inactivates microbes. C: operators sample and interpret results. D: a distribution pipe carries water to a household tap. A failed check leads to correction and public advice.</desc>
<rect width="1040" height="520" fill="#f7faf8"/>
<text x="38" y="54" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#173c39">Safe water takes more than one barrier</text>
<text x="38" y="84" font-family="Arial,sans-serif" font-size="17" fill="#49615c">Follow the route. At each step, ask what can fail and how the failure would be noticed.</text>
<path d="M42 289 H997" stroke="#9cbeb8" stroke-width="5" stroke-dasharray="9 8"/>
<g font-family="Arial,sans-serif">
  <g transform="translate(34 120)">
    <rect width="220" height="263" rx="6" fill="#fff" stroke="#b5cec8" stroke-width="2"/>
    <circle cx="29" cy="31" r="19" fill="#00695f"/><text x="29" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">A</text>
    <text x="58" y="38" font-size="19" font-weight="700" fill="#173c39">Source water</text>
    <path d="M18 131 Q55 109 94 130 T170 127 T208 130 V191 H18 Z" fill="#c4e3ec" stroke="#397d90" stroke-width="2"/>
    <path d="M16 190 Q70 176 117 192 T210 190" fill="none" stroke="#397d90" stroke-width="3"/>
    <path d="M91 96 l8 -21 8 21 M143 106 l7 -18 8 18" fill="none" stroke="#765c43" stroke-width="4"/>
    <circle cx="76" cy="167" r="5" fill="#b56d39"/><circle cx="133" cy="151" r="5" fill="#b56d39"/>
    <text x="16" y="234" font-size="15" fill="#355650">Protect the watershed.</text>
    <text x="16" y="255" font-size="15" fill="#355650">Hazards may enter here.</text>
  </g>
  <path d="M258 258 h26 m-10 -9 11 9 -11 9" fill="none" stroke="#00695f" stroke-width="4"/>
  <g transform="translate(288 120)">
    <rect width="220" height="263" rx="6" fill="#fff" stroke="#b5cec8" stroke-width="2"/>
    <circle cx="29" cy="31" r="19" fill="#00695f"/><text x="29" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">B</text>
    <text x="58" y="38" font-size="19" font-weight="700" fill="#173c39">Treatment</text>
    <path d="M28 103 v112 h163 V103" fill="#e7f2ef" stroke="#46756d" stroke-width="3"/>
    <path d="M29 139 h162 M29 176 h162" stroke="#46756d" stroke-width="3"/>
    <circle cx="73" cy="125" r="5" fill="#9b7046"/><circle cx="112" cy="125" r="5" fill="#9b7046"/>
    <path d="M156 120 l5 9 10 -20" fill="none" stroke="#00695f" stroke-width="4"/>
    <text x="16" y="234" font-size="15" fill="#355650">Remove particles;</text>
    <text x="16" y="255" font-size="15" fill="#355650">inactivate microbes.</text>
  </g>
  <path d="M512 258 h26 m-10 -9 11 9 -11 9" fill="none" stroke="#00695f" stroke-width="4"/>
  <g transform="translate(542 120)">
    <rect width="220" height="263" rx="6" fill="#fff" stroke="#b5cec8" stroke-width="2"/>
    <circle cx="29" cy="31" r="19" fill="#00695f"/><text x="29" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">C</text>
    <text x="58" y="38" font-size="19" font-weight="700" fill="#173c39">Monitoring</text>
    <path d="M51 101 v80 q0 34 40 34 t40 -34 v-80" fill="#d9edf0" stroke="#397d90" stroke-width="3"/>
    <path d="M43 101 h97" stroke="#397d90" stroke-width="4"/>
    <path d="M149 140 h47 m-47 19 h37 m-37 19 h43" stroke="#46756d" stroke-width="3"/>
    <circle cx="175" cy="112" r="19" fill="#dcebe6" stroke="#46756d" stroke-width="2"/>
    <path d="M164 112 l7 7 13 -16" fill="none" stroke="#00695f" stroke-width="4"/>
    <text x="16" y="234" font-size="15" fill="#355650">Sample and interpret;</text>
    <text x="16" y="255" font-size="15" fill="#355650">respond to failed checks.</text>
  </g>
  <path d="M766 258 h26 m-10 -9 11 9 -11 9" fill="none" stroke="#00695f" stroke-width="4"/>
  <g transform="translate(796 120)">
    <rect width="210" height="263" rx="6" fill="#fff" stroke="#b5cec8" stroke-width="2"/>
    <circle cx="29" cy="31" r="19" fill="#00695f"/><text x="29" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">D</text>
    <text x="58" y="38" font-size="19" font-weight="700" fill="#173c39">Household tap</text>
    <path d="M32 180 h43 v-51 h84 v24 h24" fill="none" stroke="#46756d" stroke-width="10" stroke-linejoin="round"/>
    <path d="M179 153 v17" stroke="#46756d" stroke-width="9"/>
    <path d="M179 182 q-11 21 0 31 q11 -10 0 -31" fill="#8bc9da"/>
    <text x="16" y="234" font-size="15" fill="#355650">Protect distribution;</text>
    <text x="16" y="255" font-size="15" fill="#355650">follow public advice.</text>
  </g>
</g>
<path d="M651 391 v42 H388" fill="none" stroke="#ae6c31" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M388 433 l11 -7 v14 z" fill="#ae6c31"/>
<text x="44" y="455" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#8b552a">If a check fails: investigate, correct the pathway and communicate precautions.</text>
<text x="44" y="486" font-family="Arial,sans-serif" font-size="15" fill="#52645f">Conceptual diagram based on Health Canada's source-to-tap multi-barrier approach; not an operating procedure.</text>
</svg>
