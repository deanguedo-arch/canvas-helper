<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 965" role="img" aria-labelledby="title desc"><title id="title">Inclusive rehearsal formats</title><desc id="desc">Mental imagery, a written or spoken sequence, a storyboard or an appropriate eyes-open walkthrough can represent a task. First-person and observer perspectives serve different purposes. The assignment assesses the sequence, cues, recovery and explanation, not the vividness of an internal picture.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="965" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">Different ways to rehearse</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Choose a representation that helps you prepare the task.</text><rect x="44" y="166" width="812" height="128" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="209" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Mental imagery</text><text x="68" y="252" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Imagine relevant sights, sounds or movement.</text><rect x="44" y="320" width="812" height="128" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="363" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Written or spoken sequence</text><text x="68" y="406" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Describe the steps and practise explaining the cues.</text><rect x="44" y="474" width="812" height="128" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="517" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Storyboard</text><text x="68" y="560" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Draw simple frames showing actions and a response.</text><rect x="44" y="628" width="812" height="128" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="671" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Eyes-open walkthrough</text><text x="68" y="714" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Walk through a suitable sequence without a vivid image.</text><text x="44" y="854" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">Use first-person or observer perspective for a clear</text><text x="44" y="887" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">purpose. Assess the plan and reasoning, not claimed</text><text x="44" y="920" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">vividness.</text></g></svg>