<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc"><title id="title">Recovery as a planning and support decision</title><desc id="desc">Describe the pattern, seek appropriate support, discuss an adjustment and review what happens. A case does not establish overtraining, a personal recovery deadline or a safe training dose. Motivation and readiness are different questions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="1000" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">Notice · discuss · adjust</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">A planning sequence, not a diagnostic scale.</text><rect x="44" y="160" width="812" height="137" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="203" font-size="29" font-weight="700" fill="#171b1b" text-anchor="start">Notice the pattern</text><text x="68" y="244" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Describe the changed demands and what the performer</text><text x="68" y="276" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">reports.</text><path d="M450 304 L450 324" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="334" width="812" height="137" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="377" font-size="29" font-weight="700" fill="#171b1b" text-anchor="start">Seek appropriate support</text><text x="68" y="418" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Ask a teacher, coach or trusted adult about the</text><text x="68" y="450" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">situation.</text><path d="M450 478 L450 498" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="508" width="812" height="137" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="551" font-size="29" font-weight="700" fill="#171b1b" text-anchor="start">Discuss an adjustment</text><text x="68" y="592" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Consider the schedule and available resources without</text><text x="68" y="624" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">prescribing treatment.</text><path d="M450 652 L450 672" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="682" width="812" height="137" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="725" font-size="29" font-weight="700" fill="#171b1b" text-anchor="start">Review what happens</text><text x="68" y="766" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Look at the agreed action and whether more support is</text><text x="68" y="798" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">needed.</text><text x="44" y="906" font-size="22" font-weight="400" fill="#171b1b" text-anchor="start">Persistent difficulty is not proof of weak motivation. A</text><text x="44" y="937" font-size="22" font-weight="400" fill="#171b1b" text-anchor="start">short classroom case cannot diagnose a condition.</text></g></svg>