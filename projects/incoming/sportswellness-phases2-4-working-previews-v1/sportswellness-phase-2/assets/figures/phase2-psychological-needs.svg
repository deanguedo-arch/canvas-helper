<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">Choice, progress and belonging</title><desc id="desc">Autonomy is a meaningful sense of choice within appropriate constraints. Competence concerns opportunities to develop skill and influence progress. Relatedness concerns belonging and support. A demonstration, suitable choice or respectful partner can address a specific need; the learner’s experience still needs checking.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">Three psychological needs</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Ask what change would support this learner in this task.</text><rect x="44" y="165" width="812" height="172" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="209" font-size="31" font-weight="750" fill="#154212" text-anchor="start">Autonomy</text><text x="68" y="250" font-size="26" font-weight="650" fill="#171b1b" text-anchor="start">A meaningful sense of choice</text><text x="68" y="290" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Offer a choice between two appropriate practice tasks.</text><rect x="44" y="365" width="812" height="172" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="409" font-size="31" font-weight="750" fill="#154212" text-anchor="start">Competence</text><text x="68" y="450" font-size="26" font-weight="650" fill="#171b1b" text-anchor="start">A clear route toward progress</text><text x="68" y="490" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Demonstrate a manageable step and give useful feedback.</text><rect x="44" y="565" width="812" height="172" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="609" font-size="31" font-weight="750" fill="#154212" text-anchor="start">Relatedness</text><text x="68" y="650" font-size="26" font-weight="650" fill="#171b1b" text-anchor="start">Belonging and support</text><text x="68" y="690" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Arrange respectful partners and make questions welcome.</text><text x="44" y="805" font-size="22" font-weight="400" fill="#171b1b" text-anchor="start">One change can support more than one need. Check the learner’s</text><text x="44" y="836" font-size="22" font-weight="400" fill="#171b1b" text-anchor="start">experience; improvement is not guaranteed.</text></g></svg>