<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" role="img" aria-labelledby="title desc"><title id="title">Different reasons for action</title><desc id="desc">Amotivation means no intention to act. Four extrinsic forms range from outside pressure to a purpose that fits values. Intrinsic motivation concerns enjoyment of the activity itself. Integrated regulation remains extrinsic. These are not compulsory stages or permanent labels for people.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="1050" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">Different reasons for the same practice</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Compare the stated reason. This is not a compulsory ladder.</text><rect x="44" y="160" width="812" height="125" rx="8" fill="#f7f8f5" stroke="#d9ded8" stroke-width="2"/><text x="68" y="198" font-size="27" font-weight="700" fill="#171b1b" text-anchor="start">Amotivation · no intention to act</text><text x="68" y="242" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">“I do not see a purpose in starting.”</text><text x="44" y="337" font-size="25" font-weight="750" fill="#146c60" text-anchor="start">EXTRINSIC · a separable purpose</text><rect x="44" y="366" width="812" height="84" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="400" font-size="26" font-weight="700" fill="#171b1b" text-anchor="start">External</text><text x="290" y="416" font-size="22" font-weight="400" fill="#171b1b" text-anchor="start">“I want the reward.”</text><rect x="44" y="464" width="812" height="84" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="498" font-size="26" font-weight="700" fill="#171b1b" text-anchor="start">Introjected</text><text x="290" y="514" font-size="22" font-weight="400" fill="#171b1b" text-anchor="start">“I would feel guilty if I stopped.”</text><rect x="44" y="562" width="812" height="84" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="596" font-size="26" font-weight="700" fill="#171b1b" text-anchor="start">Identified</text><text x="290" y="612" font-size="22" font-weight="400" fill="#171b1b" text-anchor="start">“This helps a skill I value.”</text><rect x="44" y="660" width="812" height="84" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="694" font-size="26" font-weight="700" fill="#171b1b" text-anchor="start">Integrated</text><text x="290" y="710" font-size="22" font-weight="400" fill="#171b1b" text-anchor="start">“This fits my wider values and identity.”</text><rect x="44" y="790" width="812" height="112" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="826" font-size="27" font-weight="700" fill="#171b1b" text-anchor="start">Intrinsic · interest or enjoyment</text><text x="68" y="870" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">“I enjoy the activity itself.”</text><text x="44" y="950" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Integrated regulation remains extrinsic. A person can have</text><text x="44" y="982" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">more than one reason, and reasons can change.</text></g></svg>