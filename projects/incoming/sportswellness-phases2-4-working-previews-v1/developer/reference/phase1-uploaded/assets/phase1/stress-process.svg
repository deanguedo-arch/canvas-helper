<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 645" role="img"><title>The four-stage stress process</title><desc>Appraisal is the pivot within Stage 2; it is not a fifth stage. The next demand starts another loop. These responses are possible, not certain.</desc><rect width="800" height="645" fill="#fff"/><g font-family="Arial,sans-serif" fill="#173c31"><text x="32" y="45" font-size="29" font-weight="700">The four-stage stress process</text><text x="32" y="79" font-size="18">Appraisal is the pivot within Stage 2; it is not a fifth stage.</text><rect x="32" y="115" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="145" font-size="23" font-weight="700">1. Environmental demand</text><text x="54" y="173" font-size="18">What is the performer being asked to do?</text><path d="M400 213v14m-5-5 5 5 5-5" stroke="#247464" fill="none" stroke-width="2"/><rect x="32" y="230" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="260" font-size="23" font-weight="700">2. Perception of demand — appraisal</text><text x="54" y="288" font-size="18">What does it mean? What resources does the performer believe they have?</text><path d="M400 328v14m-5-5 5 5 5-5" stroke="#247464" fill="none" stroke-width="2"/><rect x="32" y="345" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="375" font-size="23" font-weight="700">3. Possible stress response</text><text x="54" y="403" font-size="18">Worry, activation, tension and attention may change.</text><path d="M400 443v14m-5-5 5 5 5-5" stroke="#247464" fill="none" stroke-width="2"/><rect x="32" y="460" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="490" font-size="23" font-weight="700">4. Behavioural consequences</text><text x="54" y="518" font-size="18">Actions and results can inform the next appraisal.</text><text x="32" y="617" font-size="17">The next demand starts another loop. These responses are possible, not certain.</text></g></svg>