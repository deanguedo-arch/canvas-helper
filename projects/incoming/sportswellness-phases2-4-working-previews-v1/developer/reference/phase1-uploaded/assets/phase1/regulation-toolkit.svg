<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 645" role="img"><title>Performance Regulation Tools</title><desc>Notice the signs → match an adjustment → use a task cue. Tools do not guarantee calmness or success. Avoid forcing breathing.</desc><rect width="800" height="645" fill="#fff"/><g font-family="Arial,sans-serif" fill="#173c31"><text x="32" y="45" font-size="29" font-weight="700">Performance Regulation Tools</text><text x="32" y="79" font-size="18">Notice the signs → match an adjustment → use a task cue.</text><rect x="32" y="115" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="145" font-size="23" font-weight="700">Settle when tense or rushing</text><text x="54" y="173" font-size="18">A familiar comfortable breath or muscle release may help.</text><path d="M400 213v14m-5-5 5 5 5-5" stroke="#247464" fill="none" stroke-width="2"/><rect x="32" y="230" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="260" font-size="23" font-weight="700">Activate when flat or disengaged</text><text x="54" y="288" font-size="18">Use familiar warm-up movement, imagery or an energising cue.</text><path d="M400 328v14m-5-5 5 5 5-5" stroke="#247464" fill="none" stroke-width="2"/><rect x="32" y="345" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="375" font-size="23" font-weight="700">Maintain and direct when ready</text><text x="54" y="403" font-size="18">Keep the routine and attend to cues that fit the next task.</text><path d="M400 443v14m-5-5 5 5 5-5" stroke="#247464" fill="none" stroke-width="2"/><rect x="32" y="460" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="490" font-size="23" font-weight="700">Review at a safe break</text><text x="54" y="518" font-size="18">Observe what happened and decide what to keep or adjust.</text><text x="32" y="617" font-size="17">Tools do not guarantee calmness or success. Avoid forcing breathing.</text></g></svg>