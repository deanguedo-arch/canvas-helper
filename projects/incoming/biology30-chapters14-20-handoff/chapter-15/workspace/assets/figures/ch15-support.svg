<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Early extraembryonic support structures</title><desc>The amnion surrounds the embryo and amniotic cavity; the chorion lies outside it. The yolk sac is separate from the amniotic cavity, and the connecting stalk links toward the outer tissues.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Early extraembryonic support structures</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><ellipse cx="700" cy="400" rx="475" ry="230" fill="#f3e5df" stroke="#a43f35" stroke-width="5"/><ellipse cx="670" cy="340" rx="270" ry="145" fill="#dfedf5" stroke="#367aaa" stroke-width="4"/><path d="M580 330 C570 250 730 235 785 325 C820 400 710 420 650 375 C620 365 600 355 580 330Z" fill="#efd2c3" stroke="#c27832" stroke-width="3"/><ellipse cx="640" cy="550" rx="100" ry="58" fill="#f7e9b6" stroke="#c27832" stroke-width="3"/><line x1="655" y1="492" x2="662" y2="397" stroke="#c27832" stroke-width="14"/><path d="M790 385 L1090 420 L1105 455 L785 410Z" fill="#dbb9aa" stroke="#c27832" stroke-width="3"/><path d="M750 392 Q825 435 930 429" fill="none" stroke="#146c60" stroke-width="8"/><line x1="300" y1="155" x2="475" y2="197.4" stroke="#171b1b" stroke-width="2.5"/><circle cx="475" cy="197.4" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="300" cy="155" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="300" y="163" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><line x1="880" y1="155" x2="800" y2="213" stroke="#171b1b" stroke-width="2.5"/><circle cx="800" cy="213" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="880" cy="155" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="880" y="163" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><line x1="410" y1="355" x2="485" y2="325" stroke="#171b1b" stroke-width="2.5"/><circle cx="485" cy="325" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="410" cy="355" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="410" y="363" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><line x1="420" y1="590" x2="580" y2="550" stroke="#171b1b" stroke-width="2.5"/><circle cx="580" cy="550" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="420" cy="590" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="420" y="598" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><line x1="1235" y1="450" x2="1000" y2="429" stroke="#171b1b" stroke-width="2.5"/><circle cx="1000" cy="429" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="1235" cy="450" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1235" y="458" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">E</text><line x1="960" y1="580" x2="885" y2="426" stroke="#171b1b" stroke-width="2.5"/><circle cx="885" cy="426" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="960" cy="580" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="960" y="588" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">F</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">A · Chorion</text><text x="495" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">B · Amnion</text><text x="940" y="782" font-family="Arial,sans-serif" font-size="19" fill="#