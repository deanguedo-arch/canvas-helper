<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Placental exchange: two separate circulations</title><desc>Maternal blood surrounds a chorionic villus. Fetal blood flows through vessels inside that villus. Oxygen and nutrients cross inward; carbon dioxide and wastes cross outward. The blood streams stay separate.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Placental exchange: two separate circulations</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><rect x="70" y="190" width="770" height="500" rx="12" fill="#f8e0dc" stroke="#d9ded8" stroke-width="2"/><text x="455.0" y="226" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">Maternal blood space</text><path d="M1220 265 L630 265 Q440 265 440 460 Q440 630 630 630 L1220 630 Z" fill="#f5e6d5" stroke="#a43f35" stroke-width="7"/><path d="M1220 330 L650 330 Q515 330 515 460" fill="none" stroke="#367aaa" stroke-width="24"/><path d="M515 460 Q515 560 650 560 L1220 560" fill="none" stroke="#a43f35" stroke-width="24"/><line x1="1080" y1="330" x2="860" y2="330" stroke="white" stroke-width="3"/><polygon points="860.0,330.0 874.9,321.8 874.9,338.2" fill="white"/><line x1="860" y1="560" x2="1080" y2="560" stroke="white" stroke-width="3"/><polygon points="1080.0,560.0 1065.1,568.2 1065.1,551.8" fill="white"/><text x="995" y="295" font-family="Arial,sans-serif" font-size="23" fill="#367aaa" text-anchor="middle" font-weight="400">From fetus</text><text x="995" y="607" font-family="Arial,sans-serif" font-size="23" fill="#a43f35" text-anchor="middle" font-weight="400">To fetus</text><line x1="215" y1="405" x2="535" y2="405" stroke="#c27832" stroke-width="4"/><polygon points="535.0,405.0 520.1,413.2 520.1,396.8" fill="#c27832"/><line x1="535" y1="520" x2="215" y2="520" stroke="#146c60" stroke-width="4"/><polygon points="215.0,520.0 229.9,511.8 229.9,528.2" fill="#146c60"/><text x="260" y="350" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">Oxygen and</text><text x="260" y="381" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">nutrients</text><text x="245" y="580" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">Carbon dioxide and</text><text x="245" y="611" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">wastes</text><line x1="110" y1="160" x2="170" y2="290" stroke="#171b1b" stroke-width="2.5"/><circle cx="170" cy="290" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="110" cy="160" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="110" y="168" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><line x1="865" y1="705" x2="745" y2="630" stroke="#171b1b" stroke-width="2.5"/><circle cx="745" cy="630" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="865" cy="705" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="865" y="713" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><line x1="1090" y1="195" x2="1060" y2="330" stroke="#171b1b" stroke-width="2.5"/><circle cx="1060" cy="330" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="1090" cy="195" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1090" y="203" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><line x1="1225" y1="705" x2="1120" y2="560" stroke="#171b1b" stroke-width="2.5"/><circle cx="1120" cy="560" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="1225" cy="705" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1225" y="713" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><text x="930" y="455" font-family="Arial,sans-serif" font-size="27" fill="#171b1b" text-anchor="middle" font-weight="400">Fetal capillary</text><text x="930" y="492" font-family="Arial,sans-serif" font-size="23" fill="#5b635d" text-anchor="middle" font-weight="400">inside the villus</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="790" font-family="Arial,sans-serif" font-size="21" fill="#5b635d">Use the lettered features and the nearby lesson explanation.</text></svg>