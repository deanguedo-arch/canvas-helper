<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Linked allele arrangements and gamete classes</title><desc>The starting arrangement is AB/ab. Without crossing over, AB and ab are parental combinations; Ab and aB are recombinants.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Linked allele arrangements and gamete classes</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><text x="280" y="195" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">Starting homologues</text><line x1="105" y1="300" x2="495" y2="300" stroke="#367aaa" stroke-width="18"/><text x="165" y="275" font-family="Arial,sans-serif" font-size="30" fill="#367aaa" text-anchor="middle" font-weight="400">A</text><text x="435" y="275" font-family="Arial,sans-serif" font-size="30" fill="#367aaa" text-anchor="middle" font-weight="400">B</text><line x1="105" y1="465" x2="495" y2="465" stroke="#c27832" stroke-width="18"/><text x="165" y="440" font-family="Arial,sans-serif" font-size="30" fill="#c27832" text-anchor="middle" font-weight="400">a</text><text x="435" y="440" font-family="Arial,sans-serif" font-size="30" fill="#c27832" text-anchor="middle" font-weight="400">b</text><line x1="545" y1="380" x2="715" y2="380" stroke="#146c60" stroke-width="5"/><polygon points="715.0,380.0 700.1,388.2 700.1,371.8" fill="#146c60"/><rect x="680" y="230" width="270" height="130" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="815.0" y="266" font-family="Arial,sans-serif" font-size="32" fill="#171b1b" text-anchor="middle" font-weight="400">AB</text><circle cx="815" cy="410" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="815" y="418" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><rect x="1015" y="230" width="270" height="130" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1150.0" y="266" font-family="Arial,sans-serif" font-size="32" fill="#171b1b" text-anchor="middle" font-weight="400">ab</text><circle cx="1150" cy="410" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1150" y="418" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><rect x="680" y="455" width="270" height="130" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="815.0" y="491" font-family="Arial,sans-serif" font-size="32" fill="#171b1b" text-anchor="middle" font-weight="400">Ab</text><circle cx="815" cy="635" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="815" y="643" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><rect x="1015" y="455" width="270" height="130" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1150.0" y="491" font-family="Arial,sans-serif" font-size="32" fill="#171b1b" text-anchor="middle" font-weight="400">aB</text><circle cx="1150" cy="635" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1150" y="643" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="790" font-family="Arial,sans-serif" font-size="21" fill="#5b635d">Use the lettered features and the nearby lesson explanation.</text></svg>