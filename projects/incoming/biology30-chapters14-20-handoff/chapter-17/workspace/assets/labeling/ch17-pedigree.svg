<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Pedigree: use the stated inheritance model</title><desc>In this fully penetrant autosomal recessive model, filled symbols are affected. Unaffected parents with an affected child must both be carriers. The unaffected sibling remains AA or Aa.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Pedigree: use the stated inheritance model</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><rect x="478" y="213" width="64" height="64" fill="white" stroke="#171b1b" stroke-width="3"/><circle cx="870" cy="245" r="32" fill="white" stroke="#171b1b" stroke-width="3"/><line x1="542" y1="245" x2="838" y2="245" stroke="#171b1b" stroke-width="3"/><line x1="690" y1="245" x2="690" y2="365" stroke="#171b1b" stroke-width="3"/><line x1="470" y1="365" x2="910" y2="365" stroke="#171b1b" stroke-width="3"/><line x1="470" y1="365" x2="470" y2="470" stroke="#171b1b" stroke-width="3"/><line x1="910" y1="365" x2="910" y2="470" stroke="#171b1b" stroke-width="3"/><rect x="438" y="470" width="64" height="64" fill="#171b1b" stroke="#171b1b" stroke-width="3"/><circle cx="910" cy="502" r="32" fill="white" stroke="#171b1b" stroke-width="3"/><line x1="420" y1="170" x2="510" y2="245" stroke="#171b1b" stroke-width="2.5"/><circle cx="510" cy="245" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="420" cy="170" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="420" y="178" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><line x1="990" y1="170" x2="870" y2="245" stroke="#171b1b" stroke-width="2.5"/><circle cx="870" cy="245" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="99