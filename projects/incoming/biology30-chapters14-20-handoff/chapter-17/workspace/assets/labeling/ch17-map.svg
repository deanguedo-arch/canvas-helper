<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>A short-interval chromosome map</title><desc>The schematic positions are 0, 8 and 20 cM. The middle locus is 8 cM from the left locus and 12 cM from the right locus; the total map interval is 20 cM.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">A short-interval chromosome map</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Constructed short-interval teaching example — not physical base-pair distances</text><line x1="130" y1="360" x2="1270" y2="360" stroke="#146c60" stroke-width="10"/><line x1="170" y1="335" x2="170" y2="385" stroke="#171b1b" stroke-width="4"/><line x1="170" y1="270" x2="170" y2="360" stroke="#171b1b" stroke-width="2.5"/><circle cx="170" cy="360" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="170" cy="270" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="170" y="278" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><text x="170" y="430" font-family="Arial,sans-serif" font-size="28" fill="#171b1b" text-anchor="middle" font-weight="400">0 cM</text><line x1="594" y1="335" x2="594" y2="385" stroke="#171b1b" stroke-width="4"/><line x1="594" y1="270" x2="594" y2="360" stroke="#171b1b" stroke-width="2.5"/><circle cx="594" cy="360" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="594" cy="270" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="594" y="278" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><text x="594" y="430" font-family="Arial,sans-serif" font-size="28" fill="#171b1b" text-anchor="middle" font-weight="400">8 cM</text><line x1="1230" y1="335" x2="1230" y2="385" stroke="#171b1b" stroke-width="4"/><line x1="1230" y1="270" x2="1230" y2="360" stroke="#171b1b" stroke-width="2.5"/><circle cx="1230" cy="360" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="1230" cy="270" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1230" y="278" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><text x="1230" y="430" font-family="Arial,sans-serif" font-size="28" fill="#171b1b" text-anchor="middle" font-weight="400">20 cM</text><line x1="170" y1="530" x2="594" y2="530" stroke="#367aaa" stroke-width="4"/><line x1="594" y1="600" x2="1230" y2="600" stroke="#c27832" stroke-width="4"/><circle cx="382" cy="550" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="382" y="558" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><circle cx="912" cy="620" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="912" y="628" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">E</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="790" font-family="Arial,sans-serif" font-size="21" fill="#5b635d">Use the lettered features and the nearby lesson explanation.</text></svg>