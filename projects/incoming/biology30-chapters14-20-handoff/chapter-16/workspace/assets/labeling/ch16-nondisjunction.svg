<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Nondisjunction: compare the gamete outcomes</title><desc>For one affected chromosome, a meiosis I error produces two n + 1 and two n − 1 gametes; a one-cell meiosis II error produces two normal, one n + 1 and one n − 1 gamete.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Nondisjunction: compare the gamete outcomes</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><circle cx="100" cy="250" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="100" y="258" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><circle cx="380" cy="250" r="88" fill="#f3f7f2" stroke="#146c60" stroke-width="3"/><line x1="362.5" y1="218.0" x2="362.5" y2="282.0" stroke="#367aaa" stroke-width="8.8"/><circle cx="362.5" cy="250" r="4.0" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><line x1="397.5" y1="218.0" x2="397.5" y2="282.0" stroke="#367aaa" stroke-width="8.8"/><circle cx="397.5" cy="250" r="4.0" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><text x="380" y="375" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">n + 1</text><circle cx="660" cy="250" r="88" fill="#f3f7f2" stroke="#146c60" stroke-width="3"/><line x1="642.5" y1="218.0" x2="642.5" y2="282.0" stroke="#367aaa" stroke-width="8.8"/><circle cx="642.5" cy="250" r="4.0" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><line x1="677.5" y1="218.0" x2="677.5" y2="282.0" stroke="#367aaa" stroke-width="8.8"/><circle cx="677.5" cy="250" r="4.0" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><text x="660" y="375" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">n + 1</text><circle cx="940" cy="250" r="88" fill="#f3f7f2" stroke="#146c60" stroke-width="3"/><text x="940" y="375" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">n − 1</text><circle cx="1220" cy="250" r="88" fill="#f3f7f2" stroke="#146c60" stroke-width="3"/><text x="1220" y="375" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">n − 1</text><circle cx="100" cy="535" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="100" y="543" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><circle cx="380" cy="535" r="88" fill="#f3f7f2" stroke="#146c60" stroke-width="3"/><line x1="380.0" y1="503.0" x2="380.0" y2="567.0" stroke="#367aaa" stroke-width="8.8"/><circle cx="380.0" cy="535" r="4.0" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><text x="380" y="660" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">n</text><circle cx="660" cy="535" r="88" fill="#f3f7f2" stroke="#146c60" stroke-width="3"/><line x1="660.0" y1="503.0" x2="660.0" y2="567.0" stroke="#367aaa" stroke-width="8.8"/><circle cx="660.0" cy="535" r="4.0" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><text x="660" y="660" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">n</text><circle cx="940" cy="535" r="88" fill="#f3f7f2" stroke="#146c60" stroke-width="3"/><line x1="922.5" y1="503.0" x2="922.5" y2="567.0" stroke="#367aaa" stroke-width="8.8"/><circle cx="922.5" cy="535" r="4.0" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><line x1="957.5" y1="503.0" x2="957.5" y2="567.0" stroke="#367aaa" stroke-width="8.8"/><circle cx="957.5" cy="535" r="4.0" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><text x="940" y="660" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" f