<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Meiosis: separate homologues, then sisters</title><desc>A diploid 2n = 4 model begins after replication. Meiosis I produces two haploid cells with replicated chromosomes. Meiosis II separates sisters into four haploid products.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Meiosis: separate homologues, then sisters</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><ellipse cx="215" cy="390" rx="160" ry="205" fill="#f8faf7" stroke="#146c60" stroke-width="3"/><line x1="153" y1="275" x2="187" y2="355" stroke="#367aaa" stroke-width="11"/><line x1="187" y1="275" x2="153" y2="355" stroke="#367aaa" stroke-width="11"/><circle cx="170" cy="315" r="5" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><line x1="238" y1="275" x2="272" y2="355" stroke="#c27832" stroke-width="11"/><line x1="272" y1="275" x2="238" y2="355" stroke="#c27832" stroke-width="11"/><circle cx="255" cy="315" r="5" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><line x1="158.95" y1="449.0" x2="181.05" y2="501.0" stroke="#367aaa" stroke-width="7.15"/><line x1="181.05" y1="449.0" x2="158.95" y2="501.0" stroke="#367aaa" stroke-width="7.15"/><circle cx="170" cy="475" r="3.25" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><line x1="243.95" y1="449.0" x2="266.05" y2="501.0" stroke="#c27832" stroke-width="7.15"/><line x1="266.05" y1="449.0" x2="243.95" y2="501.0" stroke="#c27832" stroke-width="7.15"/><circle cx="255" cy="475" r="3.25" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><circle cx="215" cy="145" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="215" y="153" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-w