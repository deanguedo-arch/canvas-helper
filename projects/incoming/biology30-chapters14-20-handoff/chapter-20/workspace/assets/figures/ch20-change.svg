<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Population accounting across a boundary</title><desc>Births and immigration add individuals; deaths and emigration remove individuals. The totals must describe the same population and interval.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Population accounting across a boundary</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><rect x="470" y="295" width="470" height="270" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="705.0" y="331" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">Population</text><text x="705.0" y="369" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">N₀ → N₀ + ΔN</text><rect x="80" y="180" width="290" height="115" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="225.0" y="216" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">New offspring</text><line x1="370" y1="260" x2="470" y2="345" stroke="#146c60" stroke-width="5"/><polygon points="470.0,345.0 453.4,341.5 463.9,329.1" fill="#146c60"/><circle cx="225" cy="145" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="225" y="153" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><rect x="80" y="540" width="290" height="115" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="225.0" y="576" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">Individuals enter</text><line x1="370" y1="580" x2="470" y2="500" stroke="#146c60" stroke-width="5"/><polygon points="470.0,500.0 463.4,515.7 453.3,503.0" fill="#146c60"/><circle cx="225" cy="710" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="225" y="718" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><rect x="1030" y="180" width="290" height="115" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1175.0" y="216" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">Individuals die</text><line x1="940" y1="345" x2="1030" y2="260" stroke="#146c60" stroke-width="5"/><polygon points="1030.0,260.0 1024.7,276.2 1013.6,264.3" fill="#146c60"/><circle cx="1170" cy="145" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1170" y="153" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><rect x="1030" y="540" width="290" height="115" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1175.0" y="576" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">Individuals leave</text><line x1="940" y1="500" x2="1030" y2="580" stroke="#146c60" stroke-width="5"/><polygon points="1030.0,580.0 1013.4,576.2 1024.3,564.0" fill="#146c60"/><circle cx="1170" cy="710" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1170" y="718" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">A · Births</text><text x="495" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">B · Immigration</text><text x="940" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">C · Deaths</text><text x="50" y="825" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">D · Emigration</text></svg>