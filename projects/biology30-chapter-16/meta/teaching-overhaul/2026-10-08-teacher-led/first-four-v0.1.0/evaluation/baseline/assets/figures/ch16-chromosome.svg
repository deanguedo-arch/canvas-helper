<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>One chromosome before and after replication</title><desc>Replication doubles DNA amount without initially doubling chromosome number. The two sister chromatids remain one replicated chromosome until they separate.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">One chromosome before and after replication</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><rect x="90" y="170" width="390" height="390" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="285.0" y="206" font-family="Arial,sans-serif" font-size="24" fill="#171b1b" text-anchor="middle" font-weight="400">Before S phase</text><line x1="290" y1="295" x2="290" y2="455" stroke="#367aaa" stroke-width="22"/><circle cx="290" cy="375" r="10" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><line x1="120" y1="350" x2="290" y2="330" stroke="#171b1b" stroke-width="2.5"/><circle cx="290" cy="330" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="120" cy="350" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="120" y="358" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><line x1="510" y1="365" x2="690" y2="365" stroke="#146c60" stroke-width="5"/><polygon points="690.0,365.0 675.1,373.2 675.1,356.8" fill="#146c60"/><text x="600" y="325" font-family="Arial,sans-serif" font-size="23" fill="#146c60" text-anchor="middle" font-weight="400">DNA replication</text><rect x="750" y="170" width="560" height="390" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1030.0" y="206" font-family="Arial,sans-serif" font-size="24" fill="#171b1b" text-anchor="middle" font-weight="400">After S phase</text><line x1="986" y1="300" x2="1054" y2="460" stroke="#367aaa" stroke-width="22"/><line x1="1054" y1="300" x2="986" y2="460" stroke="#367aaa" stroke-width="22"/><circle cx="1020" cy="380" r="10" fill="#171b1b" stroke="#171b1b" stroke-width="1"/><line x1="820" y1="310" x2="986" y2="300" stroke="#171b1b" stroke-width="2.5"/><circle cx="986" cy="300" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="820" cy="310" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="820" y="318" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><line x1="1220" y1="310" x2="1054" y2="300" stroke="#171b1b" stroke-width="2.5"/><circle cx="1054" cy="300" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="1220" cy="310" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1220" y="318" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><line x1="1210" y1="485" x2="1020" y2="380" stroke="#171b1b" stroke-width="2.5"/><circle cx="1020" cy="380" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="1210" cy="485" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1210" y="493" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><text x="300" y="640" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">1 chromosome · 1 DNA molecule</text><text x="1015" y="640" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">1 chromosome · 2 DNA molecules</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">A · One unreplicated chromosome</text><text x="495" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">B · Sister chromatid</text><text x="940" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">C · Sister chromatid</text><text x="50" y="825" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">D · Centromere region</text></svg>