<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><rect width="1400" height="620" fill="white"/><style>text{font-family:Arial;fill:#18282b}.title{font-size:26px;font-weight:bold}.small{font-size:17px}</style><text x="30" y="40" class="title">First response: four mitotic phases, model 2n = 2</text><ellipse cx="175" cy="265" rx="145" ry="150" fill="#fafafa" stroke="#284751" stroke-width="3"/><text x="175" y="85" text-anchor="middle" class="title">Prophase</text><line x1="117" y1="200" x2="143" y2="250" stroke="#237bb1" stroke-width="6"/><line x1="143" y1="200" x2="117" y2="250" stroke="#237bb1" stroke-width="6"/><line x1="207" y1="265" x2="233" y2="315" stroke="#ba6929" stroke-width="6"/><line x1="233" y1="265" x2="207" y2="315" stroke="#ba6929" stroke-width="6"/><ellipse cx="525" cy="265" rx="145" ry="150" fill="#fafafa" stroke="#284751" stroke-width="3"/><text x="525" y="85" text-anchor="middle" class="title">Metaphase</text><line x1="512" y1="200" x2="538" y2="250" stroke="#237bb1" stroke-width="6"/><line x1="538" y1="200" x2="512" y2="250" stroke="#237bb1" stroke-width="6"/><line x1="400" y1="265" x2="525" y2="225" stroke="#91a6ab" stroke-width="1"/><line x1="650" y1="265" x2="525" y2="225" stroke="#91a6ab" stroke-width="1"/><line x1="512" y1="265" x2="538" y2="315" stroke="#ba6929" stroke-width="6"/><line x1="538" y1="265" x2="512" y2="315" stroke="#ba6929" stroke-width="6"/><line x1="400" y1="265" x2="525" y2="290" stroke="#91a6ab" stroke-width="1"/><line x1="650" y1="265" x2="525" y2="290" stroke="#91a6ab" stroke-width="1"/><ellipse cx="875" cy="265" rx="145" ry="150" fill="#fafafa" stroke="#284751" stroke-width="3"/><text x="875" y="85" text-anchor="middle" class="title">Anaphase</text><line x1="795" y1="205" x2="795" y2="255" stroke="#237bb1" stroke-width="6"/><line x1="750" y1="265" x2="795" y2="230" stroke="#91a6ab" stroke-width="1"/><line x1="795" y1="270" x2="795" y2="320" stroke="#ba6929" stroke-width="6"/><line x1="750" y1="265" x2="795" y2="295" stroke="#91a6ab" stroke-width="1"/><line x1="955" y1="205" x2="955" y2="255" stroke="#237bb1" stroke-width="6"/><line x1="1000" y1="265" x2="955" y2="230" stroke="#91a6ab" stroke-width="1"/><line x1="955" y1="270" x2="955" y2="320" stroke="#ba6929" stroke-width="6"/><line x1="1000" y1="265" x2="955" y2="295" stroke="#91a6ab" stroke-width="1"/><ellipse cx="1225" cy="265" rx="145" ry="150" fill="#fafafa" stroke="#284751" stroke-width="3"/><text x="1225" y="85" text-anchor="middle" class="title">Telophase</text><ellipse cx="1153" cy="265" rx="55" ry="100" fill="none" stroke="#5e8b76" stroke-width="3"/><path d="M1138,217 q30,0 0,15 q-20,10 10,20" fill="none" stroke="#237bb1" stroke-width="4"/><path d="M1138,277 q30,0 0,15 q-20,10 10,20" fill="none" stroke="#ba6929" stroke-width="4"/><ellipse cx="1297" cy="265" rx="55" ry="100" fill="none" stroke="#5e8b76" stroke-width="3"/><path d="M1282,217 q30,0 0,15 q-20,10 10,20" fill="none" stroke="#237bb1" stroke-width="4"/><path d="M1282,277 q30,0 0,15 q-20,10 10,20" fill="none" stroke="#ba6929" stroke-width="4"/><text x="175" y="470" text-anchor="middle" class="small">2 replicated chromosomes condense</text><text x="175" y="500" text-anchor="middle" class="small">Spindle begins organizing</text><text x="175" y="530" text-anchor="middle" class="small">DNA was copied before mitosis</text><text x="525" y="470" text-anchor="middle" class="small">2 replicated chromosomes align singly</text><text x="525" y="500" text-anchor="middle" class="small">Opposite-pole attachments form</text><text x="525" y="530" text-anchor="middle" class="small">Each X contains 2 sister chromatids</text><text x="875" y="470" text-anchor="middle" class="small">Sisters separate and move apart</text><text x="875" y="500" text-anchor="middle" class="small">4 chromosomes in whole cell</text><text x="875" y="530" text-anchor="middle" class="small">2 chromosomes move toward each pole</text><text x="1225" y="470" text-anchor="middle" class="small">2 nuclear envelopes re-form</text><text x="1225" y="500" text-anchor="middle" class="small">Chromosomes decondense</text><text x="1225" y="530" text-anchor="middle" class="small">2 chromosomes in each nucleus</text><text x="30" y="600" class="small">Schematic; colours distinguish homologues. Cytokinesis is separate from nuclear division.</text></svg>