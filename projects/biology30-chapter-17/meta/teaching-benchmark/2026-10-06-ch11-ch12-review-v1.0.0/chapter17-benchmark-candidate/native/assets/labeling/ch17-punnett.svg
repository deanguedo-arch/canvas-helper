<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>A single-trait cross: Aa × Aa</title><desc>Each row and column represents a gamete. Four equally likely combinations give a 1:2:1 genotype ratio under the stated model. A is completely dominant to a.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">A single-trait cross: Aa × Aa</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><text x="355" y="240" font-family="Arial,sans-serif" font-size="35" fill="#367aaa" text-anchor="middle" font-weight="400">A</text><text x="625" y="240" font-family="Arial,sans-serif" font-size="35" fill="#c27832" text-anchor="middle" font-weight="400">a</text><text x="180" y="360" font-family="Arial,sans-serif" font-size="35" fill="#367aaa" text-anchor="middle" font-weight="400">A</text><text x="180" y="560" font-family="Arial,sans-serif" font-size="35" fill="#c27832" text-anchor="middle" font-weight="400">a</text><rect x="230" y="275" width="270" height="190" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><circle cx="365" cy="370" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="365" y="378" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><rect x="500" y="275" width="270" height="190" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><circle cx="635" cy="370" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="635" y="378" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><rect x="230" y="475" width="270" height="190" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><circle cx="365" cy="570" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="365" y="578" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><rect x="500" y="475" width="270" height="190" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><circle cx="635" cy="570" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="635" y="578" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><text x="1000" y="295" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">Interpret each</text><text x="1000" y="329" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">lettered box as an</text><text x="1000" y="363" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">offspring genotype,</text><text x="1000" y="397" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">not as a gamete.</text><text x="1000" y="455" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">One allele comes from</text><text x="1000" y="489" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">the row and one from</text><text x="1000" y="523" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">the column.</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="790" font-family="Arial,sans-serif" font-size="21" fill="#5b635d">Use the lettered features and the nearby lesson explanation.</text></svg>