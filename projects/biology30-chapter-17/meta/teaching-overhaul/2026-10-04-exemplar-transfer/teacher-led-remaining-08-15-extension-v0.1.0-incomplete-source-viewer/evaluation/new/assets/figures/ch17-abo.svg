<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>ABO inheritance: IAi × IBi</title><desc>The standard three-allele ABO model produces four possible offspring genotypes in this cross. Each letter marks one phenotype to infer from its genotype.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">ABO inheritance: IAi × IBi</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><text x="410" y="230" font-family="Arial,sans-serif" font-size="30" fill="#367aaa" text-anchor="middle" font-weight="400">IA</text><text x="750" y="230" font-family="Arial,sans-serif" font-size="30" fill="#c27832" text-anchor="middle" font-weight="400">i</text><text x="160" y="370" font-family="Arial,sans-serif" font-size="30" fill="#367aaa" text-anchor="middle" font-weight="400">IB</text><text x="160" y="590" font-family="Arial,sans-serif" font-size="30" fill="#c27832" text-anchor="middle" font-weight="400">i</text><rect x="250" y="275" width="340" height="190" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="420.0" y="311" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">IAIB</text><circle cx="420" cy="395" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="420" y="403" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><rect x="590" y="275" width="340" height="190" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="760.0" y="311" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">IBi</text><circle cx="760" cy="395" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="760" y="403" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><rect x="250" y="495" width="340" height="190" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="420.0" y="531" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">IAi</text><circle cx="420" cy="615" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="420" y="623" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><rect x="590" y="495" width="340" height="190" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="760.0" y="531" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">ii</text><circle cx="760" cy="615" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="760" y="623" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><text x="1110" y="330" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">IA and IB are</text><text x="1110" y="363" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">codominant. Both</text><text x="1110" y="396" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">are dominant to</text><text x="1110" y="429" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">i.</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">A · AB</text><text x="495" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">B · B</text><text x="940" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">C · A</text><text x="50" y="825" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">D · 