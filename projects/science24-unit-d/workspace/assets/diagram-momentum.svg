<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="t d"><title id="t">Two carts with opposite momenta</title><desc id="d">One cart moves right at marker A and one moves left at marker B. Marker C brackets the two-cart system. Marker D is an outside arrow.</desc><rect width="760" height="290" fill="#f7faf9"/><path d="M50 229H710" stroke="#6b827b" stroke-width="3"/><g fill="#fff" stroke="#12605d" stroke-width="3"><rect x="170" y="150" width="140" height="55" rx="2"/><rect x="448" y="150" width="140" height="55" rx="2"/></g><g fill="#172b2b"><circle cx="195" cy="214" r="11"/><circle cx="282" cy="214" r="11"/><circle cx="475" cy="214" r="11"/><circle cx="560" cy="214" r="11"/></g><path d="M175 118H310m0 0-16-10m16 10-16 10M585 118H450m0 0 16-10m-16 10 16 10" fill="none" stroke="#12605d" stroke-width="4"/><path d="M150 70v-16h460v16" fill="none" stroke="#172b2b" stroke-width="2"/><path d="M655 169h55m0 0-15-10m15 10-15 10" fill="none" stroke="#bd7420" stroke-width="3"/><g font-family="sans-serif" font-size="20" font-weight="700" fill="#172b2b"><text x="237" y="104">A</text><text x="511" y="104">B</text><text x="374" y="45">C</text><text x="657" y="150">D</text></g><text x="68" y="270" font-family="sans-serif" font-size="14" fill="#415a58">Choose right as positive; arrows show directions, not measured speeds.</text></svg>
