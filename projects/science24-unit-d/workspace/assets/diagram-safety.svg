<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Four transport safety positions</title><desc id="d">Marker A is a roadside warning sign. B is the deformable front of a vehicle. C is its occupant compartment. D is a belt crossing a seated passenger.</desc><rect width="760" height="300" fill="#f7faf9"/><path d="M35 255H725" stroke="#718981" stroke-width="3"/><path d="M103 245V72" stroke="#172b2b" stroke-width="5"/><path d="M66 72h74v56H66z" fill="#fff" stroke="#12605d" stroke-width="3"/><path d="M82 113l21-30 21 30z" fill="#eac37d" stroke="#172b2b" stroke-width="2"/><path d="M256 211h320l35 35H210z" fill="#fff" stroke="#12605d" stroke-width="4"/><path d="M265 155h270l40 56H225z" fill="#fff" stroke="#12605d" stroke-width="4"/><path d="M320 158v54M475 158v54" stroke="#12605d" stroke-width="4"/><path d="M371 174l65 72" stroke="#bd7420" stroke-width="7"/><circle cx="292" cy="249" r="22" fill="#172b2b"/><circle cx="525" cy="249" r="22" fill="#172b2b"/><g font-family="sans-serif" font-size="20" font-weight="700" fill="#172b2b"><text x="93" y="51">A</text><text x="213" y="206">B</text><text x="447" y="143">C</text><text x="401" y="193">D</text></g><text x="35" y="288" font-family="sans-serif" font-size="14" fill="#415a58">Schematic feature positions; real vehicles and roads vary by design.</text></svg>
