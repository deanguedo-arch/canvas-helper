<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-labelledby="title desc"><title id="title">Compare momentum at the same velocity</title><desc id="desc">Both simplified systems travel at plus five metres per second. A 70 kilogram model has momentum plus 350 kilogram metres per second. A 750 kilogram model has momentum plus 3750 kilogram metres per second.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="520" fill="#fff"/><text x="300" y="43" font-size="32" fill="#174c24" font-weight="700" text-anchor="middle">Same velocity: +5 m/s</text><g transform="translate(136 148)" fill="none" stroke="#087d75" stroke-width="5"><circle cx="-45" cy="15" r="28"/><circle cx="55" cy="15" r="28"/><path d="M-45 15 L-13-30 L16 15 Z M-13-30 H36 L55 15 M16 15 L36-30 L31-48 M-24-33 H-5"/></g><line x1="245" y1="140" x2="530" y2="140" stroke="#087d75" stroke-width="4" /><path d="M 521 128 L 530 140 L 539 128" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(-90 530 140)"/><text x="300" y="232" font-size="30" fill="#087d75" font-weight="700" text-anchor="middle">70 kg × 5 m/s</text><text x="300" y="270" font-size="30" fill="#087d75" font-weight="700" text-anchor="middle">p = +350 kg·m/s</text><g transform="translate(137 334)"><path d="M-75 12 V-24 L-35-53 H33 L60-23 H79 V12 Z" fill="#edf5ef" stroke="#174c24" stroke-width="4"/><path d="M-27-46 H28 L47-25 H-44 Z" fill="#b6d6cc"/><circle cx="-43" cy="14" r="16" fill="#192522"/><circle cx="47" cy="14" r="16" fill="#192522"/></g><line x1="245" y1="324" x2="530" y2="324" stroke="#087d75" stroke-width="4" /><path d="M 521 312 L 530 324 L 539 312" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(-90 530 324)"/><text x="300" y="424" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">750 kg × 5 m/s</text><text x="300" y="462" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">p = +3750 kg·m/s</text></svg>
