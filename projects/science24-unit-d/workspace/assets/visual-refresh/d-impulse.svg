<svg xmlns="http://www.w3.org/2000/svg" width="600" height="555" viewBox="0 0 600 555" role="img" aria-labelledby="title desc"><title id="title">Different forces can give the same impulse magnitude</title><desc id="desc">An average force of 100 newtons acting for two seconds and an average force of 400 newtons acting for half a second each give an impulse magnitude of 200 newton seconds. The constant-force rectangles are simplified representations.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="555" fill="#fff"/><line x1="118" y1="85" x2="118" y2="365" stroke="#192522" stroke-width="3" /><line x1="118" y1="365" x2="559" y2="365" stroke="#192522" stroke-width="3" /><line x1="113" y1="365" x2="559" y2="365" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="97" y="374" font-size="26" fill="#192522" font-weight="400" text-anchor="end">0</text><line x1="113" y1="295" x2="559" y2="295" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="97" y="304" font-size="26" fill="#192522" font-weight="400" text-anchor="end">100</text><line x1="113" y1="225" x2="559" y2="225" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="97" y="234" font-size="26" fill="#192522" font-weight="400" text-anchor="end">200</text><line x1="113" y1="155" x2="559" y2="155" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="97" y="164" font-size="26" fill="#192522" font-weight="400" text-anchor="end">300</text><line x1="113" y1="85" x2="559" y2="85" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="97" y="94" font-size="26" fill="#192522" font-weight="400" text-anchor="end">400</text><line x1="118" y1="365" x2="118" y2="372" stroke="#192522" stroke-width="3" /><text x="118" y="405" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">0</text><line x1="225.5" y1="365" x2="225.5" y2="372" stroke="#192522" stroke-width="3" /><text x="225.5" y="405" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">0.5</text><line x1="333" y1="365" x2="333" y2="372" stroke="#192522" stroke-width="3" /><text x="333" y="405" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">1</text><line x1="440.5" y1="365" x2="440.5" y2="372" stroke="#192522" stroke-width="3" /><text x="440.5" y="405" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">1.5</text><line x1="548" y1="365" x2="548" y2="372" stroke="#192522" stroke-width="3" /><text x="548" y="405" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">2</text><text x="330" y="447" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Time (s)</text><text x="165" y="62" font-size="27" fill="#192522" font-weight="400" text-anchor="start">Force magnitude (N)</text><rect x="118" y="295" width="430" height="70" fill="#087d75" fill-opacity=".2" stroke="#087d75" stroke-width="4"/><rect x="118" y="85" width="107.5" height="280" fill="#925900" fill-opacity=".16" stroke="#925900" stroke-width="4"/><text x="353" y="264" font-size="30" fill="#087d75" font-weight="700" text-anchor="middle">100 N × 2 s</text><text x="355" y="137" font-size="30" fill="#925900" font-weight="700" text-anchor="middle">400 N × 0.5 s</text><text x="300" y="502" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">Both areas = 200 N·s</text><text x="300" y="540" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">These are force magnitudes.</text></svg>
