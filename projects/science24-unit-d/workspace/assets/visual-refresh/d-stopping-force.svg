<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc"><title id="title">Equal impulse, different stopping time</title><desc id="desc">A 1000 kilogram vehicle initially moving at plus ten metres per second stops, so its momentum change is minus 10000 kilogram metres per second. Average-force rectangles represent two alternative stops: 20000 newtons for half a second or 5000 newtons for two seconds. Each has impulse magnitude 10000 newton seconds.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="650" fill="#fff"/><text x="300" y="40" font-size="28" fill="#174c24" font-weight="700" text-anchor="middle">1000 kg vehicle · 10 m/s → rest</text><line x1="118" y1="110" x2="118" y2="390" stroke="#192522" stroke-width="3" /><line x1="118" y1="390" x2="559" y2="390" stroke="#192522" stroke-width="3" /><line x1="113" y1="390" x2="559" y2="390" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="97" y="399" font-size="26" fill="#192522" font-weight="400" text-anchor="end">0</text><line x1="113" y1="250" x2="559" y2="250" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="97" y="259" font-size="26" fill="#192522" font-weight="400" text-anchor="end">10000</text><line x1="113" y1="110" x2="559" y2="110" stroke="#cbd9d2" stroke-width="1" stroke-dasharray="5 6"/><text x="97" y="119" font-size="26" fill="#192522" font-weight="400" text-anchor="end">20000</text><line x1="118" y1="390" x2="118" y2="397" stroke="#192522" stroke-width="3" /><text x="118" y="430" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">0</text><line x1="225.5" y1="390" x2="225.5" y2="397" stroke="#192522" stroke-width="3" /><text x="225.5" y="430" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">0.5</text><line x1="333" y1="390" x2="333" y2="397" stroke="#192522" stroke-width="3" /><text x="333" y="430" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">1</text><line x1="440.5" y1="390" x2="440.5" y2="397" stroke="#192522" stroke-width="3" /><text x="440.5" y="430" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">1.5</text><line x1="548" y1="390" x2="548" y2="397" stroke="#192522" stroke-width="3" /><text x="548" y="430" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">2</text><text x="330" y="472" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Time (s)</text><text x="165" y="87" font-size="27" fill="#192522" font-weight="400" text-anchor="start">Force magnitude (N)</text><rect x="118" y="320" width="430" height="70" fill="#087d75" fill-opacity=".2" stroke="#087d75" stroke-width="4"/><rect x="118" y="110" width="107.5" height="280" fill="#925900" fill-opacity=".16" stroke="#925900" stroke-width="4"/><text x="395" y="166" font-size="28" fill="#925900" font-weight="700" text-anchor="middle">20,000 N</text><text x="395" y="202" font-size="28" fill="#925900" font-weight="700" text-anchor="middle">for 0.5 s</text><text x="386" y="294" font-size="28" fill="#087d75" font-weight="700" text-anchor="middle">5000 N for 2.0 s</text><text x="300" y="536" font-size="30" fill="#174c24" font-weight="700" text-anchor="middle">Both areas = 10,000 N·s</text><text x="300" y="583" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">Two alternative stops,</text><text x="300" y="617" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">shown with average-force rectangles.</text></svg>
