<svg xmlns="http://www.w3.org/2000/svg" width="600" height="695" viewBox="0 0 600 695" role="img" aria-labelledby="title desc"><title id="title">Connect avoiding a collision with managing an impact</title><desc id="desc">Before braking, reaction distance equals speed times reaction time. Total stopping distance also includes braking distance. During an impact, impulse equals momentum change; a longer stopping time can reduce mean force for the same momentum change.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="695" fill="#fff"/><text x="300" y="44" font-size="32" fill="#174c24" font-weight="700" text-anchor="middle">Before a collision</text><rect x="30" y="73" width="540" height="96" rx="5" fill="#fff5e1" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="112.16666666666666" font-size="29" fill="#192522" font-weight="400" text-anchor="middle">Thinking distance</text><text x="300" y="149.16666666666666" font-size="29" fill="#192522" font-weight="400" text-anchor="middle">Speed × reaction time</text><line x1="300" y1="169" x2="300" y2="206" stroke="#087d75" stroke-width="4" /><path d="M 291 194 L 300 206 L 309 194" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 206)"/><rect x="30" y="221" width="540" height="106" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="265.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Thinking distance + braking distance</text><text x="300" y="300.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">= stopping distance</text><text x="300" y="393" font-size="32" fill="#174c24" font-weight="700" text-anchor="middle">During an impact</text><rect x="30" y="422" width="540" height="96" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="479.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Impulse = change in momentum</text><line x1="300" y1="518" x2="300" y2="558" stroke="#087d75" stroke-width="4" /><path d="M 291 546 L 300 558 L 309 546" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 558)"/><rect x="30" y="574" width="540" height="96" rx="5" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="613.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Same momentum change</text><text x="300" y="648.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Longer time → lower mean force</text></svg>
