<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">A round trip has distance but zero displacement</title><desc id="desc">A simplified round trip goes 800 metres from A to B and 800 metres back to A. Path distance is 1600 metres. Final and starting positions match, so displacement is zero.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="440" fill="#fff"/><rect x="25" y="30" width="175" height="85" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="112.5" y="81.83333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">A: start</text><rect x="400" y="30" width="175" height="85" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="487.5" y="81.83333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">B: turn</text><line x1="200" y1="151" x2="398" y2="151" stroke="#087d75" stroke-width="4" /><path d="M 389 139 L 398 151 L 407 139" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(-90 398 151)"/><text x="300" y="133" font-size="28" fill="#087d75" font-weight="700" text-anchor="middle">800 m out</text><line x1="398" y1="226" x2="200" y2="226" stroke="#925900" stroke-width="4" /><path d="M 191 214 L 200 226 L 209 214" fill="none" stroke="#925900" stroke-width="4" transform="rotate(90 200 226)"/><text x="300" y="211" font-size="28" fill="#925900" font-weight="700" text-anchor="middle">800 m back</text><rect x="25" y="284" width="550" height="114" rx="5" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="332.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Distance: 800 + 800 = 1600 m</text><text x="300" y="368.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Displacement: 0 m</text></svg>
