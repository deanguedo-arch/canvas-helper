<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="t d"><title id="t">Four stages of a vehicle stopping</title><desc id="d">A road timeline shows a hazard, the response interval, braking and the final stop. Letter markers A through D are above the four stages.</desc><rect width="760" height="220" fill="#f7faf9"/><path d="M44 158H716" stroke="#183c3c" stroke-width="3"/><path d="M46 161l670 0" stroke="#bccac5" stroke-width="2" stroke-dasharray="20 15"/><path d="M112 125v31M298 125v31M487 125v31M670 125v31" stroke="#12605d" stroke-width="3"/><path d="M112 133h185M298 133h188M487 133h182" stroke="#12605d" stroke-width="2" marker-end="url(#a)"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9" fill="#12605d"/></marker></defs><g font-family="sans-serif" font-weight="700" font-size="21" fill="#172b2b" text-anchor="middle"><text x="112" y="78">A</text><text x="298" y="78">B</text><text x="487" y="78">C</text><text x="670" y="78">D</text></g><g fill="#fff" stroke="#12605d" stroke-width="2"><circle cx="112" cy="94" r="6"/><circle cx="298" cy="94" r="6"/><circle cx="487" cy="94" r="6"/><circle cx="670" cy="94" r="6"/></g><text x="44" y="200" font-family="sans-serif" font-size="14" fill="#415a58">Read the sequence from left to right. Distances are schematic, not to scale.</text></svg>
