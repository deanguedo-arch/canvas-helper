<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Art Studio Course Shell</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Newsreader:ital,opsz,wght@1,6..72,200..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              tertiary: "#925600",
              primary: "#c0281f",
              on_surface: "#373831",
              surface: "#fffcf7",
              surface_container_high: "#f0eee4",
              surface_container_highest: "#eae9dd",
              primary_container: "#ffaca0",
              surface_container_low: "#fcf9f3",
              surface_container: "#f6f4ec",
              outline_variant: "#babaaf",
              outline: "#818178",
              secondary_container: "#e1e0ff",
              on_secondary_container: "#4042b5",
              on_surface_variant: "#64655c"
            },
            borderRadius: { xl: "1.5rem", full: "9999px" },
            fontFamily: { headline: ["Epilogue"], body: ["Newsreader"], label: ["Newsreader"] }
          }
        }
      };
    </script>
    <style>
      body { background-color: #fffcf7; color: #373831; font-family: "Newsreader", serif; }
      .watercolor-bleed { background: radial-gradient(circle at top left, rgba(255, 172, 160, 0.15), transparent 70%); }
      .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
      .hand-drawn-border { box-shadow: 0 0 0 1px rgba(129, 129, 120, 0.15), 4px 4px 0 0 rgba(146, 86, 0, 0.05); }
      .curriculum-scroll::-webkit-scrollbar { width: 8px; }
      .curriculum-scroll::-webkit-scrollbar-thumb { background: rgba(146, 86, 0, 0.2); border-radius: 999px; }
      .lesson-content-wrapper h1, .lesson-content-wrapper h2, .lesson-content-wrapper h3, .lesson-content-wrapper h4, .lesson-content-wrapper h5, .lesson-content-wrapper h6 {
        font-family: "Epilogue", sans-serif; font-weight: 700; line-height: 1.1; margin-top: 1.1em; margin-bottom: 0.4em; color: #373831;
      }
      .lesson-content-wrapper h1 { font-size: clamp(2.4rem, 5vw, 4.2rem); }
      .lesson-content-wrapper h2 { font-size: clamp(2rem, 4vw, 3.2rem); }
      .lesson-content-wrapper h3 { font-size: clamp(1.45rem, 3vw, 2.2rem); }
      .lesson-content-wrapper p, .lesson-content-wrapper li, .lesson-content-wrapper td, .lesson-content-wrapper th {
        font-family: "Newsreader", serif; font-size: 1.2rem; line-height: 1.55; color: #373831;
      }
      .lesson-content-wrapper p:first-of-type::first-letter {
        float: left; font-family: "Epilogue", sans-serif; font-size: 3.2em; line-height: 0.85; color: #c0281f; font-weight: 900; padding-right: 8px;
      }
      .lesson-content-wrapper img, .lesson-content-wrapper video { max-width: 100%; height: auto; border-radius: 1rem; }
      .lesson-content-wrapper iframe {
        width: 100%;
        min-height: 420px;
        border: 0;
        border-radius: 1rem;
        margin: 1rem 0;
      }
      @media (min-width: 1280px) {
        .main-with-sidebar {
          margin-left: 20rem;
        }
      }
      .lesson-content-wrapper table { width: 100%; border-collapse: collapse; }
      .lesson-content-wrapper th, .lesson-content-wrapper td { border-bottom: 1px solid #d9d6cb; padding: 0.5rem; }
    </style>
  </head>
  <body class="bg-surface min-h-screen">
    <header class="bg-[#fffcf7] bg-opacity-80 backdrop-blur-md flex justify-between items-center px-4 md:px-8 py-4 w-full fixed top-0 z-50 bg-gradient-to-b from-[#fffcf7] to-transparent">
      <div class="flex items-center gap-3">
        <button id="btn-menu" class="inline-flex items-center justify-center w-10 h-10 rounded-xl border border-outline_variant bg-surface mr-1" aria-label="Toggle curriculum">
          <span class="material-symbols-outlined text-[#373831]">menu</span>
        </button>
        <span class="material-symbols-outlined text-[#c0281f]">palette</span>
        <h1 class="text-2xl font-black text-[#373831] italic font-['Epilogue'] tracking-tight">Art Studio Course Shell</h1>
      </div>
      <div class="hidden md:flex gap-8 items-center">
        <nav class="flex gap-6 font-headline font-bold text-sm tracking-widest uppercase">
          <a class="text-[#c0281f]" href="#">Content</a>
        </nav>
      </div>
    </header>
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/25 z-30 hidden xl:hidden"></div>
    <div class="flex pt-20 h-screen overflow-hidden">
      <aside id="sidebar" class="fixed left-0 top-0 h-full w-80 z-40 p-6 flex flex-col min-h-0 bg-[#f5f0e6] rounded-r-[2rem] shadow-[20px_0_40px_rgba(55,56,49,0.04)] pt-24 transition-transform duration-300 -translate-x-full">
        <div class="mb-8 px-4">
          <span class="font-['Epilogue'] font-bold uppercase tracking-widest text-xs text-[#925600]">Curriculum</span>
          <h2 class="font-['Newsreader'] italic text-2xl text-on_surface mt-1">Structured as Art 10 / Art 20 / Art 30</h2>
          <div id="progress-pill" class="mt-3 text-xs font-['Epilogue'] text-[#665f56]">Loading progress...</div>
        </div>
        <nav id="curriculum-list" class="flex-1 min-h-0 space-y-2 overflow-y-auto curriculum-scroll"></nav>
        <div class="mt-4 grid grid-cols-2 gap-2">
          <button id="btn-reset-progress" class="px-3 py-2 rounded-xl border border-outline_variant text-xs font-headline uppercase tracking-wider">Reset</button>
          <button id="btn-print-report" class="px-3 py-2 rounded-xl bg-gradient-to-r from-primary to-primary_container text-white text-xs font-headline uppercase tracking-wider">Report</button>
        </div>
      </aside>
      <main id="main-shell" class="flex-1 overflow-y-auto bg-surface watercolor-bleed p-4 md:p-8 xl:p-12 transition-[margin] duration-300">
        <div class="max-w-[1600px] mx-auto">
          <div class="mb-8">
            <div>
              <nav id="module-crumb" class="flex gap-2 text-tertiary text-sm font-headline font-bold tracking-widest uppercase mb-4"></nav>
              <h2 id="lesson-heading" class="text-6xl md:text-7xl font-black text-on_surface font-headline leading-[0.9] tracking-tighter mb-4"></h2>
            </div>
          </div>
          <div class="space-y-8">
            <div id="hero-media" class="relative group"></div>
            <div id="lesson-content" class="lesson-content-wrapper max-w-none font-body text-on_surface_variant leading-relaxed"></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./main.js?rev=art-shell-v8"></script>
  </body>
</html>
