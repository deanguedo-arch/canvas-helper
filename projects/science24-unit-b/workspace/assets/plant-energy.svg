<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">Photosynthesis and respiration compared</title><desc id="desc">Light supports glucose formation in chloroplasts; mitochondria use fuel and oxygen during aerobic respiration.</desc><style>text{font-family:system-ui,sans-serif;fill:#24323c;font-size:18px}.small{font-size:14px}.head{font-weight:700;font-size:21px}.box{fill:#f7faf8;stroke:#667d73;stroke-width:2}.arrow{stroke:#3e6c58;stroke-width:4;fill:none;marker-end:url(#tip)}.label{font-weight:700;fill:#124c35}</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e6c58"/></marker></defs><rect class="box" x="28" y="33" rx="8" width="206" height="84"/><text x="42" y="65" class="head">Light + CO₂ + H₂O</text><text x="42" y="88" class="small">photosynthesis inputs</text><rect class="box" x="285" y="33" rx="8" width="190" height="84"/><text x="299" y="65" class="head">Chloroplast</text><text x="299" y="88" class="small">builds glucose</text><rect class="box" x="529" y="33" rx="8" width="206" height="84"/><text x="543" y="65" class="head">Glucose + O₂</text><text x="543" y="88" class="small">photosynthesis outputs</text><rect class="box" x="285" y="197" rx="8" width="190" height="84"/><text x="299" y="229" class="head">Mitochondrion</text><text x="299" y="252" class="small">uses fuel + oxygen</text><rect class="box" x="529" y="197" rx="8" width="206" height="84"/><text x="543" y="229" class="head">Cell work + heat</text><text x="543" y="252" class="small">CO₂ + H₂O returned</text><path class="arrow" d="M234 75 L285 75"/><path class="arrow" d="M475 75 L529 75"/><path class="arrow" d="M625 117 L390 196"/><path class="arrow" d="M475 240 L529 240"/></svg>