<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">Four-level food-energy pyramid with lettered rows</title><desc id="desc">The widest bottom row D shows grass, above it C a grasshopper, above it B a frog, and the narrow top row A a hawk. Width narrows upward as available energy generally decreases.</desc>
<g font-family="system-ui,sans-serif" fill="#24323c"><g fill="#f8faf8" stroke="#567a68" stroke-width="2"><rect x="275" y="16" width="210" height="59" rx="7"/><rect x="218" y="83" width="324" height="59" rx="7"/><rect x="158" y="150" width="444" height="59" rx="7"/><rect x="95" y="217" width="570" height="76" rx="7"/></g><g font-size="21" font-weight="700"><text x="294" y="43">A</text><text x="237" y="110">B</text><text x="177" y="177">C</text><text x="114" y="244">D</text></g><g font-size="20"><text x="343" y="51">hawk</text><text x="327" y="118">frog</text><text x="315" y="185">grasshopper</text><text x="325" y="252">grass</text></g><path d="M380 270v-18m-11 18l11-18 11 18m18 0v-18m-11 18l11-18 11 18" fill="none" stroke="#35684d" stroke-width="3"/></g>
</svg>
