<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">Simplified layered underground reservoir with four lettered targets</title><desc id="desc">A is a solid upper seal. Below it a porous rock layer has an upper pale pocket B, a darker middle pocket C, and a blue lower pocket D. These fluids occupy pores rather than empty caverns.</desc>
<g font-family="system-ui,sans-serif" fill="#24323c" stroke="#7c7b68" stroke-width="2"><rect x="35" y="25" width="690" height="62" fill="#d8cfb4"/><rect x="35" y="87" width="690" height="61" fill="#f4edda"/><rect x="35" y="148" width="690" height="61" fill="#bca47e"/><rect x="35" y="209" width="690" height="76" fill="#9ab8c4"/><path d="M35 87q130-26 260 0t260 0t170 0M35 148q130-18 260 0t260 0t170 0M35 209q130-18 260 0t260 0t170 0" fill="none" stroke="#7c7b68"/><g stroke="none" font-size="24" font-weight="700"><text x="57" y="65">A</text><text x="57" y="126">B</text><text x="57" y="187">C</text><text x="57" y="253">D</text></g><g fill="none" stroke="#7c7b68" stroke-width="1" opacity=".55"><circle cx="248" cy="113" r="4"/><circle cx="291" cy="133" r="5"/><circle cx="492" cy="118" r="4"/><circle cx="230" cy="180" r="5"/><circle cx="413" cy="168" r="4"/><circle cx="530" cy="186" r="5"/><circle cx="265" cy="243" r="4"/><circle cx="433" cy="262" r="5"/></g></g>
</svg>
