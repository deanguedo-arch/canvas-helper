<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">Useful and other output energy</title><desc id="desc">A device receives 100 J, transfers 30 J as useful light and 70 J as other outputs; efficiency is 30 percent.</desc><style>text{font-family:system-ui,sans-serif;fill:#24323c;font-size:18px}.small{font-size:14px}.head{font-weight:700;font-size:21px}.box{fill:#f7faf8;stroke:#667d73;stroke-width:2}.arrow{stroke:#3e6c58;stroke-width:4;fill:none;marker-end:url(#tip)}.label{font-weight:700;fill:#124c35}</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e6c58"/></marker></defs><rect class="box" x="40" y="105" rx="8" width="180" height="95"/><text x="54" y="137" class="head">100 J input</text><text x="54" y="160" class="small">electrical</text><rect class="box" x="300" y="105" rx="8" width="160" height="95"/><text x="314" y="137" class="head">Device</text><text x="314" y="160" class="small">conversion</text><rect class="box" x="545" y="35" rx="8" width="185" height="85"/><text x="559" y="67" class="head">30 J useful</text><text x="559" y="90" class="small">light</text><rect class="box" x="545" y="195" rx="8" width="185" height="85"/><text x="559" y="227" class="head">70 J other</text><text x="559" y="250" class="small">heat + sound</text><path class="arrow" d="M220 150 L300 150"/><path class="arrow" d="M460 130 L545 78"/><path class="arrow" d="M460 170 L545 237"/></svg>