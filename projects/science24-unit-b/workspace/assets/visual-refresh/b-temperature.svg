<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="title desc"><title id="title">Feedback when the body cools</title><desc id="desc">Receptors detect cooling, the nervous system coordinates a response, shivering and heat conservation oppose the change, and temperature moves toward its usual range. Feedback changes the response as conditions change.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="580" fill="#fff"/><rect x="38" y="20" width="492" height="96" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="284" y="77.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Receptors detect cooling</text><line x1="285" y1="116" x2="285" y2="148" stroke="#087d75" stroke-width="4" /><path d="M 276 136 L 285 148 L 294 136" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 285 148)"/><rect x="38" y="150" width="492" height="96" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="284" y="207.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Brain coordinates a response</text><line x1="285" y1="246" x2="285" y2="278" stroke="#087d75" stroke-width="4" /><path d="M 276 266 L 285 278 L 294 266" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 285 278)"/><rect x="38" y="280" width="492" height="108" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="284" y="325.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Shivering and heat conservation</text><text x="284" y="361.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">oppose the cooling</text><line x1="285" y1="388" x2="285" y2="423" stroke="#087d75" stroke-width="4" /><path d="M 276 411 L 285 423 L 294 411" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 285 423)"/><rect x="38" y="425" width="492" height="96" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="284" y="464.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Temperature moves</text><text x="284" y="500.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">toward its usual range</text><line x1="530" y1="473" x2="560" y2="473" stroke="#087d75" stroke-width="3" /><line x1="560" y1="473" x2="560" y2="67" stroke="#087d75" stroke-width="3" /><line x1="560" y1="67" x2="533" y2="67" stroke="#087d75" stroke-width="4" /><path d="M 524 55 L 533 67 L 542 55" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(90 533 67)"/><text x="300" y="560" font-size="26" fill="#087d75" font-weight="700" text-anchor="middle">Feedback adjusts the response.</text></svg>
