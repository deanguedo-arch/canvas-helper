<svg xmlns="http://www.w3.org/2000/svg" width="600" height="710" viewBox="0 0 600 710" role="img" aria-labelledby="title desc"><title id="title">Follow stored chemical energy through different pathways</title><desc id="desc">Sunlight is stored by photosynthesis. Food can fuel cellular respiration. Ancient organic matter can become fossil fuels over geological time and release energy through combustion. Technologies convert energy into useful and other outputs.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="710" fill="#fff"/><rect x="105" y="20" width="390" height="86" rx="5" fill="#fff5e1" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="73.33333333333334" font-size="31" fill="#192522" font-weight="400" text-anchor="middle">Sunlight</text><line x1="300" y1="106" x2="300" y2="143" stroke="#087d75" stroke-width="4" /><path d="M 291 131 L 300 143 L 309 131" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 143)"/><rect x="50" y="150" width="500" height="108" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="195.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Photosynthesis stores energy</text><text x="300" y="231.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">in organic matter</text><line x1="220" y1="258" x2="150" y2="315" stroke="#087d75" stroke-width="4" /><path d="M 141 303 L 150 315 L 159 303" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(50.844565877386884 150 315)"/><line x1="380" y1="258" x2="450" y2="315" stroke="#087d75" stroke-width="4" /><path d="M 441 303 L 450 315 L 459 303" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(-50.84456587738686 450 315)"/><rect x="20" y="328" width="260" height="112" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="150" y="375.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Food</text><text x="150" y="411.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Cellular respiration</text><rect x="320" y="328" width="260" height="112" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="450" y="375.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Ancient biomass</text><text x="450" y="411.3333333333333" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Fossil fuels</text><line x1="150" y1="440" x2="150" y2="477" stroke="#087d75" stroke-width="4" /><path d="M 141 465 L 150 477 L 159 465" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 150 477)"/><line x1="450" y1="440" x2="450" y2="477" stroke="#087d75" stroke-width="4" /><path d="M 441 465 L 450 477 L 459 465" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 450 477)"/><rect x="20" y="489" width="260" height="108" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="150" y="534.3333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Cell processes</text><text x="150" y="570.3333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">and thermal energy</text><rect x="320" y="489" width="260" height="108" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="450" y="534.3333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Combustion</text><text x="450" y="570.3333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">and thermal energy</text><text x="300" y="650" font-size="29" fill="#174c24" font-weight="700" text-anchor="middle">Technologies convert energy</text><text x="300" y="692" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">into useful and other outputs.</text></svg>
