<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">Matter and energy in aerobic respiration</title><desc id="desc">Glucose and oxygen become carbon dioxide and water. Chemical energy is transferred to cell processes and to thermal energy; it is not newly created.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="480" fill="#fff"/><rect x="45" y="20" width="510" height="86" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="73" font-size="30" fill="#192522" font-weight="400" text-anchor="middle">Glucose + oxygen</text><line x1="300" y1="107" x2="300" y2="148" stroke="#087d75" stroke-width="4" /><path d="M 291 136 L 300 148 L 309 136" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 148)"/><rect x="45" y="164" width="510" height="103" rx="5" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="225.16666666666666" font-size="29" fill="#192522" font-weight="400" text-anchor="middle">Carbon dioxide + water</text><line x1="550" y1="67" x2="575" y2="67" stroke="#925900" stroke-width="4" /><line x1="575" y1="67" x2="575" y2="349" stroke="#925900" stroke-width="4" /><line x1="575" y1="349" x2="534" y2="349" stroke="#925900" stroke-width="4" /><path d="M 525 337 L 534 349 L 543 337" fill="none" stroke="#925900" stroke-width="4" transform="rotate(90 534 349)"/><rect x="45" y="312" width="490" height="118" rx="5" fill="#fff5e1" stroke="#cbd9d2" stroke-width="2"/><text x="290" y="362.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">Energy transferred to</text><text x="290" y="397.5" font-size="27" fill="#192522" font-weight="400" text-anchor="middle">cell processes + thermal energy</text><text x="300" y="465" font-size="26" fill="#192522" font-weight="400" text-anchor="middle">Matter changes; energy is transferred.</text></svg>
