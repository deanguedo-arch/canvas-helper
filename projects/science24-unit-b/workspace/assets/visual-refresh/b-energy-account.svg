<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title desc"><title id="title">Account for the whole energy input</title><desc id="desc">100 joules enter a device. 35 joules leave as useful output and 65 joules as other outputs. 35 plus 65 equals 100; energy is conserved for this stated boundary.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="490" fill="#fff"/><rect x="95" y="20" width="410" height="87" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="74.16666666666666" font-size="32" fill="#192522" font-weight="400" text-anchor="middle">100 J input</text><line x1="300" y1="107" x2="300" y2="148" stroke="#087d75" stroke-width="4" /><path d="M 291 136 L 300 148 L 309 136" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 148)"/><rect x="170" y="155" width="260" height="80" rx="5" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="205" font-size="30" fill="#192522" font-weight="400" text-anchor="middle">Device</text><line x1="245" y1="235" x2="157" y2="298" stroke="#087d75" stroke-width="7" /><path d="M 148 286 L 157 298 L 166 286" fill="none" stroke="#087d75" stroke-width="7" transform="rotate(54.400780041023836 157 298)"/><line x1="355" y1="235" x2="447" y2="298" stroke="#925900" stroke-width="12" /><path d="M 438 286 L 447 298 L 456 286" fill="none" stroke="#925900" stroke-width="12" transform="rotate(-55.59733514502356 447 298)"/><rect x="18" y="308" width="270" height="116" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="153" y="357.1666666666667" font-size="29" fill="#192522" font-weight="400" text-anchor="middle">Useful output</text><text x="153" y="394.1666666666667" font-size="29" fill="#192522" font-weight="400" text-anchor="middle">35 J</text><rect x="312" y="308" width="270" height="116" rx="5" fill="#fff5e1" stroke="#cbd9d2" stroke-width="2"/><text x="447" y="357.1666666666667" font-size="29" fill="#192522" font-weight="400" text-anchor="middle">Other outputs</text><text x="447" y="394.1666666666667" font-size="29" fill="#192522" font-weight="400" text-anchor="middle">65 J</text><text x="300" y="470" font-size="32" fill="#174c24" font-weight="700" text-anchor="middle">35 J + 65 J = 100 J</text></svg>
