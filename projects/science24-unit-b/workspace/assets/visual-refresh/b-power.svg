<svg xmlns="http://www.w3.org/2000/svg" width="600" height="455" viewBox="0 0 600 455" role="img" aria-labelledby="title desc"><title id="title">Power is energy transferred per second</title><desc id="desc">120 joules in half a minute: convert half a minute to 30 seconds, then divide 120 joules by 30 seconds to obtain 4 watts. One watt is one joule per second.</desc><style>text{font-family:'Work Sans',Arial,sans-serif}line,path,rect{stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="455" fill="#fff"/><text x="300" y="49" font-size="32" fill="#174c24" font-weight="700" text-anchor="middle">Power = energy ÷ time</text><rect x="55" y="85" width="490" height="90" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="139.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Energy transferred: 120 J</text><rect x="55" y="196" width="490" height="90" rx="5" fill="#edf5ef" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="250.33333333333334" font-size="28" fill="#192522" font-weight="400" text-anchor="middle">Half a minute = 30 s</text><line x1="300" y1="287" x2="300" y2="318" stroke="#087d75" stroke-width="4" /><path d="M 291 306 L 300 318 L 309 306" fill="none" stroke="#087d75" stroke-width="4" transform="rotate(0 300 318)"/><rect x="55" y="335" width="490" height="88" rx="5" fill="#fff5e1" stroke="#cbd9d2" stroke-width="2"/><text x="300" y="389.6666666666667" font-size="32" fill="#192522" font-weight="400" text-anchor="middle">120 J ÷ 30 s = 4 W</text></svg>
