<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Labour: an amplifying feedback loop</title><desc>The first five features reinforce cervical stretch; birth removes the principal stimulus. Prostaglandins can also support contractions.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Labour: an amplifying feedback loop</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — arrows show the specified causal sequence</text><rect x="90" y="220" width="330" height="150" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="255.0" y="256" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">Pressure increases stretch</text><text x="255.0" y="287" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">at the cervix</text><circle cx="125" cy="196" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="125" y="204" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><line x1="432" y1="295.0" x2="528" y2="295.0" stroke="#146c60" stroke-width="5"/><polygon points="528.0,295.0 513.1,303.2 513.1,286.8" fill="#146c60"/><rect x="540" y="220" width="330" height="150" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="705.0" y="256" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">Signals travel to the</text><text x="705.0" y="287" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">hypothalamus</text><circle cx="575" cy="196" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="575" y="204" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><line x1="882" y1="295.0" x2="978" y2="295.0" stroke="#146c60" stroke-width="5"/><polygon points="978.0,295.0 963.1,303.2 963.1,286.8" fill="#146c60"/><rect x="990" y="220" width="330" height="150" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1155.0" y="256" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">Posterior pituitary</text><text x="1155.0" y="287" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">releases a hormone</text><circle cx="1025" cy="196" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1025" y="204" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><rect x="90" y="470" width="330" height="150" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="255.0" y="506" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">Uterine muscle contracts</text><text x="255.0" y="537" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">more strongly</text><circle cx="125" cy="446" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="125" y="454" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><line x1="432" y1="545.0" x2="528" y2="545.0" stroke="#146c60" stroke-width="5"/><polygon points="528.0,545.0 513.1,553.2 513.1,536.8" fill="#146c60"/><rect x="540" y="470" width="330" height="150" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="705.0" y="506" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">Pressure reinforces the</text><text x="705.0" y="537" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">original stimulus</text><circle cx="575" cy="446" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="575" y="454" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">E</text><line x1="882" y1="545.0" x2="978" y2="545.0" stroke="#146c60" stroke-width="5"/><polygon points="978.0,545.0 963.1,553.2 963.1,536.8" fill="#146c60"/><rect x="990" y="470" width="330" height="150" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1155.0" y="506" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">Delivery removes the main</text><text x="1155.0" y="537" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="400">stretch stimulus</text><circle cx="1025" cy="446" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1025" y="454" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">F</text><line x1="1155" y1="370" x2="1155" y2="420" stroke="#146c60" stroke-width="4"/><line x1="1155" y1="420" x2="60" y2="420" stroke="#146c60" stroke-width="4"/><line x1="60" y1="420" x2="60" y2="545.0" stroke="#146c60" stroke-width="4"/><line x1="60" y1="545.0" x2="90" y2="545.0" stroke="#146c60" stroke-width="5"/><polygon points="90.0,545.0 75.1,553.2 75.1,536.8" fill="#146c60"/><line x1="705" y1="620" x2="705" y2="710" stroke="#146c60" stroke-width="4"/><line x1="705" y1="710" x2="40" y2="710" stroke="#146c60" stroke-width="4"/><line x1="40" y1="710" x2="40" y2="245" stroke="#146c60" stroke-width="4"/><line x1="40" y1="245" x2="90" y2="245" stroke="#146c60" stroke-width="5"/><polygon points="90.0,245.0 75.1,253.2 75.1,236.8" fill="#146c60"/><text x="440" y="741" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="middle" font-weight="400">Reinforces cervical stretch</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="790" font-family="Arial,sans-serif" font-size="21" fill="#5b635d">Use the lettered features and the nearby lesson explanation.</text></svg>