<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Lactation: production is not ejection</title><desc>Suckling can stimulate two hormonal responses: anterior-pituitary prolactin supports milk production, while posterior-pituitary oxytocin supports milk ejection.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Lactation: production is not ejection</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><rect x="480" y="160" width="430" height="85" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="695.0" y="196" font-family="Arial,sans-serif" font-size="24" fill="#171b1b" text-anchor="middle" font-weight="400">Suckling → sensory input</text><line x1="560" y1="260" x2="330" y2="335" stroke="#146c60" stroke-width="5"/><polygon points="330.0,335.0 341.7,322.6 346.7,338.1" fill="#146c60"/><line x1="820" y1="260" x2="1060" y2="335" stroke="#146c60" stroke-width="5"/><polygon points="1060.0,335.0 1043.3,338.3 1048.2,322.8" fill="#146c60"/><rect x="150" y="340" width="380" height="100" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="340.0" y="376" font-family="Arial,sans-serif" font-size="24" fill="#171b1b" text-anchor="middle" font-weight="400">Anterior pituitary</text><line x1="340" y1="442" x2="340" y2="465" stroke="#146c60" stroke-width="5"/><polygon points="340.0,465.0 331.8,450.1 348.2,450.1" fill="#146c60"/><circle cx="340" cy="490" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="340" y="498" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><line x1="340" y1="515" x2="340" y2="550" stroke="#146c60" stroke-width="5"/><polygon points="340.0,550.0 331.8,535.1 348.2,535.1" fill="#146c60"/><rect x="150" y="565" width="380" height="105" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="340.0" y="601" font-family="Arial,sans-serif" font-size="24" fill="#171b1b" text-anchor="middle" font-weight="400">Secretory cells</text><line x1="560" y1="615" x2="490" y2="615" stroke="#171b1b" stroke-width="2.5"/><circle cx="490" cy="615" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="560" cy="615" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="560" y="623" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><rect x="860" y="340" width="380" height="100" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1050.0" y="376" font-family="Arial,sans-serif" font-size="24" fill="#171b1b" text-anchor="middle" font-weight="400">Posterior pituitary</text><line x1="1050" y1="442" x2="1050" y2="465" stroke="#146c60" stroke-width="5"/><polygon points="1050.0,465.0 1041.8,450.1 1058.2,450.1" fill="#146c60"/><circle cx="1050" cy="490" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1050" y="498" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><line x1="1050" y1="515" x2="1050" y2="550" stroke="#146c60" stroke-width="5"/><polygon points="1050.0,550.0 1041.8,535.1 1058.2,535.1" fill="#146c60"/><rect x="860" y="565" width="380" height="105" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1050.0" y="601" font-family="Arial,sans-serif" font-size="24" fill="#171b1b" text-anchor="middle" font-weight="400">Myoepithelial contraction</text><line x1="1270" y1="615" x2="1200" y2="615" stroke="#171b1b" stroke-width="2.5"/><circle cx="1200" cy="615" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="1270" cy="615" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1270" y="623" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">A · Prolactin</text><text x="495" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">B · Milk production</text><text x="940" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">C · Oxytocin</text><text x="50" y="825" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">D · Milk ejection</text></svg>