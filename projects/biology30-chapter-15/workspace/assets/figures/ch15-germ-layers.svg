<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Three germ layers after gastrulation</title><desc>Three adjacent embryonic layers provide different tissue lineages. The coloured bands compare the layers; the spaces between bands do not represent cavities.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Three germ layers after gastrulation</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><rect x="250" y="205" width="860" height="105" rx="12" fill="#cfe6f3" stroke="#d9ded8" stroke-width="2"/><line x1="125" y1="255" x2="300" y2="255" stroke="#171b1b" stroke-width="2.5"/><circle cx="300" cy="255" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="125" cy="255" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="125" y="263" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><text x="680" y="250" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">Nervous system; epidermis</text><rect x="250" y="345" width="860" height="105" rx="12" fill="#f1d8dc" stroke="#d9ded8" stroke-width="2"/><line x1="125" y1="395" x2="300" y2="395" stroke="#171b1b" stroke-width="2.5"/><circle cx="300" cy="395" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="125" cy="395" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="125" y="403" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><text x="680" y="390" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">Muscle; skeleton; blood and vessels</text><rect x="250" y="485" width="860" height="105" rx="12" fill="#f7e9b6" stroke="#d9ded8" stroke-width="2"/><line x1="125" y1="535" x2="300" y2="535" stroke="#171b1b" stroke-width="2.5"/><circle cx="300" cy="535" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="125" cy="535" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="125" y="543" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><text x="680" y="530" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">Digestive and respiratory epithelial linings</text><text x="700" y="690" font-family="Arial,sans-serif" font-size="25" fill="#5b635d" text-anchor="middle" font-weight="400">All three layers are parts of one developing embryo.</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">A · Ectoderm</text><text x="495" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">B · Mesoderm</text><text x="940" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">C · Endoderm</text></svg>