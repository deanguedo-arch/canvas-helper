<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Same principle: a specific signal meets a receptor"><title>Same principle: a specific signal meets a receptor</title><desc>Conceptual schematic, not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146c60"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a15c00"/></marker></defs><rect width="1000" height="560" fill="#fcfdfb"/><g font-family="Arial,sans-serif" fill="#171b1b"><text x="34" y="40" font-size="25" font-weight="700">Same principle: a specific signal meets a receptor</text><rect x="35" y="90" width="445" height="385" rx="9" fill="#eef5f1" stroke="#bdcdbf"/><text x="257.5" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="257.5" dy="0">Water-soluble signal</tspan></text><text x="257.5" y="157" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"></text><rect x="520" y="90" width="445" height="385" rx="9" fill="#f7f3e8" stroke="#bdcdbf"/><text x="742.5" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="742.5" dy="0">Lipid-soluble signal</tspan></text><text x="742.5" y="157" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"></text><path d="M72 244H448M554 244H928" stroke="#92ab9c" stroke-width="18"/><path d="M254 226v57" stroke="#a26a66" stroke-width="18"/><circle cx="254" cy="193" r="16" fill="#d49c69"/><path d="M259 301v51" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><circle cx="747" cy="192" r="16" fill="#d49c69"/><path d="M747 211v91" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><ellipse cx="771" cy="371" rx="66" ry="44" fill="#dee7de" stroke="#93a88e" stroke-width="3"/><circle cx="739" cy="337" r="16" fill="#d49c69"/><text x="260" y="379" text-anchor="middle" font-size="20" font-weight="400" fill="#171b1b"><tspan x="260" dy="0">Membrane receptor</tspan><tspan x="260" dy="27.0">→ internal signalling</tspan></text><text x="747" y="439" text-anchor="middle" font-size="20" font-weight="400" fill="#171b1b"><tspan x="747" dy="0">Intracellular receptor</tspan><tspan x="747" dy="27.0">→ gene activity / proteins</tspan></text><text x="66" y="285" text-anchor="start" font-size="15" font-weight="400" fill="#171b1b"><tspan x="66" dy="0">Membrane</tspan></text><text x="560" y="285" text-anchor="start" font-size="15" font-weight="400" fill="#171b1b"><tspan x="560" dy="0">Membrane</tspan></text><text x="500" y="519" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="500" dy="0">Both require a responsive target cell. Thyroid hormones are lipid soluble but are not steroids.</tspan></text></g></svg>