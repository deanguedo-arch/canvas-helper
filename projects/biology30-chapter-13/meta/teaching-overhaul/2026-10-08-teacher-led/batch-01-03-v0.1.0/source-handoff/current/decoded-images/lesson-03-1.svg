<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Negative feedback: oppose the starting change"><title>Negative feedback: oppose the starting change</title><desc>Conceptual schematic, not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146c60"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a15c00"/></marker></defs><rect width="1000" height="380" fill="#fcfdfb"/><g font-family="Arial,sans-serif" fill="#171b1b"><text x="34" y="40" font-size="25" font-weight="700">Negative feedback: oppose the starting change</text><rect x="45.0" y="118" width="286.0" height="133" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="188.0" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="188.0" dy="0">Glucose rises</tspan></text><text x="188.0" y="185" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="188.0" dy="0">Change in the</tspan><tspan x="188.0" dy="24.3">regulated variable</tspan></text><path d="M334.0 182L353.0 182" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><rect x="357.0" y="118" width="286.0" height="133" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="500.0" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="500.0" dy="0">Insulin rises</tspan></text><text x="500.0" y="185" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="500.0" dy="0">Pancreatic beta cells</tspan><tspan x="500.0" dy="24.3">release the hormone</tspan></text><path d="M646.0 182L665.0 182" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><rect x="669.0" y="118" width="286.0" height="133" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="812.0" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="812.0" dy="0">Targets respond</tspan></text><text x="812.0" y="185" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="812.0" dy="0">Uptake and storage</tspan><tspan x="812.0" dy="24.3">reduce blood glucose</tspan></text><path d="M812.0 253V311H188.0" stroke="#a43f35" stroke-width="3" fill="none"/><path d="M188.0 311V256M178.0 256h20" stroke="#a43f35" stroke-width="3" fill="none"/><text x="500" y="343" text-anchor="middle" font-size="19" font-weight="400" fill="#a43f35"><tspan x="500" dy="0">Correction reduces the original drive for extra insulin release</tspan></text></g></svg>