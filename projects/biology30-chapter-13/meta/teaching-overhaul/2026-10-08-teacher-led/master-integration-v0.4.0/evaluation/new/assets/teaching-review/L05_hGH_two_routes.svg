<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Growth hormone: direct and indirect routes</title><desc id="desc">Anterior pituitary releases hGH into blood. hGH reaches responsive tissue directly to change metabolism, or stimulates liver to release growth factors that reach responsive tissue and support growth. Only the indirect route has the extra growth-factor messenger.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376e64"/></marker></defs>
<rect width="1200" height="800" fill="#f6f3eb"/>
<g font-family="Arial, sans-serif" fill="#233b3d">
<text x="60" y="58" font-size="30" font-weight="700">One hormone, two routes to responsive tissue</text>
<text x="60" y="95" font-size="21">Follow each branch separately. Blood carries both kinds of messenger.</text>
<g stroke="#54776e" stroke-width="2" fill="#fffdf8"><rect x="430" y="122" width="340" height="108" rx="8"/><rect x="60" y="350" width="400" height="108" rx="8"/><rect x="730" y="350" width="400" height="108" rx="8"/><rect x="730" y="622" width="400" height="98" rx="8"/></g>
<text x="600" y="162" text-anchor="middle" font-size="26" font-weight="700">Anterior pituitary</text><text x="600" y="199" text-anchor="middle" font-size="23">releases hGH into blood</text>
<g fill="none" stroke="#376e64" stroke-width="4" marker-end="url(#arrow)"><path d="M520 230V404H472"/><path d="M680 230V404H718"/><path d="M930 458V472" marker-end="none"/></g>
<text x="60" y="305" font-size="24" font-weight="700">1 · Direct effect</text><text x="60" y="335" font-size="21">hGH delivered to responsive tissue</text>
<text x="730" y="305" font-size="24" font-weight="700">2 · Indirect effect</text><text x="730" y="335" font-size="21">hGH stimulates liver cells</text>
<text x="260" y="388" text-anchor="middle" font-size="25" font-weight="700">Responsive tissue</text><text x="260" y="424" text-anchor="middle" font-size="22">hGH changes tissue activity</text>
<text x="60" y="495" font-size="22">Example: releasing stored fat for fuel</text><text x="60" y="530" font-size="21">This branch does not pass through liver.</text>
<text x="930" y="388" text-anchor="middle" font-size="25" font-weight="700">Liver</text><text x="930" y="424" text-anchor="middle" font-size="22">releases growth factors</text>
<rect x="705" y="472" width="455" height="62" fill="#f6f3eb"/><text x="930" y="496" text-anchor="middle" font-size="22" font-weight="700">Extra messenger: growth factors</text><text x="930" y="525" text-anchor="middle" font-size="21">travel in blood to responsive tissue</text>
<path d="M930 534V610" fill="none" stroke="#376e64" stroke-width="4" marker-end="url(#arrow)"/>
<text x="930" y="661" text-anchor="middle" font-size="25" font-weight="700">Responsive tissue</text><text x="930" y="696" text-anchor="middle" font-size="22">growth factors support growth</text>
<text x="60" y="777" font-size="19">Arrows show delivery or stimulation as labelled. Simplified examples; not every hGH action. Not to scale.</text>
</g></svg>
