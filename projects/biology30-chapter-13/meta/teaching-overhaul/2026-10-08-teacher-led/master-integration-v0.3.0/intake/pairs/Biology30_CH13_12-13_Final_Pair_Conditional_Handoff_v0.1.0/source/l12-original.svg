<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-label="After a meal / between meals"><title>After a meal / between meals</title><desc>Conceptual schematic, not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146c60"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a15c00"/></marker></defs><rect width="1000" height="610" fill="#fcfdfb"/><g font-family="Arial,sans-serif" fill="#171b1b"><text x="34" y="40" font-size="25" font-weight="700">After a meal / between meals</text><rect x="35" y="100" width="270" height="131" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="170.0" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="170.0" dy="0">HIGH blood glucose</tspan></text><text x="170.0" y="167" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="170.0" dy="0">Starting disturbance</tspan></text><rect x="355" y="100" width="287" height="131" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="498.5" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="498.5" dy="0">Beta cells → insulin</tspan></text><text x="498.5" y="167" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="498.5" dy="0">Uptake and storage</tspan><tspan x="498.5" dy="24.3">increase</tspan></text><rect x="699" y="100" width="266" height="131" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="832.0" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="832.0" dy="0">Glucose falls</tspan></text><text x="832.0" y="167" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="832.0" dy="0">Toward usual range</tspan></text><path d="M308 165L350 165" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><path d="M646 165L694 165" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><path d="M831 233V277H169V239" fill="none" stroke="#a43f35" stroke-width="3"/><path d="M157 239h24" stroke="#a43f35" stroke-width="4"/><text x="500" y="308" text-anchor="middle" font-size="18" font-weight="400" fill="#a43f35"><tspan x="500" dy="0">Both are negative feedback: the effect opposes the disturbance.</tspan></text><rect x="35" y="340" width="270" height="131" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="170.0" y="374" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="170.0" dy="0">LOW blood glucose</tspan></text><text x="170.0" y="407" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="170.0" dy="0">Starting disturbance</tspan></text><rect x="355" y="340" width="287" height="131" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="498.5" y="374" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="498.5" dy="0">Alpha cells → glucagon</tspan></text><text x="498.5" y="407" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="498.5" dy="0">Liver glucose supply</tspan><tspan x="498.5" dy="24.3">increases</tspan></text><rect x="699" y="340" width="266" height="131" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="832.0" y="374" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="832.0" dy="0">Glucose rises</tspan></text><text x="832.0" y="407" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="832.0" dy="0">Toward usual range</tspan></text><path d="M308 405L350 405" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><path d="M646 405L694 405" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><path d="M831 473V517H169V479" fill="none" stroke="#a43f35" stroke-width="3"/><path d="M157 479h24" stroke="#a43f35" stroke-width="4"/><text x="500" y="548" text-anchor="middle" font-size="18" font-weight="400" fill="#a43f35"><tspan x="500" dy="0">Both are negative feedback: the effect opposes the disturbance.</tspan></text></g></svg>