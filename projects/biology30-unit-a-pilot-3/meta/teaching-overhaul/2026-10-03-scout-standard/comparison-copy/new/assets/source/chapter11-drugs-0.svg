<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Drugs can alter different steps of synaptic transmission</title><defs><marker id="a-ink" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#19392F"/></marker><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#287E80"/></marker><marker id="a-amber" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B87923"/></marker><marker id="a-brick" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#AA4D3E"/></marker><marker id="a-grey" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#718078"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8271A4"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="64" y="72.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#19392F" font-weight="700" text-anchor="start">Drugs can alter different steps of synaptic transmission</text><text x="64" y="116.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#718078" font-weight="400" text-anchor="start">Understand how each mechanism changes communication at a synapse.</text><line x1="64" y1="144" x2="1536" y2="144" stroke="#CFDAD3" stroke-width="2"/><circle cx="120" cy="253" r="34" fill="#E8D7AB" stroke="#19392F" stroke-width="2"/><text x="120" y="265.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#19392F" font-weight="700" text-anchor="middle">1</text><text x="176" y="262.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#19392F" font-weight="700" text-anchor="start">Synthesis and storage</text><text x="176" y="322.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">Less transmitter may be available.</text><circle cx="905" cy="253" r="34" fill="#B8D5D1" stroke="#19392F" stroke-width="2"/><text x="905" y="265.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#19392F" font-weight="700" text-anchor="middle">2</text><text x="961" y="262.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#19392F" font-weight="700" text-anchor="start">Release</text><text x="961" y="322.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">More or less transmitter enters the</text><text x="961" y="355.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">cleft.</text><circle cx="120" cy="538" r="34" fill="#DAB8AB" stroke="#19392F" stroke-width="2"/><text x="120" y="550.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#19392F" font-weight="700" text-anchor="middle">3</text><text x="176" y="547.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#19392F" font-weight="700" text-anchor="start">Receptor binding</text><text x="176" y="607.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">A drug may mimic a transmitter or</text><text x="176" y="640.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">block its receptor.</text><circle cx="905" cy="538" r="34" fill="#CBC2DD" stroke="#19392F" stroke-width="2"/><text x="905" y="550.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#19392F" font-weight="700" text-anchor="middle">4</text><text x="961" y="547.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#19392F" font-weight="700" text-anchor="start">Breakdown or reuptake</text><text x="961" y="607.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">A signal may last longer or end</text><text x="961" y="640.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">sooner.</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#CFDAD3" stroke-width="2"/><text x="64" y="860.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">Predict the effect from the step that changes. “Stimulant” does not simply mean “more transmitter.”</text></svg>