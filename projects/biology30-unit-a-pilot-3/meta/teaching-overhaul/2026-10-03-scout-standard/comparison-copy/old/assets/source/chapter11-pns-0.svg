<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img"><title>Organization of the nervous system</title><defs><marker id="a-ink" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#19392F"/></marker><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#287E80"/></marker><marker id="a-amber" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B87923"/></marker><marker id="a-brick" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#AA4D3E"/></marker><marker id="a-grey" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#718078"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8271A4"/></marker></defs><rect width="1600" height="980" fill="white"/><text x="64" y="72.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#19392F" font-weight="700" text-anchor="start">Organization of the nervous system</text><text x="64" y="116.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#718078" font-weight="400" text-anchor="start">Location divides CNS from PNS; function further divides the peripheral pathways.</text><line x1="64" y1="144" x2="1536" y2="144" stroke="#CFDAD3" stroke-width="2"/><rect x="544" y="177" width="512" height="71" rx="12" fill="#EDF3EA" stroke="#729365" stroke-width="2"/><text x="800.0" y="216.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#19392F" font-weight="700" text-anchor="middle">Nervous system</text><rect x="75" y="313" width="485" height="112" rx="12" fill="#EDF3EA" stroke="#729365" stroke-width="2"/><text x="317.5" y="352.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#19392F" font-weight="700" text-anchor="middle">Central nervous system</text><text x="317.5" y="392.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="middle">Brain and spinal cord</text><rect x="686" y="313" width="781" height="71" rx="12" fill="#EDF3EA" stroke="#729365" stroke-width="2"/><text x="1076.5" y="352.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#19392F" font-weight="700" text-anchor="middle">Peripheral nervous system</text><path d="M800,248 L800,278 L320,278 L320,309" fill="none" stroke="#19392F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M800,278 L1080,278 L1080,309" fill="none" stroke="#19392F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><rect x="600" y="454" width="397" height="109" rx="12" fill="#EDF3EA" stroke="#729365" stroke-width="2"/><text x="798.5" y="493.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#19392F" font-weight="700" text-anchor="middle">Sensory (afferent)</text><text x="798.5" y="533.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="middle">Carries information to CNS</text><rect x="1054" y="454" width="447" height="109" rx="12" fill="#EDF3EA" stroke="#729365" stroke-width="2"/><text x="1277.5" y="493.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#19392F" font-weight="700" text-anchor="middle">Motor (efferent)</text><text x="1277.5" y="533.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="middle">Carries commands from CNS</text><path d="M1080,384 L1080,411 L796,411 L796,448" fill="none" stroke="#19392F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M1080,411 L1276,411 L1276,448" fill="none" stroke="#19392F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><rect x="612" y="625" width="383" height="99" rx="12" fill="#EDF3EA" stroke="#729365" stroke-width="2"/><text x="803.5" y="664.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#19392F" font-weight="700" text-anchor="middle">Somatic</text><text x="803.5" y="704.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="middle">Skeletal muscles</text><rect x="1095" y="625" width="406" height="99" rx="12" fill="#EDF3EA" stroke="#729365" stroke-width="2"/><text x="1298.0" y="664.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#19392F" font-weight="700" text-anchor="middle">Autonomic</text><text x="1298.0" y="704.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="middle">Smooth / cardiac muscle; glands</text><path d="M1276,563 L1276,592 L805,592 L805,620" fill="none" stroke="#19392F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M1276,592 L1298,592 L1298,620" fill="none" stroke="#19392F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="118" y="538.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#19392F" font-weight="700" text-anchor="start">Integration</text><text x="118" y="585.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">Processing sensory input</text><text x="118" y="618.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">and coordinating responses</text><path d="M1298,724 L1298,751 L1080,751 L1080,791" fill="none" stroke="#19392F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M1298,751 L1410,751 L1410,791" fill="none" stroke="#19392F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/><rect x="929" y="797" width="303" height="64" rx="10" fill="#EDF3EA" stroke="#729365" stroke-width="2"/><text x="1080" y="837.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#19392F" font-weight="700" text-anchor="middle">Sympathetic</text><rect x="1251" y="797" width="303" height="64" rx="10" fill="#EDF3EA" stroke="#729365" stroke-width="2"/><text x="1402" y="837.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#19392F" font-weight="700" text-anchor="middle">Parasympathetic</text><line x1="64" y1="892" x2="1536" y2="892" stroke="#CFDAD3" stroke-width="2"/><text x="64" y="940.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">Afferent: arrives at the CNS. Efferent: exits toward an effector.</text></svg>