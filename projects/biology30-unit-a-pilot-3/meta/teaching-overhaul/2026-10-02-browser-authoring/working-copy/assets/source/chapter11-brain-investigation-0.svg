<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>What does a brain investigation measure?</title><defs><marker id="a-ink" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#19392F"/></marker><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#287E80"/></marker><marker id="a-amber" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B87923"/></marker><marker id="a-brick" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#AA4D3E"/></marker><marker id="a-grey" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#718078"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8271A4"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="64" y="72.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#19392F" font-weight="700" text-anchor="start">What does a brain investigation measure?</text><text x="64" y="116.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#718078" font-weight="400" text-anchor="start">Keep structural observations separate from inferences about activity or function.</text><line x1="64" y1="144" x2="1536" y2="144" stroke="#CFDAD3" stroke-width="2"/><text x="74" y="234.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#19392F" font-weight="700" text-anchor="start">Anatomy / dissection</text><ellipse cx="282" cy="427" rx="154" ry="119" fill="#DFC2AD" stroke="#B69680" stroke-width="3"/><path d="M167,365 Q225,333 281,365 T402,377" fill="none" stroke="#B69680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M167,392 Q225,360 281,392 T402,401" fill="none" stroke="#B69680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M167,419 Q225,387 281,419 T402,425" fill="none" stroke="#B69680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M167,446 Q225,414 281,446 T402,449" fill="none" stroke="#B69680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M167,473 Q225,441 281,473 T402,473" fill="none" stroke="#B69680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="614.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="start">Identify structures and their positions.</text><text x="74" y="645.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="start">Observe shape and relationships.</text><text x="74" y="729.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#718078" font-weight="400" text-anchor="start">Conceptual illustration, not a scan.</text><text x="596" y="234.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#19392F" font-weight="700" text-anchor="start">MRI</text><ellipse cx="806" cy="427" rx="151" ry="119" fill="#E4E7E4" stroke="#718078" stroke-width="3"/><ellipse cx="806" cy="427" rx="109" ry="82" fill="#BDC5BC" stroke="#718078" stroke-width="2"/><line x1="806" y1="331" x2="806" y2="524" stroke="white" stroke-width="5"/><text x="596" y="614.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="start">Produces detailed images of structure.</text><text x="596" y="645.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="start">MRI provides information about brain anatomy.</text><text x="596" y="729.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#718078" font-weight="400" text-anchor="start">Conceptual illustration, not a scan.</text><text x="1118" y="234.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#19392F" font-weight="700" text-anchor="start">PET</text><ellipse cx="1328" cy="427" rx="151" ry="119" fill="#ECDFC7" stroke="#718078" stroke-width="3"/><circle cx="1273" cy="405" r="28" fill="#B96D49" stroke="#B96D49" stroke-width="2"/><circle cx="1357" cy="379" r="40" fill="#D4AB63" stroke="#D4AB63" stroke-width="2"/><circle cx="1369" cy="471" r="33" fill="#A47B6A" stroke="#A47B6A" stroke-width="2"/><text x="1118" y="614.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="start">Uses a labelled tracer to show uptake.</text><text x="1118" y="645.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#19392F" font-weight="400" text-anchor="start">Tracer uptake is related to energy use.</text><text x="1118" y="729.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#718078" font-weight="400" text-anchor="start">Conceptual illustration, not a scan.</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#CFDAD3" stroke-width="2"/><text x="64" y="860.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">Use the photographs for observation tasks; an illustration is not experimental evidence.</text></svg>