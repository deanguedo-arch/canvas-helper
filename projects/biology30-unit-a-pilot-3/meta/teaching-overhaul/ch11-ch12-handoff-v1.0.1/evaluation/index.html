<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biology 30 Chapters 11–12 teaching comparison</title><style>body{margin:0;background:#f6f8f5;color:#17201b;font:15px system-ui,sans-serif}header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 16px;border-bottom:1px solid #ccd4cd}select,a{font:inherit}select{padding:8px;max-width:100%}main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ccd4cd}section{min-width:0;background:white}h2{font-size:16px;margin:0;padding:10px 16px}h2 a{float:right;color:#08685f;font-weight:400}iframe{display:block;width:100%;height:calc(100vh - 150px);border:0}p{padding:0 16px;margin:8px 0;font-size:13px}a{color:#08685f}@media(max-width:700px){main{grid-template-columns:1fr}iframe{height:80vh}}</style></head><body><header><strong>Biology 30 teaching comparison</strong><label>Chapter <select id="chapter"><option value="11">Chapter 11</option><option value="12">Chapter 12</option></select></label><label>Lesson <select id="lesson"></select></label></header><p>Working review copies. Original assessments, progress rules and course design retained. New optional writing is ungraded. Use the full-width links to review or print a chapter.</p><main><section><h2>Original <a id="old-link" target="_blank" rel="noopener">Open full width</a></h2><iframe id="old" title="Original chapter"></iframe></section><section><h2>Revised teaching v1.0.1 <a id="new-link" target="_blank" rel="noopener">Open full width</a></h2><iframe id="new" title="Revised chapter"></iframe></section></main><script>
const titles={11:['Nervous communication','Neurons & myelin','Pathways & reflexes','The resting neuron','Action potentials','Synapses & summation','Drugs at the synapse','Peripheral control','Central control','The brain','Studying the brain','Chapter review and final check','Optional extension'],12:['Sensory receptors, sensation and adaptation','Eye structures and the path of light','Focusing, accommodation and vision problems','The retina, rods and cones','Ear structures and sound transmission','Pitch, loudness and hearing impairment','Balance, body position and proprioception','Taste, smell, touch and temperature','Chapter review and final check','Optional extension']};
const c=document.querySelector('#chapter'),l=document.querySelector('#lesson'),params=new URLSearchParams(location.search);c.value=params.get('chapter')||'11';
function populate(){l.replaceChildren(...titles[c.value].map((t,i)=>{const o=document.createElement('option');o.value=c.value==='12'&&i===9?'extension':'lesson-'+String(i+1).padStart(2,'0');o.textContent=(i+1)+'. '+t;return o;}));}
function show(){for(const name of ['old','new']){const port=Number(c.value)===11?(name==='old'?57301:57302):(name==='old'?57303:57304),url='http://127.0.0.1:'+port+'/index.html#'+l.value;document.getElementById(name).src=url;document.getElementById(name+'-link').href=url;}history.replaceState(null,'','?chapter='+c.value+'&lesson='+l.value);}
populate();if(params.get('lesson'))l.value=params.get('lesson');c.onchange=()=>{populate();show();};l.onchange=show;show();
</script></body></html>
