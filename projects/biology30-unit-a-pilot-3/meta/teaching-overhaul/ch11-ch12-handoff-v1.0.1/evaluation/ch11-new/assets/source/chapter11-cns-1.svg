<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Protecting the central nervous system</title><defs><marker id="a-ink" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#19392F"/></marker><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#287E80"/></marker><marker id="a-amber" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B87923"/></marker><marker id="a-brick" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#AA4D3E"/></marker><marker id="a-grey" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#718078"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8271A4"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="64" y="72.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#19392F" font-weight="700" text-anchor="start">Protecting the central nervous system</text><text x="64" y="116.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#718078" font-weight="400" text-anchor="start">Bone, membranes and fluid have different protective roles.</text><line x1="64" y1="144" x2="1536" y2="144" stroke="#CFDAD3" stroke-width="2"/><rect x="108" y="220" width="881" height="80" rx="0" fill="#D8C6A0" stroke="#CFDAD3" stroke-width="2"/><line x1="1005" y1="260.0" x2="1115" y2="260.0" stroke="#718078" stroke-width="2"/><text x="1140" y="269.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="400" text-anchor="start">Skull / vertebral bone</text><rect x="108" y="300" width="881" height="42" rx="0" fill="#B8CEC7" stroke="#CFDAD3" stroke-width="2"/><line x1="1005" y1="321.0" x2="1115" y2="321.0" stroke="#718078" stroke-width="2"/><text x="1140" y="330.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="400" text-anchor="start">Dura mater</text><rect x="108" y="342" width="881" height="40" rx="0" fill="#D9E2D3" stroke="#CFDAD3" stroke-width="2"/><line x1="1005" y1="362.0" x2="1115" y2="362.0" stroke="#718078" stroke-width="2"/><text x="1140" y="371.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="400" text-anchor="start">Arachnoid layer</text><rect x="108" y="382" width="881" height="95" rx="0" fill="#CBE4ED" stroke="#CFDAD3" stroke-width="2"/><line x1="1005" y1="429.5" x2="1115" y2="429.5" stroke="#718078" stroke-width="2"/><text x="1140" y="438.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="700" text-anchor="start">Cerebrospinal fluid</text><rect x="108" y="477" width="881" height="24" rx="0" fill="#B7CBA4" stroke="#CFDAD3" stroke-width="2"/><line x1="1005" y1="489.0" x2="1115" y2="489.0" stroke="#718078" stroke-width="2"/><text x="1140" y="498.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="400" text-anchor="start">Pia mater</text><rect x="108" y="501" width="881" height="189" rx="0" fill="#DEC0AA" stroke="#CFDAD3" stroke-width="2"/><line x1="1005" y1="595.5" x2="1115" y2="595.5" stroke="#718078" stroke-width="2"/><text x="1140" y="604.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="700" text-anchor="start">Nervous tissue</text><path d="M160,549 Q194,505 227,550 T291,559" fill="none" stroke="#B98D74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320,549 Q354,505 387,550 T451,559" fill="none" stroke="#B98D74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,549 Q514,505 547,550 T611,559" fill="none" stroke="#B98D74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M640,549 Q674,505 707,550 T771,559" fill="none" stroke="#B98D74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M800,549 Q834,505 867,550 T931,559" fill="none" stroke="#B98D74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="144" y="751.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#718078" font-weight="400" text-anchor="start">Cross-section shown schematically; layer thicknesses are not to scale.</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#CFDAD3" stroke-width="2"/><text x="64" y="860.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">The meninges surround the CNS. Cerebrospinal fluid cushions it; bone provides outer protection.</text></svg>