<h3 data-canvas-helper-edit-key="p3-chapter-620">Parasympathetic: rest and digest</h3>
<p data-canvas-helper-edit-key="p3-chapter-621">The <strong><button aria-haspopup="dialog" class="bio-term" data-bio-term="parasympathetic division" data-canvas-helper-edit-key="p3-chapter-622" type="button">parasympathetic division</button></strong> supports <strong>rest and digest</strong>. Pupils constrict, heart rate and blood pressure fall, and digestion and urination increase. <strong><button aria-haspopup="dialog" class="bio-term" data-bio-term="acetylcholine" data-canvas-helper-edit-key="p3-chapter-623" type="button">Acetylcholine</button></strong> is the key <strong><button aria-haspopup="dialog" class="bio-term" data-bio-term="neurotransmitter" data-canvas-helper-edit-key="p3-chapter-624" type="button">neurotransmitter</button></strong> in these pathways.</p>
<p data-canvas-helper-edit-key="p3-chapter-625">The <strong><button aria-haspopup="dialog" class="bio-term" data-bio-term="sympathetic and parasympathetic divisions" data-canvas-helper-edit-key="p3-chapter-626" type="button">sympathetic and parasympathetic divisions</button></strong> often have <strong><button aria-haspopup="dialog" class="bio-term" data-bio-term="opposing effects" data-canvas-helper-edit-key="p3-chapter-627" type="button">opposing effects</button></strong> on the same organ. Together, they adjust body functions as conditions change.</p>
