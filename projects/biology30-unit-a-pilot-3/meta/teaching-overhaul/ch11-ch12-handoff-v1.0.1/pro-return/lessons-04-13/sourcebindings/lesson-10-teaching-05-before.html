<h3 data-canvas-helper-edit-key="p3-chapter-863">The two hemispheres work together</h3>
<p data-canvas-helper-edit-key="p3-chapter-864">Some functions are more strongly associated with one hemisphere, but both hemispheres work together during complex tasks.</p>
<p data-canvas-helper-edit-key="p3-chapter-865">The corpus callosum allows this communication. Avoid labelling a person as a “left-brained” or “right-brained” learner.</p>
