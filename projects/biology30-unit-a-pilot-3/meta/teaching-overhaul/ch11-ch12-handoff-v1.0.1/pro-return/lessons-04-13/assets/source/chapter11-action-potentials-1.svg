<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>All-or-none signalling: frequency is not amplitude</title><defs><marker id="a-ink" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#19392F"/></marker><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#287E80"/></marker><marker id="a-amber" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B87923"/></marker><marker id="a-brick" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#AA4D3E"/></marker><marker id="a-grey" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#718078"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8271A4"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="64" y="72.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#19392F" font-weight="700" text-anchor="start">All-or-none signalling: frequency is not amplitude</text><text x="64" y="116.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#718078" font-weight="400" text-anchor="start">Compare the same neuron over equal time intervals.</text><line x1="64" y1="144" x2="1536" y2="144" stroke="#CFDAD3" stroke-width="2"/><text x="84" y="218.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#19392F" font-weight="700" text-anchor="start">Lower firing frequency</text><line x1="130" y1="358" x2="1455" y2="358" stroke="#CFDAD3" stroke-width="2"/><path d="M130,358 L315,358 Q336,358 350,244 Q365,348 383,382 Q396,358 416,358 L665,358 Q686,358 700,244 Q715,348 733,382 Q746,358 766,358 L1015,358 Q1036,358 1050,244 Q1065,348 1083,382 Q1096,358 1116,358 L1455,358" fill="none" stroke="#AA4D3E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="477.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#19392F" font-weight="700" text-anchor="start">Higher firing frequency</text><line x1="130" y1="617" x2="1455" y2="617" stroke="#CFDAD3" stroke-width="2"/><path d="M130,617 L220,617 Q241,617 255,503 Q270,607 288,641 Q301,617 321,617 L370,617 Q391,617 405,503 Q420,607 438,641 Q451,617 471,617 L520,617 Q541,617 555,503 Q570,607 588,641 Q601,617 621,617 L670,617 Q691,617 705,503 Q720,607 738,641 Q751,617 771,617 L820,617 Q841,617 855,503 Q870,607 888,641 Q901,617 921,617 L970,617 Q991,617 1005,503 Q1020,607 1038,641 Q1051,617 1071,617 L1120,617 Q1141,617 1155,503 Q1170,607 1188,641 Q1201,617 1221,617 L1270,617 Q1291,617 1305,503 Q1320,607 1338,641 Q1351,617 1371,617 L1455,617" fill="none" stroke="#AA4D3E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="145" y1="732" x2="1450" y2="732" stroke="#19392F" stroke-width="3" marker-end="url(#a-ink)"/><text x="1360" y="779.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">Time</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#CFDAD3" stroke-width="2"/><text x="64" y="860.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">Individual action potentials remain the same size. Recruitment means activating more neurons.</text></svg>