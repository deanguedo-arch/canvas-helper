<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Where do the rays meet?"><title>Where do the rays meet?</title><desc>Conceptual schematic, not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146c60"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a15c00"/></marker></defs><rect width="1000" height="600" fill="#fcfdfb"/><g font-family="Arial,sans-serif" fill="#171b1b"><text x="34" y="40" font-size="25" font-weight="700">Where do the rays meet?</text><text x="44" y="89" text-anchor="start" font-size="22" font-weight="700" fill="#171b1b"><tspan x="44" dy="0">Myopia: focus is in front of the retina</tspan></text><ellipse cx="610" cy="188" rx="135" ry="95" fill="#f9f2e1" stroke="#8d9b8f" stroke-width="3"/><ellipse cx="510" cy="188" rx="18" ry="51" fill="#cce5e6" stroke="#5b8790" stroke-width="2"/><path d="M737 138Q756 188 737 238" stroke="#b98458" stroke-width="5" fill="none"/><path d="M285 143L510 143L820 269.8181818181818M285 233L510 233L820 106.18181818181819" fill="none" stroke="#a15c00" stroke-width="2.5"/><circle cx="620" cy="188" r="6" fill="#a43f35"/><text x="55" y="190" text-anchor="start" font-size="19" font-weight="400" fill="#146c60"><tspan x="55" dy="0">Correction needed:</tspan><tspan x="55" dy="25.650000000000002">concave lens</tspan></text><text x="44" y="314" text-anchor="start" font-size="22" font-weight="700" fill="#171b1b"><tspan x="44" dy="0">Hyperopia: focus would fall behind the retina</tspan></text><ellipse cx="610" cy="413" rx="135" ry="95" fill="#f9f2e1" stroke="#8d9b8f" stroke-width="3"/><ellipse cx="510" cy="413" rx="18" ry="51" fill="#cce5e6" stroke="#5b8790" stroke-width="2"/><path d="M737 363Q756 413 737 463" stroke="#b98458" stroke-width="5" fill="none"/><path d="M285 368L510 368L820 421.65384615384613M285 458L510 458L820 404.34615384615387" fill="none" stroke="#a15c00" stroke-width="2.5"/><circle cx="770" cy="413" r="6" fill="#a43f35"/><text x="55" y="415" text-anchor="start" font-size="19" font-weight="400" fill="#146c60"><tspan x="55" dy="0">Correction needed:</tspan><tspan x="55" dy="25.650000000000002">convex lens</tspan></text><text x="500" y="563" text-anchor="middle" font-size="18" font-weight="400" fill="#5b635d"><tspan x="500" dy="0">Optical model only: corneal and lens effects are combined; distances are not to scale.</tspan></text></g></svg>