<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="From a change to a meaning"><title>From a change to a meaning</title><desc>Conceptual schematic, not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146c60"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a15c00"/></marker></defs><rect width="1000" height="380" fill="#fcfdfb"/><g font-family="Arial,sans-serif" fill="#171b1b"><text x="34" y="40" font-size="25" font-weight="700">From a change to a meaning</text><rect x="45.0" y="118" width="208.0" height="133" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="149.0" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="149.0" dy="0">Stimulus</tspan></text><text x="149.0" y="185" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="149.0" dy="0">Light, chemicals,</tspan><tspan x="149.0" dy="24.3">pressure or heat</tspan></text><path d="M256.0 182L275.0 182" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><rect x="279.0" y="118" width="208.0" height="133" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="383.0" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="383.0" dy="0">Receptor</tspan></text><text x="383.0" y="185" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="383.0" dy="0">Transduction changes</tspan><tspan x="383.0" dy="24.3">cell activity</tspan></text><path d="M490.0 182L509.0 182" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><rect x="513.0" y="118" width="208.0" height="133" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="617.0" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="617.0" dy="0">Neural pathway</tspan></text><text x="617.0" y="185" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="617.0" dy="0">Signals travel</tspan><tspan x="617.0" dy="24.3">toward the brain</tspan></text><path d="M724.0 182L743.0 182" fill="none" stroke="#146c60" stroke-width="3" marker-end="url(#arrow)"/><rect x="747.0" y="118" width="208.0" height="133" rx="9" fill="#edf5ef" stroke="#bdcdbf"/><text x="851.0" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#171b1b"><tspan x="851.0" dy="0">Interpretation</tspan></text><text x="851.0" y="185" text-anchor="middle" font-size="18" font-weight="400" fill="#171b1b"><tspan x="851.0" dy="0">The brain makes</tspan><tspan x="851.0" dy="24.3">sense of the input</tspan></text><text x="500" y="305" text-anchor="middle" font-size="18" font-weight="400" fill="#5b635d"><tspan x="500" dy="0">The original stimulus and the neural signal are different forms of information.</tspan></text></g></svg>