<section class="content-section" id="ch12-pre-v1-02-bridge"><h2>Why distance creates a focusing problem</h2><p>The eye combines a clear route, structures that refract light, and a sensory layer that detects it. The distance from lens to retina cannot be adjusted each time you glance at a nearer object. How can a change in lens shape keep the image at the retina?</p></section>
