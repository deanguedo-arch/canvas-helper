<h2 data-canvas-helper-edit-key="p3-integrated-1">Nervous communication</h2>
<p data-canvas-helper-edit-key="p3-integrated-2">Your nervous system detects changes and directs a <button aria-haspopup="dialog" class="bio-term" data-bio-term="response" data-bio-term-route="lesson-01" data-canvas-helper-edit-key="p3-integrated-3" type="button">response</button>. Some responses are voluntary, such as reaching for a glass. Others, such as a change in heart rate, happen without a conscious decision.</p>
