<h2 data-canvas-helper-edit-key="p3-integrated-10">A first look at the two main divisions</h2>
<p data-canvas-helper-edit-key="p3-integrated-11">The <strong><button aria-haspopup="dialog" class="bio-term" data-bio-term="central nervous system" data-bio-term-route="lesson-01" data-canvas-helper-edit-key="p3-integrated-12" type="button">central nervous system</button> (<button aria-haspopup="dialog" class="bio-term" data-bio-term="cns" data-bio-term-route="lesson-01" data-canvas-helper-edit-key="p3-integrated-13" type="button">CNS</button>)</strong> is the brain and spinal cord. The <strong><button aria-haspopup="dialog" class="bio-term" data-bio-term="peripheral nervous system" data-bio-term-route="lesson-01" data-canvas-helper-edit-key="p3-integrated-14" type="button">peripheral nervous system</button> (<button aria-haspopup="dialog" class="bio-term" data-bio-term="pns" data-bio-term-route="lesson-01" data-canvas-helper-edit-key="p3-integrated-15" type="button">PNS</button>)</strong> consists of nerves linking the CNS with the rest of the body. You will study their subdivisions later.</p>
