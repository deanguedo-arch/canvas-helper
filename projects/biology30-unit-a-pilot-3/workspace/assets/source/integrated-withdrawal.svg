<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>A withdrawal reflex: follow the pathway</title><defs><marker id="a-ink" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#19392F"/></marker><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#287E80"/></marker><marker id="a-amber" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B87923"/></marker><marker id="a-brick" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#AA4D3E"/></marker><marker id="a-grey" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#718078"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8271A4"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="64" y="72.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#19392F" font-weight="700" text-anchor="start">A withdrawal reflex: follow the pathway</text><text x="64" y="116.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#718078" font-weight="400" text-anchor="start">A spinal circuit can initiate the response before conscious processing is complete.</text><line x1="64" y1="144" x2="1536" y2="144" stroke="#CFDAD3" stroke-width="2"/><ellipse cx="836" cy="467" rx="214" ry="242" fill="#E5ECE3" stroke="#718078" stroke-width="3"/><path d="M706,310 Q778,305 821,408 Q850,425 871,403 Q918,310 976,318 Q967,398 921,457 Q915,477 932,518 Q976,583 957,627 Q903,623 866,535 Q839,515 817,535 Q772,627 715,626 Q700,580 751,514 Q769,474 752,442 Q714,387 706,310 Z" fill="#ACC2A5" stroke="#729365" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="716" y="216.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" fill="#19392F" font-weight="700" text-anchor="start">Spinal cord (CNS)</text><rect x="78" y="344" width="230" height="152" rx="15" fill="#EAD6C4" stroke="#B5957C" stroke-width="2"/><path d="M100,393 Q115,352 106,349" fill="none" stroke="#B87923" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M140,393 Q155,352 146,349" fill="none" stroke="#B87923" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M180,393 Q195,352 186,349" fill="none" stroke="#B87923" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M220,393 Q235,352 226,349" fill="none" stroke="#B87923" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M260,393 Q275,352 266,349" fill="none" stroke="#B87923" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M290,393 Q305,352 296,349" fill="none" stroke="#B87923" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="300.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#19392F" font-weight="700" text-anchor="start">Receptor in skin</text><path d="M206,389 C328,305 498,309 659,326 Q732,337 790,413" fill="none" stroke="#B87923" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><circle cx="587" cy="316" r="26" fill="#E8D7AB" stroke="#B87923" stroke-width="2"/><text x="340" y="285.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#B87923" font-weight="700" text-anchor="start">Sensory neuron</text><path d="M791,453 Q798.25,437.45 808,436 Q841.75,444.7 849,465 Q843.2,486.75 820,494 Q793.9,486.75 791,453 Z" fill="#BCD1B1" stroke="#729365" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="820" cy="465" r="10.73" fill="#B9ACD0" stroke="#8271A4" stroke-width="2"/><circle cx="826" cy="467" r="3.77" fill="#8271A4" stroke="#8271A4" stroke-width="2"/><line x1="817" y1="494" x2="839" y2="535" stroke="#287E80" stroke-width="5" marker-end="url(#a-teal)"/><text x="1080" y="446.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#287E80" font-weight="700" text-anchor="start">Interneuron</text><line x1="1060" y1="449" x2="848" y2="465" stroke="#718078" stroke-width="2"/><text x="1139" y="604.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#19392F" font-weight="400" text-anchor="start">Motor neuron</text><path d="M1220,580 L1090,604" fill="none" stroke="#718078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1090" cy="604" r="4" fill="#19392F" stroke="#19392F" stroke-width="0"/><path d="M832,561 Q840.5,540.7 854,539 Q891.5,549.2 900,573 Q893.2,598.5 866,607 Q835.4,598.5 832,561 Z" fill="#BCD1B1" stroke="#729365" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="866" cy="573" r="12.58" fill="#B9ACD0" stroke="#8271A4" stroke-width="2"/><circle cx="872" cy="575" r="4.42" fill="#8271A4" stroke="#8271A4" stroke-width="2"/><path d="M897,582 C1083,664 1217,613 1390,555" fill="none" stroke="#287E80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><ellipse cx="1412" cy="557" rx="81" ry="47" fill="#D8A190" stroke="#AA4D3E" stroke-width="3"/><path d="M1340,543 Q1415,553 1480,543" fill="none" stroke="#AA4D3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1340,556 Q1415,566 1480,556" fill="none" stroke="#AA4D3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1340,570 Q1415,580 1480,570" fill="none" stroke="#AA4D3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1270" y="475.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#19392F" font-weight="700" text-anchor="start">Effector: muscle</text><path d="M860,394 C1049,296 1088,242 1107,194" fill="none" stroke="#718078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-grey)" stroke-dasharray="9 10"/><text x="1150" y="240.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">Information also</text><text x="1150" y="279.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">travels to the brain.</text><text x="95" y="703.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#AA4D3E" font-weight="700" text-anchor="start">Stimulus</text><line x1="105" y1="634" x2="162" y2="506" stroke="#AA4D3E" stroke-width="4" marker-end="url(#a-brick)"/><text x="1055" y="711.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#287E80" font-weight="700" text-anchor="start">Response: the muscle contracts</text><text x="1055" y="752.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#287E80" font-weight="400" text-anchor="start">and the hand withdraws.</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#CFDAD3" stroke-width="2"/><text x="64" y="860.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">Receptor → sensory neuron → interneuron → motor neuron → effector.</text></svg>