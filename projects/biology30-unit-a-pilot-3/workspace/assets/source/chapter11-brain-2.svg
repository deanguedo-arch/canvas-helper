<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Two cerebral hemispheres work together</title><defs><marker id="a-ink" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#19392F"/></marker><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#287E80"/></marker><marker id="a-amber" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B87923"/></marker><marker id="a-brick" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#AA4D3E"/></marker><marker id="a-grey" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#718078"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8271A4"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="64" y="72.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#19392F" font-weight="700" text-anchor="start">Two cerebral hemispheres work together</text><text x="64" y="116.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#718078" font-weight="400" text-anchor="start">The corpus callosum connects the hemispheres; many motor pathways cross to the opposite side.</text><line x1="64" y1="144" x2="1536" y2="144" stroke="#CFDAD3" stroke-width="2"/><ellipse cx="374" cy="345" rx="217" ry="155" fill="#DBBFAE" stroke="#AC8D78" stroke-width="3"/><text x="374" y="355.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" fill="#19392F" font-weight="700" text-anchor="middle">Left hemisphere</text><ellipse cx="1214" cy="345" rx="217" ry="155" fill="#DBBFAE" stroke="#AC8D78" stroke-width="3"/><text x="1214" y="355.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" fill="#19392F" font-weight="700" text-anchor="middle">Right hemisphere</text><path d="M590,337 L991,337" fill="none" stroke="#287E80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M990,367 L591,367" fill="none" stroke="#287E80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><text x="790" y="267.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#287E80" font-weight="700" text-anchor="middle">Corpus callosum</text><path d="M375,504 C482,624 889,528 1188,691" fill="none" stroke="#AA4D3E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-brick)"/><path d="M1216,504 C1093,581 701,585 392,691" fill="none" stroke="#B87923" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><text x="234" y="744.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#19392F" font-weight="700" text-anchor="start">Left side of the body</text><text x="1037" y="744.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#19392F" font-weight="700" text-anchor="start">Right side of the body</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#CFDAD3" stroke-width="2"/><text x="64" y="860.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">The hemispheres overlap and interact; their differences are not labels for types of learners.</text></svg>