<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Summation: combining incoming signals</title><defs><marker id="a-ink" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#19392F"/></marker><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#287E80"/></marker><marker id="a-amber" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B87923"/></marker><marker id="a-brick" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#AA4D3E"/></marker><marker id="a-grey" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#718078"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8271A4"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="64" y="72.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#19392F" font-weight="700" text-anchor="start">Summation: combining incoming signals</text><text x="64" y="116.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#718078" font-weight="400" text-anchor="start">Spatial summation combines different inputs. Temporal summation combines closely spaced inputs.</text><line x1="64" y1="144" x2="1536" y2="144" stroke="#CFDAD3" stroke-width="2"/><text x="80" y="213.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" fill="#19392F" font-weight="700" text-anchor="start">Spatial summation</text><text x="853" y="213.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" fill="#19392F" font-weight="700" text-anchor="start">Temporal summation</text><path d="M428,446 Q448.75,379.15 499,375 Q573.25,399.9 594,458 Q577.4,520.25 511,541 Q436.3,520.25 428,446 Z" fill="#BCD1B1" stroke="#729365" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="511" cy="458" r="30.71" fill="#B9ACD0" stroke="#8271A4" stroke-width="2"/><circle cx="517" cy="460" r="10.790000000000001" fill="#8271A4" stroke="#8271A4" stroke-width="2"/><line x1="580" y1="458" x2="744" y2="458" stroke="#729365" stroke-width="11"/><path d="M151,330 Q158.0,315.4 167,314 Q200.0,322.4 207,342 Q201.4,363.0 179,370 Q153.8,363.0 151,330 Z" fill="#BCD1B1" stroke="#729365" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="179" cy="342" r="10.36" fill="#B9ACD0" stroke="#8271A4" stroke-width="2"/><circle cx="185" cy="344" r="3.64" fill="#8271A4" stroke="#8271A4" stroke-width="2"/><path d="M210,342 Q354,342 435,429.0" fill="none" stroke="#287E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M135,440 Q142.0,425.4 151,424 Q184.0,432.4 191,452 Q185.4,473.0 163,480 Q137.8,473.0 135,440 Z" fill="#BCD1B1" stroke="#729365" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="163" cy="452" r="10.36" fill="#B9ACD0" stroke="#8271A4" stroke-width="2"/><circle cx="169" cy="454" r="3.64" fill="#8271A4" stroke="#8271A4" stroke-width="2"/><path d="M194,452 Q354,452 435,456.5" fill="none" stroke="#287E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M161,562 Q168.0,547.4 177,546 Q210.0,554.4 217,574 Q211.4,595.0 189,602 Q163.8,595.0 161,562 Z" fill="#BCD1B1" stroke="#729365" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="189" cy="574" r="10.36" fill="#B9ACD0" stroke="#8271A4" stroke-width="2"/><circle cx="195" cy="576" r="3.64" fill="#8271A4" stroke="#8271A4" stroke-width="2"/><path d="M220,574 Q354,574 435,487.0" fill="none" stroke="#287E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><text x="91" y="703.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="400" text-anchor="start">Several presynaptic neurons</text><text x="91" y="747.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="400" text-anchor="start">provide input at the same time.</text><path d="M1225,446 Q1245.75,379.15 1296,375 Q1370.25,399.9 1391,458 Q1374.4,520.25 1308,541 Q1233.3,520.25 1225,446 Z" fill="#BCD1B1" stroke="#729365" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1308" cy="458" r="30.71" fill="#B9ACD0" stroke="#8271A4" stroke-width="2"/><circle cx="1314" cy="460" r="10.790000000000001" fill="#8271A4" stroke="#8271A4" stroke-width="2"/><line x1="1380" y1="458" x2="1505" y2="458" stroke="#729365" stroke-width="11"/><path d="M916,444 Q926.25,417.05 945,415 Q987.75,427.3 998,456 Q989.8,486.75 957,497 Q920.1,486.75 916,444 Z" fill="#BCD1B1" stroke="#729365" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="957" cy="456" r="15.17" fill="#B9ACD0" stroke="#8271A4" stroke-width="2"/><circle cx="963" cy="458" r="5.33" fill="#8271A4" stroke="#8271A4" stroke-width="2"/><line x1="1005" y1="456" x2="1220" y2="456" stroke="#287E80" stroke-width="6" marker-end="url(#a-teal)"/><path d="M1035,337 L1044,337 L1050,286 L1058,337 L1073,337" fill="none" stroke="#AA4D3E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1095,337 L1104,337 L1110,286 L1118,337 L1133,337" fill="none" stroke="#AA4D3E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1155,337 L1164,337 L1170,286 L1178,337 L1193,337" fill="none" stroke="#AA4D3E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="922" y="703.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="400" text-anchor="start">One input fires repeatedly</text><text x="922" y="747.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#19392F" font-weight="400" text-anchor="start">before its earlier effects fade.</text><text x="558" y="555.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#19392F" font-weight="400" text-anchor="middle">Combined</text><text x="558" y="587.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#19392F" font-weight="400" text-anchor="middle">effect</text><text x="1320" y="555.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#19392F" font-weight="400" text-anchor="middle">Combined</text><text x="1320" y="587.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#19392F" font-weight="400" text-anchor="middle">effect</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#CFDAD3" stroke-width="2"/><text x="64" y="860.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#19392F" font-weight="400" text-anchor="start">The net excitatory and inhibitory effects determine whether the postsynaptic neuron reaches threshold.</text></svg>