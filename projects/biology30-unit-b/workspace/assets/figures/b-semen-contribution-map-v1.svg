<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Trace separate contributions to semen</title><desc id="desc">Four rows distinguish sperm development in testicular tubules and subsequent duct transport, seminal-vesicle fluid including fructose, prostatic fluid including enzymes, and bulbourethral mucus that lubricates the urethra. Converging arrows indicate contributions to the reproductive passage and mixed sample; they do not depict anatomical distances or exact secretion fractions. Accessory glands do not produce sperm. A sample containing fluid without observed sperm supports some secretion and delivery but cannot distinguish reduced sperm production from impaired sperm transport.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Trace separate contributions to semen</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Semen is a mixture. Its fluid and cell contributions come from different sources.</tspan></text><rect x="50" y="175" width="360" height="96" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="70" y="215" text-anchor="start" font-size="25" font-weight="700"><tspan x="70" dy="0">Testicular tubules</tspan></text><text x="480" y="209" text-anchor="start" font-size="23" font-weight="400"><tspan x="480" dy="0">Sperm develop here;</tspan><tspan x="480" dy="30.360000000000003">ducts then transport them.</tspan></text><path d="M770 215 L930 215" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="315" width="360" height="96" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="70" y="355" text-anchor="start" font-size="25" font-weight="700"><tspan x="70" dy="0">Seminal vesicles</tspan></text><text x="480" y="349" text-anchor="start" font-size="23" font-weight="400"><tspan x="480" dy="0">Fluid including fructose</tspan><tspan x="480" dy="30.360000000000003">contributes to the medium.</tspan></text><path d="M770 355 L930 355" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="455" width="360" height="96" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="70" y="495" text-anchor="start" font-size="25" font-weight="700"><tspan x="70" dy="0">Prostate</tspan></text><text x="480" y="489" text-anchor="start" font-size="23" font-weight="400"><tspan x="480" dy="0">Fluid with enzymes and</tspan><tspan x="480" dy="30.360000000000003">other substances contributes.</tspan></text><path d="M770 495 L930 495" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="595" width="360" height="96" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="70" y="635" text-anchor="start" font-size="25" font-weight="700"><tspan x="70" dy="0">Bulbourethral glands</tspan></text><text x="480" y="629" text-anchor="start" font-size="23" font-weight="400"><tspan x="480" dy="0">Mucus helps lubricate</tspan><tspan x="480" dy="30.360000000000003">the urethral passage.</tspan></text><path d="M770 635 L930 635" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M960 215 L960 635" fill="none" stroke="#176e68" stroke-width="3"/><path d="M960 425 L1080 425" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="1090" y="477" text-anchor="middle" font-size="23" font-weight="700"><tspan x="1090" dy="0">Mixed</tspan><tspan x="1090" dy="30.360000000000003">sample</tspan></text><text x="50" y="792" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Fluid without observed sperm supports some gland secretion and delivery.</tspan><tspan x="50" dy="30.360000000000003">It does not distinguish low sperm production from a sperm-transport problem.</tspan></text></g></svg>