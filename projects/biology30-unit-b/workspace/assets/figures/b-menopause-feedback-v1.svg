<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Distinguish follicular change from a fall in every hormone</title><desc id="desc">A qualitative mechanism connects natural loss of ovarian follicular function to changing ovarian hormone support and the eventual end of recurring menstrual cycles. Reduced ovarian negative feedback can permit pituitary FSH to rise, so not all hormones decline together. The transition can involve variable cycles. No individual diagnosis, numerical threshold, treatment recommendation or fixed age is inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Distinguish follicular change from a fall in every hormone</tspan></text><text x="50" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Natural loss of ovarian follicular function changes several linked signals.</tspan></text><rect x="55" y="210" width="370" height="130" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="240" y="260" text-anchor="middle" font-size="25" font-weight="700"><tspan x="240" dy="0">Less ovarian</tspan><tspan x="240" dy="33.0">follicular function</tspan></text><rect x="675" y="210" width="370" height="130" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="860" y="260" text-anchor="middle" font-size="25" font-weight="700"><tspan x="860" dy="0">Changed ovarian</tspan><tspan x="860" dy="33.0">hormone support</tspan></text><path d="M430 275 L668 275" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M860 346 L860 445" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><rect x="665" y="450" width="390" height="120" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="860" y="497" text-anchor="middle" font-size="22" font-weight="400"><tspan x="860" dy="0">Reduced negative feedback</tspan><tspan x="860" dy="29.040000000000003">can allow pituitary FSH to rise</tspan></text><rect x="55" y="450" width="390" height="120" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="250" y="493" text-anchor="middle" font-size="23" font-weight="400"><tspan x="250" dy="0">Recurring menstrual cycles</tspan><tspan x="250" dy="30.360000000000003">eventually end</tspan></text><path d="M240 346 L240 445" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="700" text-anchor="start" font-size="24" font-weight="400"><tspan x="50" dy="0">Not every hormone simply falls together.</tspan><tspan x="50" dy="31.68">The transition can involve variable cycles before recurring menstruation ends.</tspan><tspan x="50" dy="31.68">One classroom graph, symptom or measurement does not diagnose an individual cause.</tspan></text></g></svg>