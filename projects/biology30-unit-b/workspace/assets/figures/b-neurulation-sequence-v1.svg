<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Follow folding from neural plate to neural tube</title><desc id="desc">Three schematic transverse views show a thickened neural plate in ectoderm, rising folds surrounding an open neural groove, and a closed neural tube below rejoined surface ectoderm. Other tissues are omitted. Dark blue identifies the neural region; lighter blue identifies neighbouring surface ectoderm. The neural tube contributes to brain and spinal cord, with later growth, differentiation and connectivity still required. Closure is a process across time and body position, not a simultaneous event everywhere. These drawings are shape models, not microscopy or a clinical timeline.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Follow folding from neural plate to neural tube</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Simplified transverse views follow one region of ectoderm. Other tissues are omitted.</tspan></text><text x="215" y="214" text-anchor="middle" font-size="26" font-weight="700"><tspan x="215" dy="0">Neural plate</tspan></text><text x="600" y="214" text-anchor="middle" font-size="26" font-weight="700"><tspan x="600" dy="0">Neural groove</tspan></text><text x="985" y="214" text-anchor="middle" font-size="26" font-weight="700"><tspan x="985" dy="0">Neural tube</tspan></text><path d="M75 335 L355 335" fill="none" stroke="#9ebacf" stroke-width="10"/><path d="M130 335 L300 335" fill="none" stroke="#376d95" stroke-width="20"/><path d="M460 335 L500 335 C520 250 550 250 560 335 C575 430 625 430 640 335 C650 250 680 250 700 335 L740 335" fill="none" stroke="#376d95" stroke-width="15"/><path d="M845 306 L1125 306" fill="none" stroke="#9ebacf" stroke-width="10"/><ellipse cx="985" cy="377" rx="65" ry="58" fill="white" stroke="#376d95" stroke-width="15"/><path d="M370 315 L435 315" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M755 315 L820 315" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="215" y="505" text-anchor="middle" font-size="23" font-weight="400"><tspan x="215" dy="0">A thickened region</tspan><tspan x="215" dy="30.360000000000003">forms the neural plate.</tspan></text><text x="600" y="505" text-anchor="middle" font-size="23" font-weight="400"><tspan x="600" dy="0">Folds rise around</tspan><tspan x="600" dy="30.360000000000003">an open groove.</tspan></text><text x="985" y="505" text-anchor="middle" font-size="23" font-weight="400"><tspan x="985" dy="0">Folds join; a tube</tspan><tspan x="985" dy="30.360000000000003">separates from the surface.</tspan></text><text x="50" y="676" text-anchor="start" font-size="26" font-weight="700"><tspan x="50" dy="0">The tube contributes to the brain and spinal cord.</tspan></text><text x="50" y="728" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">It is an early structure; later growth, differentiation and connections are still needed.</tspan><tspan x="50" dy="30.360000000000003">Closure occurs across time and position along the body, not everywhere at once.</tspan></text><text x="50" y="853" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Dark blue highlights the neural region. Shape and scale are schematic, not microscopy.</tspan></text></g></svg>