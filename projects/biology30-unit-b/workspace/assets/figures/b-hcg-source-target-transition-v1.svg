<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Trace early hCG support through its actual targets</title><desc id="desc">A clockwise pathway connects trophoblast as early hCG source to ovarian corpus luteum as receiving tissue, continued progesterone and estrogen release, and support of responsive uterine endometrium. hCG and progesterone have distinct immediate targets. A separate note explains that later placental steroid production supplies much of the support and can use maternal and fetal starting materials. No unsupported fixed switch week or diagnostic hCG threshold is supplied. hCG can act at the LH receptor but is not LH, and a concentration alone does not identify its tissue source.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Trace early hCG support through its actual targets</tspan></text><text x="50" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Name the source, signal, receiving tissue and downstream response.</tspan></text><rect x="70" y="205" width="330" height="118" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="235.0" y="253" text-anchor="middle" font-size="24" font-weight="700"><tspan x="235.0" dy="0">Trophoblast</tspan><tspan x="235.0" dy="31.68">early signal source</tspan></text><rect x="745" y="205" width="385" height="118" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="937.5" y="253" text-anchor="middle" font-size="24" font-weight="700"><tspan x="937.5" dy="0">Corpus luteum</tspan><tspan x="937.5" dy="31.68">ovarian receiving tissue</tspan></text><rect x="745" y="460" width="385" height="118" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="937.5" y="508" text-anchor="middle" font-size="24" font-weight="700"><tspan x="937.5" dy="0">Continued steroid release</tspan><tspan x="937.5" dy="31.68">progesterone + estrogen</tspan></text><rect x="70" y="460" width="400" height="118" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="270.0" y="508" text-anchor="middle" font-size="24" font-weight="700"><tspan x="270.0" dy="0">Responsive uterine tissue</tspan><tspan x="270.0" dy="31.68">endometrial support</tspan></text><path d="M415 264 L723 264" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="566" y="235" text-anchor="middle" font-size="27" font-weight="700"><tspan x="566" dy="0">hCG</tspan></text><path d="M937 340 L937 439" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M723 519 L491 519" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="607" y="486" text-anchor="middle" font-size="20" font-weight="400"><tspan x="607" dy="0">hormonal signal</tspan></text><text x="50" y="667" text-anchor="start" font-size="25" font-weight="700"><tspan x="50" dy="0">The main steroid source changes as pregnancy progresses.</tspan></text><text x="50" y="718" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Later placental steroid production supplies much of the support.</tspan><tspan x="50" dy="30.360000000000003">Some synthesis uses starting materials from maternal and fetal tissues.</tspan><tspan x="50" dy="30.360000000000003">A measured hormone value alone does not identify its source.</tspan></text><text x="50" y="850" text-anchor="start" font-size="22" font-weight="400"><tspan x="50" dy="0">hCG can act at an LH receptor; hCG and LH remain different hormones with different sources.</tspan></text></g></svg>