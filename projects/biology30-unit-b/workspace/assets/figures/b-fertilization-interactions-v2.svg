<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Separate the steps that lead to fertilization</title><desc id="desc">Four functional stages distinguish capacitation and readiness, interaction with coverings including acrosomal changes, membrane fusion, and oocyte activation with completion of meiosis II and cortical granule release. A small stylized sperm approaches an oocyte with surrounding coverings. The inset is schematic and not to scale. Arrival alone does not prove fusion or activation. The usual location is a uterine tube. Acrosomal events are not assigned an exact universal time or location; the sequence is a functional teaching model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Separate the steps that lead to fertilization</tspan></text><text x="50" y="112" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Arrival, membrane fusion and activation are different pieces of evidence.</tspan></text><circle cx="175" cy="220" r="42" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="175" y="230" text-anchor="middle" font-size="32" font-weight="700"><tspan x="175" dy="0">1</tspan></text><text x="175" y="324" text-anchor="middle" font-size="21" font-weight="400"><tspan x="175" dy="0">Functional readiness</tspan><tspan x="175" dy="27.720000000000002">Capacitation supports</tspan><tspan x="175" dy="27.720000000000002">later sperm interactions.</tspan></text><path d="M230 220 L400 220" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><circle cx="455" cy="220" r="42" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="455" y="230" text-anchor="middle" font-size="32" font-weight="700"><tspan x="455" dy="0">2</tspan></text><text x="455" y="324" text-anchor="middle" font-size="21" font-weight="400"><tspan x="455" dy="0">Covering interactions</tspan><tspan x="455" dy="27.720000000000002">Acrosomal changes help</tspan><tspan x="455" dy="27.720000000000002">interaction with coverings.</tspan></text><path d="M510 220 L680 220" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><circle cx="735" cy="220" r="42" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="735" y="230" text-anchor="middle" font-size="32" font-weight="700"><tspan x="735" dy="0">3</tspan></text><text x="735" y="324" text-anchor="middle" font-size="21" font-weight="400"><tspan x="735" dy="0">Membrane fusion</tspan><tspan x="735" dy="27.720000000000002">Sperm and oocyte</tspan><tspan x="735" dy="27.720000000000002">membranes join.</tspan></text><path d="M790 220 L960 220" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><circle cx="1015" cy="220" r="42" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="1015" y="230" text-anchor="middle" font-size="32" font-weight="700"><tspan x="1015" dy="0">4</tspan></text><text x="1015" y="324" text-anchor="middle" font-size="21" font-weight="400"><tspan x="1015" dy="0">Oocyte activation</tspan><tspan x="1015" dy="27.720000000000002">Meiosis II completes;</tspan><tspan x="1015" dy="27.720000000000002">cortical granules release.</tspan></text><circle cx="335" cy="622" r="114" fill="#fff1d9" stroke="#45625c" stroke-width="2"/><circle cx="335" cy="622" r="87" fill="#f3f8f6" stroke="#45625c" stroke-width="2"/><text x="335" y="630" text-anchor="middle" font-size="22" font-weight="400"><tspan x="335" dy="0">oocyte</tspan></text><ellipse cx="169" cy="622" rx="22" ry="12" fill="#8caebb" stroke="#34515e" stroke-width="2"/><path d="M147 622 Q117 586 80 622" fill="none" stroke="#34515e" stroke-width="3"/><path d="M191 622 L215 622" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="790" text-anchor="start" font-size="22" font-weight="400"><tspan x="50" dy="0">Simplified interaction inset; coverings and cells are not to scale.</tspan></text><text x="535" y="532" text-anchor="start" font-size="25" font-weight="700"><tspan x="535" dy="0">Ask what the observation actually establishes.</tspan></text><text x="535" y="586" text-anchor="start" font-size="22" font-weight="400"><tspan x="535" dy="0">Sperm near the oocyte: arrival evidence.</tspan><tspan x="535" dy="29.040000000000003">Fusion observed: a later event is supported.</tspan><tspan x="535" dy="29.040000000000003">Activation response: another step needs evidence.</tspan><tspan x="535" dy="29.040000000000003">One successful step does not establish all the rest.</tspan></text><text x="50" y="860" text-anchor="start" font-size="22" font-weight="400"><tspan x="50" dy="0">Usual location: a uterine tube. This sequence is a functional model, not a timed film.</tspan></text></g></svg>