<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Separate developmental genes, hormones and targets</title><desc id="desc">A typical XY pathway places SRY activity upstream of a testis-development gene network, not as a direct instruction to build every structure. Testicular tissues supply testosterone and AMH. Testosterone supports specific internal ducts; conversion in responsive targets to DHT contributes to typical external development. AMH promotes regression of a different embryonic duct system. Each action depends on target response and timing. Ovarian development uses active gene networks too. Chromosomes alone do not establish every anatomical feature, fertility outcome, health need or identity. The map gives a bounded typical pathway rather than an exhaustive account of variation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Separate developmental genes, hormones and targets</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">A developmental signal needs a responsive target at the relevant time.</tspan></text><rect x="50" y="170" width="460" height="94" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="280" y="210" text-anchor="middle" font-size="23" font-weight="700"><tspan x="280" dy="0">Typical XY pathway: SRY activity</tspan><tspan x="280" dy="30.360000000000003">supports a testis-development network</tspan></text><path d="M280 275 L280 333" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="345" width="460" height="80" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="280" y="394" text-anchor="middle" font-size="25" font-weight="700"><tspan x="280" dy="0">Developing testicular tissues</tspan></text><text x="560" y="495" text-anchor="start" font-size="25" font-weight="700"><tspan x="560" dy="0">Testosterone</tspan></text><text x="560" y="530" text-anchor="start" font-size="22" font-weight="400"><tspan x="560" dy="0">supports specific internal ducts</tspan></text><text x="560" y="610" text-anchor="start" font-size="25" font-weight="700"><tspan x="560" dy="0">DHT in responsive targets</tspan></text><text x="560" y="645" text-anchor="start" font-size="22" font-weight="400"><tspan x="560" dy="0">contributes to typical external development</tspan></text><text x="560" y="725" text-anchor="start" font-size="25" font-weight="700"><tspan x="560" dy="0">AMH</tspan></text><text x="560" y="760" text-anchor="start" font-size="22" font-weight="400"><tspan x="560" dy="0">supports regression of another duct system</tspan></text><path d="M280 438 L280 726" fill="none" stroke="#176e68" stroke-width="3"/><path d="M280 495 L536 495" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M280 725 L536 725" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M737 542 L737 579" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="815" y="571" text-anchor="start" font-size="20" font-weight="400"><tspan x="815" dy="0">target conversion</tspan></text><text x="50" y="835" text-anchor="start" font-size="22" font-weight="400"><tspan x="50" dy="0">Ovarian development also uses active gene networks. Chromosomes alone do not establish</tspan><tspan x="50" dy="29.040000000000003">every anatomical feature, fertility outcome, health need or identity.</tspan></text></g></svg>