<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#146c60"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#171b1b}.title{font-size:32px;font-weight:700}.body{font-size:22px}.small{font-size:18px}.letter{font-size:30px;font-weight:700}</style><text x="600" y="48" class="title" text-anchor="middle">Ovarian and uterine events occur together</text><text x="600" y="82" class="small" text-anchor="middle">Illustrative 28-day model — actual cycle timing varies</text><rect x="70" y="210" width="320" height="125" rx="8" fill="#eef3ee" stroke="#146c60" stroke-width="2"/><text x="230.0" y="267.0" class="body" text-anchor="middle">Early follicular phase</text><text x="230.0" y="292.0" class="body" text-anchor="middle">Follicles develop</text><rect x="70" y="485" width="320" height="125" rx="8" fill="#eef3ee" stroke="#146c60" stroke-width="2"/><text x="230.0" y="542.0" class="body" text-anchor="middle">Menstrual flow</text><text x="230.0" y="567.0" class="body" text-anchor="middle">Part of lining is shed</text><path d="M230 340 L230 478" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="430" y="210" width="320" height="125" rx="8" fill="#eef3ee" stroke="#146c60" stroke-width="2"/><text x="590.0" y="267.0" class="body" text-anchor="middle">Late follicular phase</text><text x="590.0" y="292.0" class="body" text-anchor="middle">Estrogen rises</text><rect x="430" y="485" width="320" height="125" rx="8" fill="#eef3ee" stroke="#146c60" stroke-width="2"/><text x="590.0" y="542.0" class="body" text-anchor="middle">Rebuilding</text><text x="590.0" y="567.0" class="body" text-anchor="middle">Endometrium grows</text><path d="M590 340 L590 478" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="790" y="210" width="320" height="125" rx="8" fill="#eef3ee" stroke="#146c60" stroke-width="2"/><text x="950.0" y="267.0" class="body" text-anchor="middle">After ovulation</text><text x="950.0" y="292.0" class="body" text-anchor="middle">Corpus luteum active</text><rect x="790" y="485" width="320" height="125" rx="8" fill="#eef3ee" stroke="#146c60" stroke-width="2"/><text x="950.0" y="542.0" class="body" text-anchor="middle">Maintenance</text><text x="950.0" y="567.0" class="body" text-anchor="middle">Progesterone supports lining</text><path d="M950 340 L950 478" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="55" y="175" class="small" text-anchor="start">OVARY</text><text x="55" y="453" class="small" text-anchor="start">UTERUS</text><path d="M395 271 L423 271" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M755 271 L783 271" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="680" class="body" text-anchor="middle">Flow overlaps early follicular development.</text><text x="600" y="724" class="small" text-anchor="middle">Hormone decline after corpus-luteum regression permits the next flow.</text></svg>