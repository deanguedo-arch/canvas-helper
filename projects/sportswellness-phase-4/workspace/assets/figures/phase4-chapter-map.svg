<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 970" role="img" aria-labelledby="title desc"><title id="title">Confidence and rehearsal as an adaptable plan</title><desc id="desc">Preparation evidence supports a believable routine. Rehearsal represents the task and a recovery response. Review uses observations and useful feedback to adapt the next plan. None of these guarantees a result or requires certainty.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="970" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">A usable confidence and rehearsal toolkit</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Evidence → routine → rehearsal → review</text><rect x="44" y="170" width="812" height="136" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="214" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Preparation evidence</text><text x="68" y="257" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">What supports readiness? What remains uncertain?</text><path d="M450 313 L450 331" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="341" width="812" height="136" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="385" font-size="29" font-weight="750" fill="#154212" text-anchor="start">A believable routine</text><text x="68" y="428" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Choose a cue, an appropriate pause and task attention.</text><path d="M450 484 L450 502" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="512" width="812" height="136" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="556" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Rehearsal with recovery</text><text x="68" y="599" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Represent the sequence and a response to interruption.</text><path d="M450 655 L450 673" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="683" width="812" height="136" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="727" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Review and adaptation</text><text x="68" y="770" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Keep useful feedback and change what no longer fits.</text><text x="44" y="913" font-size="25" font-weight="650" fill="#146c60" text-anchor="start">Confidence is not certainty about the outcome.</text></g></svg>