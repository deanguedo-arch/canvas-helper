<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 970" role="img" aria-labelledby="title desc"><title id="title">Disruption and recovery rehearsal</title><desc id="desc">Begin with the task, introduce a plausible interruption, rehearse a suitable response and keep an alternative if it does not fit. The flat-tire metaphor concerns preparing an adjustment, not requiring distress or guaranteeing a result.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="970" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">Rehearse a disruption and a response</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Plan for one realistic change—not for a perfect future.</text><rect x="44" y="168" width="812" height="136" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="211" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Start with the task</text><text x="68" y="253" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">State the preparation, first cue and normal sequence.</text><path d="M450 311 L450 329" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="339" width="812" height="136" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="382" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Introduce a likely interruption</text><text x="68" y="424" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">For example: the screen stops during a presentation.</text><path d="M450 482 L450 500" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="510" width="812" height="136" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="553" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Rehearse a useful response</text><text x="68" y="595" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Use the prepared notes and explain the next point.</text><path d="M450 653 L450 671" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="681" width="812" height="136" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="724" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Keep an alternative</text><text x="68" y="766" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">If the first response does not fit, pause and seek</text><text x="68" y="798" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">clarification.</text><text x="44" y="914" font-size="24" font-weight="650" fill="#146c60" text-anchor="start">Review the response; do not promise the result.</text></g></svg>