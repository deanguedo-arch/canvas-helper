<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 965" role="img" aria-labelledby="title desc"><title id="title">C-B-A without guarantees</title><desc id="desc">C: choose a believable preparation-based cue. B: use a familiar comfortable breath if appropriate during a safe pause, or another suitable pause. A: direct attention to what the next task needs. A routine does not guarantee calmness or success. There are no physiological target numbers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="965" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">C–B–A: a brief preparation routine</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Cue → comfortable breath if useful → task attention</text><rect x="44" y="170" width="812" height="171" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="215" font-size="28" font-weight="750" fill="#154212" text-anchor="start">C · Cue a believable statement</text><text x="68" y="262" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">Connect the reminder to preparation: “I know my opening.”</text><path d="M450 348 L450 370" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="380" width="812" height="171" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="425" font-size="28" font-weight="750" fill="#154212" text-anchor="start">B · Breathe comfortably, if useful</text><text x="68" y="472" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">Use a familiar unforced breath during a safe pause, or</text><text x="68" y="505" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">another suitable pause.</text><path d="M450 558 L450 580" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="590" width="812" height="171" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="635" font-size="28" font-weight="750" fill="#154212" text-anchor="start">A · Attach attention to the task</text><text x="68" y="682" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">Choose the information needed for the next action.</text><text x="44" y="866" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Useful action is possible while uncertain. A routine does</text><text x="44" y="898" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">not guarantee calmness or a successful result.</text></g></svg>