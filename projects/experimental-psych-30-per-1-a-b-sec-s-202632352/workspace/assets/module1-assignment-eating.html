<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 1 Assignment 2 Interactive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-transparent">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
  </style>
  <div id="app" class="flex items-center justify-center p-6 text-slate-500 font-serif">
    Loading assignment...
  </div>
  <pre id="runtime-error" class="hidden whitespace-pre-wrap max-w-5xl mx-auto my-8 p-4 border border-red-300 bg-red-50 text-red-900 text-sm"></pre>

  <script>
    (async () => {
      const appNode = document.getElementById("app");
      const errorNode = document.getElementById("runtime-error");

      const showError = (message) => {
        appNode.className = "hidden";
        errorNode.className = "whitespace-pre-wrap max-w-5xl mx-auto my-8 p-4 border border-red-300 bg-red-50 text-red-900 text-sm";
        errorNode.textContent = message;
      };

      const normalizeSource = (source) =>
        source
          .replace(/^\s*import\s+React\s*,\s*\{\s*useState\s*,\s*useEffect\s*\}\s+from\s+['"]react['"];?\s*$/m, "")
          .replace(
            /^\s*import\s+\{\s*CheckSquare\s*,\s*XSquare\s*,\s*AlertCircle\s*,\s*FileText\s*,\s*Printer\s*,\s*Edit3\s*,\s*Award\s*,\s*FileCheck\s*,\s*RotateCcw\s*\}\s+from\s+['"]lucide-react['"];?\s*$/m,
            ""
          )
          .replace(/^\s*export\s+default\s+function\s+App\s*\(/m, "function App(");

      try {
        const response = await fetch("./module1assignmenteating.source.jsx");
        if (!response.ok) {
          throw new Error("Could not load source file for Module 1 assignment.");
        }

        const source = await response.text();
        const stripped = normalizeSource(source);

        const prelude = [
          "const { useState, useEffect } = React;",
          "const iconFactory = (glyph) => function Icon({ size = 16, className = '' }) {",
          "  return React.createElement('span', {",
          "    className,",
          "    style: {",
          "      width: `${size}px`,",
          "      height: `${size}px`,",
          "      fontSize: `${size}px`,",
          "      lineHeight: 1,",
          "      display: 'inline-flex',",
          "      alignItems: 'center',",
          "      justifyContent: 'center'",
          "    },",
          "    'aria-hidden': 'true'",
          "  }, glyph);",
          "};",
          "const CheckSquare = iconFactory('\\u2611');",
          "const XSquare = iconFactory('\\u2612');",
          "const AlertCircle = iconFactory('\\u26A0');",
          "const FileText = iconFactory('\\u{1F4C4}');",
          "const Printer = iconFactory('\\u{1F5A8}');",
          "const Edit3 = iconFactory('\\u270E');",
          "const Award = iconFactory('\\u{1F3C5}');",
          "const FileCheck = iconFactory('\\u2705');",
          "const RotateCcw = iconFactory('\\u21BA');"
        ].join("\n");

        const boot = [
          "const root = ReactDOM.createRoot(document.getElementById('app'));",
          "root.render(<App />);"
        ].join("\n");

        const fullScript = `${prelude}\n${stripped}\n${boot}\n`;
        const compiled = Babel.transform(fullScript, { presets: ["react"] }).code;
        new Function(compiled)();
      } catch (error) {
        const details = error && error.stack ? error.stack : String(error);
        showError(`Module 1 assignment failed to load.\n\n${details}`);
      }
    })();
  </script>
</body>
</html>
