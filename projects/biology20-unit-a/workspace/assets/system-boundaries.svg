<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">The same jar, two system boundaries</title><desc id="desc">A sealed jar exchanges energy but approximately no matter. A plant inside exchanges water and carbon dioxide across its own smaller boundary. Water evaporation inside the jar does not cross the jar boundary.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17491d"/></marker><marker id="energy" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#936000"/></marker></defs>
<rect width="1200" height="680" fill="white"/><g font-family="sans-serif" fill="#17211a"><text x="600" y="50" text-anchor="middle" font-size="32" font-weight="bold">Choose the boundary before classifying the system</text>
<text x="310" y="105" text-anchor="middle" font-size="25" font-weight="bold">Boundary: whole sealed jar</text><text x="900" y="105" text-anchor="middle" font-size="25" font-weight="bold">Boundary: plant inside the jar</text>
<rect x="130" y="170" width="370" height="330" rx="30" fill="#f5faf5" stroke="#17491d" stroke-width="5" stroke-dasharray="12 8"/><rect x="735" y="170" width="330" height="330" rx="30" fill="#fafcfa" stroke="#a5ada6" stroke-width="2"/>
<rect x="150" y="425" width="330" height="55" fill="#e8daca"/><rect x="755" y="425" width="290" height="55" fill="#e8daca"/>
<g stroke="#17491d" fill="#8cbc86" stroke-width="4"><path d="M335 435V300M335 365Q235 370 265 295Q335 300 335 365M335 335Q420 350 410 265Q340 265 335 335"/><path d="M900 435V300M900 365Q800 370 830 295Q900 300 900 365M900 335Q985 350 975 265Q905 265 900 335"/></g>
<ellipse cx="900" cy="355" rx="110" ry="125" fill="none" stroke="#17491d" stroke-width="5" stroke-dasharray="12 8"/>
<path d="M80 140L235 240" stroke="#936000" stroke-width="5" stroke-dasharray="9 6" marker-end="url(#energy)"/><text x="30" y="135" font-size="23">Light enters</text>
<path d="M395 210L550 150" stroke="#936000" stroke-width="5" stroke-dasharray="9 6" marker-end="url(#energy)"/><text x="410" y="140" font-size="21">Energy can leave</text>
<path d="M220 420Q165 325 205 260" fill="none" stroke="#17491d" stroke-width="4" marker-end="url(#arrow)"/><text x="260" y="230" font-size="19">Evaporation</text><text x="170" y="405" font-size="18">Internal transfer</text>
<path d="M695 275L815 310" stroke="#17491d" stroke-width="4" marker-end="url(#arrow)"/><text x="590" y="255" font-size="21">Carbon dioxide</text><path d="M1050 450L975 412" stroke="#17491d" stroke-width="4" marker-end="url(#arrow)"/><text x="1040" y="480" font-size="21">Water</text>
<path d="M1060 170L945 250" stroke="#936000" stroke-width="5" stroke-dasharray="9 6" marker-end="url(#energy)"/><text x="1060" y="155" font-size="22">Light</text>
<text x="315" y="540" text-anchor="middle" font-size="24" font-weight="bold">Approximately closed</text><text x="315" y="574" text-anchor="middle" font-size="20">Energy crosses; matter stays inside.</text><text x="900" y="540" text-anchor="middle" font-size="24" font-weight="bold">Open</text><text x="900" y="574" text-anchor="middle" font-size="20">Matter and energy cross the plant boundary.</text>
<text x="600" y="625" text-anchor="middle" font-size="20">Dashed green outline = selected boundary. Amber arrows = energy; green arrows = matter.</text><text x="600" y="655" text-anchor="middle" font-size="18">Conceptual short-period comparison; seals, organisms and all transfers are simplified.</text></g></svg>
