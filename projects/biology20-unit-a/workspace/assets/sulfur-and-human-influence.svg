<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#fff"/><g fill="#18251b" font-family="sans-serif"><text x="40" y="52" font-size="28">Distinguish weathering, combustion and deposition</text><text x="40" y="140" font-size="23">Sulfur-bearing rock → weathering → soil/water substances</text><text x="40" y="205" font-size="23">Soil-water sulfate → plant uptake → biological transfers</text><text x="40" y="270" font-size="23">Sulfur-containing fuel → combustion → atmospheric emissions</text><text x="40" y="335" font-size="23">Atmospheric reactions and transport → wet / dry deposition</text><text x="40" y="535" font-size="20">Simplified routes, not emission measurements. Never identify or test hazardous gases by</text><text x="40" y="563" font-size="20">smell.</text></g></svg>