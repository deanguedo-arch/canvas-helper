<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#fff"/><g fill="#18251b" font-family="sans-serif"><text x="40" y="52" font-size="28">A seasonal nitrogen budget is not a nitrate test</text><text x="40" y="140" font-size="23">Fertilizer 40 + biological fixation 25 = inputs 65</text><text x="40" y="205" font-size="23">Harvest 45 + measured other losses 15 = outputs 60</text><text x="40" y="270" font-size="23">Residual storage change = +5 kg N per hectare</text><text x="40" y="535" font-size="20">Illustrative seasonal balance. Chemical form and unmeasured transfers still matter.</text></g></svg>