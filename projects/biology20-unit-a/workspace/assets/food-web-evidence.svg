<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#fff"/><g fill="#18251b" font-family="sans-serif"><text x="40" y="52" font-size="28">Read arrows from food toward its consumer</text><text x="40" y="140" font-size="23">Grass → hare → owl</text><text x="40" y="205" font-size="23">Grass → elk → wolf</text><text x="40" y="270" font-size="23">Dead material from all levels → decomposers</text><text x="40" y="535" font-size="20">This supplied web does not include hare → wolf. Missing links are not proof of</text><text x="40" y="563" font-size="20">impossibility.</text></g></svg>