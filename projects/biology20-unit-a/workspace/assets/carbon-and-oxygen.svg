<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#fff"/><g fill="#18251b" font-family="sans-serif"><text x="40" y="52" font-size="28">Carbon enters, transfers within, and leaves a forest</text><text x="40" y="140" font-size="23">Atmospheric carbon → fixation → organic carbon</text><text x="40" y="205" font-size="23">Organic carbon → respiration/decomposition → returned carbon</text><text x="40" y="270" font-size="23">120 fixed − 85 returned − 20 exported = +15 stored</text><text x="40" y="535" font-size="20">Illustrative carbon units over one year. Exported carbon is not necessarily immediately</text><text x="40" y="563" font-size="20">atmospheric.</text></g></svg>