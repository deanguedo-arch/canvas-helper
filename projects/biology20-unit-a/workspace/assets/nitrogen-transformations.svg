<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#fff"/><g fill="#18251b" font-family="sans-serif"><text x="40" y="52" font-size="28">Track nitrogen&#39;s form as well as its location</text><text x="40" y="140" font-size="23">N₂ → fixation → reduced biologically available nitrogen</text><text x="40" y="205" font-size="23">Ammonium → nitrification → nitrite → nitrate</text><text x="40" y="270" font-size="23">Ammonium / nitrate → assimilation → organic nitrogen</text><text x="40" y="335" font-size="23">Organic nitrogen → ammonification → ammonium</text><text x="40" y="400" font-size="23">Nitrate → denitrification → gaseous nitrogen products</text><text x="40" y="535" font-size="20">Simplified pathways; organisms and environmental conditions determine which transformations</text><text x="40" y="563" font-size="20">occur.</text></g></svg>