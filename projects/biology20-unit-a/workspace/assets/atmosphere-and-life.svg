<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#fff"/><g fill="#18251b" font-family="sans-serif"><text x="40" y="52" font-size="28">Build an inference from several kinds of evidence</text><text x="40" y="125" font-size="23">Observation</text><text x="375" y="125" font-size="23">Possible inference</text><text x="710" y="125" font-size="23">Additional evidence</text><path d="M40 155H1050" stroke="#a4afa6"/><text x="40" y="195" font-size="22">Layered textures</text><text x="375" y="195" font-size="22">Microbial-mat origin?</text><text x="710" y="195" font-size="22">Structure and context</text><path d="M40 230H1050" stroke="#a4afa6"/><text x="40" y="270" font-size="22">Iron mineral forms</text><text x="375" y="270" font-size="22">Oxidation conditions?</text><text x="710" y="270" font-size="22">Chemistry and setting</text><path d="M40 305H1050" stroke="#a4afa6"/><text x="40" y="345" font-size="22">Dated records</text><text x="375" y="345" font-size="22">Regional/global timing?</text><text x="710" y="345" font-size="22">Independent records</text><text x="40" y="535" font-size="20">A reasoning diagram, not a fossil photograph or measured timeline. One undated specimen is</text><text x="40" y="563" font-size="20">insufficient.</text></g></svg>