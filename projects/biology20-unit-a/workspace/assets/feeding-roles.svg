<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#fff"/><g fill="#18251b" font-family="sans-serif"><text x="40" y="52" font-size="28">One omnivore, two feeding pathways</text><text x="40" y="140" font-size="23">Berries → bear: primary consumer</text><text x="40" y="205" font-size="23">Leaves → herbivorous insect → bear: secondary consumer</text><text x="40" y="535" font-size="20">Trophic role follows the specified pathway, not a permanent species rank.</text></g></svg>