<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#fff"/><g fill="#18251b" font-family="sans-serif"><text x="40" y="52" font-size="28">The same plot can have different-shaped inventories</text><text x="40" y="125" font-size="23">Level</text><text x="375" y="125" font-size="23">Number</text><text x="710" y="125" font-size="23">Dry biomass</text><path d="M40 155H1050" stroke="#a4afa6"/><text x="40" y="195" font-size="22">Trees</text><text x="375" y="195" font-size="22">2</text><text x="710" y="195" font-size="22">400 kg</text><path d="M40 230H1050" stroke="#a4afa6"/><text x="40" y="270" font-size="22">Insects</text><text x="375" y="270" font-size="22">200</text><text x="710" y="270" font-size="22">0.4 kg</text><path d="M40 305H1050" stroke="#a4afa6"/><text x="40" y="345" font-size="22">Birds</text><text x="375" y="345" font-size="22">10</text><text x="710" y="345" font-size="22">0.8 kg</text><text x="40" y="535" font-size="20">Illustrative snapshot. Counts and standing masses cannot give energy-transfer efficiency.</text></g></svg>