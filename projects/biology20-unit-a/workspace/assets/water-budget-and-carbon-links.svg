<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" fill="#fff"/><g fill="#18251b" font-family="sans-serif"><text x="40" y="52" font-size="28">A pond budget has an explicit boundary and interval</text><text x="40" y="140" font-size="23">Rain 80 + inflow 40 = 120 m³ entering</text><text x="40" y="205" font-size="23">Evaporation 50 + outflow 100 = 150 m³ leaving</text><text x="40" y="270" font-size="23">Initial 500 + net change (−30) = final 470 m³</text><text x="40" y="535" font-size="20">Illustrative one-week account. Groundwater is omitted, not measured to be zero.</text></g></svg>