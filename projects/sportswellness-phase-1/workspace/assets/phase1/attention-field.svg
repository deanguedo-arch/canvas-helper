<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840"><title>Same court, different attention</title><rect width="800" height="840" fill="white"/><g font-family="Arial,sans-serif" fill="#173c31"><text x="30" y="42" font-size="29" font-weight="700">Same court, different attention</text><text x="30" y="95" font-size="25" font-weight="700">Distracted</text><rect x="30" y="115" width="740" height="145" fill="#eef4f0" stroke="#426b58"/><path d="M400 115v145" stroke="#426b58" stroke-dasharray="5 5"/><circle cx="100" cy="145" r="18" fill="#197968"/><text x="100" y="183" font-size="18" text-anchor="middle">Spectators</text><circle cx="240" cy="200" r="18" fill="#bdc9c3"/><text x="240" y="238" font-size="18" text-anchor="middle">Teammate</text><circle cx="505" cy="200" r="18" fill="#bdc9c3"/><text x="505" y="238" font-size="18" text-anchor="middle">Ball</text><circle cx="670" cy="200" r="18" fill="#bdc9c3"/><text x="670" y="238" font-size="18" text-anchor="middle">Space</text><text x="30" y="295" font-size="18">Attention goes to spectators instead of the next play.</text><text x="30" y="335" font-size="25" font-weight="700">Broad external</text><rect x="30" y="355" width="740" height="145" fill="#eef4f0" stroke="#426b58"/><path d="M400 355v145" stroke="#426b58" stroke-dasharray="5 5"/><circle cx="100" cy="385" r="18" fill="#bdc9c3"/><text x="100" y="423" font-size="18" text-anchor="middle">Spectators</text><circle cx="240" cy="440" r="18" fill="#197968"/><text x="240" y="478" font-size="18" text-anchor="middle">Teammate</text><circle cx="505" cy="440" r="18" fill="#197968"/><text x="505" y="478" font-size="18" text-anchor="middle">Ball</text><circle cx="670" cy="440" r="18" fill="#197968"/><text x="670" y="478" font-size="18" text-anchor="middle">Space</text><text x="30" y="535" font-size="18">Notice ball, teammates and space for a team decision.</text><text x="30" y="575" font-size="25" font-weight="700">Narrow external</text><rect x="30" y="595" width="740" height="145" fill="#eef4f0" stroke="#426b58"/><path d="M400 595v145" stroke="#426b58" stroke-dasharray="5 5"/><circle cx="100" cy="625" r="18" fill="#bdc9c3"/><text x="100" y="663" font-size="18" text-anchor="middle">Spectators</text><circle cx="240" cy="680" r="18" fill="#bdc9c3"/><text x="240" y="718" font-size="18" text-anchor="middle">Teammate</text><circle cx="505" cy="680" r="18" fill="#197968"/><text x="505" y="718" font-size="18" text-anchor="middle">Ball</text><circle cx="670" cy="680" r="18" fill="#bdc9c3"/><text x="670" y="718" font-size="18" text-anchor="middle">Space</text><text x="30" y="775" font-size="18">Focus on the ball for a specific contact task.</text><text x="30" y="818" font-size="18">A useful focus depends on the task. Narrow attention can be appropriate.</text></g></svg>