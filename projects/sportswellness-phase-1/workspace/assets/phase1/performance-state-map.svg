<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 645" role="img"><title>Performance state — a map of influences</title><desc>A real or fictional sport, artistic or academic performance. Stress and anxiety do not automatically create an ideal performance state.</desc><rect width="800" height="645" fill="#fff"/><g font-family="Arial,sans-serif" fill="#173c31"><text x="32" y="45" font-size="29" font-weight="700">Performance state — a map of influences</text><text x="32" y="79" font-size="18">A real or fictional sport, artistic or academic performance.</text><rect x="32" y="115" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="145" font-size="23" font-weight="700">Demand and interpretation</text><text x="54" y="173" font-size="18">The situation and its meaning are different parts of the picture.</text><path d="M400 213v14m-5-5 5 5 5-5" stroke="#247464" fill="none" stroke-width="2"/><rect x="32" y="230" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="260" font-size="23" font-weight="700">Activation, anxiety and attention</text><text x="54" y="288" font-size="18">Related influences, but distinct concepts.</text><path d="M400 328v14m-5-5 5 5 5-5" stroke="#247464" fill="none" stroke-width="2"/><rect x="32" y="345" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="375" font-size="23" font-weight="700">Resources and chosen action</text><text x="54" y="403" font-size="18">A believable interpretation may influence attention and the next action.</text><path d="M400 443v14m-5-5 5 5 5-5" stroke="#247464" fill="none" stroke-width="2"/><rect x="32" y="460" width="736" height="96" rx="8" fill="#f0f6f3" stroke="#afc7bd"/><text x="54" y="490" font-size="23" font-weight="700">Observe and adjust</text><text x="54" y="518" font-size="18">The result is not guaranteed. Use evidence to revise the routine.</text><text x="32" y="617" font-size="17">Stress and anxiety do not automatically create an ideal performance state.</text></g></svg>