<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="980" fill="#E8EBEF"/>

  <text x="86" y="98" fill="#243A5A" font-size="72" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Stress + Rest = Growth</text>
  <text x="86" y="142" fill="#667588" font-size="32" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Capacity drops after a stressor, then rises only if enough recovery is built into the cycle.</text>

  <line x1="170" y1="220" x2="170" y2="650" stroke="#3A485A" stroke-width="4"/>
  <line x1="170" y1="650" x2="1370" y2="650" stroke="#3A485A" stroke-width="4"/>
  <line x1="170" y1="430" x2="1370" y2="430" stroke="#CAD3DE" stroke-width="4"/>

  <text x="120" y="226" fill="#36485D" font-size="30" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Capacity</text>
  <text x="1290" y="705" fill="#36485D" font-size="30" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Time</text>

  <text x="520" y="300" fill="#C68F2B" font-size="42" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Stressor</text>
  <line x1="590" y1="316" x2="590" y2="515" stroke="#C68F2B" stroke-width="4"/>

  <path d="M210 430 L325 420 L490 422 L620 428 L705 520 L820 570 L960 510 L1080 330 L1220 280 L1330 260" stroke="#2B8E8D" stroke-width="7" fill="none"/>

  <text x="264" y="405" fill="#36485D" font-size="34" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Baseline</text>
  <text x="585" y="628" fill="#36485D" font-size="42" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Fatigue</text>
  <text x="930" y="544" fill="#36485D" font-size="42" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Recovery</text>
  <text x="1024" y="330" fill="#36485D" font-size="40" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Supercompensation</text>
  <text x="1186" y="252" fill="#36485D" font-size="42" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Higher capacity</text>

  <rect x="190" y="748" width="320" height="166" rx="16" fill="#EFE8D9" stroke="#C7932A" stroke-width="3"/>
  <text x="210" y="788" fill="#C7932A" font-size="30" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Just-manageable</text>
  <text x="210" y="820" fill="#C7932A" font-size="30" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">challenge</text>
  <text x="210" y="852" fill="#425266" font-size="24" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Stretch the system</text>
  <text x="210" y="880" fill="#425266" font-size="24" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">without overwhelming it.</text>

  <rect x="640" y="748" width="320" height="166" rx="16" fill="#DEE6F2" stroke="#2D4B72" stroke-width="3"/>
  <text x="660" y="788" fill="#2D4B72" font-size="30" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Deep recovery</text>
  <text x="660" y="824" fill="#425266" font-size="24" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Sleep, reduced load, fuel,</text>
  <text x="660" y="852" fill="#425266" font-size="24" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">and lower cognitive</text>
  <text x="660" y="880" fill="#425266" font-size="24" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">strain.</text>

  <rect x="1090" y="748" width="320" height="166" rx="16" fill="#D8EBEB" stroke="#2A8F92" stroke-width="3"/>
  <text x="1110" y="788" fill="#2A8F92" font-size="30" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Repeat with</text>
  <text x="1110" y="820" fill="#2A8F92" font-size="30" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">variation</text>
  <text x="1110" y="852" fill="#425266" font-size="24" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Cycle stress, rest, and</text>
  <text x="1110" y="880" fill="#425266" font-size="24" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">adjusted demand.</text>
</svg>
