<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#E8EBEF"/>

  <text x="86" y="100" fill="#243A5A" font-size="74" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Person x Situation</text>
  <text x="86" y="148" fill="#667588" font-size="34" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">The same social environment can lift one athlete and inhibit another, depending on motive orientation.</text>

  <text x="800" y="224" text-anchor="middle" fill="#223954" font-size="50" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Competitive setting</text>
  <text x="570" y="270" text-anchor="middle" fill="#223954" font-size="46" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Individual task</text>
  <text x="1130" y="270" text-anchor="middle" fill="#2A7E80" font-size="46" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Team / relay task</text>

  <text x="56" y="430" fill="#2A7E80" font-size="52" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Approval-</text>
  <text x="56" y="482" fill="#2A7E80" font-size="52" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">oriented</text>

  <text x="42" y="678" fill="#C25F4D" font-size="52" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Rejection-</text>
  <text x="42" y="730" fill="#C25F4D" font-size="52" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">threatened</text>

  <rect x="320" y="292" width="500" height="220" rx="22" fill="#D7DEE7" stroke="#26466C" stroke-width="3"/>
  <text x="346" y="346" fill="#223C60" font-size="56" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Usually adequate</text>
  <text x="346" y="392" fill="#34465C" font-size="40" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Performs acceptably alone, but</text>
  <text x="346" y="434" fill="#34465C" font-size="40" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">may not get the extra lift that</text>
  <text x="346" y="476" fill="#34465C" font-size="40" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">belonging provides.</text>

  <rect x="880" y="292" width="500" height="220" rx="22" fill="#D8E9E8" stroke="#2A8C8F" stroke-width="3"/>
  <text x="906" y="346" fill="#2A7F81" font-size="56" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Often improved</text>
  <text x="906" y="392" fill="#34465C" font-size="40" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Team responsibility and</text>
  <text x="906" y="434" fill="#34465C" font-size="40" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">connection can pull effort upward.</text>

  <rect x="320" y="552" width="500" height="220" rx="22" fill="#EEE8D8" stroke="#C8942A" stroke-width="3"/>
  <text x="346" y="606" fill="#C18C2B" font-size="56" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Often improved</text>
  <text x="346" y="652" fill="#34465C" font-size="40" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Less social evaluation can reduce</text>
  <text x="346" y="694" fill="#34465C" font-size="40" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">anxiety and free execution.</text>

  <rect x="880" y="552" width="500" height="220" rx="22" fill="#EFE2DF" stroke="#C55E4D" stroke-width="3"/>
  <text x="906" y="606" fill="#C05C4D" font-size="56" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Often impaired</text>
  <text x="906" y="652" fill="#34465C" font-size="40" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Fear of letting others down can</text>
  <text x="906" y="694" fill="#34465C" font-size="40" font-weight="500" font-family="Aptos, 'Segoe UI', Arial, sans-serif">choke performance.</text>

  <rect x="250" y="870" width="1100" height="98" rx="18" fill="#E6E8EC" stroke="#C8D0DB" stroke-width="2"/>
  <text x="800" y="915" text-anchor="middle" fill="#2C3B4F" font-size="38" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">Coaching implication: do not universalize grit. Match the social environment to the</text>
  <text x="800" y="952" text-anchor="middle" fill="#2C3B4F" font-size="38" font-weight="700" font-family="Aptos, 'Segoe UI', Arial, sans-serif">athlete's motive profile.</text>
</svg>
