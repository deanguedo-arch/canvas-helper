<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forensic Studies Option 2 Library Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Serif:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --background:#0c1324; --surface:#191f31; --surface-raised:#23293c; --surface-muted:#151b2d; --primary:#8aebff; --primary-strong:#22d3ee; --muted:#bbc9cd; --text:#dce1fb; --outline:rgba(133, 147, 151, 0.22); --shadow:0 18px 36px rgba(7, 13, 31, 0.35); }
    html { color-scheme: dark; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top center, rgba(34, 211, 238, 0.14), transparent 28%), linear-gradient(180deg, #10182b 0%, var(--background) 100%); color:var(--text); font-family:"Inter", sans-serif; }
    .viewer-shell { min-height:100vh; padding:18px; }
    .viewer-toolbar { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; gap:16px; margin-bottom:16px; padding:16px 18px; background:rgba(25, 31, 49, 0.88); border:1px solid var(--outline); box-shadow:var(--shadow); backdrop-filter:blur(18px); }
    .viewer-title { margin:0; font-family:"Space Grotesk", sans-serif; font-size:1.35rem; font-weight:600; }
    .viewer-meta { margin:8px 0 0; color:var(--muted); font-size:0.9rem; }
    .viewer-status { padding:18px; background:rgba(35, 41, 60, 0.9); border:1px solid var(--outline); box-shadow:var(--shadow); color:var(--muted); }
    .viewer-status.error { color:#ffb4ab; }
    .viewer-pages { display:grid; gap:18px; }
    .page-card { padding:14px; background:rgba(25, 31, 49, 0.9); border:1px solid var(--outline); box-shadow:var(--shadow); }
    .page-label { margin:0 0 10px; color:var(--primary); font-family:"Space Grotesk", sans-serif; font-size:0.82rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
    canvas { display:block; width:100%; height:auto; background:white; }
  </style>
</head>
<body>
  <div class="viewer-shell">
    <div class="viewer-toolbar">
      <div>
        <h1 id="viewer-title" class="viewer-title">Document</h1>
        <p id="viewer-meta" class="viewer-meta">Loading document</p>
      </div>
    </div>
    <div id="viewer-status" class="viewer-status">Loading PDF...</div>
    <div id="viewer-pages" class="viewer-pages" hidden></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file');
    const title = params.get('title') || 'Document';
    const titleNode = document.getElementById('viewer-title');
    const metaNode = document.getElementById('viewer-meta');
    const statusNode = document.getElementById('viewer-status');
    const pagesNode = document.getElementById('viewer-pages');
    titleNode.textContent = title;
    metaNode.textContent = file ? 'Rendering in library viewer' : 'Missing file';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    function setError(message) { statusNode.textContent = message; statusNode.classList.add('error'); pagesNode.hidden = true; }
    function getScale(viewport) { const maxWidth = Math.min(window.innerWidth - 80, 1080); return Math.max(1, maxWidth / viewport.width); }
    async function renderPdf() {
      if (!file) { setError('No PDF file was provided to the viewer.'); return; }
      try {
        const pdf = await pdfjsLib.getDocument(file).promise;
        metaNode.textContent = pdf.numPages === 1 ? '1 page' : `${pdf.numPages} pages`;
        statusNode.hidden = true;
        pagesNode.hidden = false;
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const baseViewport = page.getViewport({ scale: 1 });
          const viewport = page.getViewport({ scale: getScale(baseViewport) });
          const card = document.createElement('section');
          card.className = 'page-card';
          const label = document.createElement('p');
          label.className = 'page-label';
          label.textContent = `Page ${pageNumber}`;
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          card.append(label, canvas);
          pagesNode.appendChild(card);
          await page.render({ canvasContext: context, viewport }).promise;
        }
      } catch (error) {
        setError(error && error.message ? error.message : 'Unable to render this PDF in the viewer.');
      }
    }
    renderPdf();
  </script>
</body>
</html>
