<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forensic Studies 25 Option 2 Raw Baseline</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f0e5;
      --paper: #fffaf1;
      --line: #d6c7ad;
      --text: #241d16;
      --muted: #665c4b;
      --gold: #8b6a24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #faf6ef 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      max-width: 760px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
    }
    .eyebrow {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      margin: 10px 0 12px;
      font-size: 2rem;
      line-height: 1.05;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Raw Baseline</p>
    <h1>Forensic Studies 25 Option 2</h1>
    <p>This project is a new option-2 shell derived from the original <code>forensics</code> project. The editable source of truth is the workspace shell under <code>projects/forensicstudiesoption2/workspace</code>.</p>
  </main>
</body>
</html>
