<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 955" role="img" aria-labelledby="title desc"><title id="title">A usable motivation plan</title><desc id="desc">Choose direction and reasons, connect values and support, plan realistic goals and resources, then review evidence and adapt. The sequence organizes decisions; it does not measure character or guarantee a result.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="955" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">A usable motivation plan</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Bring the parts together after learning each one.</text><rect x="44" y="167" width="812" height="133" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="210" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Direction and reasons</text><text x="68" y="252" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">What is the useful work, and why does it matter?</text><path d="M450 307 L450 328" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="338" width="812" height="133" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="381" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Values and support</text><text x="68" y="423" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">What action fits the value? What conditions help?</text><path d="M450 478 L450 499" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="509" width="812" height="133" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="552" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Goals and resources</text><text x="68" y="594" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">What is realistic this week, including recovery?</text><path d="M450 649 L450 670" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="680" width="812" height="133" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="723" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Evidence and adaptation</text><text x="68" y="765" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">What happened? What will be kept or changed?</text><text x="44" y="903" font-size="25" font-weight="650" fill="#146c60" text-anchor="start">Return to the plan when the situation changes.</text></g></svg>