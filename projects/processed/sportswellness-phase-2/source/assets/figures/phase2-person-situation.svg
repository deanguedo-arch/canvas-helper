<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" role="img" aria-labelledby="title desc"><title id="title">Person by situation</title><desc id="desc">Consider the performer’s experience, reasons and resources alongside the task, time, transport, feedback and social setting. Choose an action that fits both. A change in performance does not establish a permanent personality type.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="810" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">The performer and the situation</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Look at their interaction before adapting the plan.</text><rect x="44" y="170" width="385" height="235" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="218" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Performer</text><text x="68" y="267" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">Experience, reasons,</text><text x="68" y="300" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">current understanding</text><text x="68" y="333" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">and available resources</text><rect x="470" y="170" width="385" height="235" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="494" y="218" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Situation</text><text x="494" y="267" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">Task, time, transport,</text><text x="494" y="300" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">feedback and social</text><text x="494" y="333" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">setting</text><path d="M240 425 L393 497" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M665 425 L508 497" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="518" width="812" height="146" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="564" font-size="29" font-weight="700" fill="#171b1b" text-anchor="start">Choose an action that fits both</text><text x="68" y="608" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">A different setting may call for a different plan—not a</text><text x="68" y="640" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">new label for the person.</text><text x="44" y="723" font-size="25" font-weight="400" fill="#171b1b" text-anchor="start">Observe the change. Explain the adjustment. Review the</text><text x="44" y="757" font-size="25" font-weight="400" fill="#171b1b" text-anchor="start">evidence.</text></g></svg>