<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">The four attention quadrants</title><desc id="desc">Broad internal attention considers several thoughts or options. Broad external attention scans the environment. Narrow internal attention notices one thought or sensation. Narrow external attention focuses on one external cue. The task determines which focus is useful; no quadrant is permanently ideal.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">Four ways to direct attention</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">The useful focus depends on the task at that moment.</text><text x="244" y="178" font-size="25" font-weight="750" fill="#146c60" text-anchor="middle">INTERNAL</text><text x="657" y="178" font-size="25" font-weight="750" fill="#146c60" text-anchor="middle">EXTERNAL</text><rect x="44" y="200" width="385" height="193" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="67" y="245" font-size="27" font-weight="750" fill="#154212" text-anchor="start">Broad internal</text><text x="67" y="291" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Consider several possible</text><text x="67" y="323" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">plans during a pause.</text><rect x="470" y="200" width="385" height="193" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="493" y="245" font-size="27" font-weight="750" fill="#154212" text-anchor="start">Broad external</text><text x="493" y="291" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Scan teammates, opponents</text><text x="493" y="323" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">and open space.</text><rect x="44" y="426" width="385" height="193" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="67" y="471" font-size="27" font-weight="750" fill="#154212" text-anchor="start">Narrow internal</text><text x="67" y="517" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Notice one body sensation</text><text x="67" y="549" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">during a safe pause.</text><rect x="470" y="426" width="385" height="193" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="493" y="471" font-size="27" font-weight="750" fill="#154212" text-anchor="start">Narrow external</text><text x="493" y="517" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Attend to one target for</text><text x="493" y="549" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">the next attempt.</text><text x="44" y="692" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">Broad = several cues. Narrow = one cue. Internal = thoughts</text><text x="44" y="725" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">or sensations. External = information in the environment.</text><text x="44" y="812" font-size="24" font-weight="650" fill="#146c60" text-anchor="start">No quadrant is permanently best. Shift when the task</text><text x="44" y="845" font-size="24" font-weight="650" fill="#146c60" text-anchor="start">changes.</text></g></svg>