<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 855" role="img" aria-labelledby="title desc"><title id="title">Gallwey’s attributed coaching framework</title><desc id="desc">Gallwey’s performance equation is a coaching framework, not a measured subtraction. Self 1 and Self 2 are names within that framework, not parts of the brain. Specific observation and a useful cue can guide a familiar task while instruction remains important during learning.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="855" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">Gallwey’s Inner Game framework</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">An attributed coaching model—not a measured calculation.</text><rect x="44" y="172" width="812" height="130" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="450" y="226" font-size="31" font-weight="750" fill="#154212" text-anchor="middle">Performance = potential − interference</text><text x="450" y="271" font-size="23" font-weight="400" fill="#171b1b" text-anchor="middle">Use it to ask what is getting in the way.</text><rect x="44" y="353" width="385" height="204" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="404" font-size="30" font-weight="750" fill="#171b1b" text-anchor="start">Self 1</text><text x="68" y="449" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">The judging or</text><text x="68" y="482" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">instructing voice in the</text><text x="68" y="515" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">model.</text><rect x="470" y="353" width="385" height="204" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="494" y="404" font-size="30" font-weight="750" fill="#171b1b" text-anchor="start">Self 2</text><text x="494" y="449" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">The learned capacity for</text><text x="494" y="482" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">action in the model.</text><text x="44" y="631" font-size="25" font-weight="400" fill="#171b1b" text-anchor="start">These names are not brain structures. Useful instruction</text><text x="44" y="665" font-size="25" font-weight="400" fill="#171b1b" text-anchor="start">during learning is different from overthinking a familiar</text><text x="44" y="699" font-size="25" font-weight="400" fill="#171b1b" text-anchor="start">action.</text><text x="44" y="764" font-size="24" font-weight="650" fill="#146c60" text-anchor="start">Observe the task. Keep useful feedback. Choose the next cue.</text></g></svg>