<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">A flexible focus plan</title><desc id="desc">A flexible focus plan connects the task, the width and direction of attention, a practised cue and evidence for adjustment. Observing a miss alone does not identify one unique attention problem.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">A flexible focus plan</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Focus is a task-dependent decision.</text><rect x="44" y="165" width="812" height="134" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="208" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Read the task</text><text x="68" y="252" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Which information matters now?</text><path d="M450 306 L450 326" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="336" width="812" height="134" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="379" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Choose width and direction</text><text x="68" y="423" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">One cue or several? Internal or external?</text><path d="M450 477 L450 497" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="507" width="812" height="134" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="550" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Use a practised cue</text><text x="68" y="594" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Prepare or reset with a meaningful reminder.</text><path d="M450 648 L450 668" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="678" width="812" height="134" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="721" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Observe and adapt</text><text x="68" y="765" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">When the task changes, reconsider the focus.</text></g></svg>