<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 925" role="img" aria-labelledby="title desc"><title id="title">Confidence evidence and useful feedback</title><desc id="desc">The confidence account is a metaphor, not a measured balance. Keep relevant evidence of effort, success and progress. Use accurate corrective feedback. Question global attacks on the whole person without denying an observed error.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="925" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">The confidence account is a metaphor</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">Use evidence. Keep useful feedback. Reject global attacks.</text><rect x="44" y="170" width="812" height="156" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="213" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Keep evidence</text><text x="68" y="257" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Record effort, success and progress that relate to the</text><text x="68" y="289" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">task.</text><rect x="44" y="363" width="812" height="156" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="406" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Use correction</text><text x="68" y="450" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">“My setup was rushed” can guide a specific adjustment.</text><rect x="44" y="556" width="812" height="156" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="599" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Question the global judgment</text><text x="68" y="643" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">“I am useless” goes beyond the evidence in one attempt.</text><text x="44" y="810" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">There is no measured bank balance. Criticism is not</text><text x="44" y="843" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">automatically a withdrawal; examine its accuracy and</text><text x="44" y="876" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">usefulness.</text></g></svg>