                overview: "Before building a course or opening an AI chatbot, educators must understand how the adolescent brain actually acquires, processes, and retains information. In an online environment where AI can easily do the heavy lifting for students, applying the Science of Learning ensures our courses require genuine cognitive effort rather than just task completion.",
                theory: "<p>Effective pedagogy is anchored in a cognitive view of educational psychology, which emphasizes understanding the mental processes involved in how students acquire and structure knowledge.<sup>1</sup> Advanced study must move students along a continuum toward expertise, helping them recognize the deeper principles of a discipline rather than just memorizing surface-level facts.<sup>2</sup> The fundamental premise of the science of learning is that memory is the residue of thought; students only remember what they actively think about.</p><p class='mt-4'>Learning happens when students experience <strong>\"desirable difficulties\"</strong>—intentional, productive struggles introduced during the learning process, such as spaced retrieval practice or elaborative interrogation, that force the brain to reconstruct neural pathways and build durable long-term memory.<sup>1</sup> However, the introduction of Generative AI (GenAI) threatens this process. When students use AI to skip this struggle, they engage in <strong>\"cognitive offloading.\"</strong> Unlike calculators or search engines that require human integration and cognitive agency, GenAI can provide complete solutions from start to finish. When AI acts as a \"cognitive prosthesis,\" it becomes a logarithmic amplifier of cognitive offloading that leads to measurable declines in critical thinking, deep processing, and strategic thinking.<sup>3</sup></p><p class='mt-4'>Furthermore, neuroscientific brain imagery suggests that when students rely entirely on GenAI for writing tasks, their executive brain functions shift from actively generating content to merely supervising AI-generated content, resulting in significantly lower neural connectivity and a dramatic drop in their ability to recall the information later.<sup>1</sup></p>",
                deeperContext: "<ul class='list-none space-y-5'><li><strong class='text-indigo-900'>The \"Crutch Effect\" and False Mastery:</strong> A large-scale field experiment involving high school mathematics students revealed the danger of unguided AI. Students given unrestricted access to a standard GenAI chatbot performed 48% better during immediate practice. However, when the AI was removed for a subsequent exam, these same students performed 17% worse than a control group that never used AI.<sup>4</sup> This illustrates the \"Crutch Effect\"—high performance mediated by a powerful tool creates a \"mirage of false mastery\" that does not equate to actual learning.<sup>1</sup></li><li><strong class='text-indigo-900'>Metacognitive Laziness:</strong> Authentic learning requires self-monitoring and regulation. Studies show that when interacting with human tutors, students follow a linear help-seeking model: diagnosing their problem, asking for help, evaluating the advice, and iterating. When using GenAI, students often skip the diagnosis and evaluation phases entirely, blindly accepting the output—a phenomenon researchers term \"metacognitive laziness\".<sup>1</sup></li><li><strong class='text-indigo-900'>Working vs. Long-Term Memory:</strong> The human brain can only process a small amount of new information at once (working memory). For learning to endure, information must be successfully transferred to long-term memory through active effort and retrieval. If AI removes the friction of that transfer, the memory is never encoded.</li><li><strong class='text-indigo-900'>Subsumption (Anchoring Knowledge):</strong> Cognitive psychologist David Ausubel proved that learning is more durable when new information is explicitly connected to prior knowledge. New concepts must be \"subsumed\" into older conceptual models to stick. AI cannot do this internal cognitive anchoring for the student.</li></ul>",

                overview: "Universal Design for Learning (UDL) is about designing your course flexibly from day one so that all learners—regardless of their reading level, language background, or neurodivergent profile—can succeed. Generative AI is an unprecedented equalizer here, allowing educators to instantly scale accessibility and provide multiple learning pathways without watering down academic rigor.",
                theory: "<p>UDL is an instructional framework rooted in neuroscience that assumes learner variability is the norm, not the exception. It advocates for a flexible approach to individual learning needs rather than retrofitting accommodations after the fact. UDL focuses on activating three primary brain networks by providing multiple means of:</p><ul class='list-disc pl-8 mt-4 space-y-2 text-slate-800'><li><strong>Engagement (The \"Why\" - Affective Network):</strong> Tapping into learners' interests, offering autonomy, and sustaining effort.</li><li><strong>Representation (The \"What\" - Recognition Network):</strong> Optimizing access to tools and presenting information in multiple formats (text, audio, visual) to bypass sensory or cognitive barriers.</li><li><strong>Action & Expression (The \"How\" - Strategic Network):</strong> Varying the methods for response and navigation, allowing students to leverage executive functions to demonstrate what they know in different ways.<sup>5</sup></li></ul><p class='mt-4'>When students are provided with options that appeal to their specific learning preferences, comprehension and motivation naturally increase. Generative AI operationalizes UDL by allowing educators to instantly create varied formats of the same core content. It functions as an essential engine for UDL, allowing educators to instantly scale accessibility and modify content to remove cognitive and linguistic barriers without diluting the underlying academic rigor.<sup>1</sup></p>",
                deeperContext: "<ul class='list-none space-y-5'><li><strong class='text-indigo-900'>The Myth of the Average:</strong> UDL operates on the scientifically proven premise that the \"average learner\" does not exist. Designing courses for the \"average\" is like designing a fighter jet cockpit for the \"average\" pilot—it ends up fitting no one perfectly and leads to crashes.</li><li><strong class='text-indigo-900'>Proactive vs. Reactive Design:</strong> Traditional education reacts to learning barriers by providing an Individualized Education Program (IEP) accommodation <em>after</em> a student struggles. UDL proactively removes the barrier before the student encounters it, embedding the support into the foundation of the course.</li><li><strong class='text-indigo-900'>The \"Curb Cut\" Effect:</strong> A UDL strategy designed for a specific need (e.g., a curb cut in a sidewalk designed for a wheelchair) is inherently beneficial for all users (e.g., someone pushing a stroller or riding a skateboard). Similarly, an audio recording made for a student with dyslexia benefits the student who wants to listen to the lesson while walking the dog.</li><li><strong class='text-indigo-900'>Reducing Accommodation Stigma:</strong> By providing multiple means of representation and expression to <em>all</em> students, UDL normalizes accommodations. A student utilizing an auditory text is no longer singled out as needing special help; they are simply choosing one of several available pathways.</li></ul>",
                anecdote: "Earlier this year, I was completely blown away when my daughter showed me how she had used NotebookLM to turn her AP Biology notes into an original podcast. I immediately thought of how useful this would be in the classroom, removing barriers by allowing teachers to provide multiple pathways into the content: taking a grade-level text and creating a podcast for students who prefer auditory learning or may struggle to access information presented in a text.",

                overview: "Backward Design means starting with the destination in mind. Instead of asking, \"What am I going to teach this week?\" (forward design), educators ask, \"What do my students need to prove they can do, and how will I measure it?\" This prevents the creation of digital \"busywork\" and keeps Grades 7-12 online courses highly focused and structured.",
                theory: "<p>Introduced by Grant Wiggins and Jay McTighe, the Backward Design framework (also known as Understanding by Design, or UbD) argues that course design must focus primarily on student learning and understanding rather than the act of teaching. Forward design often leads to a misconception that the <em>activity</em> is the learning. By contrast, Backward Design ensures strong constructive alignment through three distinct stages:</p><ul class='list-disc pl-8 mt-4 space-y-2 text-slate-800'><li><strong>Identify desired results:</strong> Clarify what learners should know, understand, and be able to do, shifting the focus from \"input\" (what the teacher covers) to \"output\" (performance and product terms).</li><li><strong>Determine acceptable evidence:</strong> Design the assessments that will prove the student has achieved the desired results.</li><li><strong>Plan learning experiences:</strong> Curate the instructional materials, AI tools, and daily activities that will explicitly prepare the student for the assessment.</li></ul>",
                deeperContext: "<ul class='list-none space-y-5'><li><strong class='text-indigo-900'>The \"Activity Trap\":</strong> Without Backward Design, online courses easily fall into the \"activity trap,\" where students complete a series of disjointed digital tasks (watch a video, post a discussion, take a quiz) that do not build toward a cohesive, enduring understanding.</li><li><strong class='text-indigo-900'>Enduring Understanding vs. Surface Knowledge:</strong> The framework forces educators to differentiate between what is \"worth being familiar with\" (surface facts an AI can instantly recall) and what constitutes \"enduring understanding\"—the big ideas and critical thinking skills students should retain years after the course ends.</li><li><strong class='text-indigo-900'>Transparency as Equity (The Road Trip Analogy):</strong> Planning a course without Backward Design is like telling students to pack for a road trip without telling them the destination. When a course is perfectly aligned backward, students never have to guess <em>why</em> they are doing an assignment. This transparency is crucial for maintaining motivation in remote learners.</li><li><strong class='text-indigo-900'>Constructive Alignment:</strong> This concept, forwarded by John Biggs, emphasizes that the objectives, assessments, and instructional strategies must all be perfectly synchronized. If a learning outcome requires higher-order analysis, the assessment cannot merely be a multiple-choice recall quiz.</li></ul>",
                anecdote: "In my early years of teaching online, I would spend hours finding the perfect, flashy YouTube video or designing an intricate digital breakout room. But come test time, the students failed. Why? Because the activities were fun, but completely misaligned with the actual standard. Starting with the final rubric first changed everything. Now, if an activity doesn't directly support the rubric I built on day one, it doesn't go in the LMS.",
                keyConcept: {
                    title: "The Three Stages of Alignment",

                    {

                `,
                overview: "Instructional design in Brightspace's New Content Experience (NCE) is about building a clean, intuitive architecture. If secondary students have to spend mental energy figuring out  how  to navigate your course, they have less energy left to actually learn the material. Without premium add-ons, educators can use external AI tools to inject high-quality interactivity into a predictable course structure.",
                theory: "<p>Cognitive Load Theory, developed by John Sweller, dictates that instructional environments must actively manage the mental effort required to learn. It posits that working memory has a limited capacity, and if a learning environment is poorly designed, it overwhelms the brain, preventing the transfer of information to long-term memory.</p><p class='mt-4'>The Brightspace New Content Experience (NCE) supports cognitive load management by focusing on a minimalist design, clean visual presentation, and color-coded units, shifting away from messy, nested file repositories.<sup>10</sup> Good digital design also relies on Richard Mayer’s principles of multimedia learning, specifically applying principles like spatial contiguity (pairing related text and visuals closely together) and signaling (providing explicit, predictable navigational cues) to guide adolescent learners.<sup>1</sup></p>",
                deeperContext: "<ul class='list-none space-y-5'><li><strong class='text-indigo-900'>The Three Types of Cognitive Load:</strong><ul class='list-disc pl-5 mt-1 space-y-1 text-slate-800'><li>Intrinsic Load: The inherent difficulty of the material itself (e.g., learning quantum physics is inherently hard).</li><li>Extraneous Load: The unnecessary mental effort caused by poor design, confusing interfaces, or disorganized multimedia. This must be actively eliminated.<sup>1</sup></li><li>Germane Load: The productive mental effort used to create schemas and process the learning. By eliminating extraneous load, we free up brainpower to maximize germane load.<sup>1</sup></li></ul></li><li><strong class='text-indigo-900'>Spatial Contiguity Principle:</strong> Mayer's research proves that students learn better when corresponding words and pictures are presented near each other rather than far apart on a screen. If a student has to scroll up to see a diagram and scroll down to read the text explaining it, their working memory is overloaded.<sup>1</sup></li><li><strong class='text-indigo-900'>The Importance of Predictability:</strong> The adolescent brain seeks patterns. A predictable course rhythm (e.g., modules always open on Mondays, assignments are always due on Fridays, visual structures are identical across units) drastically lowers anxiety and logistical confusion, acting as a structural scaffold for executive functioning.</li></ul>",
                anecdote: "I used to put everything in nested folders—a folder for week 1, inside that a folder for readings, inside that a folder for PDFs. Students were clicking four levels deep just to find their homework. Moving to the Brightspace New Content Experience and putting everything in a linear, scrollable HTML page with a checklist at the bottom stopped the 'I couldn't find the assignment' emails overnight.",
                keyConcept: {
                    title: "Extraneous Cognitive Load",

                overview: "This is the building phase. With tools like NotebookLM and Copilot, educators can shift from spending hours manually typing out study guides and rubrics to rapidly generating, curating, and refining high-quality, customized course assets that reside natively within Brightspace.",
                theory: "<p>While AI dramatically speeds up development, it introduces the severe risk of <strong>\"hallucinations\"</strong>—instances where a model produces plausible but entirely fabricated information or fake citations.<sup>1</sup> Generative models are essentially probabilistic; they predict the next most likely word rather than retrieving verified facts from a database.</p><p class='mt-4'>Course development must actively mitigate this by relying on <strong>source-grounded</strong> curation architectures, such as Retrieval-Augmented Generation (RAG).<sup>1</sup> By establishing a verified knowledge base and forcing the AI to strictly reference those approved documents, educators ensure all generated materials maintain absolute factual integrity, ensuring safe and responsible use.<sup>6</sup></p>",
                deeperContext: "<ul class='list-none space-y-5'><li><strong class='text-indigo-900'>The Hallucination Danger in K-12:</strong> In Grades 7-12, students lack the deep domain expertise required to spot subtle factual errors generated by open-ended AI models. If a teacher accidentally publishes an AI hallucination as part of the curriculum, students will internalize it as fact, actively damaging their conceptual understanding.<sup>1</sup></li><li><strong class='text-indigo-900'>Retrieval-Augmented Generation (RAG):</strong> Tools like NotebookLM utilize RAG architecture. Instead of answering questions based on the vast, unfiltered internet, the AI is tethered exclusively to a \"sandbox\" of documents the teacher provides.<sup>6</sup> This drastically lowers hallucination rates and ensures perfect curriculum alignment.<sup>6</sup></li><li><strong class='text-indigo-900'>The \"Human in the Loop\" Imperative:</strong> Course development must never be fully outsourced to an AI. Generative AI lacks pedagogical common sense and contextual empathy. The teacher must remain the ultimate editor and curator, verifying that the tone, accuracy, and pedagogical alignment meet their standards before deploying the content to the LMS.<sup>1</sup></li><li><strong class='text-indigo-900'>Efficiency vs. Effectiveness:</strong> AI tools make it easy to generate a massive amount of content quickly. However, more content does not equal better learning. Educators must use these tools to generate <em>effective</em>, targeted materials, not just voluminous ones.</li></ul>",

                overview: "Online distance education classrooms are highly diverse, often encompassing a wide spectrum of reading levels, linguistic backgrounds, and executive functioning capacities. AI is the ultimate equalizer in this domain, allowing educators to instantly modify the reading level, language, or cultural context of a lesson without changing the core academic standard.",
                theory: "<p>Differentiation is a cornerstone of student equity. However, equity is not achieved by merely simplifying content, which often leads to lowered expectations. Instead, technology must be used to maintain rigorous learning goals while adjusting the linguistic complexity, the modality, or the cultural relevance of the delivery mechanism.<sup>1</sup></p><p class='mt-4'>Generative models facilitate the <strong>\"GPS effect\"</strong>—providing turn-by-turn cognitive scaffolding that offers the greatest relative benefits to novices or struggling learners, effectively narrowing achievement gaps.<sup>1</sup> This operationalizes Vygotsky's Zone of Proximal Development (ZPD). The AI can act as a personalized cognitive coach, tracking the learner's ZPD to offer scaffolding just beyond their current ability and fading that support as their competence grows.<sup>1</sup></p>",
                deeperContext: "<ul class='list-none space-y-5'><li><strong class='text-indigo-900'>Equity vs. Equality:</strong> Equality is giving every student the exact same complex text. Equity is using AI to provide three different versions of that text so that every student has an equal opportunity to comprehend the core concept and participate in the ensuing discussion.<sup>1</sup></li><li><strong class='text-indigo-900'>Protecting Academic Rigor:</strong> The goal of differentiation is not to \"dumb down\" the curriculum. AI allows educators to lower the <em>linguistic</em> barrier (using simpler vocabulary or shorter sentences) while fiercely protecting the <em>cognitive</em> barrier (the critical thinking and rigorous logic required to solve the problem).<sup>20</sup></li><li><strong class='text-indigo-900'>The GPS Effect Explained:</strong> Just as a GPS navigation system gives a tourist the ability to navigate a new city as efficiently as a local, AI provides real-time, step-by-step cognitive navigation for struggling learners, bringing their baseline performance closer to their high-achieving peers.<sup>1</sup></li><li><strong class='text-indigo-900'>Culturally Responsive Pedagogy:</strong> Culturally relevant teaching requires bridging academic concepts to the students' lived realities. AI can quickly modify generic scenarios into culturally responsive ones, deeply validating the student's background and increasing motivation to learn.<sup>1</sup></li></ul>",

                overview: "Teaching online isn't about functioning as a digital content dispenser; it is about being profoundly human. When AI can generate perfect academic answers in seconds, the teacher's value shifts heavily to relational coaching, motivation, and actively teaching students how to critically collaborate with technology rather than cheat with it.",
                theory: "<p>Algorithms have neither a brain nor oxytocin; therefore, it is biologically impossible for humans and AI to develop an empathetic relationship.<sup>21</sup> The transpersonal nature of empathy and <strong>\"neuronal coupling\"</strong>—where the brain activity of a teacher and student synchronize—is exclusive to human-to-human relationships, which remains the absolute most significant driver of student retention and success.<sup>21</sup> Without this empathetic connection, students operating in purely digital environments become passive receivers of information.<sup>21</sup></p><p class='mt-4'>To navigate the integration of AI ethically and effectively, educators must understand the OECD's framework on Teacher-AI Teaming, which conceptualizes three paradigms of interaction:</p><ul class='list-disc pl-8 mt-2 space-y-2 text-slate-800'><li><strong>Replacement:</strong> The AI automates human tasks entirely. While efficient, this risks teacher de-skilling and removes the vital human relationship.<sup>1</sup></li><li><strong>Complementarity:</strong> The AI model amplifies the teacher's capabilities, handling routine tasks while the teacher remains actively involved in decision-making.<sup>1</sup></li><li><strong>Augmentation (Synergistic Teaming):</strong> The highest ideal, where the teacher and the AI mutually enhance each other. They evaluate each other's claims, leading to an emergent competence that exceeds the maximum capacity of the individual AI or the human alone.<sup>1</sup></li></ul>",

                overview: "To move beyond passive content consumption, online distance courses must actively cultivate a \"Community of Inquiry\" (CoI). This framework relies on three interconnected elements: Social Presence, Cognitive Presence, and Teaching Presence. Brightspace’s core communication tools—specifically threaded discussions, the Activity Feed, and Groups—are the primary vehicles for building this community, ensuring students feel connected, challenged, and supported by their instructor and peers.",
                theory: "<p>Developed by Garrison, Anderson, and Archer, the Community of Inquiry framework posits that deep, meaningful online learning occurs at the intersection of three presences:</p><ul class='list-disc pl-8 mt-4 space-y-2 text-slate-800'><li><strong>Social Presence:</strong> The ability of participants to project their authentic personal characteristics into the community, building trust and belonging.</li><li><strong>Cognitive Presence:</strong> The extent to which learners can construct and confirm meaning through sustained reflection and discourse. This requires moving students through four phases: a triggering event, exploration, integration, and resolution.</li><li><strong>Teaching Presence:</strong> The design, facilitation, and direction of cognitive and social processes by the instructor to realize meaningful learning outcomes.</li></ul><p class='mt-4'>Without intentionally structuring these interactions using the LMS toolset, online courses risk becoming isolating, which inevitably diminishes student engagement and cognitive processing.</p>",
                deeperContext: "<ul class='list-none space-y-5'><li><strong class='text-indigo-900'>The Need for Psychological Safety:</strong> Adolescents will not engage in rigorous debate or admit confusion (Cognitive Presence) unless they feel safe and accepted by their peers and teacher (Social Presence). Social presence is the prerequisite foundation for cognitive risk-taking.</li><li><strong class='text-indigo-900'>Moving Beyond \"Post Once, Reply Twice\":</strong> Standard discussion board rubrics often yield superficial compliance (\"Great post, I agree!\"). True cognitive presence requires designing prompts that necessitate negotiation, problem-solving, and the synthesis of multiple viewpoints. A discussion board should function like a lively dinner party, not a static bulletin board.</li><li><strong class='text-indigo-900'>The Visible Teacher:</strong> Teaching presence is not just setting up the course and walking away. It requires the instructor to actively jump into forums, weave disparate student thoughts together, and publicly validate excellent contributions.</li></ul>",

                theory: "<p>Modern assessment in the AI era is governed by Evidence-Centered Assessment Design (ECD), the Postplagiarism framework, and the Swiss Cheese Model of Assessment.</p><ul class='list-disc pl-8 mt-4 space-y-3 text-slate-800'><li><strong>Evidence-Centered Assessment Design (ECD):</strong> Developed by Robert Mislevy, ECD provides a principled model for linking assessment tasks, evidence, and inferences about learners' knowledge. By moving beyond a narrow focus on final outputs, ECD advocates for collecting three streams of data: product evidence (accuracy of the final work), process evidence (how the student planned and drafted), and metacognitive evidence (the student's interaction and reflection logs).<sup>1</sup></li><li><strong>Postplagiarism:</strong> Developed by Dr. Sarah Elaine Eaton, this framework acknowledges that hybrid human-machine writing is the new normal, making attempts to ban AI or separate human versus artificial text futile.<sup>1</sup> Assessment must shift from policing rule-compliance (Referencing) to measuring meta-cognitive awareness and evaluative judgment (Attribution—asking \"How do I know what I know? Who influenced my learning?\").<sup>1</sup></li><li><strong>The Swiss Cheese Model:</strong> Originally developed for risk management in complex systems, this model operates on the principle that every single assessment method has inherent vulnerabilities or \"holes\" (e.g., a student might cheat on a written test, or struggle with a lab setting).<sup>25</sup> By layering diverse assessments—diagnostic, formative, and summative—the strengths of one layer compensate for the weaknesses of another, yielding a highly reliable and valid picture of student skills.<sup>25</sup></li></ul>",

        const AI_COURSE_THEME_STORAGE_KEY = "ai-course-theme";

        function applyStoredTheme() {
            let storedTheme = null;
            try {
                storedTheme = localStorage.getItem(AI_COURSE_THEME_STORAGE_KEY);
            } catch {
                storedTheme = null;
            }

            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const shouldUseDark = storedTheme ? storedTheme === "dark" : prefersDark;
            document.documentElement.classList.toggle("dark", shouldUseDark);
            syncThemeIcons();
        }

        function syncThemeIcons() {
            const isDark = document.documentElement.classList.contains("dark");
            document.querySelectorAll("[data-theme-icon]").forEach((icon) => {
                icon.textContent = isDark ? "light_mode" : "dark_mode";
            });
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.contains("dark");
            const nextTheme = isDark ? "light" : "dark";
            try {
                localStorage.setItem(AI_COURSE_THEME_STORAGE_KEY, nextTheme);
            } catch {
                // Theme still changes for this session if browser storage is blocked.
            }
            applyStoredTheme();
        }

        // --- UNIFIED INTERACTIVE LOGIC ---

        function initDnd(mod) {
            if (mod.fillBlankData) {
                interactionState = {
                    type: 'fillBlank',
                    available: [...mod.fillBlankData.terms].sort(() => Math.random() - 0.5),
                    matched: {}, // target -> item
                    errorHighlight: null,
                    selectedForClick: null
                };
            } else if (mod.bucketData) {
                interactionState = {
                    type: 'bucket',
                    available: [...mod.bucketData.items].sort(() => Math.random() - 0.5),
                    matched: {}, // target -> array of items
                    errorHighlight: null,
                    selectedForClick: null
                };
                mod.bucketData.buckets.forEach(b => interactionState.matched[b] = []);
            } else if (mod.sequenceData) {
                interactionState = {
                    type: 'sequence',
                    available: [...mod.sequenceData.items].sort(() => Math.random() - 0.5),
                    matched: {}, // target -> item
                    errorHighlight: null,
                    selectedForClick: null
                };
            } else if (mod.scenarios) {
                interactionState = {
                    type: 'scenario',
                    available: [...mod.scenarios].sort(() => Math.random() - 0.5).map(s => s.strategy),
                    matched: {}, // target -> strategy
                    errorHighlight: null,
                    selectedForClick: null
                };
            } else {
                return; // No DND found
            }
            reRenderDnd();
        }

        function reRenderDnd() {
            const mod = courseModules.find(m => m.id === currentModuleId);
            if(!mod) return;

            const container = document.getElementById('dnd-container');
            if(!container) return;

            if (interactionState.type === 'fillBlank') renderFillBlankDnd(mod.fillBlankData, container);
            else if (interactionState.type === 'bucket') renderBucketDnd(mod.bucketData, container);
            else if (interactionState.type === 'sequence') renderSequenceDnd(mod.sequenceData, container);
            else if (interactionState.type === 'scenario') renderScenarioDnd(mod, container);
            
            lucide.createIcons();
        }

        // --- RENDERERS FOR DIFFERENT DND TYPES ---

        function buildSuccessUI() {
            return `
                <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-300 rounded-2xl p-8 flex flex-col items-center justify-center text-center animate-fade-in shadow-sm">
                    <div class="bg-emerald-200 p-3 rounded-full mb-4">

                    <p class="text-emerald-900 mb-6">You successfully completed this applied knowledge check.</p>
                    <button onclick="initDnd(courseModules.find(m => m.id === ${currentModuleId}))" class="px-6 py-2.5 bg-emerald-700 text-white font-bold rounded-lg hover:bg-emerald-800 transition-colors shadow-md focus:ring-4 focus:ring-emerald-400 focus:outline-none">
                        Practice Again
                    </button>
                </div>
            `;
        }

        function buildTermsHtml() {
            return interactionState.available.map(term => {
                const isSelected = interactionState.selectedForClick === (term.id || term);
                const text = term.text || term;
                const id = term.id || term;
                return `
                    <button draggable="true" 
                         ondragstart="handleDragStart(event, '${id.replace(/'/g, "\\'")}')"
                         onclick="handleTermClick('${id.replace(/'/g, "\\'")}')"
                         class="w-full text-left ${isSelected ? 'bg-indigo-900 ring-4 ring-indigo-300 scale-105' : 'bg-indigo-700 hover:bg-indigo-800 hover:shadow-lg focus:ring-2 focus:ring-offset-1 focus:ring-indigo-600'} text-white px-5 py-3.5 rounded-xl shadow-md cursor-pointer md:cursor-grab active:cursor-grabbing transition-all flex items-center justify-between font-medium text-sm border border-indigo-600 z-10 relative focus:outline-none">
                        <span>${text}</span>
                        <i data-lucide="grip-horizontal" class="w-4 h-4 opacity-60 shrink-0 ml-3"></i>
                    </button>
                `;
            }).join('');
        }

        function renderScenarioDnd(mod, container) {
            if (interactionState.available.length === 0) {
                container.innerHTML = buildSuccessUI();
                return;
            }

            let termsHtml = buildTermsHtml();

            let zonesHtml = mod.scenarios.map((item) => {
                const hasMatch = interactionState.matched[item.scenario];
                const isError = interactionState.errorHighlight === item.scenario;
                const safeScenario = item.scenario.replace(/'/g, "\\'");
                
                let baseClasses = "relative p-6 rounded-xl border-2 border-dashed transition-all duration-300 flex flex-col justify-between min-h-[140px] focus:outline-none focus:ring-2 focus:ring-indigo-500 ";
                if (hasMatch) baseClasses += "bg-emerald-50 border-emerald-400";
                else if (isError) baseClasses += "bg-red-50 border-red-500 animate-pulse";
                else if (interactionState.selectedForClick) baseClasses += "bg-indigo-50 border-indigo-500 shadow-inner cursor-pointer hover:bg-indigo-100";
                else baseClasses += "bg-white border-slate-300 hover:border-slate-400";

                let matchHtml = hasMatch 
                    ? `<div class="w-full mt-4 inline-flex items-center gap-2 bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold animate-fade-in shadow-sm"><i data-lucide="check" class="w-4 h-4"></i> ${hasMatch}</div>`
                    : `<div class="w-full mt-4 h-12 border-2 border-slate-300 border-dashed rounded-lg bg-slate-100 flex items-center justify-center text-slate-700 text-sm font-bold transition-colors ${interactionState.selectedForClick ? 'bg-indigo-100 border-indigo-500 text-indigo-900' : ''}">${interactionState.selectedForClick ? 'Tap to apply strategy here' : 'Drop Strategy Here'}</div>`;

                return `
                    <button class="${baseClasses} w-full text-left"
                         ondragover="handleDragOver(event)"
                         ondragenter="handleDragEnter(event, this, ${!!hasMatch})"
                         ondragleave="handleDragLeave(event, this, ${!!hasMatch})"
                         ondrop="handleDrop(event, '${safeScenario}', this, ${!!hasMatch})"
                         onclick="handleZoneClick('${safeScenario}')">
                        <div class="flex items-start gap-3 pointer-events-none">
                            <i data-lucide="user-circle" class="w-5 h-5 text-slate-500 shrink-0 mt-0.5"></i>
                            <p class="text-slate-800 relative text-[15px] font-medium leading-relaxed">${item.scenario}</p>
                        </div>
                        <div class="pointer-events-none w-full">${matchHtml}</div>
                    </button>
                `;
            }).join('');

            container.innerHTML = `
                <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm">
                    <p class="text-slate-800 font-bold mb-4 text-sm uppercase tracking-wide">APPLICATION: Read the classroom scenarios below. Drag the strategy (or tap to select) that best solves the pedagogical challenge.</p>
                    <div class="flex flex-col lg:flex-row gap-8">
                        <div class="w-full lg:w-1/3">
                            <h4 class="font-bold text-slate-900 mb-4 flex items-center gap-2 text-sm uppercase tracking-wide"><i data-lucide="layers" class="w-4 h-4 text-slate-600"></i> Strategy Bank</h4>
                            <div class="flex flex-col gap-3 p-5 bg-slate-100 rounded-xl border border-slate-300 shadow-inner min-h-[300px]">${termsHtml}</div>
                        </div>
                        <div class="w-full lg:w-2/3 flex flex-col gap-5">
                            <h4 class="font-bold text-slate-900 mb-[-4px] flex items-center gap-2 text-sm uppercase tracking-wide"><i data-lucide="layout-grid" class="w-4 h-4 text-slate-600"></i> Classroom Scenarios</h4>
                            ${zonesHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBucketDnd(data, container) {
            if (interactionState.available.length === 0) {
                container.innerHTML = buildSuccessUI();
                return;
            }

            let termsHtml = buildTermsHtml();

            let bucketsHtml = data.buckets.map(bName => {
                const matchedItems = interactionState.matched[bName] || [];
                const isError = interactionState.errorHighlight === bName;
                const safeBname = bName.replace(/'/g, "\\'");
                
                let itemsHtml = matchedItems.map(i => `<div class="bg-emerald-100 text-emerald-900 px-3 py-2 rounded text-sm mb-2 font-bold shadow-sm"><i data-lucide="check" class="w-4 h-4 inline mr-1 text-emerald-700"></i> ${i.text}</div>`).join('');
                
                let baseClasses = "flex-1 min-h-[180px] p-5 rounded-xl border-2 border-dashed transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 ";
                if (isError) baseClasses += "border-red-500 bg-red-50 animate-pulse";
                else if (interactionState.selectedForClick) baseClasses += "bg-indigo-50 border-indigo-500 shadow-inner cursor-pointer hover:bg-indigo-100";
                else baseClasses += "border-slate-400 bg-slate-50 hover:border-slate-500";

                return `
                    <button class="${baseClasses} w-full flex flex-col"
                         ondragover="handleDragOver(event)"
                         ondragenter="handleDragEnter(event, this, false)"
                         ondragleave="handleDragLeave(event, this, false)"
                         ondrop="handleDrop(event, '${safeBname}', this, false)"
                         onclick="handleZoneClick('${safeBname}')">
                         <h4 class="font-bold text-slate-900 mb-4 text-center pb-2 border-b border-slate-300 pointer-events-none w-full">${bName}</h4>
                         <div class="pointer-events-none w-full text-left">
                            ${itemsHtml}
                            ${matchedItems.length === 0 ? `<p class="text-slate-600 text-sm text-center mt-4 font-bold ${interactionState.selectedForClick ? 'text-indigo-800' : ''}">${interactionState.selectedForClick ? 'Tap to place item here' : 'Drop items here'}</p>` : ''}
                         </div>
                    </button>
                `;
            }).join('');

            container.innerHTML = `
                <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm">
                    <p class="text-slate-800 font-bold mb-6 text-sm uppercase tracking-wide">APPLICATION: ${data.instructions}</p>
                    <div class="flex flex-col gap-6">
                        <div class="flex flex-wrap gap-3 p-5 bg-slate-100 rounded-xl border border-slate-300 shadow-inner min-h-[100px] justify-center">
                            ${termsHtml}
                        </div>
                        <div class="grid md:grid-cols-${data.buckets.length} gap-4">
                            ${bucketsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSequenceDnd(data, container) {
            if (interactionState.available.length === 0) {
                container.innerHTML = buildSuccessUI();
                return;
            }

            let termsHtml = buildTermsHtml();

            let slotsHtml = data.slots.map((slotName, idx) => {
                const matchedItem = interactionState.matched[slotName];
                const isError = interactionState.errorHighlight === slotName;
                const safeSlot = slotName.replace(/'/g, "\\'");
                
                let baseClasses = "relative flex items-center p-4 rounded-xl border-2 border-dashed transition-all duration-300 min-h-[80px] focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full text-left ";
                if (matchedItem) baseClasses += "bg-emerald-50 border-emerald-400";
                else if (isError) baseClasses += "bg-red-50 border-red-500 animate-pulse";
                else if (interactionState.selectedForClick) baseClasses += "bg-indigo-50 border-indigo-500 shadow-inner cursor-pointer hover:bg-indigo-100";
                else baseClasses += "bg-slate-50 border-slate-400 hover:border-slate-500";

                let contentHtml = matchedItem 
                    ? `<div class="flex-1 ml-4 bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-bold shadow-sm animate-fade-in"><i data-lucide="check" class="w-4 h-4 inline mr-1"></i> ${matchedItem.text}</div>`
                    : `<div class="flex-1 ml-4 text-slate-600 text-sm font-bold ${interactionState.selectedForClick ? 'text-indigo-800' : ''}">${interactionState.selectedForClick ? 'Tap to place step here' : 'Drop Step Here'}</div>`;

                return `
                    <button class="${baseClasses}"
                         ondragover="handleDragOver(event)"
                         ondragenter="handleDragEnter(event, this, ${!!matchedItem})"
                         ondragleave="handleDragLeave(event, this, ${!!matchedItem})"
                         ondrop="handleDrop(event, '${safeSlot}', this, ${!!matchedItem})"
                         onclick="handleZoneClick('${safeSlot}')">
                         <div class="w-10 h-10 rounded-full bg-slate-300 text-slate-800 flex items-center justify-center font-bold text-lg shrink-0 pointer-events-none shadow-inner">${idx + 1}</div>
                         <div class="pointer-events-none w-full">${contentHtml}</div>
                    </button>
                `;
            }).join('');

            container.innerHTML = `
                <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm">
                    <p class="text-slate-800 font-bold mb-6 text-sm uppercase tracking-wide">APPLICATION: ${data.instructions}</p>
                    <div class="flex flex-col lg:flex-row gap-10">
                        <div class="w-full lg:w-1/2 flex flex-col gap-3">
                            <h4 class="font-bold text-slate-900 mb-2 flex items-center gap-2 text-sm uppercase tracking-wide"><i data-lucide="layers" class="w-4 h-4 text-slate-600"></i> Available Steps</h4>
                            <div class="flex flex-col gap-3 p-5 bg-slate-100 rounded-xl border border-slate-300 shadow-inner min-h-[300px]">
                                ${termsHtml}
                            </div>
                        </div>
                        <div class="w-full lg:w-1/2 flex flex-col gap-4">
                            <h4 class="font-bold text-slate-900 mb-1 flex items-center gap-2 text-sm uppercase tracking-wide"><i data-lucide="arrow-down" class="w-4 h-4 text-slate-600"></i> Correct Order</h4>
                            ${slotsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFillBlankDnd(data, container) {
            if (interactionState.available.length === 0) {
                container.innerHTML = buildSuccessUI();
                return;
            }

            let termsHtml = buildTermsHtml();

            let textWithBlanks = data.text;
            data.blanks.forEach(blank => {
                const matchedItem = interactionState.matched[blank.id];
                const isError = interactionState.errorHighlight === blank.id;
                
                let zoneClasses = "inline-flex items-center justify-center min-w-[140px] h-10 px-4 mx-1 rounded-md border-b-4 transition-all align-middle text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-600 ";
                
                if (matchedItem) {
                    zoneClasses += "border-emerald-700 text-emerald-950 bg-emerald-100 shadow-sm cursor-default";
                } else if (isError) {
                    zoneClasses += "border-red-600 text-red-900 bg-red-100 animate-pulse";
                } else if (interactionState.selectedForClick) {
                    zoneClasses += "border-indigo-600 bg-indigo-100 shadow-inner text-indigo-900 cursor-pointer";
                } else {
                    zoneClasses += "border-slate-400 bg-slate-200 text-slate-700 hover:border-indigo-500 hover:bg-slate-300 cursor-pointer";
                }

                const matchHtml = matchedItem ? matchedItem.text : (interactionState.selectedForClick ? "Tap to drop" : "Drop term here");

                const safeId = blank.id.replace(/'/g, "\\'");
                const zoneHtml = `<button class="${zoneClasses}" 
                    ondragover="handleDragOver(event)" 
                    ondragenter="handleDragEnter(event, this, ${!!matchedItem})" 
                    ondragleave="handleDragLeave(event, this, ${!!matchedItem})" 
                    ondrop="handleDrop(event, '${safeId}', this, ${!!matchedItem})" 
                    onclick="handleZoneClick('${safeId}')">${matchHtml}</button>`;
                
                textWithBlanks = textWithBlanks.replace(`[${blank.id}]`, zoneHtml);
            });

            container.innerHTML = `
                <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm">
                    <p class="text-slate-800 font-bold mb-6 text-sm uppercase tracking-wide">APPLICATION: ${data.instructions}</p>
                    <div class="flex flex-col gap-8">
                        <div class="flex flex-wrap gap-3 p-5 bg-slate-100 rounded-xl border border-slate-300 shadow-inner min-h-[80px] justify-center">
                            ${termsHtml}
                        </div>
                        <div class="p-8 bg-white border border-slate-300 shadow-sm rounded-xl text-lg leading-loose text-slate-800 font-medium">
                            ${textWithBlanks}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- UNIFIED DND EVENT HANDLERS ---
        function handleDragStart(e, idOrTerm) {
            e.dataTransfer.setData("text/plain", idOrTerm);
            e.dataTransfer.effectAllowed = "move";
            interactionState.selectedForClick = null; 
        }

        function handleDragOver(e) { 
            e.preventDefault(); 
            e.dataTransfer.dropEffect = "move"; 
        }

        function handleDragEnter(e, el, hasMatch) {
            e.preventDefault();
            if (!hasMatch) {
                if(el.tagName === 'BUTTON' && el.classList.contains('inline-flex')) {
                    el.classList.add('bg-indigo-100', 'border-indigo-500', 'shadow-inner', 'text-indigo-900');
                    el.classList.remove('bg-slate-200', 'border-slate-400', 'text-slate-700');
                } else {
                    el.classList.add('bg-indigo-50', 'border-indigo-400', 'shadow-inner');
                    el.classList.remove('bg-white', 'bg-slate-50', 'border-slate-300', 'border-slate-400');
                }
            }
        }

        function handleDragLeave(e, el, hasMatch) {
            e.preventDefault();
            if (!hasMatch) {
                if(el.tagName === 'BUTTON' && el.classList.contains('inline-flex')) {
                    el.classList.remove('bg-indigo-100', 'border-indigo-500', 'shadow-inner', 'text-indigo-900');
                    el.classList.add('bg-slate-200', 'border-slate-400', 'text-slate-700');
                } else {
                    el.classList.remove('bg-indigo-50', 'border-indigo-400', 'shadow-inner');
                    el.classList.add('bg-slate-50', 'border-slate-300'); 
                }
            }
        }

        function handleDrop(e, target, el, hasMatch) {
            e.preventDefault();
            if (!hasMatch) {
                if(el.tagName === 'BUTTON' && el.classList.contains('inline-flex')) {
                    el.classList.remove('bg-indigo-100', 'border-indigo-500', 'shadow-inner', 'text-indigo-900');
                } else {
                    el.classList.remove('bg-indigo-50', 'border-indigo-400', 'shadow-inner');
                }
            }
            processDrop(e.dataTransfer.getData("text/plain"), target);
        }

        function handleTermClick(idOrTerm) {
            interactionState.selectedForClick = interactionState.selectedForClick === idOrTerm ? null : idOrTerm;
            reRenderDnd();
        }

        function handleZoneClick(target) {
            if (!interactionState.selectedForClick) return; 
            if (interactionState.type !== 'bucket' && interactionState.matched[target]) return; 

            const term = interactionState.selectedForClick;
            interactionState.selectedForClick = null; 
            processDrop(term, target);
        }

        function processDrop(draggedId, target) {
            const mod = courseModules.find(m => m.id === currentModuleId);
            let isCorrect = false;
            let draggedObj = null;

            if (interactionState.type === 'scenario') {
                const correctPair = mod.scenarios.find(item => item.scenario === target);
                isCorrect = (correctPair && correctPair.strategy === draggedId);
                draggedObj = draggedId;
            } 
            else if (interactionState.type === 'bucket') {
                const item = mod.bucketData.items.find(i => i.id === draggedId);
                isCorrect = (item && item.target === target);
                draggedObj = item;
            }
            else if (interactionState.type === 'sequence') {
                const item = mod.sequenceData.items.find(i => i.id === draggedId);
                isCorrect = (item && item.target === target);
                draggedObj = item;
            }
            else if (interactionState.type === 'fillBlank') {
                const blank = mod.fillBlankData.blanks.find(b => b.id === target);
                const item = mod.fillBlankData.terms.find(t => t.id === draggedId);
                isCorrect = (blank && item && blank.answer === item.id);
                draggedObj = item;
            }
            
            if (isCorrect) {
                if (interactionState.type === 'bucket') {
                    interactionState.matched[target].push(draggedObj);
                    interactionState.available = interactionState.available.filter(t => t.id !== draggedId);
                } else {
                    interactionState.matched[target] = draggedObj;
                    interactionState.available = interactionState.available.filter(t => (t.id || t) !== draggedId);
                }
                interactionState.errorHighlight = null;
                reRenderDnd();
            } else {
                interactionState.errorHighlight = target;
                reRenderDnd();
                setTimeout(() => {
                    interactionState.errorHighlight = null;
                    reRenderDnd();
                }, 800);
            }
        }

        // --- BOOT ---
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
