<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Verify a suspicious message using an independent route</title>
<desc id="desc">Four steps: pause; do not use the message's link, number, or code request; open an official site or a known number independently; check the account or report using that trusted route.</desc>
<rect width="900" height="330" fill="#f8faf8"/>
<g font-family="Arial,sans-serif" fill="#17221e"><text x="42" y="55" font-size="24" font-weight="700">A message is a claim. Verify it elsewhere.</text>
<rect x="42" y="93" width="185" height="149" rx="4" fill="#fff8ec" stroke="#9c6720" stroke-width="2"/><text x="58" y="131" font-size="19" font-weight="700">1 · Pause</text><text x="58" y="165" font-size="16">Urgency does not</text><text x="58" y="190" font-size="16">prove the sender.</text>
<rect x="252" y="93" width="185" height="149" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/><text x="268" y="131" font-size="19" font-weight="700">2 · Avoid</text><text x="268" y="165" font-size="16">Do not use its link,</text><text x="268" y="190" font-size="16">reply or code request.</text>
<rect x="462" y="93" width="185" height="149" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/><text x="478" y="131" font-size="19" font-weight="700">3 · Open</text><text x="478" y="165" font-size="16">Use a known official</text><text x="478" y="190" font-size="16">site or number.</text>
<rect x="672" y="93" width="185" height="149" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/><text x="688" y="131" font-size="19" font-weight="700">4 · Check</text><text x="688" y="165" font-size="16">Verify the claim and</text><text x="688" y="190" font-size="16">report if needed.</text>
<text x="42" y="291" font-size="16" fill="#506158">A plausible message can still be false. A surprising call can also be real: check independently.</text>
</g></svg>
