<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Workplace hazard response sequence</title><desc id="desc">Identify the hazard and missing information, pause unsafe work, request labels training and supervision, reassess all remaining hazards, and either proceed under a safe procedure or use the workplace and Alberta escalation process.</desc><rect width="900" height="350" fill="#f8faf8"/><text x="36" y="47" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17221e">A safe response is a sequence</text><g font-family="Arial,sans-serif" font-size="17" fill="#17221e"><rect x="36" y="91" width="179" height="94" rx="4" fill="#fff8ea" stroke="#9b661c" stroke-width="2"/><text x="54" y="125" font-weight="700">1  Identify</text><text x="54" y="154">What could harm?</text><rect x="250" y="91" width="179" height="94" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/><text x="268" y="125" font-weight="700">2  Pause</text><text x="268" y="154">Do not guess.</text><rect x="464" y="91" width="179" height="94" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/><text x="482" y="125" font-weight="700">3  Ask</text><text x="482" y="154">Info + training</text><rect x="678" y="91" width="179" height="94" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/><text x="696" y="125" font-weight="700">4  Reassess</text><text x="696" y="154">Risks remaining?</text></g><path d="M215 138h35m179 0h35m179 0h35" stroke="#426c60" stroke-width="3"/><path d="M766 185v43H240" fill="none" stroke="#426c60" stroke-width="3"/><rect x="54" y="229" width="335" height="70" rx="4" fill="#dbece2" stroke="#2d6956" stroke-width="2"/><text x="72" y="270" font-family="Arial,sans-serif" font-size="17" fill="#17221e">Safe procedure established → continue</text><rect x="464" y="229" width="393" height="70" rx="4" fill="#fff1e2" stroke="#9b661c" stroke-width="2"/><text x="482" y="270" font-family="Arial,sans-serif" font-size="17" fill="#17221e">Danger remains → report and follow process</text><text x="36" y="328" font-family="Arial,sans-serif" font-size="14" fill="#55625a">For real work, follow current Alberta rules, training and emergency procedures.</text></svg>
