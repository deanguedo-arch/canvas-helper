<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Gross earnings become net pay after listed deductions</title><desc id="desc">Fictional pay statement: twelve and one half hours at eighteen dollars gives two hundred twenty five dollars gross. Three deductions of sixteen dollars, ten dollars eighty cents, and three dollars sixty cents total thirty dollars forty cents. Net pay is one hundred ninety four dollars sixty cents.</desc>
<rect width="900" height="330" fill="#f8faf8"/><text x="42" y="55" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17221e">Follow one fictional pay period</text>
<rect x="42" y="90" width="260" height="126" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/><text x="64" y="126" font-family="Arial,sans-serif" font-size="18" fill="#24433a">Hours × rate</text><text x="64" y="158" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17221e">12.5 × $18.00</text><text x="64" y="193" font-family="Arial,sans-serif" font-size="20" fill="#17221e">Gross  $225.00</text>
<path d="M315 153h48" stroke="#426c60" stroke-width="4"/><path d="m359 144 14 9-14 9" fill="none" stroke="#426c60" stroke-width="4"/>
<rect x="382" y="90" width="217" height="126" rx="4" fill="#fff7e8" stroke="#9b661c" stroke-width="2"/><text x="404" y="126" font-family="Arial,sans-serif" font-size="18" fill="#6a4c24">Listed deductions</text><text x="404" y="158" font-family="Arial,sans-serif" font-size="19" fill="#17221e">$16 + $10.80 + $3.60</text><text x="404" y="193" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17221e">Total  $30.40</text>
<path d="M612 153h48" stroke="#426c60" stroke-width="4"/><path d="m656 144 14 9-14 9" fill="none" stroke="#426c60" stroke-width="4"/>
<rect x="680" y="90" width="180" height="126" rx="4" fill="#dbece2" stroke="#2d6956" stroke-width="2"/><text x="702" y="126" font-family="Arial,sans-serif" font-size="18" fill="#24433a">Deposit</text><text x="702" y="170" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17221e">$194.60</text><text x="702" y="194" font-family="Arial,sans-serif" font-size="16" fill="#24433a">Net pay</text>
<text x="42" y="268" font-family="Arial,sans-serif" font-size="18" fill="#33413b">$225.00 gross − $30.40 deductions = $194.60 net</text><text x="42" y="297" font-family="Arial,sans-serif" font-size="14" fill="#55625a">Amounts are invented for learning. They do not represent current payroll rates.</text>
</svg>
