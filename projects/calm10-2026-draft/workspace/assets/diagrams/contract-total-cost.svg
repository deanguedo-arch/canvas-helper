<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">A mobile plan comparison must include the full term and missing terms</title>
<desc id="desc">The decision path asks for promotional months, later months, device payments, taxes and fees, and cancellation terms before comparing twelve-month totals. The fictional lesson document supplies exact amounts.</desc>
<rect width="900" height="330" fill="#f8faf8"/>
<text x="42" y="54" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17221e">Read past the headline price</text>
<g font-family="Arial,sans-serif" fill="#17221e">
<rect x="42" y="91" width="185" height="132" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/>
<text x="58" y="128" font-size="18" font-weight="700">1 · Promo</text><text x="58" y="159" font-size="17">Price × months</text><text x="58" y="184" font-size="16">Then ask: when</text><text x="58" y="208" font-size="16">does it end?</text>
<rect x="252" y="91" width="185" height="132" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/>
<text x="268" y="128" font-size="18" font-weight="700">2 · Later price</text><text x="268" y="159" font-size="17">Price × months</text><text x="268" y="184" font-size="16">Use the full</text><text x="268" y="208" font-size="16">comparison term.</text>
<rect x="462" y="91" width="185" height="132" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/>
<text x="478" y="128" font-size="18" font-weight="700">3 · Device</text><text x="478" y="159" font-size="17">Add instalments</text><text x="478" y="184" font-size="16">and ask what you</text><text x="478" y="208" font-size="16">own at the end.</text>
<rect x="672" y="91" width="185" height="132" rx="4" fill="#fff8ec" stroke="#9c6720" stroke-width="2"/>
<text x="688" y="128" font-size="18" font-weight="700">4 · Unknowns</text><text x="688" y="159" font-size="17">Taxes, fees,</text><text x="688" y="184" font-size="16">cancellation and</text><text x="688" y="208" font-size="16">data limits.</text>
<text x="42" y="273" font-size="18" font-weight="700">Compare totals only after you mark what is included and what is missing.</text>
<text x="42" y="301" font-size="15" fill="#506158">Fictional teaching example; check the actual written agreement before any real purchase.</text>
</g></svg>
