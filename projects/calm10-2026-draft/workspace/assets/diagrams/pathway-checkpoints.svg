<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">A high-school pathway plan with two routes and verification points</title><desc id="desc">Shared preparation leads to a choice between route A with a possible advanced science prerequisite and route B with a possible portfolio project. Both must be verified using current program and school information, then reviewed when circumstances change.</desc><rect width="900" height="360" fill="#f8faf8"/><text x="38" y="48" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#17221e">Keep two routes open</text><rect x="38" y="90" width="210" height="98" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/><text x="57" y="124" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17221e">Shared preparation</text><text x="57" y="155" font-family="Arial,sans-serif" font-size="16" fill="#33413b">Foundational courses</text><path d="M250 139h70m0 0 68-45m-68 45 68 57" fill="none" stroke="#426c60" stroke-width="3"/><rect x="389" y="60" width="218" height="92" rx="4" fill="#f2f7f3" stroke="#2d6956" stroke-width="2"/><text x="408" y="95" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17221e">Route A</text><text x="408" y="124" font-family="Arial,sans-serif" font-size="16" fill="#33413b">Check course sequence</text><rect x="389" y="180" width="218" height="92" rx="4" fill="#fff8ea" stroke="#9b661c" stroke-width="2"/><text x="408" y="215" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17221e">Route B</text><text x="408" y="244" font-family="Arial,sans-serif" font-size="16" fill="#33413b">Check portfolio needs</text><path d="M608 106h49m-49 120h49" stroke="#426c60" stroke-width="3"/><rect x="657" y="111" width="207" height="112" rx="4" fill="#e8f1eb" stroke="#2d6956" stroke-width="2"/><text x="675" y="147" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17221e">Verify and review</text><text x="675" y="177" font-family="Arial,sans-serif" font-size="16" fill="#33413b">Program + school</text><text x="675" y="200" font-family="Arial,sans-serif" font-size="16" fill="#33413b">Current dates + options</text><text x="38" y="324" font-family="Arial,sans-serif" font-size="15" fill="#55625a">The route labels are illustrative; actual prerequisites must come from current sources.</text></svg>
