<text x="64" y="48" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#ffffff" text-anchor="start">CALM 10  /  PROTECT YOUR MONEY AND INFORMATION</text>
<text x="1200" y="48" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#dfe9e4" text-anchor="end">2 / 6</text>
<rect x="64" y="108" width="1152" height="500" rx="4" fill="#ffffff" stroke="#c9d7d0" stroke-width="2"/>
<rect x="64" y="108" width="10" height="500" fill="#17624f"/>
<text x="104" y="153" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="600" fill="#17211e" text-anchor="start">Spot pressure and sensitive requests</text>
<text x="104" y="195" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#17624f" text-anchor="start">A cue raises concern; verify before acting.</text>
<rect x="104" y="232" width="515" height="285" rx="6" fill="#fff8f4" stroke="#dfc5bc"/>
<rect x="654" y="232" width="520" height="285" rx="6" fill="#f3f8f5" stroke="#c9d7d0"/>
<text x="138" y="277" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#a14433" text-anchor="start">MESSAGE A  /  URGENT MONEY REQUEST</text>
<text x="688" y="277" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17624f" text-anchor="start">MESSAGE B  /  NOTICE</text>
<text x="140" y="334" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" fill="#24312d" text-anchor="start">Urgency or threat</text>
<text x="690" y="334" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" fill="#24312d" text-anchor="start">Transfer to a “safe” account</text>
<text x="640" y="566" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#17624f" text-anchor="middle">Cue ≠ proof • pause before an irreversible action.</text>
<line x1="104" y1="585" x2="1174" y2="585" stroke="#c9d7d0"/>
<text x="104" y="627" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52615b" text-anchor="start">Recognize high-risk requests, distinguish appearance from evidence, and verify a contact independently.</text>
<text x="1174" y="671" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52615b" text-anchor="end">CALM 10  •  WORKED EXAMPLE</text>
