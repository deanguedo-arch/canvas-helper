<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#f7f8f5"/>
<rect width="1280" height="74" fill="#17211e"/>
<text x="64" y="48" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#ffffff" text-anchor="start">CALM 10  /  BORROWING AND DEBT</text>
<text x="1200" y="48" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#dfe9e4" text-anchor="end">3 / 6</text>
<rect x="64" y="108" width="1152" height="500" rx="4" fill="#ffffff" stroke="#c9d7d0" stroke-width="2"/>
<rect x="64" y="108" width="10" height="500" fill="#17624f"/>
<text x="104" y="153" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="600" fill="#17211e" text-anchor="start">Calculate the level payment</text>
<text x="104" y="195" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#17624f" text-anchor="start">Use the converted monthly rate, not 12% ÷ 12.</text>
<rect x="104" y="232" width="1070" height="205" rx="4" fill="#edf3ef" stroke="#c9d7d0"/>
<text x="140" y="280" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" fill="#24312d" text-anchor="start">Principal P = $1,000</text>
<text x="140" y="322" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" fill="#24312d" text-anchor="start">Monthly rate i ≈ 0.00975879</text>
<text x="140" y="364" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" fill="#24312d" text-anchor="start">n = 12 monthly payments</text>
<rect x="104" y="458" width="1070" height="104" rx="4" fill="#e4eee8"/>
<text x="640" y="500" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#17624f" text-anchor="middle">Payment = P × i ÷ [1 − (1 + i)⁻ⁿ] ≈ $88.71344</text>
<line x1="104" y1="585" x2="1174" y2="585" stroke="#c9d7d0"/>
<text x="104" y="627" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52615b" text-anchor="start">Trace how a level payment is divided between interest and principal as the balance declines.</text>
<text x="1174" y="671" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52615b" text-anchor="end">CALM 10  •  WORKED EXAMPLE</text>
</svg>