<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#f7f8f5"/>
<rect width="1280" height="74" fill="#17211e"/>
<text x="64" y="48" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#ffffff" text-anchor="start">CALM 10  /  EVERYDAY MONEY</text>
<text x="1200" y="48" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#dfe9e4" text-anchor="end">6 / 6</text>
<rect x="64" y="108" width="1152" height="500" rx="4" fill="#ffffff" stroke="#c9d7d0" stroke-width="2"/>
<rect x="64" y="108" width="10" height="500" fill="#17624f"/>
<text x="104" y="153" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="600" fill="#17211e" text-anchor="start">Worked answer and next check</text>
<text x="104" y="195" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#17624f" text-anchor="start">Arithmetic can reconcile while a record still needs checking.</text>
<rect x="104" y="232" width="1070" height="290" rx="6" fill="#edf3ef" stroke="#c9d7d0"/>
<text x="142" y="283" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#24312d" text-anchor="start">12.5 × $18.00 = $225.00 gross</text>
<text x="142" y="331" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#24312d" text-anchor="start">$16.00 + $10.80 + $3.60 = $30.40</text>
<text x="142" y="379" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#24312d" text-anchor="start">$225.00 − $30.40 = $194.60 net</text>
<text x="640" y="565" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#17624f" text-anchor="middle">Next check: same dates, actual hours, and applicable records.</text>
<line x1="104" y1="585" x2="1174" y2="585" stroke="#c9d7d0"/>
<text x="104" y="627" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52615b" text-anchor="start">Reconcile hours, gross earnings, deductions, and net pay without treating a label as proof.</text>
<text x="1174" y="671" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52615b" text-anchor="end">CALM 10  •  WORKED EXAMPLE</text>
</svg>