<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#f7f8f5"/>
<rect width="1280" height="74" fill="#17211e"/>
<text x="64" y="48" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#ffffff" text-anchor="start">CALM 10  /  WORKPLACE RIGHTS</text>
<text x="1200" y="48" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#dfe9e4" text-anchor="end">4 / 6</text>
<rect x="64" y="108" width="1152" height="500" rx="4" fill="#ffffff" stroke="#c9d7d0" stroke-width="2"/>
<rect x="64" y="108" width="10" height="500" fill="#17624f"/>
<text x="104" y="153" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="600" fill="#17211e" text-anchor="start">Choose an immediate control</text>
<text x="104" y="195" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#17624f" text-anchor="start">Reduce exposure before collecting more detail.</text>
<rect x="104" y="232" width="1070" height="288" rx="6" fill="#edf3ef" stroke="#c9d7d0"/>
<circle cx="145" cy="274" r="12" fill="#17624f"/>
<text x="178" y="282" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#24312d" text-anchor="start">1  STOP the task</text>
<circle cx="145" cy="324" r="12" fill="#316b83"/>
<text x="178" y="332" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#24312d" text-anchor="start">2  KEEP CLEAR if safe</text>
<circle cx="145" cy="374" r="12" fill="#b67715"/>
<text x="178" y="382" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#24312d" text-anchor="start">3  TELL the supervisor</text>
<circle cx="145" cy="424" r="12" fill="#a14433"/>
<text x="178" y="432" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#24312d" text-anchor="start">4  WAIT for trained direction</text>
<text x="640" y="567" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#17624f" text-anchor="middle">Never smell • mix • pour • test</text>
<line x1="104" y1="585" x2="1174" y2="585" stroke="#c9d7d0"/>
<text x="104" y="627" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52615b" text-anchor="start">Decide what must happen before a worker handles an unknown hazard.</text>
<text x="1174" y="671" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#52615b" text-anchor="end">CALM 10  •  WORKED EXAMPLE</text>
</svg>