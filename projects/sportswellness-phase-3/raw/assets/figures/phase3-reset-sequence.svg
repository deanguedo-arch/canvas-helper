<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">Notice, reset and return</title><desc id="desc">Notice a specific signal, make an appropriate adjustment, return attention to a task cue, then act and review. The response should fit the situation. A familiar comfortable pause is an option, not an instant off-switch for thoughts or feelings.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">Notice, reset and return</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">A short, adaptable sequence during a suitable pause.</text><rect x="44" y="165" width="812" height="134" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="208" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Notice</text><text x="68" y="252" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Describe the signal or missed information.</text><path d="M450 306 L450 326" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="336" width="812" height="134" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="379" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Adjust</text><text x="68" y="423" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Choose a familiar, appropriate response.</text><path d="M450 477 L450 497" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="507" width="812" height="134" rx="8" fill="#eef6f3" stroke="#d9ded8" stroke-width="2"/><text x="68" y="550" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Refocus</text><text x="68" y="594" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Attend to the cue the next task needs.</text><path d="M450 648 L450 668" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="678" width="812" height="134" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="721" font-size="29" font-weight="750" fill="#154212" text-anchor="start">Act and review</text><text x="68" y="765" font-size="23" font-weight="400" fill="#171b1b" text-anchor="start">Attempt the task; review at a sensible break.</text></g></svg>