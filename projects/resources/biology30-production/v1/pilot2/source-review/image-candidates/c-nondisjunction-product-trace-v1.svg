<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Trace every product to distinguish two error timings</title><desc id="description">Two branching diagrams track one duplicated homologous pair. In the first, homologues fail to separate in meiosis I, and otherwise normal meiosis II yields tracked-copy counts2,2,0,0: two n+1 and two n-1 products. In the second, meiosis I is normal and sisters fail to separate in only one meiosis II cell, giving1,1,2,0: two usual n products, one n+1 and one n-1. Empty circles omit only the tracked chromosome; other chromosomes are present but not drawn. The model describes one isolated error without additional rescue events and does not establish an individual phenotype or prognosis. Aneuploid counts concern one chromosome, not whole-set polyploidy.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Trace every product to distinguish two error timings</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">A single tracked chromosome pair gives different patterns when separation fails.</text><text x="300" y="177" font-size="25" text-anchor="middle" fill="#213033">Meiosis I error</text><circle cx="300" cy="260" r="46" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="280" y1="237.5" x2="292" y2="282.5" stroke="#176e6a" stroke-width="4"/><line x1="292" y1="237.5" x2="280" y2="282.5" stroke="#176e6a" stroke-width="4"/><line x1="308" y1="237.5" x2="320" y2="282.5" stroke="#a55a28" stroke-width="4"/><line x1="320" y1="237.5" x2="308" y2="282.5" stroke="#a55a28" stroke-width="4"/><path d="M275,305 L175,365" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="175" cy="410" r="45" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="156" y1="389.0" x2="168" y2="431.0" stroke="#176e6a" stroke-width="4"/><line x1="168" y1="389.0" x2="156" y2="431.0" stroke="#176e6a" stroke-width="4"/><line x1="182" y1="389.0" x2="194" y2="431.0" stroke="#a55a28" stroke-width="4"/><line x1="194" y1="389.0" x2="182" y2="431.0" stroke="#a55a28" stroke-width="4"/><path d="M325,305 L425,365" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="425" cy="410" r="45" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><path d="M175,456 L102,527" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="102" cy="568" r="42" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="91.0" y1="548.0" x2="91.0" y2="588.0" stroke="#176e6a" stroke-width="4"/><line x1="113.0" y1="548.0" x2="113.0" y2="588.0" stroke="#a55a28" stroke-width="4"/><text x="102" y="640" font-size="20" text-anchor="middle" fill="#213033">2 copies</text><text x="102" y="676" font-size="22" text-anchor="middle" fill="#213033">n + 1</text><path d="M175,456 L234,527" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="234" cy="568" r="42" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="223.0" y1="548.0" x2="223.0" y2="588.0" stroke="#176e6a" stroke-width="4"/><line x1="245.0" y1="548.0" x2="245.0" y2="588.0" stroke="#a55a28" stroke-width="4"/><text x="234" y="640" font-size="20" text-anchor="middle" fill="#213033">2 copies</text><text x="234" y="676" font-size="22" text-anchor="middle" fill="#213033">n + 1</text><path d="M425,456 L366,527" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="366" cy="568" r="42" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="366" y="640" font-size="20" text-anchor="middle" fill="#213033">0 copies</text><text x="366" y="676" font-size="22" text-anchor="middle" fill="#213033">n − 1</text><path d="M425,456 L498,527" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="498" cy="568" r="42" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="498" y="640" font-size="20" text-anchor="middle" fill="#213033">0 copies</text><text x="498" y="676" font-size="22" text-anchor="middle" fill="#213033">n − 1</text><text x="300" y="741" font-size="24" text-anchor="middle" fill="#213033">All four abnormal</text><text x="900" y="177" font-size="25" text-anchor="middle" fill="#213033">One meiosis II error</text><circle cx="900" cy="260" r="46" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="880" y1="237.5" x2="892" y2="282.5" stroke="#176e6a" stroke-width="4"/><line x1="892" y1="237.5" x2="880" y2="282.5" stroke="#176e6a" stroke-width="4"/><line x1="908" y1="237.5" x2="920" y2="282.5" stroke="#a55a28" stroke-width="4"/><line x1="920" y1="237.5" x2="908" y2="282.5" stroke="#a55a28" stroke-width="4"/><path d="M875,305 L775,365" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="775" cy="410" r="45" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="769" y1="389.0" x2="781" y2="431.0" stroke="#176e6a" stroke-width="4"/><line x1="781" y1="389.0" x2="769" y2="431.0" stroke="#176e6a" stroke-width="4"/><path d="M925,305 L1025,365" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="1025" cy="410" r="45" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="1019" y1="389.0" x2="1031" y2="431.0" stroke="#a55a28" stroke-width="4"/><line x1="1031" y1="389.0" x2="1019" y2="431.0" stroke="#a55a28" stroke-width="4"/><path d="M775,456 L702,527" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="702" cy="568" r="42" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="702.0" y1="548.0" x2="702.0" y2="588.0" stroke="#176e6a" stroke-width="4"/><text x="702" y="640" font-size="20" text-anchor="middle" fill="#213033">1 copies</text><text x="702" y="676" font-size="22" text-anchor="middle" fill="#213033">n</text><path d="M775,456 L834,527" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="834" cy="568" r="42" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="834.0" y1="548.0" x2="834.0" y2="588.0" stroke="#176e6a" stroke-width="4"/><text x="834" y="640" font-size="20" text-anchor="middle" fill="#213033">1 copies</text><text x="834" y="676" font-size="22" text-anchor="middle" fill="#213033">n</text><path d="M1025,456 L966,527" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="966" cy="568" r="42" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="955.0" y1="548.0" x2="955.0" y2="588.0" stroke="#a55a28" stroke-width="4"/><line x1="977.0" y1="548.0" x2="977.0" y2="588.0" stroke="#a55a28" stroke-width="4"/><text x="966" y="640" font-size="20" text-anchor="middle" fill="#213033">2 copies</text><text x="966" y="676" font-size="22" text-anchor="middle" fill="#213033">n + 1</text><path d="M1025,456 L1098,527" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="1098" cy="568" r="42" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="1098" y="640" font-size="20" text-anchor="middle" fill="#213033">0 copies</text><text x="1098" y="676" font-size="22" text-anchor="middle" fill="#213033">n − 1</text><text x="900" y="741" font-size="24" text-anchor="middle" fill="#213033">Two usual; two abnormal</text><text x="50" y="817" font-size="21" text-anchor="start" fill="#213033">Only one chromosome pair is tracked; empty circles still contain the other chromosomes.</text><text x="50" y="848" font-size="21" text-anchor="start" fill="#213033">The labels n±1 count all chromosomes relative to a usual gamete. No individual prognosis follows.</text></g></svg>
