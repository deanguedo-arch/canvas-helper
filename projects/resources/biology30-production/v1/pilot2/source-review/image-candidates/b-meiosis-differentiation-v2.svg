<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Follow the divisions, then distinguish differentiation</title><desc id="desc">A branching sequence follows one primary spermatocyte with46 duplicated chromosomes to two secondary spermatocytes each with23 duplicated chromosomes and then four spermatids each with23 unduplicated chromosomes. Meiosis I separates homologues; meiosis II separates sister chromatids without intervening replication. A separate differentiation panel names nuclear compaction, acrosome, flagellum and mitochondrial organization. Differentiation and later maturation support function without another chromosome-number reduction. The circles are symbolic cells, not microscopy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Follow the divisions, then distinguish differentiation</tspan></text><text x="50" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">One primary spermatocyte normally gives four haploid spermatids.</tspan></text><circle cx="720" cy="210" r="48" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="720" y="218" text-anchor="middle" font-size="25" font-weight="700"><tspan x="720" dy="0">2n</tspan></text><text x="55" y="195" text-anchor="start" font-size="21" font-weight="400"><tspan x="55" dy="0">Primary spermatocyte</tspan><tspan x="55" dy="27.720000000000002">46 duplicated chromosomes</tspan></text><circle cx="560" cy="390" r="48" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="560" y="398" text-anchor="middle" font-size="25" font-weight="700"><tspan x="560" dy="0">n</tspan></text><circle cx="900" cy="390" r="48" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="900" y="398" text-anchor="middle" font-size="25" font-weight="700"><tspan x="900" dy="0">n</tspan></text><text x="55" y="375" text-anchor="start" font-size="21" font-weight="400"><tspan x="55" dy="0">Secondary spermatocytes</tspan><tspan x="55" dy="27.720000000000002">23 duplicated chromosomes each</tspan></text><circle cx="480" cy="570" r="48" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="480" y="578" text-anchor="middle" font-size="25" font-weight="700"><tspan x="480" dy="0">n</tspan></text><circle cx="650" cy="570" r="48" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="650" y="578" text-anchor="middle" font-size="25" font-weight="700"><tspan x="650" dy="0">n</tspan></text><circle cx="820" cy="570" r="48" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="820" y="578" text-anchor="middle" font-size="25" font-weight="700"><tspan x="820" dy="0">n</tspan></text><circle cx="990" cy="570" r="48" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="990" y="578" text-anchor="middle" font-size="25" font-weight="700"><tspan x="990" dy="0">n</tspan></text><text x="55" y="555" text-anchor="start" font-size="21" font-weight="400"><tspan x="55" dy="0">Spermatids</tspan><tspan x="55" dy="27.720000000000002">23 unduplicated chromosomes each</tspan></text><path d="M720 261 L560 338" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 261 L900 338" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M560 439 L480 519" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M560 439 L650 519" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 439 L820 519" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 439 L990 519" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="1020" y="310" text-anchor="middle" font-size="23" font-weight="700"><tspan x="1020" dy="0">Meiosis I</tspan></text><text x="1020" y="488" text-anchor="middle" font-size="23" font-weight="700"><tspan x="1020" dy="0">Meiosis II</tspan></text><rect x="50" y="675" width="1100" height="150" fill="#fff7e8" stroke="#617973" stroke-width="2"/><text x="75" y="713" text-anchor="start" font-size="24" font-weight="700"><tspan x="75" dy="0">Differentiation changes form; it does not halve the chromosome count again.</tspan></text><text x="75" y="758" text-anchor="start" font-size="23" font-weight="400"><tspan x="75" dy="0">Compact nucleus • acrosome • flagellum • mitochondrial organization</tspan><tspan x="75" dy="30.360000000000003">Each sperm remains haploid. Later maturation supports functional readiness.</tspan></text><text x="50" y="872" text-anchor="start" font-size="22" font-weight="400"><tspan x="50" dy="0">No DNA replication occurs between meiosis I and meiosis II. Cell sizes are schematic.</tspan></text></g></svg>