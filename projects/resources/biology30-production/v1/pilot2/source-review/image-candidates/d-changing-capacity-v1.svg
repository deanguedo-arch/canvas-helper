<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Changing support can precede a population response</title><desc id="desc">A fictional carrying-capacity line drops from500 to300 after drought changes resource support. A separate population line remains near500 initially and later declines with a lag toward the new support level. The trajectory is illustrative and time intervals are unspecified. The earlier capacity is not permanent, and a response need not be instantaneous. Drought and crowding can interact; evidence about effects per individual at different densities is needed to classify density dependence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Changing support can precede a population response</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Fictional support change from 500 to 300; no measured time series is implied.</tspan></text><path d="M175 550 L1100 550" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="150" y="558" text-anchor="end" font-size="22" font-weight="400"><tspan x="150" dy="0">0</tspan></text><path d="M175 495 L1100 495" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="150" y="503" text-anchor="end" font-size="22" font-weight="400"><tspan x="150" dy="0">100</tspan></text><path d="M175 440 L1100 440" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="150" y="448" text-anchor="end" font-size="22" font-weight="400"><tspan x="150" dy="0">200</tspan></text><path d="M175 385 L1100 385" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="150" y="393" text-anchor="end" font-size="22" font-weight="400"><tspan x="150" dy="0">300</tspan></text><path d="M175 330 L1100 330" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="150" y="338" text-anchor="end" font-size="22" font-weight="400"><tspan x="150" dy="0">400</tspan></text><path d="M175 275 L1100 275" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="150" y="283" text-anchor="end" font-size="22" font-weight="400"><tspan x="150" dy="0">500</tspan></text><path d="M175 220 L1100 220" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="150" y="228" text-anchor="end" font-size="22" font-weight="400"><tspan x="150" dy="0">600</tspan></text><text x="55" y="177" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Individuals</tspan></text><text x="650" y="603" text-anchor="middle" font-size="23" font-weight="400"><tspan x="650" dy="0">Time (schematic; intervals unspecified)</tspan></text><path d="M175 275 L580 275" fill="none" stroke="#ae682b" stroke-width="3" stroke-dasharray="8 6"/><path d="M580 275 L580 385" fill="none" stroke="#ae682b" stroke-width="3" stroke-dasharray="8 6"/><path d="M580 385 L1100 385" fill="none" stroke="#ae682b" stroke-width="3" stroke-dasharray="8 6"/><path d="M175 282 C300 260 420 278 580 275 C650 275 700 282 750 320 C820 370 890 403 970 390 S1050 384 1100 386" fill="none" stroke="#16766b" stroke-width="4"/><text x="335" y="240" text-anchor="middle" font-size="24" font-weight="400"><tspan x="335" dy="0">Earlier K = 500</tspan></text><text x="965" y="357" text-anchor="middle" font-size="24" font-weight="400"><tspan x="965" dy="0">New K = 300</tspan></text><text x="580" y="660" text-anchor="middle" font-size="25" font-weight="700"><tspan x="580" dy="0">Drought changes support conditions</tspan></text><path d="M580 624 L580 557" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M100 720 L190 720" fill="none" stroke="#16766b" stroke-width="3"/><text x="210" y="728" text-anchor="start" font-size="23" font-weight="400"><tspan x="210" dy="0">One possible delayed response</tspan></text><path d="M665 720 L755 720" fill="none" stroke="#ae682b" stroke-width="3" stroke-dasharray="8 6"/><text x="775" y="728" text-anchor="start" font-size="23" font-weight="400"><tspan x="775" dy="0">Model carrying capacity</tspan></text><text x="55" y="792" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Drought can reduce water; crowding changes how that water is shared.</tspan><tspan x="55" dy="31.05">Classify the measured density relationship, not only the event’s name.</tspan></text></g></svg>