<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Use parental phase before counting recombinants</title><desc id="description">The specified heterozygote has AB on one homologue and ab on the other, and the ab/ab tester contributes ab to each offspring. Scored AB40 and ab40 classes are parental; Ab10 and aB10 are recombinant relative to that known phase. Recombination fraction is(10+10)/(40+40+10+10)=20%. Under suitable short-interval assumptions this estimates20centimorgans, not20DNA base pairs. Comparable survival, scoring and gamete representation are necessary. Parental phase, not an intrinsically common phenotype, defines parental classes. A separate denominator example92/1000 yields9.2%. Multiple exchanges can hide some events.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Use parental phase before counting recombinants</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">Exact existing synthetic test-cross counts illustrate the complete denominator.</text><text x="50" y="182" font-size="26" text-anchor="start" fill="#213033">Heterozygous parent: AB / ab. Tester: ab / ab.</text><line x1="120" y1="258" x2="500" y2="258" stroke="#176e6a" stroke-width="7"/><text x="165" y="246" font-size="27" text-anchor="start" fill="#213033">A</text><text x="435" y="246" font-size="27" text-anchor="start" fill="#213033">B</text><line x1="120" y1="325" x2="500" y2="325" stroke="#a55a28" stroke-width="7"/><text x="165" y="313" font-size="27" text-anchor="start" fill="#213033">a</text><text x="435" y="313" font-size="27" text-anchor="start" fill="#213033">b</text><text x="610" y="253" font-size="22" text-anchor="start" fill="#213033">The tester contributes ab to every offspring.</text><text x="610" y="289" font-size="22" text-anchor="start" fill="#213033">Offspring classes reveal the other gamete</text><text x="610" y="325" font-size="22" text-anchor="start" fill="#213033">under equal scoring and survival assumptions.</text><rect x="50" y="419" width="266" height="166" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="183" y="463" font-size="29" text-anchor="middle" fill="#213033">AB</text><text x="183" y="505" font-size="24" text-anchor="middle" fill="#213033">40 offspring</text><text x="183" y="549" font-size="23" text-anchor="middle" fill="#213033">parental</text><rect x="336" y="419" width="266" height="166" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="469" y="463" font-size="29" text-anchor="middle" fill="#213033">ab</text><text x="469" y="505" font-size="24" text-anchor="middle" fill="#213033">40 offspring</text><text x="469" y="549" font-size="23" text-anchor="middle" fill="#213033">parental</text><rect x="622" y="419" width="266" height="166" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="755" y="463" font-size="29" text-anchor="middle" fill="#213033">Ab</text><text x="755" y="505" font-size="24" text-anchor="middle" fill="#213033">10 offspring</text><text x="755" y="549" font-size="23" text-anchor="middle" fill="#213033">recombinant</text><rect x="908" y="419" width="266" height="166" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="1041" y="463" font-size="29" text-anchor="middle" fill="#213033">aB</text><text x="1041" y="505" font-size="24" text-anchor="middle" fill="#213033">10 offspring</text><text x="1041" y="549" font-size="23" text-anchor="middle" fill="#213033">recombinant</text><text x="50" y="664" font-size="22" text-anchor="start" fill="#213033">Recombinant fraction = (10 + 10) / (40 + 40 + 10 + 10) = 20 / 100 = 20%.</text><text x="50" y="707" font-size="22" text-anchor="start" fill="#213033">For a short interval this estimates 20 cM; map units are not DNA base pairs.</text><text x="50" y="750" font-size="22" text-anchor="start" fill="#213033">The stated AB / ab phase defines the classes. Reversing phase changes their classification.</text><text x="50" y="793" font-size="22" text-anchor="start" fill="#213033">The denominator includes all scored offspring. In another sample, 92 / 1000 = 9.2%.</text></g></svg>
