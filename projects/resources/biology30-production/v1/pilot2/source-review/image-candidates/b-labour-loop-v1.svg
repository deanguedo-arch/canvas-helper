<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Labour: a reinforcing loop with an endpoint</title><desc id="desc">Cervical stretch signals the hypothalamus; oxytocin made there is released through posterior pituitary into blood. Uterine contractions can increase cervical stretch. Delivery removes the main stretch stimulus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16766b"/></marker><marker id="bar" viewBox="0 0 10 12" refX="8" refY="6" markerWidth="8" markerHeight="12" orient="auto"><path d="M 8 0 L 8 12" stroke="#985526" stroke-width="2"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="55" text-anchor="start" font-size="32" font-weight="700" fill="#202a2c"><tspan x="55" dy="0">Labour: a reinforcing loop with an endpoint</tspan></text><rect x="60" y="155" width="330" height="105" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="225.0" y="199.5" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="225.0" dy="0">Cervical stretch</tspan><tspan x="225.0" dy="31.200000000000003">during labour</tspan></text><rect x="780" y="155" width="360" height="105" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="960.0" y="199.5" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="960.0" dy="0">Hypothalamic neurons</tspan><tspan x="960.0" dy="31.200000000000003">make oxytocin</tspan></text><path d="M390 207 H775" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="585" y="174" text-anchor="middle" font-size="22" font-weight="400" fill="#202a2c"><tspan x="585" dy="0">Sensory signals</tspan></text><path d="M960 260 V355" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="1015" y="306" text-anchor="start" font-size="20" font-weight="400" fill="#202a2c"><tspan x="1015" dy="0">stored in</tspan></text><rect x="780" y="360" width="360" height="110" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="960.0" y="407.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="960.0" dy="0">Posterior pituitary</tspan><tspan x="960.0" dy="31.200000000000003">releases oxytocin</tspan></text><path d="M960 470 V570" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="1007" y="522" text-anchor="start" font-size="21" font-weight="400" fill="#202a2c"><tspan x="1007" dy="0">in blood</tspan></text><rect x="780" y="575" width="360" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="960.0" y="617.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="960.0" dy="0">Responsive uterine tissue</tspan><tspan x="960.0" dy="31.200000000000003">contracts</tspan></text><path d="M780 625 H225 V267" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="241" y="470" text-anchor="start" font-size="23" font-weight="400" fill="#202a2c"><tspan x="241" dy="0">Contractions can increase</tspan><tspan x="241" dy="29.900000000000002">pressure and stretch</tspan><tspan x="241" dy="29.900000000000002">at the cervix.</tspan></text><text x="60" y="748" text-anchor="start" font-size="25" font-weight="700" fill="#202a2c"><tspan x="60" dy="0">Delivery removes the main stretch stimulus for this loop.</tspan></text><text x="60" y="806" text-anchor="start" font-size="22" font-weight="400" fill="#202a2c"><tspan x="60" dy="0">This is one reinforcing mechanism, not a complete explanation of labour onset.</tspan><tspan x="60" dy="28.6">Other signals and changing tissue responsiveness also matter.</tspan></text></g></svg>