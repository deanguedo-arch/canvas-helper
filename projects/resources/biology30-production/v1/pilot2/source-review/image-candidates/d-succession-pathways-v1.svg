<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Compare starting conditions and possible community pathways</title><desc id="desc">Two original ground-profile schematics distinguish newly exposed rock without developed soil from a disturbed site retaining soil, roots or survivors. Both feed into colonization, interactions, changing conditions and later disturbance, with branching possible community outcomes. Open and wooded communities are illustrative possibilities, not a fixed sequence or guaranteed permanent climax. Timescales and routes depend on conditions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Compare starting conditions and possible community pathways</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Starting conditions matter more than the disturbance’s name.</tspan></text><text x="55" y="190" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">Primary example: newly exposed rock</tspan></text><rect x="55" y="220" width="350" height="180" fill="#fff" stroke="#627b75" stroke-width="2"/><path d="M55 400 L55 355 L110 330 L170 362 L230 327 L290 348 L355 335 L405 362 V400Z" fill="#bbc0be" stroke="#75817b" stroke-width="2"/><text x="230" y="448" text-anchor="middle" font-size="21" font-weight="400"><tspan x="230" dy="0">Developed soil absent</tspan></text><path d="M420 325 L575 325" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="475" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">Secondary example: soil remains</tspan></text><rect x="55" y="505" width="350" height="180" fill="#fff" stroke="#627b75" stroke-width="2"/><rect x="55" y="615" width="350" height="70" fill="#bd9872" stroke="#627b75" stroke-width="2"/><path d="M95 630 L95 560" fill="none" stroke="#566c40" stroke-width="3"/><path d="M95 590 L77 569" fill="none" stroke="#566c40" stroke-width="3"/><path d="M95 597 L113 575" fill="none" stroke="#566c40" stroke-width="3"/><path d="M95 630 L78 659" fill="none" stroke="#6f5039" stroke-width="3"/><path d="M195 630 L195 560" fill="none" stroke="#566c40" stroke-width="3"/><path d="M195 590 L177 569" fill="none" stroke="#566c40" stroke-width="3"/><path d="M195 597 L213 575" fill="none" stroke="#566c40" stroke-width="3"/><path d="M195 630 L178 659" fill="none" stroke="#6f5039" stroke-width="3"/><path d="M310 630 L310 560" fill="none" stroke="#566c40" stroke-width="3"/><path d="M310 590 L292 569" fill="none" stroke="#566c40" stroke-width="3"/><path d="M310 597 L328 575" fill="none" stroke="#566c40" stroke-width="3"/><path d="M310 630 L293 659" fill="none" stroke="#6f5039" stroke-width="3"/><text x="230" y="733" text-anchor="middle" font-size="21" font-weight="400"><tspan x="230" dy="0">Soil, roots and survivors may persist</tspan></text><path d="M420 610 L575 610" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="310" width="220" height="280" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="710" y="363" text-anchor="middle" font-size="22" font-weight="400"><tspan x="710" dy="0">Colonization</tspan><tspan x="710" dy="29.700000000000003">Interactions</tspan><tspan x="710" dy="29.700000000000003">Changing conditions</tspan><tspan x="710" dy="29.700000000000003">Later disturbance</tspan></text><path d="M835 390 L975 265" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M835 510 L975 640" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="1080" y="223" text-anchor="middle" font-size="22" font-weight="400"><tspan x="1080" dy="0">Possible</tspan><tspan x="1080" dy="29.700000000000003">open community</tspan></text><text x="1080" y="691" text-anchor="middle" font-size="22" font-weight="400"><tspan x="1080" dy="0">Possible</tspan><tspan x="1080" dy="29.700000000000003">wooded community</tspan></text><text x="55" y="830" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Pathways and timescales vary; neither starting condition guarantees one permanent climax.</tspan></text></g></svg>