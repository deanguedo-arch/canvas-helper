<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Keep uncertainty between hormone samples visible</title><desc id="desc">Three fictional samples on a zero-to10 relative-index axis occur at day2/index2,day4/index8 andday6/index4. Two different possible paths pass through all three points but place the unsampled maximum on different sides of day4. The lines are possibilities, not measured interpolation. This separate teaching example does not show the answer to the required six-day graph. More frequent sampling can improve timing resolution. Equal relative indices from different hormones do not establish equal concentrations or predict an individual fertile interval.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Keep uncertainty between hormone samples visible</tspan></text><text x="50" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Two possible paths can pass through the same sparse observations.</tspan></text><text x="50" y="165" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Hormone relative index (illustrative)</tspan></text><path d="M180 570 L1100 570" fill="none" stroke="#d4ddda" stroke-width="3"/><text x="155" y="578" text-anchor="end" font-size="22" font-weight="400"><tspan x="155" dy="0">0</tspan></text><path d="M180 502 L1100 502" fill="none" stroke="#d4ddda" stroke-width="3"/><text x="155" y="510" text-anchor="end" font-size="22" font-weight="400"><tspan x="155" dy="0">2</tspan></text><path d="M180 434 L1100 434" fill="none" stroke="#d4ddda" stroke-width="3"/><text x="155" y="442" text-anchor="end" font-size="22" font-weight="400"><tspan x="155" dy="0">4</tspan></text><path d="M180 366 L1100 366" fill="none" stroke="#d4ddda" stroke-width="3"/><text x="155" y="374" text-anchor="end" font-size="22" font-weight="400"><tspan x="155" dy="0">6</tspan></text><path d="M180 298 L1100 298" fill="none" stroke="#d4ddda" stroke-width="3"/><text x="155" y="306" text-anchor="end" font-size="22" font-weight="400"><tspan x="155" dy="0">8</tspan></text><path d="M180 230 L1100 230" fill="none" stroke="#d4ddda" stroke-width="3"/><text x="155" y="238" text-anchor="end" font-size="22" font-weight="400"><tspan x="155" dy="0">10</tspan></text><text x="180" y="610" text-anchor="middle" font-size="23" font-weight="400"><tspan x="180" dy="0">2</tspan></text><text x="640" y="610" text-anchor="middle" font-size="23" font-weight="400"><tspan x="640" dy="0">4</tspan></text><text x="1100" y="610" text-anchor="middle" font-size="23" font-weight="400"><tspan x="1100" dy="0">6</tspan></text><text x="660" y="651" text-anchor="middle" font-size="23" font-weight="400"><tspan x="660" dy="0">Cycle day in a fictional sampling interval</tspan></text><path d="M180 502 Q410 230 640 298 Q870 385 1100 434" fill="none" stroke="#16766b" stroke-width="4"/><path d="M180 502 Q410 485 640 298 Q870 135 1100 434" fill="none" stroke="#ae682b" stroke-width="4" stroke-dasharray="10 7"/><circle cx="180" cy="502" r="7" fill="#202a2c" stroke="#617973" stroke-width="2"/><circle cx="640" cy="298" r="7" fill="#202a2c" stroke="#617973" stroke-width="2"/><circle cx="1100" cy="434" r="7" fill="#202a2c" stroke="#617973" stroke-width="2"/><text x="50" y="716" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Dots: sampled indices at days 2, 4 and 6. Lines: two possible unmeasured paths.</tspan></text><text x="50" y="773" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Sampling supports event order and measured comparisons, not the exact peak between days.</tspan><tspan x="50" dy="30.360000000000003">Relative indices for different hormones do not share a concentration unit.</tspan><tspan x="50" dy="30.360000000000003">This is a separate illustration, not the answer graph for the required six-day dataset.</tspan></text></g></svg>