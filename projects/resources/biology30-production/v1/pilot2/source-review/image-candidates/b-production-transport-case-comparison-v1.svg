<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Compare tissue evidence before naming the cause</title><desc id="desc">A fictional table compares cases P and T. P has reduced germ-cell observations, altered support observations and an open model passage; T retains germ-cell and support observations but has an obstructed model passage. Both show reduced downstream delivery. This separates production/support from transport explanations and motivates an upstream-versus-downstream observation. Signal presence alone does not prove delivery. The illustration provides a model comparison rather than an individual diagnosis, physical laboratory certification or evidence of live collaboration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Compare tissue evidence before naming the cause</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Fictional tissue observations help distinguish production from transport.</tspan></text><text x="65" y="210" text-anchor="start" font-size="26" font-weight="700"><tspan x="65" dy="0">Observation</tspan></text><text x="460" y="210" text-anchor="start" font-size="26" font-weight="700"><tspan x="460" dy="0">Case P</tspan></text><text x="810" y="210" text-anchor="start" font-size="26" font-weight="700"><tspan x="810" dy="0">Case T</tspan></text><path d="M50 253 L1150 253" fill="none" stroke="#c2ceca" stroke-width="3"/><text x="65" y="295" text-anchor="start" font-size="23" font-weight="400"><tspan x="65" dy="0">Germ-cell observations</tspan></text><text x="460" y="295" text-anchor="start" font-size="23" font-weight="400"><tspan x="460" dy="0">Reduced</tspan></text><text x="810" y="295" text-anchor="start" font-size="23" font-weight="400"><tspan x="810" dy="0">Retained</tspan></text><path d="M50 343 L1150 343" fill="none" stroke="#c2ceca" stroke-width="3"/><text x="65" y="385" text-anchor="start" font-size="23" font-weight="400"><tspan x="65" dy="0">Support-cell observations</tspan></text><text x="460" y="385" text-anchor="start" font-size="23" font-weight="400"><tspan x="460" dy="0">Altered</tspan></text><text x="810" y="385" text-anchor="start" font-size="23" font-weight="400"><tspan x="810" dy="0">Retained</tspan></text><path d="M50 433 L1150 433" fill="none" stroke="#c2ceca" stroke-width="3"/><text x="65" y="475" text-anchor="start" font-size="23" font-weight="400"><tspan x="65" dy="0">Transport passage</tspan></text><text x="460" y="475" text-anchor="start" font-size="23" font-weight="400"><tspan x="460" dy="0">Open in model</tspan></text><text x="810" y="475" text-anchor="start" font-size="23" font-weight="400"><tspan x="810" dy="0">Obstructed in model</tspan></text><path d="M50 523 L1150 523" fill="none" stroke="#c2ceca" stroke-width="3"/><text x="65" y="565" text-anchor="start" font-size="23" font-weight="400"><tspan x="65" dy="0">Downstream cell delivery</tspan></text><text x="460" y="565" text-anchor="start" font-size="23" font-weight="400"><tspan x="460" dy="0">Reduced</tspan></text><text x="810" y="565" text-anchor="start" font-size="23" font-weight="400"><tspan x="810" dy="0">Reduced</tspan></text><text x="50" y="704" text-anchor="start" font-size="25" font-weight="700"><tspan x="50" dy="0">The same downstream result can arise through different pathways.</tspan></text><text x="50" y="752" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Inspect observations upstream and downstream of the proposed obstruction.</tspan><tspan x="50" dy="30.360000000000003">Signal presence does not by itself demonstrate successful cell delivery.</tspan></text><text x="50" y="851" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">This is a supplied reasoning model, not a diagnostic test or a claim about a person.</tspan></text></g></svg>