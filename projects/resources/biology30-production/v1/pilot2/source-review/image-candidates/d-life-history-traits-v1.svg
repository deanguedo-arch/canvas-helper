<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Compare life-history traits and their trade-offs</title><desc id="desc">Three continua compare age at first breeding, offspring number per event and investment per offspring. Earlier breeding, more offspring and lower per-offspring investment are often r-associated tendencies; later breeding, fewer offspring and greater investment are often K-associated. These are historical tendencies, not universal boxes. Species can combine traits, and measured survival, recruitment and conditions are needed for recovery predictions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Compare life-history traits and their trade-offs</tspan></text><text x="55" y="112" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Historical r/K labels describe tendencies, not two universal categories.</tspan></text><text x="345" y="196" text-anchor="middle" font-size="26" font-weight="700"><tspan x="345" dy="0">Often r-associated</tspan></text><text x="925" y="196" text-anchor="middle" font-size="26" font-weight="700"><tspan x="925" dy="0">Often K-associated</tspan></text><text x="55" y="260" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Age at first breeding</tspan></text><text x="345" y="313" text-anchor="middle" font-size="25" font-weight="400"><tspan x="345" dy="0">Earlier</tspan></text><path d="M465 305 L805 305" fill="none" stroke="#708880" stroke-width="3"/><text x="635" y="297" text-anchor="middle" font-size="20" font-weight="400"><tspan x="635" dy="0">Continuum</tspan></text><text x="925" y="313" text-anchor="middle" font-size="25" font-weight="400"><tspan x="925" dy="0">Later</tspan></text><text x="55" y="380" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Offspring per event</tspan></text><text x="345" y="433" text-anchor="middle" font-size="25" font-weight="400"><tspan x="345" dy="0">More</tspan></text><path d="M465 425 L805 425" fill="none" stroke="#708880" stroke-width="3"/><text x="635" y="417" text-anchor="middle" font-size="20" font-weight="400"><tspan x="635" dy="0">Continuum</tspan></text><text x="925" y="433" text-anchor="middle" font-size="25" font-weight="400"><tspan x="925" dy="0">Fewer</tspan></text><text x="55" y="500" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Investment per offspring</tspan></text><text x="345" y="553" text-anchor="middle" font-size="25" font-weight="400"><tspan x="345" dy="0">Lower</tspan></text><path d="M465 545 L805 545" fill="none" stroke="#708880" stroke-width="3"/><text x="635" y="537" text-anchor="middle" font-size="20" font-weight="400"><tspan x="635" dy="0">Continuum</tspan></text><text x="925" y="553" text-anchor="middle" font-size="25" font-weight="400"><tspan x="925" dy="0">Higher</tspan></text><rect x="55" y="645" width="1090" height="145" fill="#fff7e8" stroke="#627b75" stroke-width="2"/><text x="85" y="684" text-anchor="start" font-size="27" font-weight="700"><tspan x="85" dy="0">A species can combine traits from both ends.</tspan></text><text x="85" y="734" text-anchor="start" font-size="23" font-weight="400"><tspan x="85" dy="0">Measure survival, recruitment and context before predicting recovery.</tspan><tspan x="85" dy="31.05">Greater investment in one function can leave fewer resources for another.</tspan></text><text x="55" y="854" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Neither label alone predicts population growth, carrying capacity or extinction risk.</tspan></text></g></svg>