<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Follow the two chromatids that exchange matching segments</title><desc id="description">Four aligned linear tracks represent two replicated homologues: AB/AB and ab/ab. Only the two middle tracks, nonsisters from different homologues, exchange corresponding distal segments between the A and B loci. Products are AB,Ab,aB,ab, with two parental and two recombinant chromatids. Color changes trace reciprocal segment origin without inventing new alleles. Dots mark schematic centromeres and the dashed line marks a matched exchange position. These linear identity tracks do not depict the three-dimensional pairing or chiasma itself and do not imply that all four chromatids exchange in one event.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Follow the two chromatids that exchange matching segments</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">One homologous pair after replication contains four chromatids; they do not all blend together.</text><text x="50" y="180" font-size="24" text-anchor="start" fill="#213033">Before: a paired set of homologues, four chromatids</text><line x1="160" y1="236" x2="445" y2="236" stroke="#176e6a" stroke-width="9"/><circle cx="190" cy="236" r="8" fill="#176e6a" stroke="#51716e" stroke-width="2"/><text x="245" y="219" font-size="22" text-anchor="start" fill="#213033">A</text><text x="393" y="219" font-size="22" text-anchor="start" fill="#213033">B</text><line x1="160" y1="299" x2="445" y2="299" stroke="#176e6a" stroke-width="9"/><circle cx="190" cy="299" r="8" fill="#176e6a" stroke="#51716e" stroke-width="2"/><text x="245" y="282" font-size="22" text-anchor="start" fill="#213033">A</text><text x="393" y="282" font-size="22" text-anchor="start" fill="#213033">B</text><line x1="160" y1="362" x2="445" y2="362" stroke="#a55a28" stroke-width="9"/><circle cx="190" cy="362" r="8" fill="#a55a28" stroke="#51716e" stroke-width="2"/><text x="245" y="345" font-size="22" text-anchor="start" fill="#213033">a</text><text x="393" y="345" font-size="22" text-anchor="start" fill="#213033">b</text><line x1="160" y1="425" x2="445" y2="425" stroke="#a55a28" stroke-width="9"/><circle cx="190" cy="425" r="8" fill="#a55a28" stroke="#51716e" stroke-width="2"/><text x="245" y="408" font-size="22" text-anchor="start" fill="#213033">a</text><text x="393" y="408" font-size="22" text-anchor="start" fill="#213033">b</text><line x1="325" y1="206" x2="325" y2="452" stroke="#213033" stroke-width="2" stroke-dasharray="7 6"/><text x="75" y="495" font-size="22" text-anchor="start" fill="#213033">Matching locus positions align.</text><path d="M493,328 L640,328" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><text x="516" y="282" font-size="22" text-anchor="start" fill="#213033">Exchange</text><text x="496" y="391" font-size="20" text-anchor="start" fill="#213033">only rows 2/3</text><line x1="705" y1="236" x2="870" y2="236" stroke="#176e6a" stroke-width="9"/><line x1="870" y1="236" x2="1090" y2="236" stroke="#176e6a" stroke-width="9"/><circle cx="735" cy="236" r="8" fill="#176e6a" stroke="#51716e" stroke-width="2"/><text x="788" y="219" font-size="22" text-anchor="start" fill="#213033">A</text><text x="1033" y="219" font-size="22" text-anchor="start" fill="#213033">B</text><line x1="705" y1="299" x2="870" y2="299" stroke="#176e6a" stroke-width="9"/><line x1="870" y1="299" x2="1090" y2="299" stroke="#a55a28" stroke-width="9"/><circle cx="735" cy="299" r="8" fill="#176e6a" stroke="#51716e" stroke-width="2"/><text x="788" y="282" font-size="22" text-anchor="start" fill="#213033">A</text><text x="1033" y="282" font-size="22" text-anchor="start" fill="#213033">b</text><line x1="705" y1="362" x2="870" y2="362" stroke="#a55a28" stroke-width="9"/><line x1="870" y1="362" x2="1090" y2="362" stroke="#176e6a" stroke-width="9"/><circle cx="735" cy="362" r="8" fill="#a55a28" stroke="#51716e" stroke-width="2"/><text x="788" y="345" font-size="22" text-anchor="start" fill="#213033">a</text><text x="1033" y="345" font-size="22" text-anchor="start" fill="#213033">B</text><line x1="705" y1="425" x2="870" y2="425" stroke="#a55a28" stroke-width="9"/><line x1="870" y1="425" x2="1090" y2="425" stroke="#a55a28" stroke-width="9"/><circle cx="735" cy="425" r="8" fill="#a55a28" stroke="#51716e" stroke-width="2"/><text x="788" y="408" font-size="22" text-anchor="start" fill="#213033">a</text><text x="1033" y="408" font-size="22" text-anchor="start" fill="#213033">b</text><text x="704" y="180" font-size="24" text-anchor="start" fill="#213033">After one balanced exchange</text><text x="50" y="589" font-size="23" text-anchor="start" fill="#213033">The two participating chromatids are nonsisters: one from each homologue.</text><text x="50" y="635" font-size="23" text-anchor="start" fill="#213033">Rows 1 and 4 retain the parental combinations; rows 2 and 3 are recombinant.</text><text x="50" y="681" font-size="23" text-anchor="start" fill="#213033">Alleles are rearranged; a new allele sequence is not required for this model.</text><text x="50" y="727" font-size="23" text-anchor="start" fill="#213033">The straight tracks show segment identity, not the three-dimensional shape of synapsis.</text><text x="50" y="773" font-size="23" text-anchor="start" fill="#213033">Dots locate schematic centromeres; the dashed line marks the matched exchange position.</text></g></svg>
