<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title description">
  <title id="title">Male reproductive structures and connected ducts</title>
  <desc id="description">Original simplified left-facing side view of one side of the paired system, with ducts separated in the drawing for visibility. The epididymal head lies near the upper testis, its body follows the posterior surface, and its lower tail continues into the ascending vas deferens. The vas curves around the pale bladder landmark and joins the seminal-vesicle duct. The resulting ejaculatory duct enters the urethra within the prostate. The urethra continues through the penis. A bulbourethral gland joins the urethra below the prostate. The testis lies inside the scrotum. Relative sizes and tissue detail are schematic.</desc>
