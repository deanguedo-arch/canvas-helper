<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Keep base pairing separate from strand direction</title><desc id="description">A DNA nucleotide comprises phosphate, deoxyribose sugar and one base A,T,G or C. The first schematic shows these components without representing full atomic chemistry. Two aligned strands have covalent backbones, abstract sugar/backbone nodes and complementary A–T,T–A,G–C,C–G base pairs. Dashed interstrand connections denote hydrogen-bond relationships without counting individual hydrogen bonds. Ends are5′ left/3′ right on the upper strand and3′ left/5′ right below, so the strands are antiparallel. The complement of5′-ATGC-3′ aligns as3′-TACG-5′ and rewrites in its own5′→3′ direction as5′-GCAT-3′. Direction reflects chemical ends, not page placement. Helical twist, atoms and exact bond counts are intentionally omitted; separating base pairs does not mean cutting every backbone linkage.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Keep base pairing separate from strand direction</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">A deliberately abstract topology diagram shows components and bond relationships.</text><text x="50" y="179" font-size="26" text-anchor="start" fill="#213033">A nucleotide: phosphate — deoxyribose sugar — one base</text><rect x="60" y="215" width="240" height="75" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="180" y="263" font-size="25" text-anchor="middle" fill="#213033">Phosphate</text><rect x="360" y="215" width="240" height="75" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="480" y="263" font-size="25" text-anchor="middle" fill="#213033">Sugar</text><rect x="670" y="215" width="240" height="75" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="790" y="263" font-size="25" text-anchor="middle" fill="#213033">A, T, G or C</text><line x1="300" y1="252" x2="360" y2="252" stroke="#213033" stroke-width="3"/><line x1="600" y1="252" x2="670" y2="252" stroke="#213033" stroke-width="3"/><text x="50" y="350" font-size="23" text-anchor="start" fill="#213033">Backbone bonds along each strand are covalent; base pairs connect between strands.</text><circle cx="345" cy="409" r="14" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="345" cy="577" r="14" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><line x1="345" y1="423" x2="345" y2="453" stroke="#213033" stroke-width="2"/><line x1="345" y1="532" x2="345" y2="563" stroke="#213033" stroke-width="2"/><text x="345" y="481" font-size="28" text-anchor="middle" fill="#213033">A</text><text x="345" y="529" font-size="28" text-anchor="middle" fill="#213033">T</text><line x1="345" y1="486" x2="345" y2="505" stroke="#a55a28" stroke-width="3" stroke-dasharray="4 4"/><line x1="360" y1="409" x2="488" y2="409" stroke="#213033" stroke-width="3"/><line x1="360" y1="577" x2="488" y2="577" stroke="#213033" stroke-width="3"/><circle cx="503" cy="409" r="14" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="503" cy="577" r="14" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><line x1="503" y1="423" x2="503" y2="453" stroke="#213033" stroke-width="2"/><line x1="503" y1="532" x2="503" y2="563" stroke="#213033" stroke-width="2"/><text x="503" y="481" font-size="28" text-anchor="middle" fill="#213033">T</text><text x="503" y="529" font-size="28" text-anchor="middle" fill="#213033">A</text><line x1="503" y1="486" x2="503" y2="505" stroke="#a55a28" stroke-width="3" stroke-dasharray="4 4"/><line x1="518" y1="409" x2="646" y2="409" stroke="#213033" stroke-width="3"/><line x1="518" y1="577" x2="646" y2="577" stroke="#213033" stroke-width="3"/><circle cx="661" cy="409" r="14" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="661" cy="577" r="14" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><line x1="661" y1="423" x2="661" y2="453" stroke="#213033" stroke-width="2"/><line x1="661" y1="532" x2="661" y2="563" stroke="#213033" stroke-width="2"/><text x="661" y="481" font-size="28" text-anchor="middle" fill="#213033">G</text><text x="661" y="529" font-size="28" text-anchor="middle" fill="#213033">C</text><line x1="661" y1="486" x2="661" y2="505" stroke="#a55a28" stroke-width="3" stroke-dasharray="4 4"/><line x1="676" y1="409" x2="804" y2="409" stroke="#213033" stroke-width="3"/><line x1="676" y1="577" x2="804" y2="577" stroke="#213033" stroke-width="3"/><circle cx="819" cy="409" r="14" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="819" cy="577" r="14" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><line x1="819" y1="423" x2="819" y2="453" stroke="#213033" stroke-width="2"/><line x1="819" y1="532" x2="819" y2="563" stroke="#213033" stroke-width="2"/><text x="819" y="481" font-size="28" text-anchor="middle" fill="#213033">C</text><text x="819" y="529" font-size="28" text-anchor="middle" fill="#213033">G</text><line x1="819" y1="486" x2="819" y2="505" stroke="#a55a28" stroke-width="3" stroke-dasharray="4 4"/><text x="222" y="420" font-size="28" text-anchor="start" fill="#213033">5′</text><text x="917" y="420" font-size="28" text-anchor="start" fill="#213033">3′</text><text x="222" y="588" font-size="28" text-anchor="start" fill="#213033">3′</text><text x="917" y="588" font-size="28" text-anchor="start" fill="#213033">5′</text><text x="990" y="510" font-size="20" text-anchor="start" fill="#213033">H bonds</text><line x1="962" y1="505" x2="830" y2="493" stroke="#a55a28" stroke-width="2"/><text x="50" y="685" font-size="22" text-anchor="start" fill="#213033">Aligned complement: 5′-ATGC-3′ pairs with 3′-TACG-5′.</text><text x="50" y="728" font-size="22" text-anchor="start" fill="#213033">The complementary strand written in its own 5′→3′ direction is 5′-GCAT-3′.</text><text x="50" y="771" font-size="22" text-anchor="start" fill="#213033">5′ and 3′ name chemical ends, not permanent left/right positions; new synthesis extends a 3′ end.</text><text x="50" y="814" font-size="22" text-anchor="start" fill="#213033">This topology model omits atoms, helical twist and exact hydrogen-bond counts.</text></g></svg>
