<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Compare observations with their own model expectation</title><desc id="desc">Observed genotype fractions 0.45, 0.45 and 0.10 are compared with expected fractions 0.455625, 0.438750 and 0.105625 calculated from p 0.675. Both sets sum to one. Small differences alone do not identify a cause.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="55" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">Compare observations with their own model expectation</tspan></text><text x="55" y="110" text-anchor="start" font-size="24" font-weight="400"><tspan x="55" dy="0">Observed counts: 45 AA, 45 Aa, 10 aa.  Direct p = 135 / 200 = 0.675.</tspan></text><text x="55" y="153" text-anchor="start" font-size="22" font-weight="400"><tspan x="55" dy="0">Expected values use this sample’s p and q, not a previous sample’s frequencies.</tspan></text><path d="M150 545 H1100" stroke="#d6dfdd"/><text x="125" y="552" text-anchor="end" font-size="21" font-weight="400"><tspan x="125" dy="0">0.0</tspan></text><path d="M150 480 H1100" stroke="#d6dfdd"/><text x="125" y="487" text-anchor="end" font-size="21" font-weight="400"><tspan x="125" dy="0">0.1</tspan></text><path d="M150 415 H1100" stroke="#d6dfdd"/><text x="125" y="422" text-anchor="end" font-size="21" font-weight="400"><tspan x="125" dy="0">0.2</tspan></text><path d="M150 350 H1100" stroke="#d6dfdd"/><text x="125" y="357" text-anchor="end" font-size="21" font-weight="400"><tspan x="125" dy="0">0.3</tspan></text><path d="M150 285 H1100" stroke="#d6dfdd"/><text x="125" y="292" text-anchor="end" font-size="21" font-weight="400"><tspan x="125" dy="0">0.4</tspan></text><path d="M150 220 H1100" stroke="#d6dfdd"/><text x="125" y="227" text-anchor="end" font-size="21" font-weight="400"><tspan x="125" dy="0">0.5</tspan></text><text x="150" y="195" text-anchor="start" font-size="22" font-weight="400"><tspan x="150" dy="0">Genotype frequency</tspan></text><rect x="205" y="252.5" width="70" height="292.5" fill="#c4e2db" stroke="#718680" stroke-width="2"/><rect x="285" y="248.84374999999994" width="70" height="296.15625000000006" fill="#f1d7a9" stroke="#718680" stroke-width="2"/><text x="280" y="581" text-anchor="middle" font-size="25" font-weight="700"><tspan x="280" dy="0">AA</tspan></text><rect x="525" y="252.5" width="70" height="292.5" fill="#c4e2db" stroke="#718680" stroke-width="2"/><rect x="605" y="259.8125" width="70" height="285.1875" fill="#f1d7a9" stroke="#718680" stroke-width="2"/><text x="600" y="581" text-anchor="middle" font-size="25" font-weight="700"><tspan x="600" dy="0">Aa</tspan></text><rect x="845" y="480.0" width="70" height="65.0" fill="#c4e2db" stroke="#718680" stroke-width="2"/><rect x="925" y="476.34375" width="70" height="68.65625" fill="#f1d7a9" stroke="#718680" stroke-width="2"/><text x="920" y="581" text-anchor="middle" font-size="25" font-weight="700"><tspan x="920" dy="0">aa</tspan></text><rect x="290" y="627" width="25" height="25" fill="#c4e2db" stroke="#718680" stroke-width="2"/><text x="330" y="649" text-anchor="start" font-size="22" font-weight="400"><tspan x="330" dy="0">Observed</tspan></text><rect x="600" y="627" width="25" height="25" fill="#f1d7a9" stroke="#718680" stroke-width="2"/><text x="640" y="649" text-anchor="start" font-size="22" font-weight="400"><tspan x="640" dy="0">Expected under the model</tspan></text><text x="55" y="713" text-anchor="start" font-size="25" font-weight="400"><tspan x="55" dy="0">Exact observed:    AA 0.45        Aa 0.45        aa 0.10</tspan></text><text x="55" y="754" text-anchor="start" font-size="25" font-weight="400"><tspan x="55" dy="0">Exact expected:    AA 0.455625  Aa 0.438750  aa 0.105625</tspan></text><text x="55" y="825" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Small differences alone do not identify a cause; evaluate sampling and model conditions.</tspan></text></g></svg>