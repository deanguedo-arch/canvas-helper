pan x="855" dy="0">Blastocyst: organized, with a cavity</tspan></text><path d="M417 648 L726 648" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="863" text-anchor="start" font-size="22" font-weight="400"><tspan x="50" dy="0">Cells and stage sizes are schematic; the blastocyst drawing is not a cell-count assay.</tspan></text></g></svg>