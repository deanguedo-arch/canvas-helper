<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">More cells first; then a change in organization</title><desc id="desc">Three similar-sized surrounding coats contain2,4 and8 schematic blastomeres; cell number increases as each cell becomes smaller during early cleavage. Below, a morula is a compact cluster and a blastocyst has an outer trophoblast, an inner cell mass and a fluid-filled cavity. The blastocyst is an organizational comparison, not an exact total cell count. Inner cell mass contributes to the embryo proper; trophoblast contributes to support tissues and the placental interface. Early cell division is distinguished from later growth; stage drawings are schematic rather than photographs or measured size data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">More cells first; then a change in organization</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Early cleavage partitions existing cytoplasm into progressively smaller cells.</tspan></text><circle cx="215" cy="285" r="95" fill="#fff2db" stroke="#45625c" stroke-width="2"/><circle cx="257.0" cy="285.0" r="40" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="173.0" cy="285.0" r="40" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="215" y="425" text-anchor="middle" font-size="25" font-weight="700"><tspan x="215" dy="0">2 blastomeres</tspan></text><circle cx="600" cy="285" r="95" fill="#fff2db" stroke="#45625c" stroke-width="2"/><circle cx="642.0" cy="285.0" r="32" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="600.0" cy="327.0" r="32" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="558.0" cy="285.0" r="32" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="600.0" cy="243.0" r="32" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="600" y="425" text-anchor="middle" font-size="25" font-weight="700"><tspan x="600" dy="0">4 blastomeres</tspan></text><circle cx="985" cy="285" r="95" fill="#fff2db" stroke="#45625c" stroke-width="2"/><circle cx="1039.0" cy="285.0" r="24" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="1023.1837661840735" cy="323.18376618407353" r="24" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="985.0" cy="339.0" r="24" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="946.8162338159265" cy="323.1837661840736" r="24" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="931.0" cy="285.0" r="24" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="946.8162338159265" cy="246.81623381592644" r="24" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="985.0" cy="231.0" r="24" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="1023.1837661840735" cy="246.8162338159264" r="24" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="985" y="425" text-anchor="middle" font-size="25" font-weight="700"><tspan x="985" dy="0">8 blastomeres</tspan></text><path d="M330 285 L480 285" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M715 285 L865 285" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><circle cx="300" cy="648" r="90" fill="#fff2db" stroke="#45625c" stroke-width="2"/><circle cx="255" cy="603" r="18" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="285" cy="603" r="18" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="315" cy="603" r="18" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><circle cx="345" cy="603" r="18" fill="#eaf3f0" stroke="#45625c" stro