<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Read the standard code using oriented RNA codons</title><desc id="description">A complete64-codon standard RNA lookup is arranged by first and second base U,C,A,G, with third base U,C,A,G listed within each cell. Every full codon is written5′→3′. Amino acids use standard three-letter names; UAA,UAG,UGA are explicitly termination signals, not amino acids. AUG gives methionine and commonly serves as the start in the stated classroom model. Several codons can specify one amino acid. The table does not determine a fragment’s reading frame, establish every AUG as an initiation site, or cover nonstandard genetic-code exceptions. Complete lookup: UUU  Phe; UUC  Phe; UUA  Leu; UUG  Leu; UCU  Ser; UCC  Ser; UCA  Ser; UCG  Ser; UAU  Tyr; UAC  Tyr; UAA  STOP; UAG  STOP; UGU  Cys; UGC  Cys; UGA  STOP; UGG  Trp; CUU  Leu; CUC  Leu; CUA  Leu; CUG  Leu; CCU  Pro; CCC  Pro; CCA  Pro; CCG  Pro; CAU  His; CAC  His; CAA  Gln; CAG  Gln; CGU  Arg; CGC  Arg; CGA  Arg; CGG  Arg; AUU  Ile; AUC  Ile; AUA  Ile; AUG  Met; ACU  Thr; ACC  Thr; ACA  Thr; ACG  Thr; AAU  Asn; AAC  Asn; AAA  Lys; AAG  Lys; AGU  Ser; AGC  Ser; AGA  Arg; AGG  Arg; GUU  Val; GUC  Val; GUA  Val; GUG  Val; GCU  Ala; GCC  Ala; GCA  Ala; GCG  Ala; GAU  Asp; GAC  Asp; GAA  Glu; GAG  Glu; GGU  Gly; GGC  Gly; GGA  Gly; GGG  Gly. STOP means a termination signal, not an amino acid.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Read the standard code using oriented RNA codons</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">First base selects the row; second base selects the column; the full triplet identifies the entry.</text><text x="50" y="179" font-size="25" text-anchor="start" fill="#213033">Every triplet is written as mRNA 5′→3′. Select the stated reading frame.</text><text x="293" y="230" font-size="22" text-anchor="middle" fill="#213033">Second base U</text><text x="541" y="230" font-size="22" text-anchor="middle" fill="#213033">Second base C</text><text x="789" y="230" font-size="22" text-anchor="middle" fill="#213033">Second base A</text><text x="1037" y="230" font-size="22" text-anchor="middle" fill="#213033">Second base G</text><text x="50" y="312" font-size="22" text-anchor="start" fill="#213033">First U</text><rect x="170" y="252" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="190" y="279" font-size="22" text-anchor="start" fill="#213033">UUU  Phe</text><text x="190" y="307" font-size="22" text-anchor="start" fill="#213033">UUC  Phe</text><text x="190" y="335" font-size="22" text-anchor="start" fill="#213033">UUA  Leu</text><text x="190" y="363" font-size="22" text-anchor="start" fill="#213033">UUG  Leu</text><rect x="418" y="252" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="438" y="279" font-size="22" text-anchor="start" fill="#213033">UCU  Ser</text><text x="438" y="307" font-size="22" text-anchor="start" fill="#213033">UCC  Ser</text><text x="438" y="335" font-size="22" text-anchor="start" fill="#213033">UCA  Ser</text><text x="438" y="363" font-size="22" text-anchor="start" fill="#213033">UCG  Ser</text><rect x="666" y="252" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="686" y="279" font-size="22" text-anchor="start" fill="#213033">UAU  Tyr</text><text x="686" y="307" font-size="22" text-anchor="start" fill="#213033">UAC  Tyr</text><text x="686" y="335" font-size="22" text-anchor="start" fill="#213033">UAA  STOP</text><text x="686" y="363" font-size="22" text-anchor="start" fill="#213033">UAG  STOP</text><rect x="914" y="252" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="934" y="279" font-size="22" text-anchor="start" fill="#213033">UGU  Cys</text><text x="934" y="307" font-size="22" text-anchor="start" fill="#213033">UGC  Cys</text><text x="934" y="335" font-size="22" text-anchor="start" fill="#213033">UGA  STOP</text><text x="934" y="363" font-size="22" text-anchor="start" fill="#213033">UGG  Trp</text><text x="50" y="444" font-size="22" text-anchor="start" fill="#213033">First C</text><rect x="170" y="384" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="190" y="411" font-size="22" text-anchor="start" fill="#213033">CUU  Leu</text><text x="190" y="439" font-size="22" text-anchor="start" fill="#213033">CUC  Leu</text><text x="190" y="467" font-size="22" text-anchor="start" fill="#213033">CUA  Leu</text><text x="190" y="495" font-size="22" text-anchor="start" fill="#213033">CUG  Leu</text><rect x="418" y="384" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="438" y="411" font-size="22" text-anchor="start" fill="#213033">CCU  Pro</text><text x="438" y="439" font-size="22" text-anchor="start" fill="#213033">CCC  Pro</text><text x="438" y="467" font-size="22" text-anchor="start" fill="#213033">CCA  Pro</text><text x="438" y="495" font-size="22" text-anchor="start" fill="#213033">CCG  Pro</text><rect x="666" y="384" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="686" y="411" font-size="22" text-anchor="start" fill="#213033">CAU  His</text><text x="686" y="439" font-size="22" text-anchor="start" fill="#213033">CAC  His</text><text x="686" y="467" font-size="22" text-anchor="start" fill="#213033">CAA  Gln</text><text x="686" y="495" font-size="22" text-anchor="start" fill="#213033">CAG  Gln</text><rect x="914" y="384" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="934" y="411" font-size="22" text-anchor="start" fill="#213033">CGU  Arg</text><text x="934" y="439" font-size="22" text-anchor="start" fill="#213033">CGC  Arg</text><text x="934" y="467" font-size="22" text-anchor="start" fill="#213033">CGA  Arg</text><text x="934" y="495" font-size="22" text-anchor="start" fill="#213033">CGG  Arg</text><text x="50" y="576" font-size="22" text-anchor="start" fill="#213033">First A</text><rect x="170" y="516" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="190" y="543" font-size="22" text-anchor="start" fill="#213033">AUU  Ile</text><text x="190" y="571" font-size="22" text-anchor="start" fill="#213033">AUC  Ile</text><text x="190" y="599" font-size="22" text-anchor="start" fill="#213033">AUA  Ile</text><text x="190" y="627" font-size="22" text-anchor="start" fill="#213033">AUG  Met</text><rect x="418" y="516" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="438" y="543" font-size="22" text-anchor="start" fill="#213033">ACU  Thr</text><text x="438" y="571" font-size="22" text-anchor="start" fill="#213033">ACC  Thr</text><text x="438" y="599" font-size="22" text-anchor="start" fill="#213033">ACA  Thr</text><text x="438" y="627" font-size="22" text-anchor="start" fill="#213033">ACG  Thr</text><rect x="666" y="516" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="686" y="543" font-size="22" text-anchor="start" fill="#213033">AAU  Asn</text><text x="686" y="571" font-size="22" text-anchor="start" fill="#213033">AAC  Asn</text><text x="686" y="599" font-size="22" text-anchor="start" fill="#213033">AAA  Lys</text><text x="686" y="627" font-size="22" text-anchor="start" fill="#213033">AAG  Lys</text><rect x="914" y="516" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="934" y="543" font-size="22" text-anchor="start" fill="#213033">AGU  Ser</text><text x="934" y="571" font-size="22" text-anchor="start" fill="#213033">AGC  Ser</text><text x="934" y="599" font-size="22" text-anchor="start" fill="#213033">AGA  Arg</text><text x="934" y="627" font-size="22" text-anchor="start" fill="#213033">AGG  Arg</text><text x="50" y="708" font-size="22" text-anchor="start" fill="#213033">First G</text><rect x="170" y="648" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="190" y="675" font-size="22" text-anchor="start" fill="#213033">GUU  Val</text><text x="190" y="703" font-size="22" text-anchor="start" fill="#213033">GUC  Val</text><text x="190" y="731" font-size="22" text-anchor="start" fill="#213033">GUA  Val</text><text x="190" y="759" font-size="22" text-anchor="start" fill="#213033">GUG  Val</text><rect x="418" y="648" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="438" y="675" font-size="22" text-anchor="start" fill="#213033">GCU  Ala</text><text x="438" y="703" font-size="22" text-anchor="start" fill="#213033">GCC  Ala</text><text x="438" y="731" font-size="22" text-anchor="start" fill="#213033">GCA  Ala</text><text x="438" y="759" font-size="22" text-anchor="start" fill="#213033">GCG  Ala</text><rect x="666" y="648" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="686" y="675" font-size="22" text-anchor="start" fill="#213033">GAU  Asp</text><text x="686" y="703" font-size="22" text-anchor="start" fill="#213033">GAC  Asp</text><text x="686" y="731" font-size="22" text-anchor="start" fill="#213033">GAA  Glu</text><text x="686" y="759" font-size="22" text-anchor="start" fill="#213033">GAG  Glu</text><rect x="914" y="648" width="238" height="124" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="934" y="675" font-size="22" text-anchor="start" fill="#213033">GGU  Gly</text><text x="934" y="703" font-size="22" text-anchor="start" fill="#213033">GGC  Gly</text><text x="934" y="731" font-size="22" text-anchor="start" fill="#213033">GGA  Gly</text><text x="934" y="759" font-size="22" text-anchor="start" fill="#213033">GGG  Gly</text><text x="50" y="817" font-size="21" text-anchor="start" fill="#213033">AUG → Met (usual start in this model). UAA/UAG/UGA signal termination; STOP is not an amino acid.</text><text x="50" y="851" font-size="21" text-anchor="start" fill="#213033">A short fragment requires a stated frame and initiation assumption; U replaces T in this RNA table.</text></g></svg>
