<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Name the boundary when counting mitotic chromosomes</title><desc id="description">Four schematic panels follow a2n=4 cell with four duplicated chromosomes through condensation and equatorial alignment, then sister separation into eight daughter chromosomes in one undivided anaphase cell, and two new nuclei each receiving four. Long/short symbols identify two chromosome types; colors distinguish homologues. The metaphase spindle links opposite sides of each paired-sister symbol to opposite poles; kinetochores and fibres are schematic, not molecular detail. A dashed anaphase midline distinguishes pole groups and is not a completed cell partition. The last single cell boundary contains two symbolic nuclei, showing that nuclear and cytoplasmic division are distinct. Condensation and decondensation are described without claiming literal X shapes throughout the cycle. This model uses2n=4; the separate core example uses eight entering chromosomes and sixteen whole-cell anaphase chromosomes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Name the boundary when counting mitotic chromosomes</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">Condensation, alignment, sister separation and new nuclei are different observations.</text><text x="165" y="195" font-size="25" text-anchor="middle" fill="#213033">Condensation</text><circle cx="165" cy="365" r="112" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="123" y1="313.0" x2="135" y2="353.0" stroke="#176e6a" stroke-width="4"/><line x1="135" y1="313.0" x2="123" y2="353.0" stroke="#176e6a" stroke-width="4"/><line x1="184" y1="316.0" x2="196" y2="356.0" stroke="#a55a28" stroke-width="4"/><line x1="196" y1="316.0" x2="184" y2="356.0" stroke="#a55a28" stroke-width="4"/><line x1="139" y1="386.0" x2="151" y2="412.0" stroke="#176e6a" stroke-width="4"/><line x1="151" y1="386.0" x2="139" y2="412.0" stroke="#176e6a" stroke-width="4"/><line x1="202" y1="381.0" x2="214" y2="407.0" stroke="#a55a28" stroke-width="4"/><line x1="214" y1="381.0" x2="202" y2="407.0" stroke="#a55a28" stroke-width="4"/><text x="455" y="195" font-size="25" text-anchor="middle" fill="#213033">Metaphase</text><circle cx="455" cy="365" r="112" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="362" y1="365" x2="450" y2="299" stroke="#91adaa" stroke-width="1"/><line x1="548" y1="365" x2="460" y2="299" stroke="#91adaa" stroke-width="1"/><line x1="449" y1="279.0" x2="461" y2="319.0" stroke="#176e6a" stroke-width="4"/><line x1="461" y1="279.0" x2="449" y2="319.0" stroke="#176e6a" stroke-width="4"/><line x1="362" y1="365" x2="450" y2="342" stroke="#91adaa" stroke-width="1"/><line x1="548" y1="365" x2="460" y2="342" stroke="#91adaa" stroke-width="1"/><line x1="449" y1="322.0" x2="461" y2="362.0" stroke="#a55a28" stroke-width="4"/><line x1="461" y1="322.0" x2="449" y2="362.0" stroke="#a55a28" stroke-width="4"/><line x1="362" y1="365" x2="450" y2="385" stroke="#91adaa" stroke-width="1"/><line x1="548" y1="365" x2="460" y2="385" stroke="#91adaa" stroke-width="1"/><line x1="449" y1="372.0" x2="461" y2="398.0" stroke="#176e6a" stroke-width="4"/><line x1="461" y1="372.0" x2="449" y2="398.0" stroke="#176e6a" stroke-width="4"/><line x1="362" y1="365" x2="450" y2="428" stroke="#91adaa" stroke-width="1"/><line x1="548" y1="365" x2="460" y2="428" stroke="#91adaa" stroke-width="1"/><line x1="449" y1="415.0" x2="461" y2="441.0" stroke="#a55a28" stroke-width="4"/><line x1="461" y1="415.0" x2="449" y2="441.0" stroke="#a55a28" stroke-width="4"/><circle cx="362" cy="365" r="4" fill="#213033" stroke="#51716e" stroke-width="2"/><circle cx="548" cy="365" r="4" fill="#213033" stroke="#51716e" stroke-width="2"/><text x="745" y="195" font-size="25" text-anchor="middle" fill="#213033">Anaphase</text><circle cx="745" cy="365" r="112" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="690" y1="278.0" x2="690" y2="318.0" stroke="#176e6a" stroke-width="4"/><line x1="690" y1="322.0" x2="690" y2="362.0" stroke="#a55a28" stroke-width="4"/><line x1="690" y1="373.0" x2="690" y2="399.0" stroke="#176e6a" stroke-width="4"/><line x1="690" y1="417.0" x2="690" y2="443.0" stroke="#a55a28" stroke-width="4"/><line x1="800" y1="278.0" x2="800" y2="318.0" stroke="#176e6a" stroke-width="4"/><line x1="800" y1="322.0" x2="800" y2="362.0" stroke="#a55a28" stroke-width="4"/><line x1="800" y1="373.0" x2="800" y2="399.0" stroke="#176e6a" stroke-width="4"/><line x1="800" y1="417.0" x2="800" y2="443.0" stroke="#a55a28" stroke-width="4"/><line x1="745" y1="260" x2="745" y2="470" stroke="#213033" stroke-width="1" stroke-dasharray="5 5"/><text x="1035" y="195" font-size="25" text-anchor="middle" fill="#213033">New nuclei</text><circle cx="1035" cy="365" r="112" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><circle cx="982" cy="365" r="47" fill="white" stroke="#51716e" stroke-width="2"/><line x1="957" y1="348.0" x2="957" y2="382.0" stroke="#176e6a" stroke-width="4"/><line x1="974" y1="348.0" x2="974" y2="382.0" stroke="#a55a28" stroke-width="4"/><line x1="991" y1="353.5" x2="991" y2="376.5" stroke="#176e6a" stroke-width="4"/><line x1="1008" y1="353.5" x2="1008" y2="376.5" stroke="#a55a28" stroke-width="4"/><circle cx="1088" cy="365" r="47" fill="white" stroke="#51716e" stroke-width="2"/><line x1="1063" y1="348.0" x2="1063" y2="382.0" stroke="#176e6a" stroke-width="4"/><line x1="1080" y1="348.0" x2="1080" y2="382.0" stroke="#a55a28" stroke-width="4"/><line x1="1097" y1="353.5" x2="1097" y2="376.5" stroke="#176e6a" stroke-width="4"/><line x1="1114" y1="353.5" x2="1114" y2="376.5" stroke="#a55a28" stroke-width="4"/><text x="65" y="531" font-size="21" text-anchor="start" fill="#213033">4 duplicated</text><text x="65" y="560" font-size="21" text-anchor="start" fill="#213033">chromosomes</text><text x="355" y="531" font-size="21" text-anchor="start" fill="#213033">4 duplicated; sisters</text><text x="355" y="560" font-size="21" text-anchor="start" fill="#213033">still joined</text><text x="645" y="531" font-size="21" text-anchor="start" fill="#213033">8 daughter chromosomes</text><text x="645" y="560" font-size="21" text-anchor="start" fill="#213033">inside the whole cell</text><text x="935" y="531" font-size="21" text-anchor="start" fill="#213033">4 chromosomes</text><text x="935" y="560" font-size="21" text-anchor="start" fill="#213033">in each new nucleus</text><text x="50" y="659" font-size="22" text-anchor="start" fill="#213033">Model starts at 2n = 4. Long/short marks distinguish two chromosome types.</text><text x="50" y="703" font-size="22" text-anchor="start" fill="#213033">At anaphase, 4 daughter chromosomes move toward each pole; 8 lie inside the whole cell.</text><text x="50" y="747" font-size="22" text-anchor="start" fill="#213033">Mitosis preserves the usual complement per nucleus. It does not guarantee no sequence mutation.</text><text x="50" y="791" font-size="22" text-anchor="start" fill="#213033">Nuclear division and cytokinesis are distinct; symbolic nuclei retain count marks for comparison.</text></g></svg>
