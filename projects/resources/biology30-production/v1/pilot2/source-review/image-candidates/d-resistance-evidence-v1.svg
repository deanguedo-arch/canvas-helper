<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Test an explanation with replicated comparisons</title><desc id="desc">An experimental-design diagram begins with comparable population size and variant frequency and branches into exposed and unexposed sets, each with three independent replicate populations. Survival, reproduction and later allele frequency should be measured separately. Exposure-linked reproductive advantage across replicates supports selection more directly than frequency change alone. Bottlenecks, migration and sampling remain alternatives to track. No observed results are supplied by this design schematic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">Test an explanation with replicated comparisons</tspan></text><text x="55" y="112" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Start with matched populations: record size and resistance-variant frequency.</tspan></text><rect x="385" y="155" width="430" height="90" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="600" y="193" text-anchor="middle" font-size="23" font-weight="400"><tspan x="600" dy="0">Independent replicate populations</tspan><tspan x="600" dy="31.05">with comparable starting conditions</tspan></text><path d="M495 245 L280 335" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M705 245 L920 335" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="350" width="485" height="220" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="297" y="390" text-anchor="middle" font-size="26" font-weight="700"><tspan x="297" dy="0">Exposure condition</tspan></text><circle cx="180" cy="465" r="32" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="180" y="473" text-anchor="middle" font-size="23" font-weight="400"><tspan x="180" dy="0">R1</tspan></text><circle cx="300" cy="465" r="32" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="300" y="473" text-anchor="middle" font-size="23" font-weight="400"><tspan x="300" dy="0">R2</tspan></text><circle cx="420" cy="465" r="32" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="420" y="473" text-anchor="middle" font-size="23" font-weight="400"><tspan x="420" dy="0">R3</tspan></text><text x="297" y="543" text-anchor="middle" font-size="22" font-weight="400"><tspan x="297" dy="0">Measure each replicate separately.</tspan></text><rect x="660" y="350" width="485" height="220" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="902" y="390" text-anchor="middle" font-size="26" font-weight="700"><tspan x="902" dy="0">Unexposed comparison</tspan></text><circle cx="785" cy="465" r="32" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="785" y="473" text-anchor="middle" font-size="23" font-weight="400"><tspan x="785" dy="0">R1</tspan></text><circle cx="905" cy="465" r="32" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="905" y="473" text-anchor="middle" font-size="23" font-weight="400"><tspan x="905" dy="0">R2</tspan></text><circle cx="1025" cy="465" r="32" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="1025" y="473" text-anchor="middle" font-size="23" font-weight="400"><tspan x="1025" dy="0">R3</tspan></text><text x="902" y="543" text-anchor="middle" font-size="22" font-weight="400"><tspan x="902" dy="0">Measure each replicate separately.</tspan></text><text x="55" y="635" text-anchor="start" font-size="26" font-weight="700"><tspan x="55" dy="0">Compare survival, reproduction and later variant frequency.</tspan></text><text x="55" y="689" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">An exposure-linked inherited advantage repeated across groups supports selection.</tspan><tspan x="55" dy="31.05">Record bottlenecks, migration and sampling: a frequency shift alone is insufficient.</tspan></text><rect x="55" y="779" width="1090" height="70" fill="#fff7e8" stroke="#627b75" stroke-width="2"/><text x="80" y="820" text-anchor="start" font-size="22" font-weight="400"><tspan x="80" dy="0">R1–R3 label replicate populations, not resistance alleles. No results are invented.</tspan></text></g></svg>