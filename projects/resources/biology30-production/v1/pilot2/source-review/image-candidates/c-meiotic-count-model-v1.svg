<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Count sets and copies through both meiotic divisions</title><desc id="desc">A simplified2n=4 cell starts after replication with four duplicated chromosomes: two long homologues and two short homologues. Meiosis I distributes one long and one short duplicated chromosome to each product, leaving two duplicated chromosomes in one set per product. Meiosis II separates sisters without a second S phase, yielding four haploid products with two unduplicated chromosomes each. The diagram explicitly states that crossing over is omitted; long/short marks identify chromosome types and colours identify homologues. Functional gamete outcomes can differ from nuclear-product counts. Daughter boundaries, not a temporary whole-cell anaphase total, are counted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" font-size="30"><tspan x="50" dy="0">Count sets and copies through both meiotic divisions</tspan></text><text x="50" y="110" font-size="23"><tspan x="50" dy="0">A simplified 2n = 4 cell has two chromosome types and two homologous sets.</tspan></text><circle cx="750" cy="220" r="52" fill="#f3f7f5" stroke="#45625c" stroke-width="2"/><path d="M715 201.0L727 239.0" fill="none" stroke="#176e68" stroke-width="3"/><path d="M727 201.0L715 239.0" fill="none" stroke="#176e68" stroke-width="3"/><path d="M735 201.0L747 239.0" fill="none" stroke="#a25b25" stroke-width="3"/><path d="M747 201.0L735 239.0" fill="none" stroke="#a25b25" stroke-width="3"/><path d="M755 208.5L767 231.5" fill="none" stroke="#176e68" stroke-width="3"/><path d="M767 208.5L755 231.5" fill="none" stroke="#176e68" stroke-width="3"/><path d="M775 208.5L787 231.5" fill="none" stroke="#a25b25" stroke-width="3"/><path d="M787 208.5L775 231.5" fill="none" stroke="#a25b25" stroke-width="3"/><text x="50" y="209" font-size="23"><tspan x="50" dy="0">Starting cell after DNA replication</tspan><tspan x="50" dy="29.900000000000002">4 duplicated chromosomes; 2 sets</tspan></text><path d="M726 274L585 364" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M774 274L915 364" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="331" font-size="24"><tspan x="50" dy="0">Meiosis I separates homologues</tspan></text><circle cx="570" cy="420" r="52" fill="#f3f7f5" stroke="#45625c" stroke-width="2"/><path d="M549 401.0L561 439.0" fill="none" stroke="#176e68" stroke-width="3"/><path d="M561 401.0L549 439.0" fill="none" stroke="#176e68" stroke-width="3"/><path d="M581 408.5L593 431.5" fill="none" stroke="#a25b25" stroke-width="3"/><path d="M593 408.5L581 431.5" fill="none" stroke="#a25b25" stroke-width="3"/><circle cx="930" cy="420" r="52" fill="#f3f7f5" stroke="#45625c" stroke-width="2"/><path d="M909 401.0L921 439.0" fill="none" stroke="#a25b25" stroke-width="3"/><path d="M921 401.0L909 439.0" fill="none" stroke="#a25b25" stroke-width="3"/><path d="M941 408.5L953 431.5" fill="none" stroke="#176e68" stroke-width="3"/><path d="M953 408.5L941 431.5" fill="none" stroke="#176e68" stroke-width="3"/><text x="50" y="409" font-size="23"><tspan x="50" dy="0">Each product after meiosis I</tspan><tspan x="50" dy="29.900000000000002">2 duplicated chromosomes; 1 set</tspan></text><path d="M550 474L480 564" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 474L660 564" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M910 474L840 564" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M950 474L1020 564" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="531" font-size="24"><tspan x="50" dy="0">Meiosis II separates sisters</tspan></text><circle cx="470" cy="620" r="52" fill="#f3f7f5" stroke="#45625c" stroke-width="2"/><path d="M455 601.0L455 639.0" fill="none" stroke="#176e68" stroke-width="3"/><path d="M487 608.5L487 631.5" fill="none" stroke="#a25b25" stroke-width="3"/><circle cx="670" cy="620" r="52" fill="#f3f7f5" stroke="#45625c" stroke-width="2"/><path d="M655 601.0L655 639.0" fill="none" stroke="#176e68" stroke-width="3"/><path d="M687 608.5L687 631.5" fill="none" stroke="#a25b25" stroke-width="3"/><circle cx="830" cy="620" r="52" fill="#f3f7f5" stroke="#45625c" stroke-width="2"/><path d="M815 601.0L815 639.0" fill="none" stroke="#a25b25" stroke-width="3"/><path d="M847 608.5L847 631.5" fill="none" stroke="#176e68" stroke-width="3"/><circle cx="1030" cy="620" r="52" fill="#f3f7f5" stroke="#45625c" stroke-width="2"/><path d="M1015 601.0L1015 639.0" fill="none" stroke="#a25b25" stroke-width="3"/><path d="M1047 608.5L1047 631.5" fill="none" stroke="#176e68" stroke-width="3"/><text x="50" y="609" font-size="23"><tspan x="50" dy="0">Each final haploid product</tspan><tspan x="50" dy="29.900000000000002">2 unduplicated chromosomes; 1 set</tspan></text><text x="50" y="762" font-size="23"><tspan x="50" dy="0">Long and short marks are different chromosome types; colours distinguish homologues.</tspan><tspan x="50" dy="29.900000000000002">Crossing over is omitted in this count model. X-like marks denote duplicated chromosomes.</tspan><tspan x="50" dy="29.900000000000002">There is no second S phase between meiosis I and II. Nuclei and functional gametes</tspan><tspan x="50" dy="29.900000000000002">need not have the same total in every reproductive system.</tspan></text></g></svg>