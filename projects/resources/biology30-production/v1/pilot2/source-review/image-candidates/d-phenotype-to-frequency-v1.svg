<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">From phenotype fraction to a conditional estimate</title><desc id="desc">Under the stated recessive model and equilibrium assumptions, 9 percent recessive phenotype gives q 0.30 and p 0.70. Expected genotype fractions are AA 0.49, Aa 0.42 and aa 0.09. Carriers among dominant-phenotype individuals are 0.42 divided by 0.91, approximately 0.4615.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="55" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">From phenotype fraction to a conditional estimate</tspan></text><text x="55" y="109" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Fictional fully expressed recessive trait; Hardy–Weinberg conditions assumed</tspan></text><rect x="55" y="160" width="300" height="120" fill="#f1f5f4" stroke="#718680" stroke-width="2"/><text x="205.0" y="205" text-anchor="middle" font-size="27" font-weight="400"><tspan x="205.0" dy="0">Recessive phenotype</tspan><tspan x="205.0" dy="35.1">9% → q² = 0.09</tspan></text><rect x="470" y="160" width="250" height="120" fill="#f1f5f4" stroke="#718680" stroke-width="2"/><text x="595.0" y="205" text-anchor="middle" font-size="27" font-weight="400"><tspan x="595.0" dy="0">q = √0.09</tspan><tspan x="595.0" dy="35.1">q = 0.30</tspan></text><rect x="845" y="160" width="300" height="120" fill="#f1f5f4" stroke="#718680" stroke-width="2"/><text x="995.0" y="205" text-anchor="middle" font-size="27" font-weight="400"><tspan x="995.0" dy="0">p = 1 − q</tspan><tspan x="995.0" dy="35.1">p = 0.70</tspan></text><path d="M355 220 L460 220" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 220 L835 220" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="339" text-anchor="start" font-size="26" font-weight="700"><tspan x="55" dy="0">Expected genotype fractions in the whole population</tspan></text><rect x="100" y="390" width="490" height="120" fill="#c4e2db" stroke="#718680" stroke-width="2"/><text x="345.0" y="456" text-anchor="middle" font-size="28" font-weight="700"><tspan x="345.0" dy="0">AA: 0.49</tspan></text><rect x="590" y="390" width="420" height="120" fill="#e8edf3" stroke="#718680" stroke-width="2"/><text x="800.0" y="456" text-anchor="middle" font-size="28" font-weight="700"><tspan x="800.0" dy="0">Aa: 0.42</tspan></text><rect x="1010" y="390" width="90" height="120" fill="#f1d7a9" stroke="#718680" stroke-width="2"/><text x="1055" y="548" text-anchor="middle" font-size="23" font-weight="400"><tspan x="1055" dy="0">aa: 0.09</tspan></text><text x="55" y="608" text-anchor="start" font-size="26" font-weight="700"><tspan x="55" dy="0">Whole-population carrier fraction: 2pq = 0.42</tspan></text><text x="55" y="675" text-anchor="start" font-size="25" font-weight="400"><tspan x="55" dy="0">Among dominant-phenotype individuals, the denominator changes:</tspan><tspan x="55" dy="32.5">Aa / (AA + Aa) = 0.42 / (0.49 + 0.42) ≈ 0.4615.</tspan></text><text x="55" y="798" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">Check: 0.49 + 0.42 + 0.09 = 1.   The observed 9% is q², not q.</tspan></text></g></svg>