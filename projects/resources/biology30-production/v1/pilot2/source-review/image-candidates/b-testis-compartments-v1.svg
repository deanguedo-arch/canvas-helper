<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Inside a testis: production, support and hormone release</title><desc id="desc">A schematic tubule cross-section has a wall around an open lumen. Germ cells develop within its wall among supporting Sertoli cells; later germ-cell stages lie closer to the lumen. Interstitial cells lie outside, between tubules, beside a blood vessel. Testosterone leaves these cells for blood, rather than travelling down the sperm duct. The tissue inset is not a complete testis or a scale drawing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176a65"/></marker></defs>
