<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Show why the same hormone can change its feedback effect</title><desc id="desc">Two panels compare ovarian feedback contexts. At many stages ovarian steroids reduce hypothalamic–pituitary gonadotropin signalling, shown by an explicitly negative return arrow. Near ovulation sustained high estrogen in suitable physiological context supports a positive upstream response, including an LH surge and events leading to ovulation. Forward gonadotropin arrows support ovarian activity. Signs label effects, and context is part of the mechanism. One sparse sample cannot establish a universal threshold or exact event time.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Show why the same hormone can change its feedback effect</tspan></text><text x="50" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">The feedback sign depends on concentration, duration and physiological context.</tspan></text><text x="310" y="193" text-anchor="middle" font-size="25" font-weight="700"><tspan x="310" dy="0">At many cycle stages</tspan></text><rect x="80" y="230" width="460" height="90" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="310" y="267" text-anchor="middle" font-size="23" font-weight="400"><tspan x="310" dy="0">Hypothalamic–pituitary</tspan><tspan x="310" dy="30.360000000000003">signalling</tspan></text><rect x="80" y="535" width="460" height="110" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="310" y="578" text-anchor="middle" font-size="22" font-weight="400"><tspan x="310" dy="0">Ovarian steroids provide</tspan><tspan x="310" dy="29.040000000000003">negative feedback</tspan></text><path d="M165 325 L165 529" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="407" text-anchor="start" font-size="20" font-weight="400"><tspan x="180" dy="0">Gonadotropins</tspan><tspan x="180" dy="26.400000000000002">support ovarian</tspan><tspan x="180" dy="26.400000000000002">activity</tspan></text><path d="M495 530 L495 325" fill="none" stroke="#ae682b" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="440" text-anchor="middle" font-size="40" font-weight="700"><tspan x="530" dy="0">−</tspan></text><text x="900" y="193" text-anchor="middle" font-size="25" font-weight="700"><tspan x="900" dy="0">Near ovulation</tspan></text><rect x="670" y="230" width="460" height="90" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="900" y="267" text-anchor="middle" font-size="23" font-weight="400"><tspan x="900" dy="0">Hypothalamic–pituitary</tspan><tspan x="900" dy="30.360000000000003">signalling</tspan></text><rect x="670" y="535" width="460" height="110" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="900" y="578" text-anchor="middle" font-size="22" font-weight="400"><tspan x="900" dy="0">Sustained high estrogen in</tspan><tspan x="900" dy="29.040000000000003">a suitable physiological context</tspan></text><path d="M755 325 L755 529" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="770" y="407" text-anchor="start" font-size="20" font-weight="400"><tspan x="770" dy="0">Gonadotropins</tspan><tspan x="770" dy="26.400000000000002">support ovarian</tspan><tspan x="770" dy="26.400000000000002">activity</tspan></text><path d="M1085 530 L1085 325" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="1120" y="440" text-anchor="middle" font-size="40" font-weight="700"><tspan x="1120" dy="0">+</tspan></text><text x="900" y="695" text-anchor="middle" font-size="23" font-weight="400"><tspan x="900" dy="0">Supports a marked LH surge</tspan><tspan x="900" dy="30.360000000000003">and events leading to ovulation</tspan></text><text x="50" y="790" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">The two panels compare contexts, not two different kinds of estrogen.</tspan><tspan x="50" dy="30.360000000000003">One sampled peak cannot establish a universal threshold or exact ovulation time.</tspan></text></g></svg>