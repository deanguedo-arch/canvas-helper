<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Align ovarian and uterine events on two tracks</title><desc id="desc">A shared illustrative day1-to28 axis aligns separate ovarian and uterine tracks. The ovarian track shows follicular development, ovulation at the illustrated day14 boundary and luteal corpus-luteum function. The uterine track shows illustrative shedding near the start, rebuilding and later secretory maintenance. Follicular estrogen supports rebuilding; luteal progesterone supports secretory function. Day1 begins bleeding. Real timing varies and events can overlap; day14 and the pictured durations are examples, not predictions or universal boundaries.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Align ovarian and uterine events on two tracks</tspan></text><text x="50" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Illustrative 28-day schedule; ovarian and uterine events remain separate.</tspan></text><path d="M190.0 190 L190.0 705" fill="none" stroke="#d4ddda" stroke-width="3" stroke-dasharray="9 7"/><text x="190.0" y="173" text-anchor="middle" font-size="23" font-weight="400"><tspan x="190.0" dy="0">1</tspan></text><path d="M396.66666666666663 190 L396.66666666666663 705" fill="none" stroke="#d4ddda" stroke-width="3" stroke-dasharray="9 7"/><text x="396.66666666666663" y="173" text-anchor="middle" font-size="23" font-weight="400"><tspan x="396.66666666666663" dy="0">7</tspan></text><path d="M637.7777777777778 190 L637.7777777777778 705" fill="none" stroke="#d4ddda" stroke-width="3" stroke-dasharray="9 7"/><text x="637.7777777777778" y="173" text-anchor="middle" font-size="23" font-weight="400"><tspan x="637.7777777777778" dy="0">14</tspan></text><path d="M878.8888888888889 190 L878.8888888888889 705" fill="none" stroke="#d4ddda" stroke-width="3" stroke-dasharray="9 7"/><text x="878.8888888888889" y="173" text-anchor="middle" font-size="23" font-weight="400"><tspan x="878.8888888888889" dy="0">21</tspan></text><path d="M1120.0 190 L1120.0 705" fill="none" stroke="#d4ddda" stroke-width="3" stroke-dasharray="9 7"/><text x="1120.0" y="173" text-anchor="middle" font-size="23" font-weight="400"><tspan x="1120.0" dy="0">28</tspan></text><text x="55" y="171" text-anchor="start" font-size="22" font-weight="400"><tspan x="55" dy="0">Cycle day</tspan></text><text x="50" y="237" text-anchor="start" font-size="26" font-weight="700"><tspan x="50" dy="0">Ovary</tspan></text><rect x="190" y="270" width="447.7777777777778" height="95" fill="#edf3f1" stroke="#617973" stroke-width="2"/><rect x="637.7777777777778" y="270" width="482.2222222222222" height="95" fill="#f1d7a9" stroke="#617973" stroke-width="2"/><text x="395" y="310" text-anchor="middle" font-size="23" font-weight="400"><tspan x="395" dy="0">Follicular phase</tspan><tspan x="395" dy="30.360000000000003">Follicles develop</tspan></text><text x="880" y="310" text-anchor="middle" font-size="23" font-weight="400"><tspan x="880" dy="0">Luteal phase</tspan><tspan x="880" dy="30.360000000000003">Corpus luteum functions</tspan></text><path d="M637.7777777777778 225 L637.7777777777778 265" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="637.7777777777778" y="217" text-anchor="middle" font-size="21" font-weight="400"><tspan x="637.7777777777778" dy="0">Ovulation shown here</tspan></text><text x="50" y="432" text-anchor="start" font-size="26" font-weight="700"><tspan x="50" dy="0">Uterus</tspan></text><rect x="190.0" y="465" width="137.77777777777777" height="90" fill="#f4deda" stroke="#617973" stroke-width="2"/><text x="258.8888888888889" y="518" text-anchor="middle" font-size="21" font-weight="400"><tspan x="258.8888888888889" dy="0">Shedding</tspan></text><rect x="327.77777777777777" y="465" width="310.00000000000006" height="90" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="482.7777777777778" y="518" text-anchor="middle" font-size="21" font-weight="400"><tspan x="482.7777777777778" dy="0">Rebuilding</tspan></text><rect x="637.7777777777778" y="465" width="482.2222222222222" height="90" fill="#f1d7a9" stroke="#617973" stroke-width="2"/><text x="878.8888888888889" y="518" text-anchor="middle" font-size="21" font-weight="400"><tspan x="878.8888888888889" dy="0">Secretory maintenance</tspan></text><text x="410" y="630" text-anchor="middle" font-size="23" font-weight="400"><tspan x="410" dy="0">Follicular estrogen</tspan><tspan x="410" dy="30.360000000000003">supports rebuilding</tspan></text><text x="890" y="630" text-anchor="middle" font-size="23" font-weight="400"><tspan x="890" dy="0">Luteal progesterone</tspan><tspan x="890" dy="30.360000000000003">supports secretory function</tspan></text><text x="50" y="772" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Day 1 marks the start of menstrual bleeding in this example.</tspan><tspan x="50" dy="30.360000000000003">Real cycle lengths, shedding duration and ovulation timing vary; events can overlap.</tspan><tspan x="50" dy="30.360000000000003">The ovary does not menstruate. This diagram does not predict an individual’s fertile days.</tspan></text></g></svg>