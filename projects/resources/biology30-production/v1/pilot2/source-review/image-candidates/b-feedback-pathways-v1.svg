<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Two feedback routes with different targets</title><desc id="desc">Testosterone reduces hypothalamic and pituitary signalling; inhibin from Sertoli cells reduces anterior pituitary FSH release. Blunt ends indicate inhibition, not absence of hormone movement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16766b"/></marker><marker id="bar" viewBox="0 0 10 12" refX="8" refY="6" markerWidth="8" markerHeight="12" orient="auto"><path d="M 8 0 L 8 12" stroke="#985526" stroke-width="2"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="55" text-anchor="start" font-size="32" font-weight="700" fill="#202a2c"><tspan x="55" dy="0">Two feedback routes with different targets</tspan></text><text x="55" y="114" text-anchor="start" font-size="25" font-weight="700" fill="#202a2c"><tspan x="55" dy="0">Testosterone feedback</tspan></text><rect x="70" y="155" width="360" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="250.0" y="197.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="250.0" dy="0">Hypothalamus and</tspan><tspan x="250.0" dy="31.200000000000003">anterior pituitary</tspan></text><rect x="770" y="155" width="360" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="950.0" y="197.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="950.0" dy="0">Interstitial cells</tspan><tspan x="950.0" dy="31.200000000000003">release testosterone</tspan></text><path d="M430 205 H765" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="175" text-anchor="middle" font-size="21" font-weight="400" fill="#202a2c"><tspan x="600" dy="0">GnRH → LH signalling</tspan></text><path d="M950 255 V335 H250 V260" fill="none" stroke="#985526" stroke-width="3" marker-end="url(#bar)"/><text x="600" y="325" text-anchor="middle" font-size="22" font-weight="400" fill="#202a2c"><tspan x="600" dy="0">Testosterone reduces upstream signalling</tspan></text><text x="55" y="423" text-anchor="start" font-size="25" font-weight="700" fill="#202a2c"><tspan x="55" dy="0">Inhibin feedback</tspan></text><rect x="70" y="465" width="360" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="250.0" y="507.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="250.0" dy="0">Anterior pituitary</tspan><tspan x="250.0" dy="31.200000000000003">releases FSH</tspan></text><rect x="770" y="465" width="360" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="950.0" y="507.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="950.0" dy="0">Sertoli cells</tspan><tspan x="950.0" dy="31.200000000000003">release inhibin</tspan></text><path d="M430 515 H765" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="489" text-anchor="middle" font-size="21" font-weight="400" fill="#202a2c"><tspan x="600" dy="0">FSH supports target activity</tspan></text><path d="M950 565 V645 H250 V570" fill="none" stroke="#985526" stroke-width="3" marker-end="url(#bar)"/><text x="600" y="635" text-anchor="middle" font-size="22" font-weight="400" fill="#202a2c"><tspan x="600" dy="0">Inhibin reduces FSH release</tspan></text><text x="55" y="745" text-anchor="start" font-size="22" font-weight="400" fill="#202a2c"><tspan x="55" dy="0">Arrowhead: stimulation or support.  Blunt end: reduced upstream release.</tspan></text><text x="55" y="799" text-anchor="start" font-size="22" font-weight="400" fill="#202a2c"><tspan x="55" dy="0">If testosterone action falls, LH can rise when upstream tissues respond.</tspan><tspan x="55" dy="28.6">A single hormone measurement cannot identify the cause on its own.</tspan></text></g></svg>