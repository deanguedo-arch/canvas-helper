<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Connect DNA regions, chromatin and chromosomes</title><desc id="description">Three deliberately different scales show a marked gene region along a longer DNA molecule, DNA associated with histone proteins as simplified chromatin, and one schematic condensed unduplicated chromosome. Many loci occupy a chromosome. The models do not prescribe a universal thirty-nanometre fibre, depict a gene as an entire chromosome or imply that condensation creates DNA. The coloured chromosome mark is a locator, not a measured gene-sized band.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Connect DNA regions, chromatin and chromosomes</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">Follow the level of organization before interpreting a label.</text><text x="50" y="177" font-size="26" text-anchor="start" fill="#213033">A gene occupies a region of a longer DNA molecule</text><line x1="70" y1="220" x2="82" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="70" y1="250" x2="82" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="94" y1="220" x2="106" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="94" y1="250" x2="106" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="118" y1="220" x2="130" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="118" y1="250" x2="130" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="142" y1="220" x2="154" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="142" y1="250" x2="154" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="166" y1="220" x2="178" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="166" y1="250" x2="178" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="190" y1="220" x2="202" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="190" y1="250" x2="202" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="214" y1="220" x2="226" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="214" y1="250" x2="226" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="238" y1="220" x2="250" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="238" y1="250" x2="250" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="262" y1="220" x2="274" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="262" y1="250" x2="274" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="286" y1="220" x2="298" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="286" y1="250" x2="298" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="310" y1="220" x2="322" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="310" y1="250" x2="322" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="334" y1="220" x2="346" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="334" y1="250" x2="346" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="358" y1="220" x2="370" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="358" y1="250" x2="370" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="382" y1="220" x2="394" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="382" y1="250" x2="394" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="406" y1="220" x2="418" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="406" y1="250" x2="418" y2="220" stroke="#a55a28" stroke-width="3"/><line x1="430" y1="220" x2="442" y2="250" stroke="#176e6a" stroke-width="3"/><line x1="430" y1="250" x2="442" y2="220" stroke="#a55a28" stroke-width="3"/><rect x="164" y="205" width="108" height="60" fill="none" stroke="#51716e" stroke-width="2"/><text x="166" y="297" font-size="22" text-anchor="start" fill="#213033">gene region</text><text x="520" y="243" font-size="23" text-anchor="start" fill="#213033">Many other loci lie along the same molecule.</text><path d="M245,324 L245,364" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="105" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="170" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="235" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="300" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="365" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="430" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><path d="M60,443 Q100,385 130,443 T195,443 T260,443 T325,443 T390,443 T455,443" fill="none" stroke="#176e6a" stroke-width="4"/><text x="540" y="420" font-size="23" text-anchor="start" fill="#213033">DNA associated with histone proteins</text><text x="540" y="451" font-size="23" text-anchor="start" fill="#213033">is chromatin. Packaging and access</text><text x="540" y="482" font-size="23" text-anchor="start" fill="#213033">are regulated; this is one simplified level.</text><path d="M245,502 L245,556" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><rect x="195" y="591" width="90" height="142" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><line x1="210" y1="615" x2="269" y2="704" stroke="#a55a28" stroke-width="5"/><text x="355" y="618" font-size="23" text-anchor="start" fill="#213033">One schematic condensed, unduplicated chromosome</text><text x="355" y="649" font-size="23" text-anchor="start" fill="#213033">contains a long DNA molecule associated with proteins.</text><text x="355" y="680" font-size="23" text-anchor="start" fill="#213033">Condensation reorganizes material; it does not create DNA.</text><text x="50" y="793" font-size="22" text-anchor="start" fill="#213033">The enlarged gene region, beads and chromosome use different scales.</text><text x="50" y="824" font-size="22" text-anchor="start" fill="#213033">The band-like mark is a model locator, not the measured size of a gene.</text></g></svg>
