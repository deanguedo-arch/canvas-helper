<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Locate the two oocyte pauses and unequal divisions</title><desc id="desc">Three symbolic stages show a primary oocyte with46 duplicated chromosomes paused in prophase I before birth, a secondary oocyte with23 duplicated chromosomes paused in metaphase II at ovulation, and the maternal product with23 unduplicated chromosomes after meiosis II. Sperm entry normally triggers the second completion. Unequal divisions give a large cell and small polar bodies. The final maternal count excludes paternal chromosomes; it is not the total zygote count. The first polar body can have its own fate, not depicted. A typical spermatocyte instead makes four similarly sized spermatids.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Locate the two oocyte pauses and unequal divisions</tspan></text><text x="50" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Unequal cytoplasm can accompany correct segregation of chromosome sets.</tspan></text><circle cx="200" cy="235" r="80" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="200" y="243" text-anchor="middle" font-size="25" font-weight="700"><tspan x="200" dy="0">2n</tspan></text><text x="340" y="205" text-anchor="start" font-size="25" font-weight="700"><tspan x="340" dy="0">Primary oocyte</tspan></text><text x="340" y="247" text-anchor="start" font-size="23" font-weight="400"><tspan x="340" dy="0">46 duplicated chromosomes</tspan><tspan x="340" dy="30.360000000000003">Prophase I pause begins before birth</tspan></text><circle cx="200" cy="440" r="68" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="200" y="448" text-anchor="middle" font-size="25" font-weight="700"><tspan x="200" dy="0">n</tspan></text><text x="340" y="410" text-anchor="start" font-size="25" font-weight="700"><tspan x="340" dy="0">Secondary oocyte</tspan></text><text x="340" y="452" text-anchor="start" font-size="23" font-weight="400"><tspan x="340" dy="0">23 duplicated chromosomes</tspan><tspan x="340" dy="30.360000000000003">Metaphase II pause at ovulation</tspan></text><circle cx="200" cy="645" r="60" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="200" y="653" text-anchor="middle" font-size="25" font-weight="700"><tspan x="200" dy="0">n</tspan></text><text x="340" y="615" text-anchor="start" font-size="25" font-weight="700"><tspan x="340" dy="0">Maternal product after meiosis II</tspan></text><text x="340" y="657" text-anchor="start" font-size="23" font-weight="400"><tspan x="340" dy="0">23 unduplicated chromosomes</tspan><tspan x="340" dy="30.360000000000003">Sperm entry normally triggers completion</tspan></text><path d="M200 319 L200 367" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M200 512 L200 580" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="1035" cy="440" r="23" fill="#f1d7a9" stroke="#617973" stroke-width="2"/><text x="1035" y="492" text-anchor="middle" font-size="20" font-weight="400"><tspan x="1035" dy="0">First polar body</tspan></text><path d="M265 325 L1008 432" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="1035" cy="645" r="23" fill="#f1d7a9" stroke="#617973" stroke-width="2"/><text x="1035" y="697" text-anchor="middle" font-size="20" font-weight="400"><tspan x="1035" dy="0">Second polar body</tspan></text><path d="M265 530 L1008 637" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="785" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Large cell retains most cytoplasm; small polar bodies receive chromosomes.</tspan><tspan x="50" dy="30.360000000000003">The maternal count above excludes the sperm contribution. Cell sizes are symbolic.</tspan><tspan x="50" dy="30.360000000000003">A typical spermatocyte instead forms four similarly sized spermatids.</tspan></text></g></svg>