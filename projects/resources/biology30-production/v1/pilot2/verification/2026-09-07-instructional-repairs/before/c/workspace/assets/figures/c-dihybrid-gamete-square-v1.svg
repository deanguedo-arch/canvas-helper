<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Connect two-locus gametes to the conditions behind a ratio</title><desc id="description">A4×4 square for AaBb×AaBb labels each parental gamete AB,Ab,aB,ab at probability1/4 and each combined genotype cell at1/16. Genotypes keep A-locus alleles before B-locus alleles. Four labelled phenotype categories group the cells as9/16 A_B_,3/16 A_bb,3/16 aaB_,1/16 aabb, using background colors only as a supplement to written genotypes and the category summary. Underscores mean either allele fits the stated dominant-phenotype category. This9:3:3:1 prediction requires independent assortment and the stated expression model, not every two-locus cross. It is not the1:1:1:1 prediction of AaBb×aabb.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Connect two-locus gametes to the conditions behind a ratio</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">Independently assorting loci and complete dominance at both scored traits are explicit assumptions.</text><text x="50" y="177" font-size="24" text-anchor="start" fill="#213033">AaBb × AaBb; gametes AB, Ab, aB, ab each have probability ¼.</text><text x="310" y="237" font-size="25" text-anchor="middle" fill="#213033">AB</text><text x="166" y="308" font-size="25" text-anchor="middle" fill="#213033">AB</text><text x="490" y="237" font-size="25" text-anchor="middle" fill="#213033">Ab</text><text x="166" y="411" font-size="25" text-anchor="middle" fill="#213033">Ab</text><text x="670" y="237" font-size="25" text-anchor="middle" fill="#213033">aB</text><text x="166" y="514" font-size="25" text-anchor="middle" fill="#213033">aB</text><text x="850" y="237" font-size="25" text-anchor="middle" fill="#213033">ab</text><text x="166" y="617" font-size="25" text-anchor="middle" fill="#213033">ab</text><rect x="225" y="263" width="180" height="103" fill="#e3f0ed" stroke="#51716e" stroke-width="2"/><text x="315" y="307" font-size="27" text-anchor="middle" fill="#213033">AABB</text><text x="315" y="345" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="405" y="263" width="180" height="103" fill="#e3f0ed" stroke="#51716e" stroke-width="2"/><text x="495" y="307" font-size="27" text-anchor="middle" fill="#213033">AABb</text><text x="495" y="345" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="585" y="263" width="180" height="103" fill="#e3f0ed" stroke="#51716e" stroke-width="2"/><text x="675" y="307" font-size="27" text-anchor="middle" fill="#213033">AaBB</text><text x="675" y="345" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="765" y="263" width="180" height="103" fill="#e3f0ed" stroke="#51716e" stroke-width="2"/><text x="855" y="307" font-size="27" text-anchor="middle" fill="#213033">AaBb</text><text x="855" y="345" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="225" y="366" width="180" height="103" fill="#e3f0ed" stroke="#51716e" stroke-width="2"/><text x="315" y="410" font-size="27" text-anchor="middle" fill="#213033">AABb</text><text x="315" y="448" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="405" y="366" width="180" height="103" fill="#e1eaf5" stroke="#51716e" stroke-width="2"/><text x="495" y="410" font-size="27" text-anchor="middle" fill="#213033">AAbb</text><text x="495" y="448" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="585" y="366" width="180" height="103" fill="#e3f0ed" stroke="#51716e" stroke-width="2"/><text x="675" y="410" font-size="27" text-anchor="middle" fill="#213033">AaBb</text><text x="675" y="448" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="765" y="366" width="180" height="103" fill="#e1eaf5" stroke="#51716e" stroke-width="2"/><text x="855" y="410" font-size="27" text-anchor="middle" fill="#213033">Aabb</text><text x="855" y="448" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="225" y="469" width="180" height="103" fill="#e3f0ed" stroke="#51716e" stroke-width="2"/><text x="315" y="513" font-size="27" text-anchor="middle" fill="#213033">AaBB</text><text x="315" y="551" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="405" y="469" width="180" height="103" fill="#e3f0ed" stroke="#51716e" stroke-width="2"/><text x="495" y="513" font-size="27" text-anchor="middle" fill="#213033">AaBb</text><text x="495" y="551" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="585" y="469" width="180" height="103" fill="#f2e4d2" stroke="#51716e" stroke-width="2"/><text x="675" y="513" font-size="27" text-anchor="middle" fill="#213033">aaBB</text><text x="675" y="551" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="765" y="469" width="180" height="103" fill="#f2e4d2" stroke="#51716e" stroke-width="2"/><text x="855" y="513" font-size="27" text-anchor="middle" fill="#213033">aaBb</text><text x="855" y="551" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="225" y="572" width="180" height="103" fill="#e3f0ed" stroke="#51716e" stroke-width="2"/><text x="315" y="616" font-size="27" text-anchor="middle" fill="#213033">AaBb</text><text x="315" y="654" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="405" y="572" width="180" height="103" fill="#e1eaf5" stroke="#51716e" stroke-width="2"/><text x="495" y="616" font-size="27" text-anchor="middle" fill="#213033">Aabb</text><text x="495" y="654" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="585" y="572" width="180" height="103" fill="#f2e4d2" stroke="#51716e" stroke-width="2"/><text x="675" y="616" font-size="27" text-anchor="middle" fill="#213033">aaBb</text><text x="675" y="654" font-size="19" text-anchor="middle" fill="#213033">1/16</text><rect x="765" y="572" width="180" height="103" fill="#eadfeb" stroke="#51716e" stroke-width="2"/><text x="855" y="616" font-size="27" text-anchor="middle" fill="#213033">aabb</text><text x="855" y="654" font-size="19" text-anchor="middle" fill="#213033">1/16</text><text x="50" y="743" font-size="22" text-anchor="start" fill="#213033">Complete dominance at both independent loci: 9/16 A_B_, 3/16 A_bb, 3/16 aaB_, 1/16 aabb.</text><text x="50" y="780" font-size="22" text-anchor="start" fill="#213033">An underscore leaves either allele possible at that position; A_ includes AA and Aa.</text><text x="50" y="817" font-size="22" text-anchor="start" fill="#213033">Linkage or other expression relationships can change these predictions. A ratio needs its model.</text></g></svg>
