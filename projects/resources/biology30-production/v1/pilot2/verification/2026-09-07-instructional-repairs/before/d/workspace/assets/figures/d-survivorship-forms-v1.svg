<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Distinguish survivorship patterns on the correct scale</title><desc id="desc">Three idealized cohort-survival curves share a logarithmic percentage scale marked100,10 and1 and a qualitative young-to-old age axis. Type I loses most individuals late; Type II has approximately constant mortality risk and therefore appears straight on this logarithmic survival plot; Type III has high early loss. All illustrated curves stop at1 percent because zero cannot be shown on a log scale. These are schematic patterns, not total-population growth or a measured species dataset.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Distinguish survivorship patterns on the correct scale</tspan></text><text x="55" y="112" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Survivorship follows a starting cohort; it is not population growth.</tspan></text><text x="55" y="166" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Starting cohort still alive (%) — logarithmic scale</tspan></text><path d="M180 210.0 L1110 210.0" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="155" y="218.0" text-anchor="end" font-size="23" font-weight="400"><tspan x="155" dy="0">100</tspan></text><path d="M180 385.0 L1110 385.0" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="155" y="393.0" text-anchor="end" font-size="23" font-weight="400"><tspan x="155" dy="0">10</tspan></text><path d="M180 560.0 L1110 560.0" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="155" y="568.0" text-anc