<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Use time and alternatives to bound a causal claim</title><desc id="desc">A fictional model-culture timeline records a precursor structure on day2, applies exposure on day4 and measures lower marker signal than comparison cultures on day6. These are laboratory days, not human developmental ages. The later exposure cannot prevent the already recorded initiation but may affect subsequent growth, survival or function. Lower marker signal can reflect fewer relevant cells, altered gene expression or measurement differences. Cell counts, suitable controls and additional functional observations help distinguish alternatives. The model does not provide an individual human risk estimate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Use time and alternatives to bound a causal claim</tspan></text><text x="50" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Fictional model-culture days: these are not human gestational ages.</tspan></text><path d="M100 280 L1100 280" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M270 265 L270 300" fill="none" stroke="#176e68" stroke-width="3"/><text x="270" y="242" text-anchor="middle" font-size="25" font-weight="700"><tspan x="270" dy="0">Day 2</tspan></text><text x="270" y="355" text-anchor="middle" font-size="23" font-weight="700"><tspan x="270" dy="0">Precursor observed</tspan></text><text x="270" y="405" text-anchor="middle" font-size="22" font-weight="400"><tspan x="270" dy="0">A defined structure</tspan><tspan x="270" dy="29.040000000000003">is already present.</tspan></text><path d="M600 265 L600 300" fill="none" stroke="#176e68" stroke-width="3"/><text x="600" y="242" text-anchor="middle" font-size="25" font-weight="700"><tspan x="600" dy="0">Day 4</tspan></text><text x="600" y="355" text-anchor="middle" font-size="23" font-weight="700"><tspan x="600" dy="0">Exposure applied</tspan></text><text x="600" y="405" text-anchor="middle" font-size="22" font-weight="400"><tspan x="600" dy="0">Treatment begins</tspan><tspan x="600" dy="29.040000000000003">after that observation.</tspan></text><path d="M930 265 L930 300" fill="none" stroke="#176e68" stroke-width="3"/><text x="930" y="242" text-anchor="middle" font-size="25" font-weight="700"><tspan x="930" dy="0">Day 6</tspan></text><text x="930" y="355" text-anchor="middle" font-size="23" font-weight="700"><tspan x="930" dy="0">Marker measured</tspan></text><text x="930" y="405" text-anchor="middle" font-size="22" font-weight="400"><tspan x="930" dy="0">Marker signal is lower</tspan><tspan x="930" dy="29.040000000000003">than in comparison cultures.</tspan></text><text x="50" y="531" text-anchor="start" font-size="26" font-weight="700"><tspan x="50" dy="0">A timing constraint</tspan></text><text x="50" y="578" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">The day-4 exposure cannot have prevented the recorded day-2 initiation.</tspan><tspan x="50" dy="30.360000000000003">It could still affect later growth, cell survival or function.</tspan></text><text x="50" y="682" text-anchor="start" font-size="26" font-weight="700"><tspan x="50" dy="0">A lower marker signal still has several explanations.</tspan></text><text x="50" y="730" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Fewer relevant cells • changed gene expression • measurement differences</tspan><tspan x="50" dy="30.360000000000003">Compare cell counts, suitable controls and additional functional evidence.</tspan></text><text x="50" y="850" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">A mechanism in this model does not supply an individual human risk estimate.</tspan></text></g></svg>