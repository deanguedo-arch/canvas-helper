<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Similar warning appearance can accompany different defence</title><desc id="desc">Two hypothetical pattern comparisons separate appearance from actual defence. In the Batesian example a relatively undefended mimic resembles a defended model. In the Müllerian example both resembling species are defended. Identical stripe swatches encode similar appearance only; they are not specimen photos or evidence of toxicity. Heritable resemblance may affect predation without intentional evolution or guaranteed protection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Similar warning appearance can accompany different defence</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Hypothetical warning-pattern swatches, not specimen images.</tspan></text><text x="55" y="185" text-anchor="start" font-size="27" font-weight="700"><tspan x="55" dy="0">Batesian comparison</tspan></text><rect x="200" y="230" width="200" height="70" fill="#f1d7a9" stroke="#627b75" stroke-width="2"/><path d="M215 234 L245 296" stroke="#202a2c" stroke-width="12"/><path d="M265 234 L295 296" stroke="#202a2c" stroke-width="12"/><path d="M315 234 L345 296" stroke="#202a2c" stroke-width="12"/><path d="M365 234 L395 296" stroke="#202a2c" stroke-width="12"/><rect x="800" y="230" width="200" height="70" fill="#f1d7a9" stroke="#627b75" stroke-width="2"/><path d="M815 234 L845 296" stroke="#202a2c" stroke-width="12"/><path d="M865 234 L895 296" stroke="#202a2c" stroke-width="12"/><path d="M915 234 L945 296" stroke="#202a2c" stroke-width="12"/><path d="M965 234 L995 296" stroke="#202a2c" stroke-width="12"/><text x="600" y="279" text-anchor="middle" font-size="24" font-weight="400"><tspan x="600" dy="0">Similar appearance</tspan></text><text x="300" y="360" text-anchor="middle" font-size="23" font-weight="700"><tspan x="300" dy="0">Defended model</tspan></text><text x="900" y="360" text-anchor="middle" font-size="23" font-weight="700"><tspan x="900" dy="0">Relatively undefended mimic</tspan></text><text x="55" y="470" text-anchor="start" font-size="27" font-weight="700"><tspan x="55" dy="0">Müllerian comparison</tspan></text><rect x="200" y="515" width="200" height="70" fill="#f1d7a9" stroke="#627b75" stroke-width="2"/><path d="M215 519 L245 581" stroke="#202a2c" stroke-width="12"/><path d="M265 519 L295 581" stroke="#202a2c" stroke-width="12"/><path d="M315 519 L345 581" stroke="#202a2c" stroke-width="12"/><path d="M365 519 L395 581" stroke="#202a2c" stroke-width="12"/><rect x="800" y="515" width="200" height="70" fill="#f1d7a9" stroke="#627b75" stroke-width="2"/><path d="M815 519 L845 581" stroke="#202a2c" stroke-width="12"/><path d="M865 519 L895 581" stroke="#202a2c" stroke-width="12"/><path d="M915 519 L945 581" stroke="#202a2c" stroke-width="12"/><path d="M965 519 L995 581" stroke="#202a2c" stroke-width="12"/><text x="600" y="564" text-anchor="middle" font-size="24" font-weight="400"><tspan x="600" dy="0">Similar appearance</tspan></text><text x="300" y="645" text-anchor="middle" font-size="23" font-weight="700"><tspan x="300" dy="0">Defended species A</tspan></text><text x="900" y="645" text-anchor="middle" font-size="23" font-weight="700"><tspan x="900" dy="0">Defended species B</tspan></text><text x="55" y="753" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Appearance and actual defence are separate evidence.</tspan><tspan x="55" dy="31.05">Heritable resemblance can be favoured when it alters predation; it is not intentional.</tspan><tspan x="55" dy="31.05">A pattern alone does not establish toxicity, a sting or complete protection.</tspan></text></g></svg>