<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Name the numerator, denominator and time interval</title><desc id="desc">The population changes from1000 to1060 across ten days. Absolute average change is60 individuals divided by ten days, or six individuals per day. Interval per-initial-individual change is60 divided by1000 equals0.06 over ten days. Dividing that interval fraction by ten gives average0.006 per day per initial individual. These do not establish a continuous intrinsic growth rate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Name the numerator, denominator and time interval</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Same population, same ten-day interval, three different summaries.</tspan></text><rect x="55" y="160" width="280" height="100" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="195" y="204" text-anchor="middle" font-size="25" font-weight="400"><tspan x="195" dy="0">Day 0</tspan><tspan x="195" dy="33.75">Initial N = 1000</tspan></text><path d="M350 210 L850 210" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="183" text-anchor="middle" font-size="24" font-weight="400"><tspan x="600" dy="0">ΔN = +60; Δt = 10 days</tspan></text><rect x="865" y="160" width="280" height="100" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="1005" y="204" text-anchor="middle" font-size="25" font-weight="400"><tspan x="1005" dy="0">Day 10</tspan><tspan x="1005" dy="33.75">Final N = 1060</tspan></text><text x="55" y="360" text-anchor="start" font-size="23" font-weight="700"><tspan x="55" dy="0">Absolute change per day</tspan></text><text x="635" y="342" text-anchor="middle" font-size="22" font-weight="400"><tspan x="635" dy="0">60 individuals</tspan></text><path d="M440 361 L830 361" fill="none" stroke="#526a66" stroke-width="3"/><text x="635" y="392" text-anchor="middle" font-size="22" font-weight="400"><tspan x="635" dy="0">10 days</tspan></text><text x="862" y="369" text-anchor="start" font-size="30" font-weight="400"><tspan x="862" dy="0">=</tspan></text><text x="910" y="369" text-anchor="start" font-size="22" font-weight="400"><tspan x="910" dy="0">6 individuals/day</tspan></text><text x="55" y="520" text-anchor="start" font-size="23" font-weight="700"><tspan x="55" dy="0">Change per initial individual</tspan></text><text x="635" y="502" text-anchor="middle" font-size="22" font-weight="400"><tspan x="635" dy="0">60 individuals</tspan></text><path d="M440 521 L830 521" fill="none" stroke="#526a66" stroke-width="3"/><text x="635" y="552" text-anchor="middle" font-size="22" font-weight="400"><tspan x="635" dy="0">1000 initial individuals</tspan></text><text x="862" y="529" text-anchor="start" font-size="30" font-weight="400"><tspan x="862" dy="0">=</tspan></text><text x="910" y="529" text-anchor="start" font-size="22" font-weight="400"><tspan x="910" dy="0">0.06 over ten days</tspan></text><text x="55" y="680" text-anchor="start" font-size="23" font-weight="700"><tspan x="55" dy="0">Daily average per initial individual</tspan></text><text x="635" y="662" text-anchor="middle" font-size="22" font-weight="400"><tspan x="635" dy="0">0.06 interval change</tspan></text><path d="M440 681 L830 681" fill="none" stroke="#526a66" stroke-width="3"/><text x="635" y="712" text-anchor="middle" font-size="22" font-weight="400"><tspan x="635" dy="0">10 days</tspan></text><text x="862" y="689" text-anchor="start" font-size="30" font-weight="400"><tspan x="862" dy="0">=</tspan></text><text x="910" y="689" text-anchor="start" font-size="22" font-weight="400"><tspan x="910" dy="0">0.006 per day</tspan></text><text x="55" y="842" text-anchor="start" font-size="22" font-weight="400"><tspan x="55" dy="0">The last two use the initial population denominator; neither is a fitted intrinsic rate.</tspan></text></g></svg>