<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Separate the allele combination from the scored phenotype</title><desc id="description">Three fictional diploid autosomal examples display alleles at corresponding marked loci: AA and aa are homozygous, Aa heterozygous. Under the explicitly stated complete-dominance model, AA and Aa share a scored dominant phenotype and aa has the recessive phenotype. A dominant observation therefore leaves two genotypes possible. Population allele diversity can exceed two although a typical diploid individual has two alleles at this locus. Dominance describes the scored relationship, not allele frequency, value, age or an universal molecular mechanism. These are fictional traits, not human eye-color or tongue-rolling claims.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Separate the allele combination from the scored phenotype</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">Two homologues carry corresponding loci; the expression model must be stated.</text><text x="215" y="184" font-size="35" text-anchor="middle" fill="#213033">AA</text><line x1="178" y1="237" x2="178" y2="378" stroke="#176e6a" stroke-width="7"/><circle cx="178" cy="298" r="8" fill="#213033" stroke="#51716e" stroke-width="2"/><text x="192" y="307" font-size="27" text-anchor="start" fill="#213033">A</text><line x1="252" y1="237" x2="252" y2="378" stroke="#a55a28" stroke-width="7"/><circle cx="252" cy="298" r="8" fill="#213033" stroke="#51716e" stroke-width="2"/><text x="266" y="307" font-size="27" text-anchor="start" fill="#213033">A</text><text x="59" y="441" font-size="22" text-anchor="start" fill="#213033">Two matching A alleles</text><text x="59" y="473" font-size="22" text-anchor="start" fill="#213033">Homozygous</text><text x="600" y="184" font-size="35" text-anchor="middle" fill="#213033">Aa</text><line x1="563" y1="237" x2="563" y2="378" stroke="#176e6a" stroke-width="7"/><circle cx="563" cy="298" r="8" fill="#213033" stroke="#51716e" stroke-width="2"/><text x="577" y="307" font-size="27" text-anchor="start" fill="#213033">A</text><line x1="637" y1="237" x2="637" y2="378" stroke="#a55a28" stroke-width="7"/><circle cx="637" cy="298" r="8" fill="#213033" stroke="#51716e" stroke-width="2"/><text x="651" y="307" font-size="27" text-anchor="start" fill="#213033">a</text><text x="444" y="441" font-size="22" text-anchor="start" fill="#213033">Two different alleles</text><text x="444" y="473" font-size="22" text-anchor="start" fill="#213033">Heterozygous</text><text x="985" y="184" font-size="35" text-anchor="middle" fill="#213033">aa</text><line x1="948" y1="237" x2="948" y2="378" stroke="#176e6a" stroke-width="7"/><circle cx="948" cy="298" r="8" fill="#213033" stroke="#51716e" stroke-width="2"/><text x="962" y="307" font-size="27" text-anchor="start" fill="#213033">a</text><line x1="1022" y1="237" x2="1022" y2="378" stroke="#a55a28" stroke-width="7"/><circle cx="1022" cy="298" r="8" fill="#213033" stroke="#51716e" stroke-width="2"/><text x="1036" y="307" font-size="27" text-anchor="start" fill="#213033">a</text><text x="829" y="441" font-size="22" text-anchor="start" fill="#213033">Two matching a alleles</text><text x="829" y="473" font-size="22" text-anchor="start" fill="#213033">Homozygous</text><rect x="60" y="557" width="1080" height="142" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="84" y="598" font-size="23" text-anchor="start" fill="#213033">Fictional autosomal A/a model with complete dominance for the scored trait:</text><text x="84" y="633" font-size="23" text-anchor="start" fill="#213033">AA and Aa share the dominant phenotype; aa has the recessive phenotype.</text><text x="84" y="668" font-size="23" text-anchor="start" fill="#213033">A population may carry more allele forms; this diploid individual has two at this locus.</text><text x="50" y="786" font-size="22" text-anchor="start" fill="#213033">The locus is the matching marked position. Letters define alleles; they do not explain the mechanism.</text><text x="50" y="817" font-size="22" text-anchor="start" fill="#213033">Dominant does not mean common, better or newer. A dominant phenotype alone leaves AA or Aa.</text></g></svg>
