<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Locate fertilization, transfer and implantation</title><desc id="desc">Two four-stage pathways distinguish usual in-body gamete meeting and fertilization in a uterine tube from IVF fertilization in a laboratory. Both require further development and uterine implantation; transfer places an embryo in the uterus but does not establish implantation or continuing pregnancy. A fictional cohort of15 started cycles,10 transfers and6 detected pregnancies gives60 percent per transfer and40 percent per started cycle. The denominator changes while the cohort and pregnancy endpoint stay the same. Neither is a live-birth rate. Artificial insemination places sperm inside the reproductive tract rather than moving fertilization to a laboratory. No treatment recommendation or real success-rate estimate is given.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Locate fertilization, transfer and implantation</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Compare where fertilization occurs and what transfer does—and does not—establish.</tspan></text><text x="50" y="220" text-anchor="start" font-size="25" font-weight="700"><tspan x="50" dy="0">Within the body</tspan></text><rect x="65" y="255" width="240" height="88" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="185" y="306" text-anchor="middle" font-size="20" font-weight="700"><tspan x="185" dy="0">Gametes meet</tspan></text><path d="M310 299 L345 299" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="352" y="255" width="240" height="88" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="472" y="306" text-anchor="middle" font-size="20" font-weight="700"><tspan x="472" dy="0">Fertilization in tube</tspan></text><path d="M597 299 L632 299" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="639" y="255" width="240" height="88" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="759" y="306" text-anchor="middle" font-size="20" font-weight="700"><tspan x="759" dy="0">Early development</tspan></text><path d="M884 299 L919 299" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="926" y="255" width="240" height="88" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="1046" y="306" text-anchor="middle" font-size="20" font-weight="700"><tspan x="1046" dy="0">Uterine implantation</tspan></text><text x="50" y="445" text-anchor="start" font-size="25" font-weight="700"><tspan x="50" dy="0">IVF pathway</tspan></text><rect x="65" y="480" width="240" height="88" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="185" y="531" text-anchor="middle" font-size="20" font-weight="700"><tspan x="185" dy="0">Oocytes + sperm</tspan></text><path d="M310 524 L345 524" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="352" y="480" width="240" height="88" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="472" y="531" text-anchor="middle" font-size="20" font-weight="700"><tspan x="472" dy="0">Fertilization in lab</tspan></text><path d="M597 524 L632 524" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="639" y="480" width="240" height="88" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="759" y="531" text-anchor="middle" font-size="20" font-weight="700"><tspan x="759" dy="0">Early development</tspan></text><path d="M884 524 L919 524" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="926" y="480" width="240" height="88" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="1046" y="531" text-anchor="middle" font-size="20" font-weight="700"><tspan x="1046" dy="0">Transfer to uterus</tspan></text><text x="650" y="629" text-anchor="middle" font-size="22" font-weight="400"><tspan x="650" dy="0">Transfer → possible implantation → possible continuing pregnancy</tspan></text><text x="50" y="711" text-anchor="start" font-size="25" font-weight="700"><tspan x="50" dy="0">Compare rates using the same denominator and endpoint.</tspan></text><text x="50" y="756" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Illustrative cohort: 15 started cycles → 10 transfers → 6 detected pregnancies.</tspan><tspan x="50" dy="30.360000000000003">6 / 10 per transfer = 60%; 6 / 15 per started cycle = 40%.</tspan><tspan x="50" dy="30.360000000000003">These describe one fictional cohort. Neither rate is a live-birth rate.</tspan></text><text x="50" y="864" text-anchor="start" font-size="22" font-weight="400"><tspan x="50" dy="0">Artificial insemination places sperm in the tract; fertilization, if it follows, is inside the body.</tspan></text></g></svg>