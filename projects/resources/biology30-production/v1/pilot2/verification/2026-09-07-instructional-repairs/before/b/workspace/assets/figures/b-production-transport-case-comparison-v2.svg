<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Compare tissue evidence before naming the cause</title><desc id="desc">The exact saved fictional model compares P and T. Developing germ cells are absent in P and present in T; Sertoli support is disrupted in P and present in T; LH is present in both; the duct is open in P and blocked in T. These observations distinguish support/production from transport hypotheses. Reduced delivery is a possible consequence to investigate, not an additional measured row. The values match b-model-signal-pathway outputs, including case identifiers. A present LH signal does not prove all downstream functions. The case is a reasoning model, not an individual diagnosis or a physical laboratory certification.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Compare tissue evidence before naming the cause</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Fictional tissue observations help distinguish production from transport.</tspan></text><text x="65" y="210" text-anchor="start" font-size="26" font-weight="700"><tspan x="65" dy="0">Observation</tspan></text><text x="460" y="210" text-anchor="start" font-size="26" font-weight="700"><tspan x="460" dy="0">Case P</tspan></text><text x="810" y="210" text-anchor="start" font-size="26" font-weight="700"><tspan x="810" dy="0">Case T</tspan></text><path d="M50 253 L1150 253" fill="none" stroke="#c2ceca" stroke-width="3"/><text x="65" y="295" text-anchor="start" font-size="23" font-weight="400"><tspan x="65" dy="0">Developing germ cells</tspan></text><text x="460" y="295" text-anchor="start" font-size="23" font-weight="400"><tspan x="460" dy="0">Absent</tspan></text><text x="810" y="295" text-anchor="start" font-size="23" font-weight="400"><tspan x="810" dy="0">Present</tspan></text><path d="M50 343 L1150 343" fill="none" stroke="#c2ceca" stroke-width="3"/><text x="65" y="385" text-anchor="start" font-size="23" font-weight="400"><tspan x="65" dy="0">Sertoli support</tspan></text><text x="460" y="385" text-anchor="start" font-size="23" font-weight="400"><tspan x="460" dy="0">Disrupted</tspan></text><text x="810" y="385" text-anchor="start" font-size="23" font-weight="400"><tspan x="810" dy="0">Present</tspan></text><path d="M50 433 L1150 433" fill="none" stroke="#c2ceca" stroke-width="3"/><text x="65" y="475" text-anchor="start" font-size="23" font-weight="400"><tspan x="65" dy="0">LH signal</tspan></text><text x="460" y="475" text-anchor="start" font-size="23" font-weight="400"><tspan x="460" dy="0">Present</tspan></text><text x="810" y="475" text-anchor="start" font-size="23" font-weight="400"><tspan x="810" dy="0">Present</tspan></text><path d="M50 523 L1150 523" fill="none" stroke="#c2ceca" stroke-width="3"/><text x="65" y="565" text-anchor="start" font-size="23" font-weight="400"><tspan x="65" dy="0">Duct passage</tspan></text><text x="460" y="565" text-anchor="start" font-size="23" font-weight="400"><tspan x="460" dy="0">Open</tspan></text><text x="810" y="565" text-anchor="start" font-size="23" font-weight="400"><tspan x="810" dy="0">Blocked</tspan></text><text x="50" y="704" text-anchor="start" font-size="25" font-weight="700"><tspan x="50" dy="0">Compare the pathway despite the recorded LH signal in both cases.</tspan></text><text x="50" y="752" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Inspect observations upstream and downstream of the proposed obstruction.</tspan><tspan x="50" dy="30.360000000000003">Signal presence does not by itself demonstrate successful cell delivery.</tspan></text><text x="50" y="851" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">This is a supplied reasoning model, not a diagnostic test or a claim about a person.</tspan></text></g></svg>