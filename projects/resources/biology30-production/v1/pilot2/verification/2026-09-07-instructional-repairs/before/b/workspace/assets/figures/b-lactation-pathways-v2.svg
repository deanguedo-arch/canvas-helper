<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Lactation: making milk and moving milk</title><desc id="desc">Sensory input supports prolactin-mediated synthesis by milk-producing cells and oxytocin-mediated contraction of surrounding myoepithelial cells for ejection. Synthesis and ejection are distinct responses.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16766b"/></marker><marker id="bar" viewBox="0 0 10 12" refX="8" refY="6" markerWidth="8" markerHeight="12" orient="auto"><path d="M 8 0 L 8 12" stroke="#985526" stroke-width="2"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="55" text-anchor="start" font-size="32" font-weight="700" fill="#202a2c"><tspan x="55" dy="0">Lactation: making milk and moving milk</tspan></text><rect x="370" y="105" width="460" height="95" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="600.0" y="160.5" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="600.0" dy="0">Suckling provides sensory input</tspan></text><path d="M500 200 V245 H260 V305" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 200 V245 H940 V305" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="310" width="400" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="260.0" y="352.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="260.0" dy="0">Anterior pituitary</tspan><tspan x="260.0" dy="31.200000000000003">releases prolactin</tspan></text><rect x="740" y="310" width="400" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="940.0" y="352.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="940.0" dy="0">Posterior pituitary</tspan><tspan x="940.0" dy="31.200000000000003">releases oxytocin</tspan></text><path d="M260 410 V490" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="455" text-anchor="start" font-size="22" font-weight="400" fill="#202a2c"><tspan x="290" dy="0">Prolactin in blood</tspan></text><path d="M940 410 V490" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="975" y="455" text-anchor="start" font-size="22" font-weight="400" fill="#202a2c"><tspan x="975" dy="0">Oxytocin in blood</tspan></text><rect x="60" y="495" width="400" height="105" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="260.0" y="539.5" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="260.0" dy="0">Milk-producing cells</tspan><tspan x="260.0" dy="31.200000000000003">synthesize milk</tspan></text><rect x="740" y="495" width="400" height="105" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="940.0" y="539.5" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="940.0" dy="0">Myoepithelial support cells</tspan><tspan x="940.0" dy="31.200000000000003">contract around secretory tissue</tspan></text><path d="M260 600 V675" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M940 600 V675" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="260" y="713" text-anchor="middle" font-size="26" font-weight="700" fill="#202a2c"><tspan x="260" dy="0">MILK SYNTHESIS</tspan></text><text x="940" y="713" text-anchor="middle" font-size="26" font-weight="700" fill="#202a2c"><tspan x="940" dy="0">MILK EJECTION</tspan></text><text x="60" y="800" text-anchor="start" font-size="21" font-weight="400" fill="#202a2c"><tspan x="60" dy="0">Oxytocin is made in hypothalamic neurons, then stored and released posteriorly.</tspan><tspan x="60" dy="27.3">After placental delivery, falling steroid levels support greater milk synthesis.</tspan></text></g></svg>