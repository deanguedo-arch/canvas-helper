<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Sources, signals and testicular targets</title><desc id="desc">GnRH from hypothalamus acts on anterior pituitary. FSH acts through Sertoli support; LH acts on interstitial cells to release testosterone. Local testosterone also supports sperm development.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16766b"/></marker><marker id="bar" viewBox="0 0 10 12" refX="8" refY="6" markerWidth="8" markerHeight="12" orient="auto"><path d="M 8 0 L 8 12" stroke="#985526" stroke-width="2"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="55" text-anchor="start" font-size="32" font-weight="700" fill="#202a2c"><tspan x="55" dy="0">Sources, signals and testicular targets</tspan></text><rect x="425" y="100" width="350" height="95" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="600.0" y="139.5" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="600.0" dy="0">Hypothalamus</tspan><tspan x="600.0" dy="31.200000000000003">releases GnRH</tspan></text><path d="M600 195 V290" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="785" y="239" text-anchor="middle" font-size="21" font-weight="400" fill="#202a2c"><tspan x="785" dy="0">GnRH in connecting</tspan><tspan x="785" dy="27.3">blood vessels</tspan></text><rect x="400" y="295" width="400" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="600.0" y="337.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="600.0" dy="0">Anterior pituitary</tspan><tspan x="600.0" dy="31.200000000000003">releases FSH and LH</tspan></text><path d="M500 395 V440 H260 V505" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 395 V440 H940 V505" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="205" y="474" text-anchor="middle" font-size="25" font-weight="700" fill="#202a2c"><tspan x="205" dy="0">FSH</tspan></text><text x="995" y="474" text-anchor="middle" font-size="25" font-weight="700" fill="#202a2c"><tspan x="995" dy="0">LH</tspan></text><rect x="75" y="510" width="370" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="260.0" y="552.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="260.0" dy="0">Sertoli cells</tspan><tspan x="260.0" dy="31.200000000000003">in seminiferous tubules</tspan></text><rect x="755" y="510" width="370" height="100" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="940.0" y="552.0" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="940.0" dy="0">Interstitial cells</tspan><tspan x="940.0" dy="31.200000000000003">between tubules</tspan></text><path d="M260 610 V710" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="139" y="665" text-anchor="middle" font-size="21" font-weight="400" fill="#202a2c"><tspan x="139" dy="0">support</tspan></text><path d="M940 610 V655" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="940" y="692" text-anchor="middle" font-size="25" font-weight="700" fill="#202a2c"><tspan x="940" dy="0">Testosterone</tspan></text><path d="M820 682 H630 V755 H445" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="715" width="370" height="85" rx="4" fill="#f2f6f5" stroke="#879e99" stroke-width="2"/><text x="260.0" y="765.5" text-anchor="middle" font-size="24" font-weight="400" fill="#202a2c"><tspan x="260.0" dy="0">Germ-cell development</tspan></text><text x="850" y="758" text-anchor="middle" font-size="21" font-weight="400" fill="#202a2c"><tspan x="850" dy="0">Testosterone contributes</tspan><tspan x="850" dy="27.3">to local support and other</tspan><tspan x="850" dy="27.3">responsive tissues.</tspan></text><text x="55" y="853" text-anchor="start" font-size="22" font-weight="400" fill="#202a2c"><tspan x="55" dy="0">Arrows show signalling or support, not one hormone changing into another.</tspan></text></g></svg>