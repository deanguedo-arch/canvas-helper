<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Use an explicit clock for developmental change</title><desc id="desc">A horizontal axis marks0,3,8,20 and38 weeks since fertilization. A matched approximate obstetric-age row gives2,5,10,22 and40 weeks; obstetric age starts from the last menstrual period. Bars distinguish the embryonic period through roughly eight weeks from subsequent fetal growth and maturation. Neurulation begins around post-fertilization week3. Broad trimester descriptions retain overlapping nervous, heart, blood-vessel, limb, bone, lung and brain development. Fetal development does not end at week12. The approximate two-week relation is a typical convention, not an individual schedule or a viability prediction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Use an explicit clock for developmental change</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">State the clock before comparing an age or developmental event.</tspan></text><text x="50" y="176" text-anchor="start" font-size="25" font-weight="700"><tspan x="50" dy="0">Weeks since fertilization</tspan></text><path d="M110 260 L1110 260" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M110 245 L110 275" fill="none" stroke="#176e68" stroke-width="3"/><text x="110" y="220" text-anchor="middle" font-size="24" font-weight="700"><tspan x="110" dy="0">0</tspan></text><text x="110" y="346" text-anchor="middle" font-size="24" font-weight="400"><tspan x="110" dy="0">2</tspan></text><path d="M185 245 L185 275" fill="none" stroke="#176e68" stroke-width="3"/><text x="185" y="220" text-anchor="middle" font-size="24" font-weight="700"><tspan x="185" dy="0">3</tspan></text><text x="185" y="346" text-anchor="middle" font-size="24" font-weight="400"><tspan x="185" dy="0">5</tspan></text><path d="M310 245 L310 275" fill="none" stroke="#176e68" stroke-width="3"/><text x="310" y="220" text-anchor="middle" font-size="24" font-weight="700"><tspan x="310" dy="0">8</tspan></text><text x="310" y="346" text-anchor="middle" font-size="24" font-weight="400"><tspan x="310" dy="0">10</tspan></text><path d="M610 245 L610 275" fill="none" stroke="#176e68" stroke-width="3"/><text x="610" y="220" text-anchor="middle" font-size="24" font-weight="700"><tspan x="610" dy="0">20</tspan></text><text x="610" y="346" text-anchor="middle" font-size="24" font-weight="400"><tspan x="610" dy="0">22</tspan></text><path d="M1060 245 L1060 275" fill="none" stroke="#176e68" stroke-width="3"/><text x="1060" y="220" text-anchor="middle" font-size="24" font-weight="700"><tspan x="1060" dy="0">38</tspan></text><text x="1060" y="346" text-anchor="middle" font-size="24" font-weight="400"><tspan x="1060" dy="0">40</tspan></text><text x="50" y="402" text-anchor="start" font-size="24" font-weight="700"><tspan x="50" dy="0">Approximate obstetric gestational age (weeks): fertilization age + about 2</tspan></text><rect x="110" y="457" width="200" height="66" fill="#d7e5f3" stroke="#45625c" stroke-width="2"/><rect x="310" y="457" width="750" height="66" fill="#d9ead3" stroke="#45625c" stroke-width="2"/><text x="210" y="499" text-anchor="middle" font-size="23" font-weight="700"><tspan x="210" dy="0">Embryonic</tspan></text><text x="685" y="499" text-anchor="middle" font-size="24" font-weight="700"><tspan x="685" dy="0">Fetal growth and maturation continue</tspan></text><text x="50" y="586" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Neurulation begins around the third week after fertilization.</tspan><tspan x="50" dy="30.360000000000003">After roughly eight weeks, the fetal period follows early body patterning.</tspan></text><text x="50" y="689" text-anchor="start" font-size="26" font-weight="700"><tspan x="50" dy="0">Broad trimester patterns overlap</tspan></text><text x="50" y="738" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">First: nervous-system, heart, blood-vessel and limb development.</tspan><tspan x="50" dy="30.360000000000003">Second: continuing growth, movement, bone and nervous-tissue changes.</tspan><tspan x="50" dy="30.360000000000003">Third: growth, energy storage, and further lung and brain maturation.</tspan></text><text x="50" y="868" text-anchor="start" font-size="22" font-weight="400"><tspan x="50" dy="0">The +2-week relation is a typical dating convention, not an exact individual schedule.</tspan></text></g></svg>