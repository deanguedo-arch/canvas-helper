stroke="#738d89" stroke-width="1"/><line x1="406" y1="235.0" x2="406" y2="235.0" stroke="#738d89" stroke-width="1"/><line x1="422" y1="222.00961894323345" x2="422" y2="247.99038105676655" stroke="#738d89" stroke-width="1"/><line x1="438" y1="222.0096189432334" x2="438" y2="247.9903810567666" stroke="#738d89" stroke-width="1"/><line x1="454" y1="234.99999999999997" x2="454" y2="235.00000000000003" stroke="#738d89" stroke-width="1"/><rect x="164" y="205" width="108" height="60" fill="none" stroke="#51716e" stroke-width="2"/><text x="166" y="297" font-size="22" text-anchor="start" fill="#213033">gene region</text><text x="520" y="243" font-size="23" text-anchor="start" fill="#213033">Many other loci lie along the same molecule.</text><path d="M245,324 L245,364" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="105" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="170" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="235" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="300" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="365" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="430" cy="443" r="22" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><path d="M60,443 Q100,385 130,443 T195,443 T260,443 T325,443 T390,443 T455,443" fill="none" stroke="#176e6a" stroke-width="4"/><text x="540" y="420" font-size="23" text-anchor="start" fill="#213033">DNA associated with histone proteins</text><text x="540" y="451" font-size="23" text-anchor="start" fill="#213033">is chromatin. Packaging and access</text><text x="540" y="482" font-size="23" text-anchor="start" fill="#213033">are regulated; this is one simplified level.</text><path d="M245,502 L245,556" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><rect x="225" y="591" width="35" height="142" rx="17" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><rect x="225" y="650" width="35" height="9" fill="#a55a28"/><text x="355" y="618" font-size="23" text-anchor="start" fill="#213033">One schematic condensed, unduplicated chromosome</text><text x="355" y="649" font-size="23" text-anchor="start" fill="#213033">contains a long DNA molecule associated with proteins.</text><text x="355" y="680" font-size="23" text-anchor="start" fill="#213033">Condensation reorganizes material; it does not create DNA.</text><text x="50" y="793" font-size="22" text-anchor="start" fill="#213033">The enlarged gene region, beads and chromosome use different scales.</text><text x="50" y="824" font-size="22" text-anchor="start" fill="#213033">The band-like mark is a model locator, not the measured size of a gene.</text></g></svg>
