<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Connect DNA regions, chromatin and chromosomes</title><desc id="description">Three deliberately different scales show a marked gene region along a longer DNA molecule, DNA associated with histone proteins as simplified chromatin, and one schematic condensed unduplicated chromosome. Many loci occupy a chromosome. The models do not prescribe a universal thirty-nanometre fibre, depict a gene as an entire chromosome or imply that condensation creates DNA. The coloured chromosome mark is a locator, not a measured gene-sized band.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Connect DNA regions, chromatin and chromosomes</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">Follow the level of organization before interpreting a label.</text><text x="50" y="177" font-size="26" text-anchor="start" fill="#213033">A gene occupies a region of a longer DNA molecule</text><polyline points="70.0,235.00 74.0,238.88 78.0,242.50 82.0,245.61 86.0,247.99 90.0,249.49 94.0,250.00 98.0,249.49 102.0,247.99 106.0,245.61 110.0,242.50 114.0,238.88 118.0,235.00 122.0,231.12 126.0,227.50 130.0,224.39 134.0,222.01 138.0,220.51 142.0,220.00 146.0,220.51 150.0,222.01 154.0,224.39 158.0,227.50 162.0,231.12 166.0,235.00 170.0,238.88 174.0,242.50 178.0,245.61 182.0,247.99 186.0,249.49 190.0,250.00 194.0,249.49 198.0,247.99 202.0,245.61 206.0,242.50 210.0,238.88 214.0,235.00 218.0,231.12 222.0,227.50 226.0,224.39 230.0,222.01 234.0,220.51 238.0,220.00 242.0,220.51 246.0,222.01 250.0,224.39 254.0,227.50 258.0,231.12 262.0,235.00 266.0,238.88 270.0,242.50 274.0,245.61 278.