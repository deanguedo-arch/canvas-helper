<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Count allele copies, then choose the denominator</title><desc id="desc">A synthetic sample of 36 AA, 48 Aa and 16 aa individuals contains 120 A and 80 a copies among 200 total. Direct allele frequencies are 0.60 and 0.40; equilibrium is not required.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="55" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">Count allele copies, then choose the denominator</tspan></text><text x="55" y="108" text-anchor="start" font-size="24" font-weight="400"><tspan x="55" dy="0">One diploid individual contributes two copies at this autosomal locus.</tspan></text><text x="215" y="174" text-anchor="middle" font-size="30" font-weight="700"><tspan x="215" dy="0">AA</tspan></text><circle cx="175" cy="225" r="30" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="175" y="234" text-anchor="middle" font-size="25" font-weight="700"><tspan x="175" dy="0">A</tspan></text><circle cx="255" cy="225" r="30" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="255" y="234" text-anchor="middle" font-size="25" font-weight="700"><tspan x="255" dy="0">A</tspan></text><text x="215" y="300" text-anchor="middle" font-size="25" font-weight="400"><tspan x="215" dy="0">36 individuals</tspan></text><text x="215" y="350" text-anchor="middle" font-size="25" font-weight="400"><tspan x="215" dy="0">72 A copies</tspan><tspan x="215" dy="32.5">0 a copies</tspan></text><text x="600" y="174" text-anchor="middle" font-size="30" font-weight="700"><tspan x="600" dy="0">Aa</tspan></text><circle cx="560" cy="225" r="30" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="560" y="234" text-anchor="middle" font-size="25" font-weight="700"><tspan x="560" dy="0">A</tspan></text><circle cx="640" cy="225" r="30" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="640" y="234" text-anchor="middle" font-size="25" font-weight="700"><tspan x="640" dy="0">a</tspan></text><text x="600" y="300" text-anchor="middle" font-size="25" font-weight="400"><tspan x="600" dy="0">48 individuals</tspan></text><text x="600" y="350" text-anchor="middle" font-size="25" font-weight="400"><tspan x="600" dy="0">48 A copies</tspan><tspan x="600" dy="32.5">48 a copies</tspan></text><text x="985" y="174" text-anchor="middle" font-size="30" font-weight="700"><tspan x="985" dy="0">aa</tspan></text><circle cx="945" cy="225" r="30" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="945" y="234" text-anchor="middle" font-size="25" font-weight="700"><tspan x="945" dy="0">a</tspan></text><circle cx="1025" cy="225" r="30" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="1025" y="234" text-anchor="middle" font-size="25" font-weight="700"><tspan x="1025" dy="0">a</tspan></text><text x="985" y="300" text-anchor="middle" font-size="25" font-weight="400"><tspan x="985" dy="0">16 individuals</tspan></text><text x="985" y="350" text-anchor="middle" font-size="25" font-weight="400"><tspan x="985" dy="0">0 A copies</tspan><tspan x="985" dy="32.5">32 a copies</tspan></text><text x="55" y="466" text-anchor="start" font-size="27" font-weight="700"><tspan x="55" dy="0">N = 36 + 48 + 16 = 100 individuals   →   2N = 200 allele copies</tspan></text><rect x="100" y="530" width="600" height="100" fill="#c4e2db" stroke="#718680" stroke-width="2"/><rect x="700" y="530" width="400" height="100" fill="#f1d7a9" stroke="#718680" stroke-width="2"/><text x="400" y="572" text-anchor="middle" font-size="25" font-weight="400"><tspan x="400" dy="0">120 A copies</tspan><tspan x="400" dy="32.5">p = 120 / 200 = 0.60</tspan></text><text x="900" y="572" text-anchor="middle" font-size="25" font-weight="400"><tspan x="900" dy="0">80 a copies</tspan><tspan x="900" dy="32.5">q = 80 / 200 = 0.40</tspan></text><text x="55" y="707" text-anchor="start" font-size="25" font-weight="400"><tspan x="55" dy="0">The bar represents all 200 allele copies, not 200 organisms.</tspan><tspan x="55" dy="32.5">Direct counting uses observed genotypes; it does not require equilibrium.</tspan></text><text x="55" y="827" text-anchor="start" font-size="21" font-weight="400"><tspan x="55" dy="0">Original synthetic teaching sample. Circle pairs show copies per individual, not group size.</tspan></text></g></svg>