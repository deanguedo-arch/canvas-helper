<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Count births, deaths and movement over one interval</title><desc id="desc">Births add120 and deaths remove70 within the defined population; immigration adds30 across its boundary and emigration removes20. All are ten-day counts, not rates. Net change is120 plus30 minus70 minus20 equals60, taking the initial1000 to1060. Movement arrows cross the boundary; births and deaths are shown inside. A closed model excludes movement but can still change through births and deaths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Count births, deaths and movement over one interval</tspan></text><text x="55" y="112" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">One defined population boundary; all counts cover the same ten-day interval.</tspan></text><rect x="385" y="190" width="430" height="410" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="600" y="235" text-anchor="middle" font-size="25" font-weight="700"><tspan x="600" dy="0">Living population</tspan></text><text x="600" y="295" text-anchor="middle" font-size="25" font-weight="400"><tspan x="600" dy="0">Births: +120</tspan></text><path d="M600 315 L600 370" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="423" text-anchor="middle" font-size="27" font-weight="700"><tspan x="600" dy="0">Initial N = 1000</tspan></text><text x="600" y="465" text-anchor="middle" font-size="27" font-weight="700"><tspan x="600" dy="0">Final N = 1060</tspan></text><path d="M600 488 L600 537" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="578" text-anchor="middle" font-size="25" font-weight="400"><tspan x="600" dy="0">Deaths: −70</tspan></text><text x="195" y="334" text-anchor="middle" font-size="25" font-weight="400"><tspan x="195" dy="0">Immigration</tspan><tspan x="195" dy="33.75">+30</tspan></text><path d="M90 407 L430 407" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 407 L1110 407" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="1025" y="334" text-anchor="middle" font-size="25" font-weight="400"><tspan x="1025" dy="0">Emigration</tspan><tspan x="1025" dy="33.75">−20</tspan></text><text x="55" y="685" text-anchor="start" font-size="28" font-weight="700"><tspan x="55" dy="0">ΔN = (120 + 30) − (70 + 20) = +60 individuals</tspan></text><text x="55" y="744" text-anchor="start" font-size="26" font-weight="400"><tspan x="55" dy="0">Final population = 1000 + 60 = 1060 individuals.</tspan></text><text x="55" y="811" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">A closed-population model sets immigration and emigration to zero.</tspan><tspan x="55" dy="31.05">Births and deaths can still change its size.</tspan></text></g></svg>