<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Keep all counted cells in the mitotic-index denominator</title><desc id="description">One hundred symbolic count boxes include28 marked mitotic and72 interphase, exactly matching the existing teaching example. The mitotic index is28/100=28 percent. Boxes are a count model, not invented photomicrographs or new observed data. A separate existing worked example uses6 percent metaphase in an assumed20-hour cycle to estimate1.2 hours, only under approximate steady asynchronous growth, similar cycles and representative sampling. Cell death, delays and biased fields can invalidate the duration inference. Actual required image observations and counts remain a separate learner task.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Keep all counted cells in the mitotic-index denominator</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">A worked count model explains the method; actual observations still need classification.</text><text x="50" y="177" font-size="25" text-anchor="start" fill="#213033">Illustrative count from the teaching example: 100 cells</text><rect x="60" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="95" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="130" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="165" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="200" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="235" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="270" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="305" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="340" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="375" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="410" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="445" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="480" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="515" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="550" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="585" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="620" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="655" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="690" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="725" y="220" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="60" y="255" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="95" y="255" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="130" y="255" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="165" y="255" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="200" y="255" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="235" y="255" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="270" y="255" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="305" y="255" width="24" height="24" fill="#176e6a" stroke="#51716e" stroke-width="2"/><rect x="340" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="375" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="410" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="445" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="480" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="515" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="550" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="585" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="620" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="655" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="690" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="725" y="255" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="60" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="95" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="130" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="165" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="200" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="235" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="270" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="305" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="340" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="375" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="410" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="445" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="480" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="515" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="550" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="585" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="620" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="655" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="690" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="725" y="290" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="60" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="95" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="130" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="165" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="200" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="235" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="270" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="305" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="340" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="375" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="410" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="445" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="480" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="515" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="550" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="585" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="620" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="655" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="690" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="725" y="325" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="60" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="95" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="130" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="165" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="200" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="235" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="270" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="305" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="340" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="375" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="410" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="445" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="480" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="515" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="550" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="585" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="620" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="655" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="690" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="725" y="360" width="24" height="24" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><rect x="830" y="218" width="25" height="25" fill="#176e6a" stroke="#51716e" stroke-width="2"/><text x="868" y="240" font-size="23" text-anchor="start" fill="#213033">28 mitotic</text><rect x="830" y="272" width="25" height="25" fill="#eef0ef" stroke="#51716e" stroke-width="2"/><text x="868" y="294" font-size="23" text-anchor="start" fill="#213033">72 interphase</text><text x="50" y="464" font-size="25" text-anchor="start" fill="#213033">Mitotic index = mitotic cells / all counted cells = 28 / 100 = 28%.</text><text x="50" y="507" font-size="25" text-anchor="start" fill="#213033">The denominator includes interphase cells. The marks are counts, not microscopy.</text><rect x="50" y="580" width="1100" height="145" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="75" y="619" font-size="23" text-anchor="start" fill="#213033">Duration estimate requires additional assumptions:</text><text x="75" y="656" font-size="23" text-anchor="start" fill="#213033">A roughly steady, asynchronous population with similar cycles and representative sampling.</text><text x="75" y="693" font-size="23" text-anchor="start" fill="#213033">In a 20-hour model cycle, 6% in metaphase suggests 0.06 × 20 = 1.2 hours.</text><text x="50" y="789" font-size="22" text-anchor="start" fill="#213033">That estimate is not direct timing. Checkpoints, cell death and biased image selection can distort it.</text><text x="50" y="820" font-size="22" text-anchor="start" fill="#213033">Retain uncertain classifications and compare multiple fields before generalizing.</text></g></svg>
