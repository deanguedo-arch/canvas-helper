<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">Use samples to estimate an explicitly bounded population</title><desc id="desc">Five one-square-metre quadrats contain2,8,4,10 and6 individuals, represented by exactly matching dot counts. Thirty individuals in five square metres gives mean density six per square metre and an estimate1200 across comparable200 square metres. A separate mark–recapture example first marks40, then catches50 including10 previously marked, giving40 times50 divided by10 equals200. Mixing, mark retention, comparable capture probability and approximate closure are explicit assumptions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="960" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Use samples to estimate an explicitly bounded population</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Five separate 1 m² quadrats; dots show the supplied counts.</tspan></text><rect x="55" y="155" width="180" height="160" fill="#fff" stroke="#627b75" stroke-width="2"/><circle cx="90" cy="190" r="9" fill="#16766b"/><circle cx="126" cy="190" r="9" fill="#16766b"/><text x="145" y="358" text-anchor="middle" font-size="22" font-weight="400"><tspan x="145" dy="0">Q1: 2 individuals</tspan></text><rect x="275" y="155" width="180" height="160" fill="#fff" stroke="#627b75" stroke-width="2"/><circle cx="310" cy="190" r="9" fill="#16766b"/><circle cx="346" cy="190" r="9" fill="#16766b"/><circle cx="382" cy="190" r="9" fill="#16766b"/><circle cx="418" cy="190" r="9" fill="#16766b"/><circle cx="310" cy="230" r="9" fill="#16766b"/><circle cx="346" cy="230" r="9" fill="#16766b"/><circle cx="382" cy="230" r="9" fill="#16766b"/><circle cx="418" cy="230" r="9" fill="#16766b"/><text x="365" y="358" text-anchor="middle" font-size="22" font-weight="400"><tspan x="365" dy="0">Q2: 8 individuals</tspan></text><rect x="495" y="155" width="180" height="160" fill="#fff" stroke="#627b75" stroke-width="2"/><circle cx="530" cy="190" r="9" fill="#16766b"/><circle cx="566" cy="190" r="9" fill="#16766b"/><circle cx="602" cy="190" r="9" fill="#16766b"/><circle cx="638" cy="190" r="9" fill="#16766b"/><text x="585" y="358" text-anchor="middle" font-size="22" font-weight="400"><tspan x="585" dy="0">Q3: 4 individuals</tspan></text><rect x="715" y="155" width="180" height="160" fill="#fff" stroke="#627b75" stroke-width="2"/><circle cx="750" cy="190" r="9" fill="#16766b"/><circle cx="786" cy="190" r="9" fill="#16766b"/><circle cx="822" cy="190" r="9" fill="#16766b"/><circle cx="858" cy="190" r="9" fill="#16766b"/><circle cx="750" cy="230" r="9" fill="#16766b"/><circle cx="786" cy="230" r="9" fill="#16766b"/><circle cx="822" cy="230" r="9" fill="#16766b"/><circle cx="858" cy="230" r="9" fill="#16766b"/><circle cx="750" cy="270" r="9" fill="#16766b"/><circle cx="786" cy="270" r="9" fill="#16766b"/><text x="805" y="358" text-anchor="middle" font-size="22" font-weight="400"><tspan x="805" dy="0">Q4: 10 individuals</tspan></text><rect x="935" y="155" width="180" height="160" fill="#fff" stroke="#627b75" stroke-width="2"/><circle cx="970" cy="190" r="9" fill="#16766b"/><circle cx="1006" cy="190" r="9" fill="#16766b"/><circle cx="1042" cy="190" r="9" fill="#16766b"/><circle cx="1078" cy="190" r="9" fill="#16766b"/><circle cx="970" cy="230" r="9" fill="#16766b"/><circle cx="1006" cy="230" r="9" fill="#16766b"/><text x="1025" y="358" text-anchor="middle" font-size="22" font-weight="400"><tspan x="1025" dy="0">Q5: 6 individuals</tspan></text><text x="55" y="429" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">Total: 30 individuals in 5 m²  →  mean density: 6 individuals/m²</tspan></text><text x="55" y="480" text-anchor="start" font-size="24" font-weight="400"><tspan x="55" dy="0">Comparable habitat: 200 m²  →  estimated abundance: 6 × 200 = 1200</tspan></text><text x="55" y="527" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">The estimate depends on representative placement and consistent detection.</tspan></text><path d="M55 567 L1145 567" fill="none" stroke="#a8b8b3" stroke-width="3"/><text x="55" y="615" text-anchor="start" font-size="26" font-weight="700"><tspan x="55" dy="0">A separate mark–recapture model for mobile organisms</tspan></text><rect x="55" y="656" width="340" height="160" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="225" y="700" text-anchor="middle" font-size="24" font-weight="400"><tspan x="225" dy="0">Marked in first catch: 40</tspan><tspan x="225" dy="32.400000000000006">Released and mixed</tspan></text><path d="M403 735 L480 735" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><rect x="495" y="656" width="350" height="160" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="670" y="700" text-anchor="middle" font-size="24" font-weight="400"><tspan x="670" dy="0">Second catch: 50</tspan><tspan x="670" dy="32.400000000000006">Previously marked: 10</tspan></text><path d="M853 735 L925 735" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="1040" y="706" text-anchor="middle" font-size="23" font-weight="700"><tspan x="1040" dy="0">N ≈ 40 × 50 / 10</tspan><tspan x="1040" dy="31.05">N ≈ 200</tspan></text><text x="55" y="872" text-anchor="start" font-size="22" font-weight="400"><tspan x="55" dy="0">Assume mixing, retained marks, comparable capture probability and approximate closure.</tspan><tspan x="55" dy="29.700000000000003">These are supplied models; no learner handling of organisms is required.</tspan></text></g></svg>