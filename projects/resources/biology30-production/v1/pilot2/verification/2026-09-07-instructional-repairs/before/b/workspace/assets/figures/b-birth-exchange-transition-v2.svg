<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Connect birth stages with changing sources of support</title><desc id="desc">Three broad stages show cervical dilation, delivery of the fetus and placental delivery. A separate before/after comparison traces oxygen transfer at the maternal-fetal placental interface before birth and from ventilated newborn lungs to newborn blood afterward. The two prenatal bloodstreams remain distinct; arrows indicate an exchange relationship, not direct maternal blood flow into fetal vessels. Effective ventilation and circulatory adaptation are required as placental exchange ends. Placental steroid contributions decline after placental delivery. The diagram is a conceptual sequence, not clinical instructions or a timed schedule.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Connect birth stages with changing sources of support</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Broad events describe a transition; they do not prescribe a clinical schedule.</tspan></text><rect x="65" y="190" width="280" height="110" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="205" y="235" text-anchor="middle" font-size="24" font-weight="700"><tspan x="205" dy="0">Cervical dilation</tspan><tspan x="205" dy="31.68">opening widens</tspan></text><path d="M357 245 L438 245" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="190" width="280" height="110" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="600" y="235" text-anchor="middle" font-size="24" font-weight="700"><tspan x="600" dy="0">Delivery</tspan><tspan x="600" dy="31.68">fetus passes through</tspan></text><path d="M752 245 L833 245" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="855" y="190" width="280" height="110" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="995" y="235" text-anchor="middle" font-size="24" font-weight="700"><tspan x="995" dy="0">Placental delivery</tspan><tspan x="995" dy="31.68">placenta separates</tspan></text><text x="50" y="405" text-anchor="start" font-size="27" font-weight="700"><tspan x="50" dy="0">Before birth</tspan></text><text x="50" y="451" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Placental interface</tspan><tspan x="50" dy="30.360000000000003">supports exchange with fetal blood.</tspan></text><rect x="570" y="385" width="265" height="100" fill="#f0dbc8" stroke="#45625c" stroke-width="2"/><text x="702" y="427" text-anchor="middle" font-size="22" font-weight="400"><tspan x="702" dy="0">Maternal side</tspan><tspan x="702" dy="29.040000000000003">of the interface</tspan></text><path d="M850 435 L922 435" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="940" y="385" width="210" height="100" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="1045" y="427" text-anchor="middle" font-size="22" font-weight="400"><tspan x="1045" dy="0">Fetal</tspan><tspan x="1045" dy="29.040000000000003">blood</tspan></text><text x="570" y="536" text-anchor="start" font-size="22" font-weight="400"><tspan x="570" dy="0">The two bloodstreams remain distinct.</tspan></text><text x="50" y="637" text-anchor="start" font-size="27" font-weight="700"><tspan x="50" dy="0">After delivery</tspan></text><text x="50" y="683" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Effective lung ventilation</tspan><tspan x="50" dy="30.360000000000003">and circulatory adaptation are needed.</tspan></text><rect x="570" y="617" width="265" height="100" fill="#d7e5f3" stroke="#45625c" stroke-width="2"/><text x="702" y="659" text-anchor="middle" font-size="22" font-weight="400"><tspan x="702" dy="0">Air in the</tspan><tspan x="702" dy="29.040000000000003">newborn lungs</tspan></text><path d="M850 667 L922 667" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="940" y="617" width="210" height="100" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="1045" y="659" text-anchor="middle" font-size="22" font-weight="400"><tspan x="1045" dy="0">Newborn</tspan><tspan x="1045" dy="29.040000000000003">blood</tspan></text><text x="50" y="839" text-anchor="start" font-size="22" font-weight="400"><tspan x="50" dy="0">Placental exchange ends; placental steroid contributions decline after placental delivery.</tspan></text><text x="886" y="417" text-anchor="middle" font-size="21">O₂</text><text x="886" y="649" text-anchor="middle" font-size="21">O₂</text></g></svg>