<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Why the heterozygote term is 2pq</title><desc id="desc">A probability grid with gamete frequencies 0.60 and 0.40 has AA 0.36, two Aa regions of 0.24 each, and aa 0.16. Areas match these probabilities. The two heterozygote routes combine to 0.48.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="55" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">Why the heterozygote term is 2pq</tspan></text><text x="55" y="110" text-anchor="start" font-size="24" font-weight="400"><tspan x="55" dy="0">Random contributions with p = 0.60 and q = 0.40 in both gamete pools</tspan></text><text x="600" y="160" text-anchor="middle" font-size="24" font-weight="700"><tspan x="600" dy="0">Contribution 2</tspan></text><rect x="320" y="225" width="390.0" height="252.0" fill="#c4e2db" stroke="#718680" stroke-width="2"/><text x="515.0" y="341.0" text-anchor="middle" font-size="27" font-weight="400"><tspan x="515.0" dy="0">AA</tspan><tspan x="515.0" dy="35.1">p × p = 0.36</tspan></text><rect x="710.0" y="225" width="260.0" height="252.0" fill="#e8edf3" stroke="#718680" stroke-width="2"/><text x="840.0" y="341.0" text-anchor="middle" font-size="27" font-weight="400"><tspan x="840.0" dy="0">Aa</tspan><tspan x="840.0" dy="35.1">p × q = 0.24</tspan></text><rect x="320" y="477.0" width="390.0" height="168.0" fill="#e8edf3" stroke="#718680" stroke-width="2"/><text x="515.0" y="551.0" text-anchor="middle" font-size="27" font-weight="400"><tspan x="515.0" dy="0">Aa</tspan><tspan x="515.0" dy="35.1">q × p = 0.24</tspan></text><rect x="710.0" y="477.0" width="260.0" height="168.0" fill="#f1d7a9" stroke="#718680" stroke-width="2"/><text x="840.0" y="551.0" text-anchor="middle" font-size="27" font-weight="400"><tspan x="840.0" dy="0">aa</tspan><tspan x="840.0" dy="35.1">q × q = 0.16</tspan></text><text x="515.0" y="205" text-anchor="middle" font-size="24" font-weight="400"><tspan x="515.0" dy="0">A (0.60)</tspan></text><text x="840.0" y="205" text-anchor="middle" font-size="24" font-weight="400"><tspan x="840.0" dy="0">a (0.40)</tspan></text><text x="175" y="351.0" text-anchor="middle" font-size="22" font-weight="400"><tspan x="175" dy="0">Contribution 1</tspan><tspan x="175" dy="28.6">A (0.60)</tspan></text><text x="175" y="561.0" text-anchor="middle" font-size="24" font-weight="400"><tspan x="175" dy="0">a (0.40)</tspan></text><text x="55" y="713" text-anchor="start" font-size="27" font-weight="700"><tspan x="55" dy="0">Two mutually exclusive routes make Aa: pq + qp = 2pq = 0.48.</tspan></text><text x="55" y="776" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Expected AA + Aa + aa = 0.36 + 0.48 + 0.16 = 1.</tspan><tspan x="55" dy="29.900000000000002">Cell areas match the stated probabilities; these are expected genotype fractions.</tspan></text></g></svg>