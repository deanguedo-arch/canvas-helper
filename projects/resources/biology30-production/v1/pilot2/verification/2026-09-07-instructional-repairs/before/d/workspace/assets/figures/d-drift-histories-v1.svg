<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Chance effects and two different population histories</title><desc id="desc">Two illustrative sets of replicate samples start at p0.50. Small populations of ten contributors end at0.10,0.70,0.40; larger populations of1000 have illustrative outcomes0.49,0.51,0.50. These selected examples depict a general sampling tendency, not its statistical proof. Founder events start a new population with colonists; bottlenecks sharply reduce an existing population. Both can intensify drift. Drift is not absent in large finite populations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">Chance effects and two different population histories</tspan></text><text x="55" y="112" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">All model populations start at p = 0.50. These are illustrative replicate outcomes.</tspan></text><text x="55" y="185" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">10 contributors</tspan></text><path d="M365 232 L365 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="365" y="280" text-anchor="middle" font-size="19" font-weight="400"><tspan x="365" dy="0">0.0</tspan></text><path d="M435 232 L435 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M505 232 L505 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="505" y="280" text-anchor="middle" font-size="19" font-weight="400"><tspan x="505" dy="0">0.2</tspan></text><path d="M575 232 L575 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M645 232 L645 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="645" y="280" text-anchor="middle" font-size="19" font-weight="400"><tspan x="645" dy="0">0.4</tspan></text><path d="M715 232 L715 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M785 232 L785 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="785" y="280" text-anchor="middle" font-size="19" font-weight="400"><tspan x="785" dy="0">0.6</tspan></text><path d="M855 232 L855 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M925 232 L925 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="925" y="280" text-anchor="middle" font-size="19" font-weight="400"><tspan x="925" dy="0">0.8</tspan></text><path d="M995 232 L995 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M1065 232 L1065 248" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="1065" y="280" text-anchor="middle" font-size="19" font-weight="400"><tspan x="1065" dy="0">1.0</tspan></text><path d="M365 240 L1065 240" fill="none" stroke="#758782" stroke-width="3"/><circle cx="435.0" cy="204" r="7" fill="#16766b"/><path d="M715 233 L435.0 204" fill="none" stroke="#16766b" stroke-width="3"/><circle cx="855.0" cy="188" r="7" fill="#16766b"/><path d="M715 233 L855.0 188" fill="none" stroke="#16766b" stroke-width="3"/><circle cx="645.0" cy="172" r="7" fill="#16766b"/><path d="M715 233 L645.0 172" fill="none" stroke="#16766b" stroke-width="3"/><text x="1110" y="280" text-anchor="middle" font-size="23" font-weight="400"><tspan x="1110" dy="0">p</tspan></text><text x="365" y="316" text-anchor="start" font-size="23" font-weight="400"><tspan x="365" dy="0">Possible p: 0.10, 0.70, 0.40</tspan></text><text x="55" y="355" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">1000 contributors</tspan></text><path d="M365 402 L365 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="365" y="450" text-anchor="middle" font-size="19" font-weight="400"><tspan x="365" dy="0">0.0</tspan></text><path d="M435 402 L435 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M505 402 L505 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="505" y="450" text-anchor="middle" font-size="19" font-weight="400"><tspan x="505" dy="0">0.2</tspan></text><path d="M575 402 L575 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M645 402 L645 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="645" y="450" text-anchor="middle" font-size="19" font-weight="400"><tspan x="645" dy="0">0.4</tspan></text><path d="M715 402 L715 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M785 402 L785 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="785" y="450" text-anchor="middle" font-size="19" font-weight="400"><tspan x="785" dy="0">0.6</tspan></text><path d="M855 402 L855 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M925 402 L925 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="925" y="450" text-anchor="middle" font-size="19" font-weight="400"><tspan x="925" dy="0">0.8</tspan></text><path d="M995 402 L995 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><path d="M1065 402 L1065 418" fill="none" stroke="#a4b2ae" stroke-width="3"/><text x="1065" y="450" text-anchor="middle" font-size="19" font-weight="400"><tspan x="1065" dy="0">1.0</tspan></text><path d="M365 410 L1065 410" fill="none" stroke="#758782" stroke-width="3"/><circle cx="708.0" cy="374" r="7" fill="#16766b"/><path d="M715 403 L708.0 374" fill="none" stroke="#16766b" stroke-width="3"/><circle cx="722.0" cy="358" r="7" fill="#16766b"/><path d="M715 403 L722.0 358" fill="none" stroke="#16766b" stroke-width="3"/><circle cx="715.0" cy="342" r="7" fill="#16766b"/><path d="M715 403 L715.0 342" fill="none" stroke="#16766b" stroke-width="3"/><text x="1110" y="450" text-anchor="middle" font-size="23" font-weight="400"><tspan x="1110" dy="0">p</tspan></text><text x="365" y="486" text-anchor="start" font-size="23" font-weight="400"><tspan x="365" dy="0">Possible p: 0.49, 0.51, 0.50</tspan></text><text x="55" y="558" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Smaller populations generally show larger proportional sampling effects.</tspan></text><text x="55" y="640" text-anchor="start" font-size="23" font-weight="700"><tspan x="55" dy="0">Founder event</tspan></text><rect x="275" y="610" width="220" height="76" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="385" y="642" text-anchor="middle" font-size="20" font-weight="400"><tspan x="385" dy="0">Source population</tspan><tspan x="385" dy="27.0">before the event</tspan></text><path d="M500 648 L578 648" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="635" text-anchor="middle" font-size="22" font-weight="400"><tspan x="790" dy="0">Small group colonizes</tspan><tspan x="790" dy="29.700000000000003">New population elsewhere</tspan></text><text x="55" y="748" text-anchor="start" font-size="23" font-weight="700"><tspan x="55" dy="0">Bottleneck</tspan></text><rect x="275" y="718" width="220" height="76" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="385" y="750" text-anchor="middle" font-size="20" font-weight="400"><tspan x="385" dy="0">Source population</tspan><tspan x="385" dy="27.0">before the event</tspan></text><path d="M500 756 L578 756" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="743" text-anchor="middle" font-size="22" font-weight="400"><tspan x="790" dy="0">Sharp reduction leaves survivors</tspan><tspan x="790" dy="29.700000000000003">Existing population continues</tspan></text><text x="55" y="855" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Both can change sampled allele shares by chance; neither guarantees adaptation.</tspan></text></g></svg>