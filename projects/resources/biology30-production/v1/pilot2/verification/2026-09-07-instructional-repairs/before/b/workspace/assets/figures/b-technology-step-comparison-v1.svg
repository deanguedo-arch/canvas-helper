<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Locate what each reproductive technology changes</title><desc id="desc">Four rows connect barrier methods to chances for gametes to meet, hormonal methods to signals or tissue conditions, duct surgery to transport, and IVF to fertilization outside the body. Mechanisms do not guarantee effectiveness or later implantation and development. A comparison needs a defined outcome, denominator and time interval, alongside access, cultural views, environmental resources, ethics and cost. Genetic contribution, gestation and social-parent roles can overlap without ranking families or making universal legal claims. The figure gives no named treatment regimen or individual recommendation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Locate what each reproductive technology changes</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Match the affected step to the evidence and the stated purpose.</tspan></text><rect x="50" y="175" width="340" height="84" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="70" y="220" text-anchor="start" font-size="25" font-weight="700"><tspan x="70" dy="0">Barrier method</tspan></text><path d="M410 216 L515 216" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="220" text-anchor="start" font-size="23" font-weight="400"><tspan x="550" dy="0">Reduces chances for gametes to meet</tspan></text><rect x="50" y="290" width="340" height="84" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="70" y="335" text-anchor="start" font-size="25" font-weight="700"><tspan x="70" dy="0">Hormonal method</tspan></text><path d="M410 331 L515 331" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="335" text-anchor="start" font-size="23" font-weight="400"><tspan x="550" dy="0">Changes signals or tissue conditions</tspan></text><rect x="50" y="405" width="340" height="84" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="70" y="450" text-anchor="start" font-size="25" font-weight="700"><tspan x="70" dy="0">Duct surgery</tspan></text><path d="M410 446 L515 446" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="450" text-anchor="start" font-size="23" font-weight="400"><tspan x="550" dy="0">Changes a transport passage</tspan></text><rect x="50" y="520" width="340" height="84" fill="#eaf3f0" stroke="#45625c" stroke-width="2"/><text x="70" y="565" text-anchor="start" font-size="25" font-weight="700"><tspan x="70" dy="0">IVF</tspan></text><path d="M410 561 L515 561" fill="none" stroke="#176e68" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="565" text-anchor="start" font-size="23" font-weight="400"><tspan x="550" dy="0">Places fertilization outside the body</tspan></text><text x="50" y="733" text-anchor="start" font-size="25" font-weight="700"><tspan x="50" dy="0">Mechanism alone does not establish effectiveness or later success.</tspan></text><text x="50" y="781" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Name the measured outcome, denominator and time interval.</tspan><tspan x="50" dy="30.360000000000003">Compare access, cultural views, environmental demands, ethics and costs.</tspan></text><text x="50" y="871" text-anchor="start" font-size="21" font-weight="400"><tspan x="50" dy="0">Different genetic, gestational and social-parent roles may overlap without ranking families.</tspan></text></g></svg>