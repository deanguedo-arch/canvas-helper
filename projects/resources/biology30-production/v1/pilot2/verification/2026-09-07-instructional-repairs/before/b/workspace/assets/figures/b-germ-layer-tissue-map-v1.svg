<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Map tissue origins without flattening whole organs</title><desc id="desc">Three columns map ectoderm to epidermis, nervous system and pituitary tissues; mesoderm to muscle, much of skeleton, blood vessels and adrenal cortex; and endoderm to digestive and airway linings, pancreatic endocrine tissue and thyroid follicular cells. A simplified digestive-wall cross-section shows endodermal inner lining and mesodermal muscle/support surrounding a lumen. It is an origin diagram, not histological layer detail. Whole organs can combine tissue origins. Endocrine glands are not assigned wholesale to one germ layer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176e68"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Map tissue origins without flattening whole organs</tspan></text><text x="50" y="112" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Trace a named tissue—not every component of a whole organ.</tspan></text><rect x="50" y="195" width="340" height="62" fill="#d7e5f3" stroke="#45625c" stroke-width="2"/><text x="220" y="236" text-anchor="middle" font-size="27" font-weight="700"><tspan x="220" dy="0">Ectoderm</tspan></text><text x="62" y="308" text-anchor="start" font-size="22" font-weight="400"><tspan x="62" dy="0">Epidermis</tspan><tspan x="62" dy="29.040000000000003">Nervous system</tspan><tspan x="62" dy="29.040000000000003">Pituitary tissues</tspan></text><rect x="430" y="195" width="340" height="62" fill="#f0dbc8" stroke="#45625c" stroke-width="2"/><text x="600" y="236" text-anchor="middle" font-size="27" font-weight="700"><tspan x="600" dy="0">Mesoderm</tspan></text><text x="442" y="308" text-anchor="start" font-size="22" font-weight="400"><tspan x="442" dy="0">Muscle; much of skeleton</tspan><tspan x="442" dy="29.040000000000003">Blood and blood vessels</tspan><tspan x="442" dy="29.040000000000003">Adrenal cortex</tspan></text><rect x="810" y="195" width="340" height="62" fill="#d9ead3" stroke="#45625c" stroke-width="2"/><text x="980" y="236" text-anchor="middle" font-size="27" font-weight="700"><tspan x="980" dy="0">Endoderm</tspan></text><text x="822" y="308" text-anchor="start" font-size="22" font-weight="400"><tspan x="822" dy="0">Digestive/airway linings</tspan><tspan x="822" dy="29.040000000000003">Pancreatic endocrine tissue</tspan><tspan x="822" dy="29.040000000000003">Thyroid follicular cells</tspan></text><path d="M50 427 L1150 427" fill="none" stroke="#aab9b5" stroke-width="3"/><text x="50" y="496" text-anchor="start" font-size="26" font-weight="700"><tspan x="50" dy="0">One digestive organ contains</tspan><tspan x="50" dy="34.32">tissues with different origins.</tspan></text><text x="50" y="596" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Endoderm → inner epithelial lining</tspan><tspan x="50" dy="30.360000000000003">Mesoderm → muscle and support</tspan><tspan x="50" dy="30.360000000000003">Lumen → the internal space</tspan></text><circle cx="930" cy="628" r="145" fill="#f0dbc8" stroke="#45625c" stroke-width="2"/><circle cx="930" cy="628" r="98" fill="#d9ead3" stroke="#45625c" stroke-width="2"/><circle cx="930" cy="628" r="64" fill="white" stroke="#45625c" stroke-width="2"/><text x="930" y="636" text-anchor="middle" font-size="22" font-weight="400"><tspan x="930" dy="0">lumen</tspan></text><text x="50" y="827" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Colour tracks origin in this simplified wall cross-section; it is not a histology image.</tspan></text><text x="50" y="863" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">“Gland” is not one germ-layer category. Name the endocrine tissue being traced.</tspan></text></g></svg>