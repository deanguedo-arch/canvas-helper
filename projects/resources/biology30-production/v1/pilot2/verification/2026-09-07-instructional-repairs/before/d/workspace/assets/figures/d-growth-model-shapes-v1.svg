<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Compare growth assumptions as well as curve shapes</title><desc id="desc">Two schematics show a J-shaped exponential trajectory and an S-shaped logistic trajectory approaching a dashed K line. Axes show time and population size without numerical scales. They are qualitative forms, not answers to the point-by-point graph exercise. A separate first-step calculation withN100,r0.20 per step andK500 yields120 for the exponential recurrence and116 for the logistic recurrence. The additional factor reduces logistic growth nearK. Actual populations can depart from either model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Compare growth assumptions as well as curve shapes</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Idealized shapes only; axes are not numerically scaled.</tspan></text><text x="280" y="177" text-anchor="middle" font-size="27" font-weight="700"><tspan x="280" dy="0">Exponential</tspan></text><path d="M90 535 L490 535" fill="none" stroke="#526a66" stroke-width="3" marker-end="url(#arrow)"/><path d="M90 535 L90 235" fill="none" stroke="#526a66" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="580" text-anchor="middle" font-size="23" font-weight="400"><tspan x="300" dy="0">Time</tspan></text><text x="60" y="215" text-anchor="start" font-size="23" font-weight="400"><tspan x="60" dy="0">Population size</tspan></text><text x="875" y="177" text-anchor="middle" font-size="27" font-weight="700"><tspan x="875" dy="0">Logistic</