<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Equal input, different albedo</title><desc id="desc">Two equal areas each receive 1000 joules. Surface S reflects 800 and absorbs 200 joules. Surface G reflects 200 and absorbs 800 joules. Values are illustrative, with no transmission.</desc>
<rect width="1200" height="630" fill="white"/><g font-family="sans-serif" fill="#17211a"><text x="600" y="52" text-anchor="middle" font-size="32" font-weight="bold">Equal incoming energy, different reflected fractions</text><text x="600" y="92" text-anchor="middle" font-size="22">Illustrative values • same area and time interval • no transmission</text>
<text x="90" y="155" font-size="25" font-weight="bold">Surface S: albedo 0.80</text><text x="650" y="155" font-size="25" font-weight="bold">Surface G: albedo 0.20</text>
<rect x="90" y="190" width="440" height="60" fill="#b17b15"/><rect x="650" y="190" width="440" height="60" fill="#b17b15"/><text x="310" y="230" text-anchor="middle" font-size="24" fill="white">Incoming: 1,000 J</text><text x="870" y="230" text-anchor="middle" font-size="24" fill="white">Incoming: 1,000 J</text>
<rect x="90" y="290" width="352" height="60" fill="#31556b"/><rect x="650" y="290" width="88" height="60" fill="#31556b"/><text x="90" y="380" font-size="23">Reflected: 800 J</text><text x="650" y="380" font-size="23">Reflected: 200 J</text>
<rect x="90" y="405" width="88" height="60" fill="#17491d"/><rect x="650" y="405" width="352" height="60" fill="#17491d"/><text x="90" y="495" font-size="23">Absorbed: 200 J</text><text x="650" y="495" font-size="23">Absorbed: 800 J</text>
<text x="310" y="550" text-anchor="middle" font-size="25">800 + 200 = 1,000 J</text><text x="870" y="550" text-anchor="middle" font-size="25">200 + 800 = 1,000 J</text>
<text x="600" y="605" text-anchor="middle" font-size="20">Bar lengths share one energy scale. This budget does not predict an exact temperature.</text></g></svg>
