<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="msc-title msc-desc" data-figure-id="figure-myelin-saltatory-conduction">
  <title id="msc-title">Myelin and saltatory conduction</title>
  <desc id="msc-desc">A myelinated axon has insulated internodes separated by nodes of Ranvier. Local current spreads beneath myelin and action potentials are regenerated at nodes. An unmyelinated comparison regenerates the signal along many adjacent regions.</desc>
  <defs><marker id="msc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#146c60"/></marker></defs>
  <style>.h{font:750 22px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 17px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 14px 'Work Sans',sans-serif;fill:#48524c}.ax{stroke:#39423d;stroke-width:10;stroke-linecap:round}.my{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.node{fill:#edf7f3;stroke:#146c60;stroke-width:3}.l{fill:none;stroke:#146c60;stroke-width:4;marker-end:url(#msc-a)}</style>
  <rect width="960" height="540" fill="#fff"/><text class="h" x="52" y="62">Myelinated axon</text>
  <line class="ax" x1="70" y1="185" x2="890" y2="185"/><g><rect class="my" x="110" y="140" width="150" height="90" rx="42"/><rect class="my" x="310" y="140" width="150" height="90" rx="42"/><rect class="my" x="510" y="140" width="150" height="90" rx="42"/><rect class="my" x="710" y="140" width="150" height="90" rx="42"/></g>
  <g><circle class="node" cx="285" cy="185" r="18"/><circle class="node" cx="485" cy="185" r="18"/><circle class="node" cx="685" cy="185" r="18"/></g><path class="l" d="M85 102C225 50 245 50 277 98M300 102C430 50 445 50 477 98M500 102C630 50 645 50 677 98M700 102C815 55 840 62 885 105"/>
  <text class="t" x="285" y="270" text-anchor="middle">node</text><text class="s" x="485" y="270" text-anchor="middle">signal regenerated</text><text class="s" x="215" y="118" text-anchor="middle">rapid local current beneath myelin</text>
  <text class="h" x="52" y="350">Unmyelinated comparison</text><line class="ax" x1="70" y1="430" x2="890" y2="430"/><g fill="#edf7f3" stroke="#146c60" stroke-width="2"><circle cx="130" cy="430" r="14"/><circle cx="210" cy="430" r="14"/><circle cx="290" cy="430" r="14"/><circle cx="370" cy="430" r="14"/><circle cx="450" cy="430" r="14"/><circle cx="530" cy="430" r="14"/><circle cx="610" cy="430" r="14"/><circle cx="690" cy="430" r="14"/><circle cx="770" cy="430" r="14"/><circle cx="850" cy="430" r="14"/></g><path class="l" d="M90 390H860"/><text class="s" x="480" y="495" text-anchor="middle">Regeneration occurs along many adjacent membrane regions.</text>
</svg>
