<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ra-title ra-desc" data-figure-id="figure-reflex-arc">
  <title id="ra-title">Withdrawal reflex arc with ascending information</title>
  <desc id="ra-desc">A skin receptor sends input along a sensory neuron to the spinal cord. Interneurons activate a motor neuron to a flexor muscle and send ascending information toward the brain. The motor response can begin before conscious awareness.</desc>
  <defs><marker id="ra-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs>
  <style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:600 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 13px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:4;marker-end:url(#ra-a)}</style><rect width="960" height="540" fill="#fff"/>
  <rect class="a" x="45" y="210" width="150" height="110" rx="55"/><text class="h" x="120" y="252" text-anchor="middle">Receptor</text><text class="s" x="120" y="280" text-anchor="middle">skin stimulus</text>
  <rect class="g" x="250" y="185" width="180" height="160" rx="10"/><text class="h" x="340" y="225" text-anchor="middle">Sensory neuron</text><text class="s" x="340" y="258" text-anchor="middle">afferent input</text><text class="s" x="340" y="287" text-anchor="middle">enters spinal cord</text>
  <rect class="b" x="500" y="125" width="210" height="280" rx="16"/><text class="h" x="605" y="165" text-anchor="middle">Spinal integration</text><circle cx="605" cy="245" r="35" fill="#edf7f3" stroke="#146c60" stroke-width="3"/><text class="t" x="605" y="250" text-anchor="middle">interneuron</text>
  <rect class="g" x="765" y="185" width="150" height="160" rx="10"/><text class="h" x="840" y="225" text-anchor="middle">Motor neuron</text><text class="s" x="840" y="258" text-anchor="middle">efferent output</text><text class="s" x="840" y="287" text-anchor="middle">to flexor muscle</text>
  <path class="l" d="M195 265H242M430 265H492M640 245H757"/><path class="l" d="M605 210V98H840"/><text class="t" x="720" y="78" text-anchor="middle">ascending information to brain</text><path class="l" d="M840 345v100H650"/><text class="t" x="640" y="428" text-anchor="end">effector contracts; limb withdraws</text>
  <text class="s" x="480" y="510" text-anchor="middle">A voluntary reaction-time task includes additional perception and decision steps.</text>
</svg>
