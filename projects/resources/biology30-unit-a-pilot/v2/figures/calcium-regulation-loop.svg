<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="crl-title crl-desc" data-figure-id="figure-calcium-regulation-loop">
  <title id="crl-title">PTH-centred calcium negative-feedback loop</title>
  <desc id="crl-desc">Low blood calcium raises PTH release. PTH supports bone calcium release, kidney calcium reabsorption and vitamin D activation, and intestinal absorption. Blood calcium rises toward range, reducing PTH release. A smaller inset notes calcitonin response to high calcium.</desc>
  <defs><marker id="crl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs><style>.h{font:750 19px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#crl-a)}</style><rect width="960" height="540" fill="#fff"/>
  <rect class="a" x="55" y="65" width="230" height="95" rx="9"/><text class="h" x="170" y="103" text-anchor="middle">Blood Ca²⁺ falls</text><text class="s" x="170" y="132" text-anchor="middle">regulated variable</text><rect class="b" x="365" y="65" width="230" height="95" rx="9"/><text class="h" x="480" y="103" text-anchor="middle">Parathyroids</text><text class="s" x="480" y="132" text-anchor="middle">PTH release rises</text><path class="l" d="M285 112H357"/>
  <rect class="g" x="70" y="250" width="230" height="110" rx="9"/><text class="h" x="185" y="290" text-anchor="middle">Bone</text><text class="s" x="185" y="319" text-anchor="middle">release to blood supported</text><rect class="g" x="365" y="250" width="230" height="110" rx="9"/><text class="h" x="480" y="290" text-anchor="middle">Kidney</text><text class="s" x="480" y="319" text-anchor="middle">reabsorb Ca²⁺ · activate vitamin D</text><rect class="g" x="660" y="250" width="230" height="110" rx="9"/><text class="h" x="775" y="290" text-anchor="middle">Intestine</text><text class="s" x="775" y="319" text-anchor="middle">absorption supported</text><path class="l" d="M480 160V205H185V242M480 205V242M480 205H775V242"/>
  <rect class="g" x="300" y="430" width="360" height="75" rx="9"/><text class="h" x="480" y="462" text-anchor="middle">Blood Ca²⁺ rises toward range</text><text class="s" x="480" y="487" text-anchor="middle">stimulus for PTH decreases</text><path class="l" d="M185 360 390 423M480 360V422M775 360 570 423"/>
  <rect x="665" y="60" width="235" height="110" rx="9" fill="#f7f8f5" stroke="#c8d0c8" stroke-width="2"/><text class="t" x="782" y="95" text-anchor="middle">When Ca²⁺ is high</text><text class="s" x="782" y="123" text-anchor="middle">calcitonin can reduce bone resorption;</text><text class="s" x="782" y="145" text-anchor="middle">PTH remains the dominant Unit A loop.</text>
</svg>
