<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="src-title src-desc" data-figure-id="figure-stress-response-comparison">
  <title id="src-title">Rapid and longer stress-response pathways</title>
  <desc id="src-desc">A shared perceived demand branches into a rapid sympathetic-adrenal-medulla pathway releasing epinephrine within seconds and a slower hypothalamic-pituitary-adrenal pathway releasing cortisol over minutes to hours. Both affect fuel and cardiovascular responses but use different routes.</desc>
  <defs><marker id="src-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs><style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#src-a)}</style><rect width="960" height="540" fill="#fff"/>
  <rect class="b" x="350" y="35" width="260" height="80" rx="9"/><text class="h" x="480" y="68" text-anchor="middle">Perceived demand</text><text class="s" x="480" y="93" text-anchor="middle">sensory + cognitive evidence</text>
  <rect class="g" x="55" y="175" width="360" height="240" rx="10"/><text class="h" x="235" y="215" text-anchor="middle">Rapid pathway · seconds</text><text class="t" x="90" y="260">Hypothalamus / brainstem</text><text class="s" x="90" y="288">sympathetic neural output</text><text class="t" x="90" y="330">Adrenal medulla</text><text class="s" x="90" y="358">epinephrine + norepinephrine</text><text class="s" x="90" y="390">heart · vessels · airways · fuel</text>
  <rect class="a" x="545" y="175" width="360" height="240" rx="10"/><text class="h" x="725" y="215" text-anchor="middle">HPA axis · minutes to hours</text><text class="t" x="580" y="260">Hypothalamus → pituitary</text><text class="s" x="580" y="288">CRH → ACTH</text><text class="t" x="580" y="330">Adrenal cortex</text><text class="s" x="580" y="358">cortisol</text><text class="s" x="580" y="390">fuel support · cardiovascular · immune effects</text>
  <path class="l" d="M430 115 295 168M530 115 665 168"/><rect class="b" x="290" y="455" width="380" height="55" rx="8"/><text class="t" x="480" y="488" text-anchor="middle">Coordinated response + recovery feedback</text><path class="l" d="M235 415 390 449M725 415 570 449"/>
</svg>
