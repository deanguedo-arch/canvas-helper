<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="eq-title eq-desc" data-figure-id="figure-equilibrium-apparatus">
  <title id="eq-title">Vestibular apparatus for angular and linear acceleration</title>
  <desc id="eq-desc">Three semicircular canals in different planes detect angular acceleration. The utricle and saccule contain otolith organs that detect linear acceleration and orientation relative to gravity. Vestibular nerve activity combines with vision and proprioception.</desc>
  <defs><marker id="eq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs><style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.canal{fill:none;stroke:#146c60;stroke-width:20}.o{fill:#fff8ed;stroke:#a15c00;stroke-width:4}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#eq-a)}</style><rect width="960" height="540" fill="#fff"/>
  <g transform="translate(75 55)"><ellipse class="canal" cx="245" cy="205" rx="155" ry="85"/><ellipse class="canal" cx="245" cy="205" rx="85" ry="155" transform="rotate(38 245 205)"/><ellipse class="canal" cx="245" cy="205" rx="85" ry="155" transform="rotate(-38 245 205)"/><ellipse class="o" cx="245" cy="290" rx="70" ry="45"/><circle class="o" cx="270" cy="365" r="38"/></g>
  <text class="h" x="320" y="50" text-anchor="middle">Semicircular canals</text><text class="s" x="320" y="82" text-anchor="middle">three planes · angular acceleration</text><text class="t" x="320" y="387" text-anchor="middle">utricle</text><text class="t" x="345" y="477" text-anchor="middle">saccule</text>
  <rect x="585" y="85" width="305" height="145" rx="10" fill="#edf7f3" stroke="#146c60" stroke-width="3"/><text class="h" x="737" y="125" text-anchor="middle">Hair-cell deflection</text><text class="s" x="737" y="158" text-anchor="middle">fluid or otolith-layer movement</text><text class="s" x="737" y="185" text-anchor="middle">changes receptor signalling</text>
  <rect x="585" y="310" width="305" height="145" rx="10" fill="#fff" stroke="#5b635d" stroke-width="2"/><text class="h" x="737" y="350" text-anchor="middle">Integrated equilibrium</text><text class="s" x="737" y="383" text-anchor="middle">vestibular + visual + proprioceptive</text><text class="s" x="737" y="410" text-anchor="middle">evidence supports posture and gaze</text><path class="l" d="M485 270H575M737 230V300"/>
</svg>
