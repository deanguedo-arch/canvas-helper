<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hpa-title hpa-desc" data-figure-id="figure-hypothalamus-pituitary-axes">
  <title id="hpa-title">Anterior and posterior pituitary pathways</title>
  <desc id="hpa-desc">The anterior pathway shows hypothalamic releasing hormones travelling through portal blood to anterior-pituitary endocrine cells, which release hGH or tropic hormones. The posterior pathway shows ADH synthesized in hypothalamic neurons, transported down axons, and released from posterior terminals.</desc>
  <defs><marker id="hpa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs><style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#hpa-a)}</style><rect width="960" height="540" fill="#fff"/>
  <text class="h" x="250" y="55" text-anchor="middle">Anterior pituitary: portal control</text><text class="h" x="710" y="55" text-anchor="middle">Posterior pituitary: neural release</text><path d="M480 25V515" stroke="#d9ded8" stroke-width="2"/>
  <rect class="g" x="115" y="80" width="270" height="80" rx="10"/><text class="h" x="250" y="113" text-anchor="middle">Hypothalamus</text><text class="s" x="250" y="140" text-anchor="middle">releasing / inhibiting hormones</text><rect class="a" x="115" y="230" width="270" height="90" rx="10"/><text class="h" x="250" y="267" text-anchor="middle">Anterior pituitary cells</text><text class="s" x="250" y="294" text-anchor="middle">synthesize hGH, TSH, ACTH</text><rect class="b" x="115" y="395" width="270" height="90" rx="10"/><text class="h" x="250" y="432" text-anchor="middle">Targets</text><text class="s" x="250" y="459" text-anchor="middle">tissues or endocrine glands</text><path class="l" d="M250 160V222M250 320V387"/><text class="s" x="270" y="198">portal blood</text>
  <rect class="g" x="575" y="80" width="270" height="80" rx="10"/><text class="h" x="710" y="113" text-anchor="middle">Hypothalamic neurons</text><text class="s" x="710" y="140" text-anchor="middle">synthesize ADH</text><rect class="a" x="575" y="230" width="270" height="90" rx="10"/><text class="h" x="710" y="267" text-anchor="middle">Posterior terminals</text><text class="s" x="710" y="294" text-anchor="middle">store and release ADH</text><rect class="b" x="575" y="395" width="270" height="90" rx="10"/><text class="h" x="710" y="432" text-anchor="middle">Kidney targets</text><text class="s" x="710" y="459" text-anchor="middle">collecting-duct water permeability</text><path class="l" d="M710 160V222M710 320V387"/><text class="s" x="730" y="198">axonal transport</text>
</svg>
