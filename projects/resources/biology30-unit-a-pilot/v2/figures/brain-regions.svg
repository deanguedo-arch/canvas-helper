  <title id="br-title">Major brain regions in a network model</title>
  <desc id="br-desc">A simplified side view labels frontal, parietal, temporal, and occipital cortex, cerebellum, brainstem, thalamus, and hypothalamus. A surrounding network ring emphasizes that complex functions depend on connections.</desc>
