<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="csc-title csc-desc" data-figure-id="figure-control-system-comparison">
  <title id="csc-title">Nervous and endocrine control systems compared</title>
  <desc id="csc-desc">Two parallel pathways begin with evidence and integration. The nervous pathway uses neurons and synapses for directed rapid effects. The endocrine pathway uses blood and target-cell receptors for distributed, often longer effects. Both converge on coordinated homeostasis.</desc>
  <defs><marker id="csc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs>
  <style>.h{font:750 25px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 19px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 15px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#c8d0c8;stroke-width:2}.n{fill:#edf7f3;stroke:#146c60;stroke-width:3}.e{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#csc-a)}</style>
  <rect width="960" height="540" fill="#fff"/><text class="h" x="480" y="48" text-anchor="middle">Shared logic, different delivery routes</text>
  <rect class="b" x="350" y="72" width="260" height="70" rx="8"/><text class="t" x="480" y="103" text-anchor="middle">Evidence + integration</text><text class="s" x="480" y="126" text-anchor="middle">What changed? What response is needed?</text>
  <rect class="n" x="70" y="205" width="350" height="220" rx="10"/><text class="h" x="245" y="246" text-anchor="middle">Nervous route</text><text class="t" x="105" y="285">Signal</text><text class="s" x="215" y="285"><tspan x="215">membrane change</tspan><tspan x="215" dy="19">+ transmitter</tspan></text><text class="t" x="105" y="333">Path</text><text class="s" x="215" y="333"><tspan x="215">connected neurons</tspan><tspan x="215" dy="19">and synapses</tspan></text><text class="t" x="105" y="381">Pattern</text><text class="s" x="215" y="381">rapid, specific, brief</text>
  <rect class="e" x="540" y="205" width="350" height="220" rx="10"/><text class="h" x="715" y="246" text-anchor="middle">Endocrine route</text><text class="t" x="575" y="285">Signal</text><text class="s" x="685" y="285">hormone</text><text class="t" x="575" y="333">Path</text><text class="s" x="685" y="333"><tspan x="685">blood to receptor-</tspan><tspan x="685" dy="19">bearing cells</tspan></text><text class="t" x="575" y="381">Pattern</text><text class="s" x="685" y="381">slower, broad, sustained</text>
  <path class="l" d="M430 142 314 198M530 142 646 198"/>
  <rect class="b" x="270" y="460" width="420" height="55" rx="8"/><text class="t" x="480" y="494" text-anchor="middle">Coordinated effect on regulated variables</text>
  <path class="l" d="M330 425 390 454M630 425 570 454"/>
</svg>
