<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="srf-title srf-desc" data-figure-id="figure-sensory-receptor-families">
  <title id="srf-title">Sensory receptor families by stimulus</title>
  <desc id="srf-desc">Six receptor families are arranged around a central transduction concept: photoreceptors for light, mechanoreceptors for deformation, chemoreceptors for molecules, thermoreceptors for temperature, nociceptors for potentially damaging conditions, and proprioceptors for position and movement.</desc>
  <style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.c{fill:#edf7f3;stroke:#146c60;stroke-width:3}.b{fill:#fff;stroke:#c8d0c8;stroke-width:2}.l{stroke:#9aa49d;stroke-width:3}</style><rect width="960" height="540" fill="#fff"/>
  <circle class="c" cx="480" cy="270" r="100"/><text class="h" x="480" y="258" text-anchor="middle">Transduction</text><text class="s" x="480" y="287" text-anchor="middle">stimulus → receptor</text><text class="s" x="480" y="309" text-anchor="middle">potential → neural signal</text>
  <g class="l"><path d="M405 200 280 120M555 200 680 120M380 270H235M580 270H725M405 340 280 420M555 340 680 420"/></g>
  <g><rect class="b" x="90" y="55" width="220" height="105" rx="9"/><text class="t" x="200" y="92" text-anchor="middle">Photoreceptors</text><text class="s" x="200" y="121" text-anchor="middle">light · retina</text><rect class="b" x="650" y="55" width="220" height="105" rx="9"/><text class="t" x="760" y="92" text-anchor="middle">Mechanoreceptors</text><text class="s" x="760" y="121" text-anchor="middle">pressure · stretch · sound</text><rect class="b" x="45" y="218" width="220" height="105" rx="9"/><text class="t" x="155" y="255" text-anchor="middle">Chemoreceptors</text><text class="s" x="155" y="284" text-anchor="middle">molecules · gases · taste</text><rect class="b" x="695" y="218" width="220" height="105" rx="9"/><text class="t" x="805" y="255" text-anchor="middle">Thermoreceptors</text><text class="s" x="805" y="284" text-anchor="middle">temperature change</text><rect class="b" x="90" y="380" width="220" height="105" rx="9"/><text class="t" x="200" y="417" text-anchor="middle">Nociceptors</text><text class="s" x="200" y="446" text-anchor="middle">potential tissue damage</text><rect class="b" x="650" y="380" width="220" height="105" rx="9"/><text class="t" x="760" y="417" text-anchor="middle">Proprioceptors</text><text class="s" x="760" y="446" text-anchor="middle">position · muscle stretch</text></g>
</svg>
