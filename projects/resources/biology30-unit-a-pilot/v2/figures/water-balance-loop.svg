<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="wbl-title wbl-desc" data-figure-id="figure-water-balance-loop">
  <title id="wbl-title">ADH negative-feedback loop for water balance</title>
  <desc id="wbl-desc">Water loss raises plasma osmotic concentration. Hypothalamic osmoreceptors increase ADH release from posterior-pituitary terminals. Kidneys increase water reabsorption, urine volume decreases, and osmotic concentration moves toward range, reducing ADH drive.</desc>
  <defs><marker id="wbl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs><style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.r{fill:#fff0ee;stroke:#a43f35;stroke-width:3}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#wbl-a)}</style><rect width="960" height="540" fill="#fff"/>
  <rect class="r" x="60" y="70" width="240" height="95" rx="9"/><text class="h" x="180" y="108" text-anchor="middle">Water loss</text><text class="s" x="180" y="137" text-anchor="middle">osmotic concentration rises</text><rect class="b" x="360" y="70" width="240" height="95" rx="9"/><text class="h" x="480" y="108" text-anchor="middle">Osmoreceptors</text><text class="s" x="480" y="137" text-anchor="middle">hypothalamic evidence</text><rect class="b" x="660" y="70" width="240" height="95" rx="9"/><text class="h" x="780" y="108" text-anchor="middle">ADH release rises</text><text class="s" x="780" y="137" text-anchor="middle">posterior terminals</text><rect class="g" x="650" y="325" width="250" height="100" rx="9"/><text class="h" x="775" y="365" text-anchor="middle">Kidney response</text><text class="s" x="775" y="394" text-anchor="middle">more water reabsorbed</text><rect class="g" x="320" y="325" width="250" height="100" rx="9"/><text class="h" x="445" y="365" text-anchor="middle">Urine volume falls</text><text class="s" x="445" y="394" text-anchor="middle">urine becomes concentrated</text><rect class="g" x="60" y="325" width="205" height="100" rx="9"/><text class="h" x="162" y="365" text-anchor="middle">Departure reduced</text><text class="s" x="162" y="394" text-anchor="middle">ADH drive falls</text><path class="l" d="M300 117H352M600 117H652M780 165V317M650 375H578M320 375H273M120 325C75 280 75 205 125 172"/><text class="s" x="480" y="490" text-anchor="middle">Urine concentration is evidence of the response; plasma osmotic concentration is a regulated variable.</text>
</svg>
