<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ea-title ea-desc" data-figure-id="figure-eye-anatomy">
  <title id="ea-title">Cross-section of the human eye</title>
  <desc id="ea-desc">A simplified side cross-section labels cornea, aqueous humour, iris, pupil, lens, ciliary region, vitreous humour, retina, choroid, sclera, fovea, and optic nerve. Light enters from the left and focuses on the retina.</desc>
  <defs><marker id="ea-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#146c60"/></marker></defs>
  <style>.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.l{stroke:#5b635d;stroke-width:2;fill:none}.ray{stroke:#146c60;stroke-width:3;fill:none;marker-end:url(#ea-a)}</style><rect width="960" height="540" fill="#fff"/>
  <ellipse cx="550" cy="270" rx="300" ry="205" fill="#f7f8f5" stroke="#5b635d" stroke-width="9"/><path d="M285 135Q190 270 285 405" fill="#e9f7fb" stroke="#146c60" stroke-width="5"/><path d="M338 155Q285 270 338 385" fill="none" stroke="#a15c00" stroke-width="18"/><ellipse cx="385" cy="270" rx="55" ry="112" fill="#fff8ed" stroke="#a15c00" stroke-width="4"/><path d="M295 215H343M295 325H343" stroke="#171b1b" stroke-width="8"/><path d="M795 100Q855 270 795 440" fill="none" stroke="#a43f35" stroke-width="12"/><path d="M812 110Q875 270 812 430" fill="none" stroke="#146c60" stroke-width="8"/><path d="M845 270h100" stroke="#39423d" stroke-width="28" stroke-linecap="round"/>
  <circle cx="810" cy="270" r="9" fill="#a15c00"/><path class="ray" d="M35 190 380 255 807 270M35 350 380 285 807 270"/>
  <path class="l" d="M230 96H90"/><text class="t" x="20" y="101">Cornea</text><path class="l" d="M315 180 170 140"/><text class="t" x="20" y="145">Iris + pupil</text><path class="l" d="M385 158V78"/><text class="t" x="350" y="62">Lens</text><path class="l" d="M600 270V70"/><text class="t" x="555" y="58">Vitreous humour</text><path class="l" d="M800 130 900 70"/><text class="t" x="850" y="58">Retina</text><path class="l" d="M820 155 925 130"/><text class="t" x="860" y="155">Choroid</text><path class="l" d="M785 100 900 190"/><text class="t" x="870" y="215">Sclera</text><path class="l" d="M810 270 885 245"/><text class="t" x="870" y="235">Fovea</text><text class="t" x="845" y="340">Optic nerve</text><text class="s" x="480" y="505" text-anchor="middle">Cornea provides most refraction; lens fine-tunes focus; retina transduces light.</text>
</svg>
