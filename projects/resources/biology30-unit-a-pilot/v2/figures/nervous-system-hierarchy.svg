<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="nsh-title nsh-desc" data-figure-id="figure-nervous-system-hierarchy">
  <title id="nsh-title">Anatomical and functional organization of the nervous system</title>
  <desc id="nsh-desc">The nervous system branches anatomically into central and peripheral systems. Peripheral pathways branch functionally into sensory and motor, and motor pathways into somatic and autonomic, with sympathetic and parasympathetic divisions.</desc>
  <style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 16px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 13px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#7a847d;stroke-width:3}</style><rect width="980" height="540" fill="#fff"/>
  <rect class="g" x="350" y="25" width="260" height="70" rx="9"/><text class="h" x="480" y="68" text-anchor="middle">Nervous system</text>
  <path class="l" d="M480 95V130M230 130H730M230 130V155M730 130V155"/>
  <rect class="b" x="100" y="155" width="260" height="80" rx="9"/><text class="h" x="230" y="190" text-anchor="middle">Central nervous system</text><text class="s" x="230" y="216" text-anchor="middle">brain + spinal cord</text>
  <rect class="b" x="600" y="155" width="260" height="80" rx="9"/><text class="h" x="730" y="183" text-anchor="middle"><tspan x="730">Peripheral nervous</tspan><tspan x="730" dy="21">system</tspan></text><text class="s" x="730" y="225" text-anchor="middle">nerves + ganglia</text>
  <path class="l" d="M730 235V270M565 270H845M565 270V295M845 270V295"/>
  <rect class="b" x="455" y="295" width="220" height="72" rx="9"/><text class="t" x="565" y="326" text-anchor="middle">Sensory division</text><text class="s" x="565" y="350" text-anchor="middle">toward CNS</text>
  <rect class="a" x="735" y="295" width="220" height="72" rx="9"/><text class="t" x="845" y="326" text-anchor="middle">Motor division</text><text class="s" x="845" y="350" text-anchor="middle">toward effectors</text>
  <path class="l" d="M845 367V397M742 397H918M742 397V425M918 397V425"/>
  <rect class="b" x="640" y="425" width="205" height="76" rx="9"/><text class="t" x="742" y="457" text-anchor="middle">Somatic</text><text class="s" x="742" y="481" text-anchor="middle">skeletal muscle</text>
  <rect class="a" x="855" y="425" width="100" height="76" rx="9"/><text class="t" x="905" y="454" text-anchor="middle">Autonomic</text><text class="s" x="905" y="478" text-anchor="middle">organs</text>
  <text class="s" x="230" y="275" text-anchor="middle">Central pathways integrate both divisions.</text><text class="s" x="480" y="525" text-anchor="middle">Autonomic output includes coordinated sympathetic and parasympathetic pathways.</text>
</svg>
