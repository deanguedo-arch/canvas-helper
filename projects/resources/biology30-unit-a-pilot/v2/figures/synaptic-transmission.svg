<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="st-title st-desc" data-figure-id="figure-synaptic-transmission">
  <title id="st-title">Chemical synaptic transmission sequence</title>
  <desc id="st-desc">Six numbered steps show action-potential arrival, calcium-channel opening, vesicle fusion, neurotransmitter diffusion, receptor binding, and signal termination by breakdown or reuptake.</desc>
  <defs><marker id="st-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs>
  <style>.n{font:750 18px 'Work Sans',sans-serif;fill:#154212}.t{font:650 16px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 13px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#c8d0c8;stroke-width:2}.c{fill:#edf7f3;stroke:#146c60;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#st-a)}</style>
  <rect width="960" height="540" fill="#fff"/><path d="M80 215c70-95 210-95 280 0v95H80Z" fill="#edf7f3" stroke="#146c60" stroke-width="3"/><path d="M80 360h280M80 405h280" stroke="#39423d" stroke-width="4"/><text class="t" x="220" y="452" text-anchor="middle">postsynaptic membrane</text>
  <g fill="#fff8ed" stroke="#a15c00" stroke-width="2"><circle cx="150" cy="230" r="25"/><circle cx="220" cy="205" r="25"/><circle cx="290" cy="232" r="25"/></g><g fill="#a43f35"><circle cx="150" cy="230" r="5"/><circle cx="220" cy="205" r="5"/><circle cx="290" cy="232" r="5"/><circle cx="178" cy="336" r="6"/><circle cx="220" cy="325" r="6"/><circle cx="270" cy="342" r="6"/></g><g fill="#fff" stroke="#146c60" stroke-width="3"><path d="M165 360v45h26v-45"/><path d="M242 360v45h26v-45"/></g>
  <g><rect class="b" x="430" y="55" width="220" height="90" rx="8"/><text class="n" x="448" y="85">1</text><text class="t" x="480" y="85">Action potential arrives</text><text class="s" x="480" y="112">terminal depolarizes</text><rect class="b" x="690" y="55" width="220" height="90" rx="8"/><text class="n" x="708" y="85">2</text><text class="t" x="740" y="85">Ca²⁺ enters</text><text class="s" x="740" y="112">voltage-gated channels open</text><rect class="b" x="430" y="190" width="220" height="90" rx="8"/><text class="n" x="448" y="220">3</text><text class="t" x="480" y="220">Vesicles fuse</text><text class="s" x="480" y="247">transmitter released</text><rect class="b" x="690" y="190" width="220" height="90" rx="8"/><text class="n" x="708" y="220">4</text><text class="t" x="740" y="220">Diffusion</text><text class="s" x="740" y="247">molecules cross cleft</text><rect class="b" x="430" y="325" width="220" height="90" rx="8"/><text class="n" x="448" y="355">5</text><text class="t" x="480" y="355">Receptors bind</text><text class="s" x="480" y="382">target response changes</text><rect class="c" x="690" y="325" width="220" height="90" rx="8"/><text class="n" x="708" y="355">6</text><text class="t" x="740" y="355">Signal ends</text><text class="s" x="740" y="378"><tspan x="740">breakdown, reuptake,</tspan><tspan x="740" dy="18">or diffusion</tspan></text></g>
  <path class="l" d="M650 100H682M800 145V182M690 235H658M540 280V317M650 370H682"/>
</svg>
