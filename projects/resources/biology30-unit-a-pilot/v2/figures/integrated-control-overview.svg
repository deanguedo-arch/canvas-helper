<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ico-title ico-desc" data-figure-id="figure-integrated-control-overview">
  <title id="ico-title">Integrated nervous and endocrine control overview</title>
  <desc id="ico-desc">A disturbance changes a regulated variable. Receptors send information to coordinating centres. Fast neural and longer endocrine routes act on effectors, whose responses oppose the disturbance.</desc>
  <defs><marker id="ico-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs>
  <style>.t{font:700 22px 'Work Sans',sans-serif;fill:#171b1b}.tw{font:700 19px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 16px 'Work Sans',sans-serif;fill:#48524c}.n{fill:#fff;stroke:#5b635d;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#ico-a)}</style>
  <rect width="960" height="540" fill="#fff"/>
  <rect class="n" x="55" y="205" width="170" height="105" rx="8"/><text class="t" x="140" y="244" text-anchor="middle">Disturbance</text><text class="s" x="140" y="274" text-anchor="middle">variable moves</text>
  <rect class="n" x="290" y="205" width="170" height="105" rx="8"/><text class="t" x="375" y="244" text-anchor="middle">Receptors</text><text class="s" x="375" y="274" text-anchor="middle">detect evidence</text>
  <rect class="n" x="525" y="205" width="170" height="105" rx="8"/><text class="t" x="610" y="244" text-anchor="middle">Integration</text><text class="s" x="610" y="274" text-anchor="middle">coordinates output</text>
  <rect class="g" x="755" y="80" width="160" height="105" rx="8"/><text class="t" x="835" y="119" text-anchor="middle">Neural route</text><text class="s" x="835" y="149" text-anchor="middle">fast, directed</text>
  <rect class="a" x="755" y="330" width="160" height="105" rx="8"/><text class="tw" x="835" y="369" text-anchor="middle">Hormone route</text><text class="s" x="835" y="399" text-anchor="middle">blood, receptors</text>
  <path class="l" d="M225 257H282M460 257H517M695 237C730 218 735 150 748 139M695 278C731 296 736 373 748 380"/>
  <rect class="n" x="490" y="395" width="205" height="100" rx="8"/><text class="t" x="592" y="433" text-anchor="middle">Effector response</text><text class="s" x="592" y="463" text-anchor="middle">opposes the change</text>
  <path class="l" d="M755 164C704 181 692 344 655 387M755 383H703M490 470C330 535 116 492 111 320"/>
  <text class="s" x="155" y="420"><tspan x="155">Return effect reduces</tspan><tspan x="155" dy="21">the original departure</tspan></text>
</svg>
