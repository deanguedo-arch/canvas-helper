<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nt-title nt-desc" data-figure-id="figure-neuron-types">
  <title id="nt-title">Sensory neurons, interneurons, and motor neurons in a pathway</title>
  <desc id="nt-desc">A receptor connects through a sensory neuron toward a central interneuron network, then a motor neuron carries output to a muscle effector. Direction arrows distinguish neuron roles.</desc>
  <defs><marker id="nt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs>
  <style>.h{font:750 23px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 17px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 14px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:4;marker-end:url(#nt-a)}</style>
  <rect width="960" height="540" fill="#fff"/><text class="h" x="480" y="52" text-anchor="middle">Roles are defined by direction and location</text>
  <rect class="b" x="45" y="205" width="135" height="105" rx="52"/><text class="t" x="112" y="247" text-anchor="middle">Receptor</text><text class="s" x="112" y="276" text-anchor="middle">detects change</text>
  <rect class="g" x="230" y="180" width="190" height="155" rx="10"/><text class="h" x="325" y="222" text-anchor="middle">Sensory neuron</text><text class="s" x="325" y="255" text-anchor="middle">toward CNS</text><text class="s" x="325" y="282" text-anchor="middle">afferent role</text>
  <rect class="b" x="465" y="150" width="190" height="215" rx="10"/><text class="h" x="560" y="200" text-anchor="middle">Interneurons</text><text class="s" x="560" y="235" text-anchor="middle">within CNS</text><path d="M510 275c35-55 65 55 100 0M510 310c35-55 65 55 100 0" fill="none" stroke="#146c60" stroke-width="4"/>
  <rect class="a" x="700" y="180" width="190" height="155" rx="10"/><text class="h" x="795" y="222" text-anchor="middle">Motor neuron</text><text class="s" x="795" y="255" text-anchor="middle">away from CNS</text><text class="s" x="795" y="282" text-anchor="middle">efferent role</text>
  <path class="l" d="M180 257H222M420 257H457M655 257H692"/><path d="M890 257h35l-18-25m18 25-18 25" fill="none" stroke="#39423d" stroke-width="4"/><text class="t" x="940" y="360" text-anchor="end">Effector</text><text class="s" x="940" y="384" text-anchor="end">muscle or gland</text>
  <text class="s" x="480" y="452" text-anchor="middle">A nerve may carry sensory axons, motor axons, or both; it is not a single neuron.</text>
</svg>
