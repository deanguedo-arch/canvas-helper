<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="wsr-title wsr-desc" data-figure-id="figure-water-salt-regulation">
  <title id="wsr-title">ADH and aldosterone in kidney regulation</title>
  <desc id="wsr-desc">Two coordinated kidney pathways are compared. ADH responds strongly to osmotic and volume evidence and increases collecting-duct water permeability. Aldosterone responds mainly through renin-angiotensin and potassium evidence and increases sodium reabsorption and potassium secretion.</desc>
  <defs><marker id="wsr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs><style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#wsr-a)}</style><rect width="960" height="540" fill="#fff"/>
  <rect class="g" x="45" y="65" width="400" height="115" rx="10"/><text class="h" x="245" y="105" text-anchor="middle">ADH pathway</text><text class="s" x="245" y="135" text-anchor="middle">high osmotic concentration or low volume</text><rect class="a" x="515" y="65" width="400" height="115" rx="10"/><text class="h" x="715" y="105" text-anchor="middle">Aldosterone pathway</text><text class="s" x="715" y="135" text-anchor="middle">renin-angiotensin signals or high K⁺</text>
  <rect class="b" x="90" y="250" width="310" height="125" rx="10"/><text class="h" x="245" y="292" text-anchor="middle">Collecting duct</text><text class="s" x="245" y="322" text-anchor="middle">water permeability increases</text><text class="s" x="245" y="347" text-anchor="middle">aquaporin insertion</text><rect class="b" x="560" y="250" width="310" height="125" rx="10"/><text class="h" x="715" y="292" text-anchor="middle">Distal nephron</text><text class="s" x="715" y="322" text-anchor="middle">Na⁺ reabsorption increases</text><text class="s" x="715" y="347" text-anchor="middle">K⁺ secretion increases</text><path class="l" d="M245 180V242M715 180V242"/>
  <rect class="g" x="90" y="440" width="310" height="70" rx="9"/><text class="t" x="245" y="470" text-anchor="middle">water conserved · urine concentrated</text><text class="s" x="245" y="493" text-anchor="middle">osmotic disturbance reduced</text><rect class="a" x="560" y="440" width="310" height="70" rx="9"/><text class="t" x="715" y="470" text-anchor="middle">sodium retained · volume supported</text><text class="s" x="715" y="493" text-anchor="middle">water may follow sodium</text><path class="l" d="M245 375V432M715 375V432"/><text class="s" x="480" y="408" text-anchor="middle">Related outcomes, different primary transport effects</text>
</svg>
