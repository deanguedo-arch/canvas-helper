<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="rlp-title rlp-desc" data-figure-id="figure-retina-light-pathway">
  <title id="rlp-title">Retinal layers and visual pathway</title>
  <desc id="rlp-desc">Light passes through ganglion and bipolar layers to rods and cones. Neural information then travels in the opposite direction through bipolar cells to ganglion cells, whose axons form the optic nerve and continue toward the thalamus and visual cortex.</desc>
  <defs><marker id="rlp-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#146c60"/></marker><marker id="rlp-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs>
  <style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.l{stroke:#c8d0c8;stroke-width:2}.light{fill:none;stroke:#a15c00;stroke-width:5;marker-end:url(#rlp-k)}.signal{fill:none;stroke:#146c60;stroke-width:5;marker-end:url(#rlp-g)}</style><rect width="960" height="540" fill="#fff"/>
  <text class="h" x="45" y="50">Retina: light and signal move in opposite directions</text><rect x="45" y="80" width="380" height="385" fill="#f7f8f5" stroke="#5b635d" stroke-width="2"/>
  <g class="l"><path d="M45 190H425M45 300H425M45 410H425"/></g><g fill="#fff" stroke="#146c60" stroke-width="3"><circle cx="120" cy="135" r="25"/><circle cx="235" cy="135" r="25"/><circle cx="350" cy="135" r="25"/><path d="M120 165v75M235 165v75M350 165v75"/><circle cx="120" cy="270" r="20"/><circle cx="235" cy="270" r="20"/><circle cx="350" cy="270" r="20"/><path d="M120 290v70M235 290v70M350 290v70"/></g><g fill="#fff8ed" stroke="#a15c00" stroke-width="3"><path d="M105 360h30l-7 78h-16Z"/><path d="M220 360h30l-7 78h-16Z"/><path d="M335 360h30l-7 78h-16Z"/></g>
  <text class="t" x="445" y="140">Ganglion layer</text><text class="t" x="445" y="270">Bipolar layer</text><text class="t" x="445" y="405">Rods + cones</text><path class="light" d="M25 100V395"/><text class="s" x="15" y="90">light</text><path class="signal" d="M405 425C515 425 555 370 565 250C570 175 580 140 600 130"/><text class="s" x="460" y="370">neural signal</text>
  <rect x="600" y="80" width="310" height="110" rx="8" fill="#edf7f3" stroke="#146c60" stroke-width="3"/><text class="h" x="755" y="122" text-anchor="middle">Optic nerve</text><text class="s" x="755" y="153" text-anchor="middle">ganglion-cell axons</text><rect x="600" y="235" width="310" height="110" rx="8" fill="#fff" stroke="#5b635d" stroke-width="2"/><text class="h" x="755" y="277" text-anchor="middle">Thalamic relay</text><text class="s" x="755" y="308" text-anchor="middle">visual-field information organized</text><rect x="600" y="390" width="310" height="110" rx="8" fill="#fff8ed" stroke="#a15c00" stroke-width="3"/><text class="h" x="755" y="432" text-anchor="middle">Visual cortex</text><text class="s" x="755" y="463" text-anchor="middle">distributed perception networks</text><path class="signal" d="M755 190V228M755 345V383"/>
</svg>
