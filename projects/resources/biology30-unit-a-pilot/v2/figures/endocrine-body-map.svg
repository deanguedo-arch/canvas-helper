<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="ebm-title ebm-desc" data-figure-id="figure-endocrine-body-map">
  <title id="ebm-title">Principal Unit A endocrine glands and targets</title>
  <desc id="ebm-desc">A simple body outline marks the hypothalamus-pituitary complex in the head, thyroid and parathyroids in the neck, adrenal glands above the kidneys, and pancreatic islets in the abdomen. Side labels name key Unit A hormones and regulated variables.</desc>
  <style>.h{font:750 19px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.body{fill:#f7f8f5;stroke:#5b635d;stroke-width:3}.g{fill:#146c60;stroke:#fff;stroke-width:3}.a{fill:#a15c00;stroke:#fff;stroke-width:3}.l{stroke:#7a847d;stroke-width:2;fill:none}</style><rect width="960" height="580" fill="#fff"/>
  <circle class="body" cx="480" cy="85" r="55"/><path class="body" d="M415 140c-45 55-55 170-28 245l-35 130h75l25-105h56l25 105h75l-35-130c27-75 17-190-28-245Z"/>
  <circle class="g" cx="480" cy="72" r="12"/><circle class="a" cx="480" cy="92" r="11"/><ellipse class="g" cx="480" cy="160" rx="27" ry="13"/><circle class="a" cx="497" cy="159" r="6"/><path class="a" d="M415 300q20-20 40 0-20 18-40 0ZM505 300q20-20 40 0-20 18-40 0Z"/><path class="g" d="M435 350c30-18 75-18 105 0-25 25-80 25-105 0Z"/>
  <path class="l" d="M468 72H240"/><text class="h" x="60" y="68">Hypothalamus</text><text class="s" x="60" y="92">neural-endocrine integration</text><path class="l" d="M468 92H240"/><text class="h" x="60" y="135">Pituitary</text><text class="s" x="60" y="159">tropic hormones · hGH · ADH release</text><path class="l" d="M507 160H720"/><text class="h" x="735" y="155">Thyroid + parathyroids</text><text class="s" x="735" y="179">thyroxine · PTH · calcitonin</text><path class="l" d="M545 300H720"/><text class="h" x="735" y="295">Adrenal glands</text><text class="s" x="735" y="319">cortisol · epinephrine · aldosterone</text><path class="l" d="M540 350H720"/><text class="h" x="735" y="350">Pancreatic islets</text><text class="s" x="735" y="374">insulin · glucagon</text><text class="s" x="480" y="555" text-anchor="middle">A hormone travels widely; only receptor-bearing target cells produce the relevant response.</text>
</svg>
