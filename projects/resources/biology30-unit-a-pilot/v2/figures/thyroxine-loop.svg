<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="tl-title tl-desc" data-figure-id="figure-thyroxine-loop">
  <title id="tl-title">Hypothalamus-pituitary-thyroid feedback axis</title>
  <desc id="tl-desc">Hypothalamic input stimulates pituitary TSH, TSH stimulates thyroid thyroxine, and thyroxine acts on tissues. Thyroxine feeds back to reduce hypothalamic and pituitary drive. Paired TSH and thyroxine values help locate disruptions.</desc>
  <defs><marker id="tl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs><style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#tl-a)}.fb{fill:none;stroke:#a43f35;stroke-width:4}</style><rect width="960" height="540" fill="#fff"/>
  <rect class="b" x="55" y="195" width="200" height="110" rx="9"/><text class="h" x="155" y="235" text-anchor="middle">Hypothalamus</text><text class="s" x="155" y="267" text-anchor="middle">controlling signal</text><rect class="g" x="305" y="195" width="200" height="110" rx="9"/><text class="h" x="405" y="235" text-anchor="middle">Anterior pituitary</text><text class="s" x="405" y="267" text-anchor="middle">TSH</text><rect class="a" x="555" y="195" width="200" height="110" rx="9"/><text class="h" x="655" y="235" text-anchor="middle">Thyroid</text><text class="s" x="655" y="267" text-anchor="middle">thyroxine</text><rect class="b" x="805" y="195" width="120" height="110" rx="9"/><text class="h" x="865" y="235" text-anchor="middle">Tissues</text><text class="s" x="865" y="267" text-anchor="middle">metabolism</text><path class="l" d="M255 250H297M505 250H547M755 250H797"/>
  <path class="fb" d="M655 195V95H405V185M655 95H155V185"/><path d="m396 176 9 18 9-18M146 176l9 18 9-18" fill="#fff" stroke="#a43f35" stroke-width="3"/><text class="t" x="405" y="65" text-anchor="middle" fill="#a43f35">thyroxine reduces upstream drive</text>
  <rect x="215" y="390" width="530" height="95" rx="9" fill="#f7f8f5" stroke="#c8d0c8" stroke-width="2"/><text class="t" x="250" y="425">Low thyroxine + high TSH</text><text class="s" x="520" y="425">target-gland limitation is a candidate</text><text class="t" x="250" y="460">Low thyroxine + low TSH</text><text class="s" x="520" y="460">upstream signalling is a candidate</text>
</svg>
