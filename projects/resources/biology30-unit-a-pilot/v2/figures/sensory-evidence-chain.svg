<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="sec-title sec-desc" data-figure-id="figure-sensory-evidence-chain">
  <title id="sec-title">Sensory evidence chain from measurement to decision</title>
  <desc id="sec-desc">Five linked stages show measurement, pattern description, mechanism, bounded claim, and technology decision. A parallel limitations lane lists calibration, sampling, context, access, and alternatives.</desc>
  <defs><marker id="sec-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs><style>.n{font:750 18px 'Work Sans',sans-serif;fill:#154212}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#c8d0c8;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:3;marker-end:url(#sec-a)}</style><rect width="960" height="540" fill="#fff"/>
  <g><rect class="b" x="35" y="105" width="160" height="120" rx="8"/><text class="n" x="55" y="137">1</text><text class="t" x="115" y="165" text-anchor="middle">Measurement</text><text class="s" x="115" y="193" text-anchor="middle">what and how?</text><rect class="b" x="215" y="105" width="160" height="120" rx="8"/><text class="n" x="235" y="137">2</text><text class="t" x="295" y="165" text-anchor="middle">Pattern</text><text class="s" x="295" y="193" text-anchor="middle">what changed?</text><rect class="b" x="395" y="105" width="160" height="120" rx="8"/><text class="n" x="415" y="137">3</text><text class="t" x="475" y="165" text-anchor="middle">Mechanism</text><text class="s" x="475" y="193" text-anchor="middle">what pathway fits?</text><rect class="g" x="575" y="105" width="160" height="120" rx="8"/><text class="n" x="595" y="137">4</text><text class="t" x="655" y="165" text-anchor="middle">Bounded claim</text><text class="s" x="655" y="193" text-anchor="middle">how certain?</text><rect class="g" x="755" y="105" width="170" height="120" rx="8"/><text class="n" x="775" y="137">5</text><text class="t" x="840" y="165" text-anchor="middle">Decision</text><text class="s" x="840" y="193" text-anchor="middle">benefit + trade-off</text></g><path class="l" d="M195 165H207M375 165H387M555 165H567M735 165H747"/>
  <rect x="75" y="315" width="810" height="150" rx="10" fill="#fff8ed" stroke="#a15c00" stroke-width="3"/><text class="t" x="115" y="357">Limitations lane</text><text class="s" x="115" y="395">calibration</text><text class="s" x="270" y="395">sample and variation</text><text class="s" x="475" y="395">context and alternatives</text><text class="s" x="710" y="395">access and unintended effects</text><text class="s" x="480" y="440" text-anchor="middle">A limitation identifies the next evidence needed; it does not erase the observed pattern.</text>
</svg>
