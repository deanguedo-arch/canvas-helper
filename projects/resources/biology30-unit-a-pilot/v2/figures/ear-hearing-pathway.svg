<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ehp-title ehp-desc" data-figure-id="figure-ear-hearing-pathway">
  <title id="ehp-title">Outer, middle, and inner ear hearing pathway</title>
  <desc id="ehp-desc">Sound travels through the pinna and auditory canal to the tympanic membrane, then through the malleus, incus, and stapes to the oval window. Cochlear fluid movement bends hair cells, and auditory-nerve signals travel to the brain.</desc>
  <defs><marker id="ehp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#146c60"/></marker></defs>
  <style>.h{font:750 20px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 15px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 12px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#c8d0c8;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.l{fill:none;stroke:#146c60;stroke-width:4;marker-end:url(#ehp-a)}</style><rect width="960" height="540" fill="#fff"/>
  <text class="h" x="165" y="55" text-anchor="middle">Outer ear</text><text class="h" x="480" y="55" text-anchor="middle">Middle ear</text><text class="h" x="790" y="55" text-anchor="middle">Inner ear + nerve</text><path d="M320 80V470M635 80V470" stroke="#d9ded8" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M80 140c-70 20-62 215 35 250 74 27 120-43 84-99-28-44-78-16-63 22 13 32 43 12 42-11" fill="none" stroke="#a15c00" stroke-width="18" stroke-linecap="round"/><rect class="b" x="190" y="245" width="115" height="48" rx="24"/><text class="t" x="247" y="276" text-anchor="middle">auditory canal</text><path d="M305 215v108" stroke="#a43f35" stroke-width="9"/><text class="s" x="245" y="345">tympanic membrane</text>
  <g fill="none" stroke="#39423d" stroke-width="9" stroke-linecap="round"><path d="M345 260 405 210 455 270 510 215 570 270"/></g><text class="t" x="460" y="335" text-anchor="middle">malleus · incus · stapes</text><ellipse class="g" cx="603" cy="270" rx="22" ry="45"/><text class="s" x="565" y="345">oval window</text>
  <path d="M700 270c0-100 155-115 170-10 13 91-104 140-155 80 73 4 101-68 60-102-34-28-75 5-75 32Z" fill="#edf7f3" stroke="#146c60" stroke-width="5"/><path d="M815 355c-15-70-73-95-110-45" fill="none" stroke="#a15c00" stroke-width="5"/><text class="t" x="785" y="180" text-anchor="middle">cochlea</text><text class="s" x="785" y="410" text-anchor="middle">hair-cell transduction</text><path class="l" d="M850 270H930"/><text class="t" x="850" y="245">auditory nerve</text>
  <path class="l" d="M28 465H920"/><text class="s" x="480" y="505" text-anchor="middle">air pressure → membrane vibration → ossicle movement → fluid wave → receptor potential → neural activity</text>
</svg>
