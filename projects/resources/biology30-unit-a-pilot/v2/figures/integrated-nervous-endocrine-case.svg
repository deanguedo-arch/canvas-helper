<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="inec-title inec-desc" data-figure-id="figure-integrated-nervous-endocrine-case">
  <title id="inec-title">Integrated nervous and endocrine case network</title>
  <desc id="inec-desc">Cold, sound, a meal, and water loss feed four evidence streams. Sensory pathways and hypothalamic integration connect to autonomic output, adrenal hormones, pancreatic hormones, and ADH. Effectors influence heart activity, fuel availability, glucose, urine, and osmotic concentration.</desc>
  <defs><marker id="inec-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39423d"/></marker></defs><style>.h{font:750 18px 'Work Sans',sans-serif;fill:#171b1b}.t{font:650 14px 'Work Sans',sans-serif;fill:#171b1b}.s{font:500 11px 'Work Sans',sans-serif;fill:#48524c}.b{fill:#fff;stroke:#5b635d;stroke-width:2}.g{fill:#edf7f3;stroke:#146c60;stroke-width:3}.a{fill:#fff8ed;stroke:#a15c00;stroke-width:3}.r{fill:#fff0ee;stroke:#a43f35;stroke-width:3}.l{fill:none;stroke:#39423d;stroke-width:2.5;marker-end:url(#inec-a)}</style><rect width="960" height="540" fill="#fff"/>
  <g><rect class="b" x="30" y="55" width="145" height="75" rx="8"/><text class="h" x="102" y="87" text-anchor="middle">Cold</text><text class="s" x="102" y="112" text-anchor="middle">thermoreceptors</text><rect class="b" x="30" y="165" width="145" height="75" rx="8"/><text class="h" x="102" y="197" text-anchor="middle">Alarm</text><text class="s" x="102" y="222" text-anchor="middle">auditory receptors</text><rect class="b" x="30" y="275" width="145" height="75" rx="8"/><text class="h" x="102" y="307" text-anchor="middle">Meal</text><text class="s" x="102" y="332" text-anchor="middle">blood glucose rises</text><rect class="b" x="30" y="385" width="145" height="75" rx="8"/><text class="h" x="102" y="417" text-anchor="middle">Water loss</text><text class="s" x="102" y="442" text-anchor="middle">osmotic concentration rises</text></g>
  <rect class="g" x="285" y="100" width="220" height="130" rx="10"/><text class="h" x="395" y="140" text-anchor="middle">Central integration</text><text class="s" x="395" y="169" text-anchor="middle">brain · hypothalamus</text><text class="s" x="395" y="194" text-anchor="middle">timing and context</text><rect class="a" x="285" y="310" width="220" height="130" rx="10"/><text class="h" x="395" y="342" text-anchor="middle"><tspan x="395">Direct endocrine</tspan><tspan x="395" dy="21">sensors</tspan></text><text class="s" x="395" y="391" text-anchor="middle">pancreatic islets</text><text class="s" x="395" y="414" text-anchor="middle">hypothalamic osmoreceptors</text>
  <g><rect class="r" x="620" y="35" width="260" height="90" rx="9"/><text class="h" x="750" y="70" text-anchor="middle">Autonomic + adrenal medulla</text><text class="s" x="750" y="97" text-anchor="middle">rapid heart, vessel, fuel response</text><rect class="a" x="620" y="155" width="260" height="90" rx="9"/><text class="h" x="750" y="190" text-anchor="middle">HPA axis</text><text class="s" x="750" y="217" text-anchor="middle">slower cortisol support</text><rect class="g" x="620" y="275" width="260" height="90" rx="9"/><text class="h" x="750" y="310" text-anchor="middle">Insulin + glucagon</text><text class="s" x="750" y="337" text-anchor="middle">blood-glucose regulation</text><rect class="g" x="620" y="395" width="260" height="90" rx="9"/><text class="h" x="750" y="430" text-anchor="middle">ADH + kidney</text><text class="s" x="750" y="457" text-anchor="middle">water conservation</text></g>
  <path class="l" d="M175 92 277 140M175 202 277 180M175 312 277 350M175 422 277 400M505 145 612 80M505 180 612 200M505 350 612 320M505 400 612 440"/><text class="s" x="480" y="515" text-anchor="middle">Read each variable and time point first; then connect the pathway and return effect.</text>
</svg>
