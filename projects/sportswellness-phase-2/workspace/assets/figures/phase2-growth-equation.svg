<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" role="img" aria-labelledby="title desc"><title id="title">A qualified growth model</title><desc id="desc">A schematic curve shows a possible dip and later improvement across demand and recovery. There are no personal measurement units. The useful teaching point is to consider suitable challenge, instruction and recovery together, not to promise growth after each session.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#146c60"/></marker></defs><rect width="900" height="865" fill="white"/><g font-family="Arial, sans-serif"><text x="44" y="60" font-size="32" font-weight="750" fill="#154212" text-anchor="start">Challenge and recovery: a simplified model</text><text x="44" y="101" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">One possible pattern—not a prediction for a particular</text><text x="44" y="132" font-size="22" font-weight="400" fill="#5b635d" text-anchor="start">learner.</text><path d="M120 555 L800 555" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M120 555 L120 184" stroke="#146c60" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="135" y="205" font-size="23" font-weight="600" fill="#171b1b" text-anchor="start">Performance</text><text x="698" y="605" font-size="24" font-weight="600" fill="#171b1b" text-anchor="start">Time</text><path d="M160 335 C260 335 255 480 350 480 S515 267 610 283 S720 310 760 255" fill="none" stroke="#146c60" stroke-width="6"/><text x="190" y="630" font-size="25" font-weight="700" fill="#171b1b" text-anchor="start">Demand</text><text x="460" y="630" font-size="25" font-weight="700" fill="#171b1b" text-anchor="start">Recovery / learning</text><rect x="44" y="681" width="812" height="135" rx="8" fill="#faf8f2" stroke="#d9ded8" stroke-width="2"/><text x="68" y="727" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">Useful challenge, instruction, practice and recovery may</text><text x="68" y="760" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">support development. The line does not provide a training</text><text x="68" y="793" font-size="24" font-weight="400" fill="#171b1b" text-anchor="start">dose or guarantee growth.</text></g></svg>