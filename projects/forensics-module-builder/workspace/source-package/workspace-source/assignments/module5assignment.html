<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forensic Lab: Impaired Driving Assignment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background: #f1f5f9; }
  </style>
  <link href="./forensic-assignment-theme.css?rev=20260421-4" rel="stylesheet" />
  <script src="./forensic-assignment-print.js?rev=20260421-1"></script>
</head>
<body class="forensic-assignment-theme">
  <div id="root"></div>
  <script>
    (function installErrorOverlay() {
      function showError(kind, value) {
        const text = value instanceof Error ? (value.stack || value.message) : String(value);
        const existing = document.getElementById("__module5_assignment_error");
        if (existing) {
          existing.textContent = text;
          return;
        }
        const panel = document.createElement("pre");
        panel.id = "__module5_assignment_error";
        panel.style.position = "fixed";
        panel.style.inset = "12px";
        panel.style.zIndex = "99999";
        panel.style.overflow = "auto";
        panel.style.margin = "0";
        panel.style.padding = "12px";
        panel.style.border = "2px solid #ef4444";
        panel.style.borderRadius = "10px";
        panel.style.background = "rgba(17, 24, 39, 0.98)";
        panel.style.color = "#fecaca";
        panel.style.font = "12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
        panel.textContent = kind + "\n\n" + text;
        document.body.appendChild(panel);
      }
      window.addEventListener("error", (event) => showError("Module 5 runtime error", event.error || event.message));
      window.addEventListener("unhandledrejection", (event) => showError("Module 5 promise rejection", event.reason));
    })();
  </script>
  <script type="module">
    import React from "https://esm.sh/react@19.1.1";
    import ReactDOM from "https://esm.sh/react-dom@19.1.1/client";
    import App from "./module5assignment.app.js?rev=3";

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
