<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Keep whole-homologue combinations and sequence changes distinct</title><desc id="description">Four symbolic haploid products enumerate possible whole-homologue combinations for two independently orienting pairs: M1M2,M1P2,P1M2,P1P2. Long and short marks denote chromosome types, while M/P and color distinguish inherited homologues. These are possibilities across orientations, not a claim that one meiosis always makes all four types. A separate comparison distinguishes crossing over within chromosomes, random fertilization combining gametes, and a mutation changing an example DNA segment ACG to ATG. The2^n count excludes crossing over, is not the count of every possible sequence and does not guarantee observed sample frequencies.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Keep whole-homologue combinations and sequence changes distinct</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">New combinations of existing alleles do not require a new allele at every locus.</text><text x="50" y="186" font-size="24" text-anchor="start" fill="#213033">Two independently orienting pairs: 2² = 4 whole-homologue combinations</text><circle cx="176" cy="328" r="87" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="153" y1="289.0" x2="153" y2="363.0" stroke="#176e6a" stroke-width="4"/><line x1="199" y1="303.5" x2="199" y2="348.5" stroke="#176e6a" stroke-width="4"/><text x="176" y="449" font-size="24" text-anchor="middle" fill="#213033">M1 + M2</text><circle cx="456" cy="328" r="87" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="433" y1="289.0" x2="433" y2="363.0" stroke="#176e6a" stroke-width="4"/><line x1="479" y1="303.5" x2="479" y2="348.5" stroke="#a55a28" stroke-width="4"/><text x="456" y="449" font-size="24" text-anchor="middle" fill="#213033">M1 + P2</text><circle cx="736" cy="328" r="87" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="713" y1="289.0" x2="713" y2="363.0" stroke="#a55a28" stroke-width="4"/><line x1="759" y1="303.5" x2="759" y2="348.5" stroke="#176e6a" stroke-width="4"/><text x="736" y="449" font-size="24" text-anchor="middle" fill="#213033">P1 + M2</text><circle cx="1016" cy="328" r="87" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><line x1="993" y1="289.0" x2="993" y2="363.0" stroke="#a55a28" stroke-width="4"/><line x1="1039" y1="303.5" x2="1039" y2="348.5" stroke="#a55a28" stroke-width="4"/><text x="1016" y="449" font-size="24" text-anchor="middle" fill="#213033">P1 + P2</text><text x="50" y="518" font-size="22" text-anchor="start" fill="#213033">M and P mark inherited homologue origins; 1 and 2 are different chromosome types.</text><text x="50" y="552" font-size="22" text-anchor="start" fill="#213033">The four possible products are collected across possible pair orientations, not one promised meiosis.</text><rect x="50" y="616" width="523" height="146" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="73" y="655" font-size="22" text-anchor="start" fill="#213033">Crossing over: rearranges segments</text><text x="73" y="688" font-size="22" text-anchor="start" fill="#213033">within homologues (see paired model).</text><text x="73" y="721" font-size="22" text-anchor="start" fill="#213033">Random fertilization: combines gametes.</text><rect x="610" y="616" width="540" height="146" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="633" y="655" font-size="22" text-anchor="start" fill="#213033">Mutation: changes a DNA sequence.</text><text x="633" y="688" font-size="22" text-anchor="start" fill="#213033">Example DNA segment: ACG → ATG.</text><text x="633" y="721" font-size="22" text-anchor="start" fill="#213033">That is a different kind of change.</text><text x="50" y="824" font-size="23" text-anchor="start" fill="#213033">The 2ⁿ count excludes crossing over and does not promise every type in a small sample.</text></g></svg>
