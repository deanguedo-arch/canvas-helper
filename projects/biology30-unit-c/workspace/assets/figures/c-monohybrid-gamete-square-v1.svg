<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Derive the gametes before combining offspring probabilities</title><desc id="description">A2×2 Punnett square combines A or a from each Aa parent, each gamete with probability one-half. Four equally weighted cells are AA,Aa,aA,aa, each one-quarter. Aa and aA are one unphased genotype reached by two parental combinations, so genotype probabilities are1/4 AA,1/2 Aa,1/4 aa. With complete dominance, phenotype probabilities are3/4 dominant and1/4 recessive. The square models segregation at one locus; it does not independently establish independence between loci or a fixed four-offspring sequence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Derive the gametes before combining offspring probabilities</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">One locus, Aa × Aa, equal gamete probabilities and complete dominance for the scored trait.</text><text x="50" y="184" font-size="30" text-anchor="start" fill="#213033">Parents: Aa × Aa</text><text x="590" y="184" font-size="24" text-anchor="start" fill="#213033">Gametes from each parent: A (½), a (½)</text><text x="315" y="260" font-size="27" text-anchor="middle" fill="#213033">A (½)</text><text x="145" y="366" font-size="27" text-anchor="middle" fill="#213033">A (½)</text><text x="565" y="260" font-size="27" text-anchor="middle" fill="#213033">a (½)</text><text x="145" y="526" font-size="27" text-anchor="middle" fill="#213033">a (½)</text><rect x="200" y="287" width="250" height="160" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="325" y="354" font-size="36" text-anchor="middle" fill="#213033">AA</text><text x="325" y="405" font-size="25" text-anchor="middle" fill="#213033">¼</text><rect x="450" y="287" width="250" height="160" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="575" y="354" font-size="36" text-anchor="middle" fill="#213033">Aa</text><text x="575" y="405" font-size="25" text-anchor="middle" fill="#213033">¼</text><rect x="200" y="447" width="250" height="160" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="325" y="514" font-size="36" text-anchor="middle" fill="#213033">aA</text><text x="325" y="565" font-size="25" text-anchor="middle" fill="#213033">¼</text><rect x="450" y="447" width="250" height="160" fill="#f2e0ce" stroke="#51716e" stroke-width="2"/><text x="575" y="514" font-size="36" text-anchor="middle" fill="#213033">aa</text><text x="575" y="565" font-size="25" text-anchor="middle" fill="#213033">¼</text><text x="770" y="318" font-size="25" text-anchor="start" fill="#213033">Genotypes:</text><text x="770" y="360" font-size="25" text-anchor="start" fill="#213033">¼ AA</text><text x="770" y="402" font-size="25" text-anchor="start" fill="#213033">½ Aa (includes aA)</text><text x="770" y="444" font-size="25" text-anchor="start" fill="#213033">¼ aa</text><text x="770" y="535" font-size="23" text-anchor="start" fill="#213033">Complete dominance:</text><text x="770" y="573" font-size="23" text-anchor="start" fill="#213033">¾ dominant phenotype</text><text x="770" y="611" font-size="23" text-anchor="start" fill="#213033">¼ recessive phenotype</text><text x="50" y="743" font-size="22" text-anchor="start" fill="#213033">Each cell combines one gamete from each parent; equal cell weights depend on the stated model.</text><text x="50" y="780" font-size="22" text-anchor="start" fill="#213033">Aa and aA are the same unphased genotype reached by two parental combinations.</text><text x="50" y="817" font-size="22" text-anchor="start" fill="#213033">Probabilities describe possible outcomes, not a schedule for four offspring.</text></g></svg>
