<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Separate chromosome sets from DNA-copy state</title><desc id="desc">Three cells show a simplified two-chromosome-type model before replication, after replication and in one product after meiosis I. Long and short symbols identify types; colours distinguish homologues. The first two cells each have two homologous sets, while the final cell has one. X-like symbols denote duplication, not diploidy. A separate human count row gives46 chromosomes/46 DNA molecules,46/92,then23/46 per cell. The picture uses2n=4; the count row uses typical human2n=46.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="50" y="55" text-anchor="start" font-size="30" font-weight="700"><tspan x="50" dy="0">Separate chromosome sets from DNA-copy state</tspan></text><text x="50" y="110" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Count each cell separately. DNA replication doubles copies, not homologous sets.</tspan></text><text x="185" y="190" text-anchor="middle" font-size="24" font-weight="700"><tspan x="185" dy="0">Before replication</tspan></text><circle cx="185" cy="305" r="93" fill="#edf3f1" stroke="#617973" stroke-width="2"/><path d="M141 272.5 L141 337.5" fill="none" stroke="#16766b" stroke-width="3"/><path d="M171 272.5 L171 337.5" fill="none" stroke="#ae682b" stroke-width="3"/><path d="M203 285.0 L203 325.0" fill="none" stroke="#16766b" stroke-width="3"/><path d="M232 285.0 L232 325.0" fill="none" stroke="#ae682b" stroke-width="3"/><text x="185" y="435" text-anchor="middle" font-size="22" font-weight="400"><tspan x="185" dy="0">2 homologous sets</tspan><tspan x="185" dy="29.040000000000003">2 chromosome types pictured</tspan></text><text x="600" y="190" text-anchor="middle" font-size="24" font-weight="700"><tspan x="600" dy="0">Primary spermatocyte</tspan></text><circle cx="600" cy="305" r="93" fill="#edf3f1" stroke="#617973" stroke-width="2"/><path d="M548 272.5 L564 337.5" fill="none" stroke="#16766b" stroke-width="3"/><path d="M564 272.5 L548 337.5" fill="none" stroke="#16766b" stroke-width="3"/><path d="M578 272.5 L594 337.5" fill="none" stroke="#ae682b" stroke-width="3"/><path d="M594 272.5 L578 337.5" fill="none" stroke="#ae682b" stroke-width="3"/><path d="M610 285.0 L626 325.0" fill="none" stroke="#16766b" stroke-width="3"/><path d="M626 285.0 L610 325.0" fill="none" stroke="#16766b" stroke-width="3"/><path d="M639 285.0 L655 325.0" fill="none" stroke="#ae682b" stroke-width="3"/><path d="M655 285.0 L639 325.0" fill="none" stroke="#ae682b" stroke-width="3"/><text x="600" y="435" text-anchor="middle" font-size="22" font-weight="400"><tspan x="600" dy="0">2 homologous sets</tspan><tspan x="600" dy="29.040000000000003">2 chromosome types pictured</tspan></text><text x="1015" y="190" text-anchor="middle" font-size="24" font-weight="700"><tspan x="1015" dy="0">After meiosis I</tspan></text><circle cx="1015" cy="305" r="93" fill="#edf3f1" stroke="#617973" stroke-width="2"/><path d="M982 272.5 L998 337.5" fill="none" stroke="#16766b" stroke-width="3"/><path d="M998 272.5 L982 337.5" fill="none" stroke="#16766b" stroke-width="3"/><path d="M1032 285.0 L1048 325.0" fill="none" stroke="#ae682b" stroke-width="3"/><path d="M1048 285.0 L1032 325.0" fill="none" stroke="#ae682b" stroke-width="3"/><text x="1015" y="435" text-anchor="middle" font-size="22" font-weight="400"><tspan x="1015" dy="0">1 homologous set</tspan><tspan x="1015" dy="29.040000000000003">2 chromosome types pictured</tspan></text><path d="M300 305 L477 305" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="388" y="278" text-anchor="middle" font-size="21" font-weight="400"><tspan x="388" dy="0">Copy DNA</tspan></text><path d="M715 305 L892 305" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="804" y="262" text-anchor="middle" font-size="20" font-weight="400"><tspan x="804" dy="0">Separate</tspan><tspan x="804" dy="26.400000000000002">homologues</tspan></text><text x="50" y="545" text-anchor="start" font-size="26" font-weight="700"><tspan x="50" dy="0">Typical human counts — per cell</tspan></text><rect x="30" y="580" width="310" height="110" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="185" y="622" text-anchor="middle" font-size="24" font-weight="400"><tspan x="185" dy="0">46 chromosomes</tspan><tspan x="185" dy="31.68">46 DNA molecules</tspan></text><rect x="445" y="580" width="310" height="110" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="600" y="622" text-anchor="middle" font-size="24" font-weight="400"><tspan x="600" dy="0">46 chromosomes</tspan><tspan x="600" dy="31.68">92 DNA molecules</tspan></text><rect x="860" y="580" width="310" height="110" fill="#edf3f1" stroke="#617973" stroke-width="2"/><text x="1015" y="622" text-anchor="middle" font-size="24" font-weight="400"><tspan x="1015" dy="0">23 chromosomes</tspan><tspan x="1015" dy="31.68">46 DNA molecules</tspan></text><text x="50" y="760" text-anchor="start" font-size="23" font-weight="400"><tspan x="50" dy="0">Picture key: long and short symbols are two chromosome types in a simplified model.</tspan><tspan x="50" dy="30.360000000000003">Colours distinguish homologues; X-like symbols are duplicated chromosomes.</tspan><tspan x="50" dy="30.360000000000003">The pictured model has 2n = 4; the human count row has 2n = 46.</tspan></text></g></svg>