<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Compare where the new cell boundary develops</title><desc id="description">The upper schematic animal cell has two nuclear regions and a narrowing external cleavage furrow. Inward arrows show a contractile ring constricting beneath the membrane. The lower plant model has a rigid outer boundary and a central developing cell plate between two nuclei; arrows extend from the centre toward the existing cell boundary. Vesicles contribute to the plate and the developing membranes and wall. The snapshots show division in progress, not complete separation. Two nuclei alone do not prove two separate cells; mechanisms can vary across biological contexts.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Compare where the new cell boundary develops</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">Animal and plant models coordinate cytoplasmic separation with nuclear division.</text><text x="50" y="190" font-size="25" text-anchor="start" fill="#213033">Many animal cells: constriction from the outside</text><path d="M95,320 C95,235 220,218 290,282 C345,303 345,303 400,282 C470,218 595,235 595,320 C595,405 470,422 400,358 C345,337 345,337 290,358 C220,422 95,405 95,320 Z" fill="#edf5f2" stroke="#51716e" stroke-width="3"/><circle cx="220" cy="320" r="40" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="470" cy="320" r="40" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><path d="M345,206 L345,291" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><path d="M345,442 L345,351" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><text x="675" y="283" font-size="24" text-anchor="start" fill="#213033">A contractile ring beneath</text><text x="675" y="317" font-size="24" text-anchor="start" fill="#213033">the membrane narrows the</text><text x="675" y="351" font-size="24" text-anchor="start" fill="#213033">cleavage furrow.</text><text x="50" y="527" font-size="25" text-anchor="start" fill="#213033">Typical plant cells: a partition builds from the centre</text><rect x="95" y="566" width="500" height="186" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><circle cx="220" cy="659" r="40" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><circle cx="470" cy="659" r="40" fill="#c6dfed" stroke="#51716e" stroke-width="2"/><line x1="345" y1="623" x2="345" y2="695" stroke="#a55a28" stroke-width="7"/><path d="M345,620 L345,578" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><path d="M345,698 L345,741" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><text x="675" y="613" font-size="23" text-anchor="start" fill="#213033">Vesicles contribute to a cell plate.</text><text x="675" y="647" font-size="23" text-anchor="start" fill="#213033">It expands outward and contributes</text><text x="675" y="681" font-size="23" text-anchor="start" fill="#213033">to new membranes and wall.</text><text x="50" y="829" font-size="23" text-anchor="start" fill="#213033">Two nuclei do not by themselves prove that the cytoplasm has finished separating.</text></g></svg>
