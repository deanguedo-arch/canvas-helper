<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Follow ploidy through the plant life cycle</title><desc id="description">A five-stage loop shows diploid sporophyte making haploid spores by meiosis, spores growing by mitosis into haploid gametophytes, gametophytes producing haploid gametes by mitosis, fertilization of gametes producing a diploid zygote, and mitotic growth returning to the sporophyte. In moss the leafy plant is the gametophyte and its attached stalk and capsule are the sporophyte. In pine the tree and cone tissues are diploid; pollen is a haploid male gametophyte and the haploid female gametophyte develops inside an ovule. A whole ovule or cone is not haploid. Spores grow without fusion, unlike gametes. Process arrows order stages, not durations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Follow ploidy through the plant life cycle</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">Moss and pine share these transitions while their visible generations differ.</text><rect x="70" y="190" width="330" height="76" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="235" y="222" font-size="25" text-anchor="middle" fill="#213033">Sporophyte</text><text x="235" y="252" font-size="25" text-anchor="middle" fill="#213033">2n</text><path d="M235,267 L235,304" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><text x="435" y="295" font-size="23" text-anchor="start" fill="#213033">MEIOSIS</text><rect x="70" y="307" width="330" height="76" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="235" y="339" font-size="25" text-anchor="middle" fill="#213033">Spores</text><text x="235" y="369" font-size="25" text-anchor="middle" fill="#213033">n</text><path d="M235,384 L235,421" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><text x="435" y="412" font-size="23" text-anchor="start" fill="#213033">MITOSIS</text><rect x="70" y="424" width="330" height="76" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="235" y="456" font-size="25" text-anchor="middle" fill="#213033">Gametophytes</text><text x="235" y="486" font-size="25" text-anchor="middle" fill="#213033">n</text><path d="M235,501 L235,538" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><text x="435" y="529" font-size="23" text-anchor="start" fill="#213033">MITOSIS</text><rect x="70" y="541" width="330" height="76" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="235" y="573" font-size="25" text-anchor="middle" fill="#213033">Gametes</text><text x="235" y="603" font-size="25" text-anchor="middle" fill="#213033">n</text><path d="M235,618 L235,655" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><text x="435" y="646" font-size="23" text-anchor="start" fill="#213033">FERTILIZATION</text><rect x="70" y="658" width="330" height="76" fill="#edf5f2" stroke="#51716e" stroke-width="2"/><text x="235" y="690" font-size="25" text-anchor="middle" fill="#213033">Zygote</text><text x="235" y="720" font-size="25" text-anchor="middle" fill="#213033">2n</text><path d="M400,696 L1030,696" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1030,696 L1030,210 L405,210" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="667" font-size="24" text-anchor="middle" fill="#213033">MITOSIS → growth</text><text x="650" y="328" font-size="21" text-anchor="start" fill="#213033">Moss: leafy plant is n.</text><text x="650" y="368" font-size="21" text-anchor="start" fill="#213033">Attached stalk + capsule are 2n.</text><text x="650" y="408" font-size="21" text-anchor="start" fill="#213033"></text><text x="650" y="448" font-size="21" text-anchor="start" fill="#213033">Pine: tree and cone tissues are 2n.</text><text x="650" y="488" font-size="21" text-anchor="start" fill="#213033">Pollen is a male gametophyte (n).</text><text x="650" y="528" font-size="21" text-anchor="start" fill="#213033">Female gametophyte is within an ovule.</text><text x="50" y="808" font-size="22" text-anchor="start" fill="#213033">A spore grows without fusing; a gamete joins another gamete at fertilization.</text><text x="50" y="843" font-size="22" text-anchor="start" fill="#213033">Mitosis preserves the current ploidy. Plant meiosis produces spores, not directly gametes.</text></g></svg>
