<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Arrange chromosomes before interpreting the count</title><desc id="description">Three arranged fictional chromosome complements compare two of each of three chromosome types, a set with one extra type2 chromosome, and three of every type. Counts are6,7 and9 respectively. Duplicated symbols are counted as chromosomes, not doubled for their sisters. Type is indicated by length and matching symbolic band/centromere features; colors distinguish members, not diagnostic identities. One extra specific chromosome is aneuploidy; an extra complete set is polyploidy. This is not a human karyotype and cannot identify a clinical condition, individual phenotype, small sequence variant or all unsampled cell lineages.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Arrange chromosomes before interpreting the count</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">A fictional model with three chromosome types distinguishes aneuploidy and polyploidy.</text><text x="50" y="230" font-size="25" text-anchor="start" fill="#213033">Two sets</text><text x="50" y="270" font-size="22" text-anchor="start" fill="#213033">6 chromosomes</text><line x1="486.5" y1="204.5" x2="498.5" y2="289.5" stroke="#176e6a" stroke-width="4"/><line x1="498.5" y1="204.5" x2="486.5" y2="289.5" stroke="#176e6a" stroke-width="4"/><line x1="485.5" y1="238" x2="499.5" y2="238" stroke="#213033" stroke-width="3"/><line x1="521.5" y1="204.5" x2="533.5" y2="289.5" stroke="#a55a28" stroke-width="4"/><line x1="533.5" y1="204.5" x2="521.5" y2="289.5" stroke="#a55a28" stroke-width="4"/><line x1="