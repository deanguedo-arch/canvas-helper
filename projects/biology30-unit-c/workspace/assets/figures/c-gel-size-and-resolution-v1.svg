<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description"><title id="title">Read migration, controls and resolution before identity</title><desc id="description">An ordinary-gel schematic has a size ladder1000,600,400,200bp and reference,substitution,insertion and no-template lanes. Wells are at the negative end,with DNA migration downward toward positive; smaller fragments travel farther in this qualitative model. Reference and substitution each have600+400bp fragments,while insertion has600+401bp. The400/401 bands are intentionally drawn unresolved at this ordinary-gel resolution rather than falsely claiming a visible one-base difference. A clean no-template lane is the stipulated control pattern,not an observed assay. Known positive and sample-specific controls remain necessary for a missing-band inference. Fragment sizes are independently supplied measurements,not derived from the short coding excerpt; matching bands do not imply identical sequences or unique identity.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176e6a"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="58" font-size="31" text-anchor="start" fill="#213033">Read migration, controls and resolution before identity</text><text x="50" y="109" font-size="23" text-anchor="start" fill="#213033">An idealized model of the supplied larger fragments; it is not a laboratory gel photograph.</text><text x="50" y="178" font-size="24" text-anchor="start" fill="#213033">Idealized ordinary gel: bands represent size evidence, not complete sequences.</text><text x="185" y="231" font-size="22" text-anchor="middle" fill="#213033">Ladder</text><rect x="127" y="258" width="116" height="420" fill="#f5f7f6" stroke="#51716e" stroke-width="2"/><rect x="154" y="273" width="62" height="12" fill="#d1d9d7" stroke="#51716e" stroke-width="2"/><text x="387" y="231" font-size="22" text-anchor="middle" fill="#213033">Reference</text><rect x="329" y="258" width="116" height="420" fill="#f5f7f6" stroke="#51716e" stroke-width="2"/><rect x="356" y="273" width="62" height="12" fill="#d1d9d7" stroke="#51716e" stroke-width="2"/><text x="589" y="231" font-size="22" text-anchor="middle" fill="#213033">Substitution</text><rect x="531" y="258" width="116" height="420" fill="#f5f7f6" stroke="#51716e" stroke-width="2"/><rect x="558" y="273" width="62" height="12" fill="#d1d9d7" stroke="#51716e" stroke-width="2"/><text x="791" y="231" font-size="22" text-anchor="middle" fill="#213033">Insertion</text><rect x="733" y="258" width="116" height="420" fill="#f5f7f6" stroke="#51716e" stroke-width="2"/><rect x="760" y="273" width="62" height="12" fill="#d1d9d7" stroke="#51716e" stroke-width="2"/><text x="993" y="231" font-size="22" text-anchor="middle" fill="#213033">No-template</text><rect x="935" y="258" width="116" height="420" fill="#f5f7f6" stroke="#51716e" stroke-width="2"/><rect x="962" y="273" width="62" height="12" fill="#d1d9d7" stroke="#51716e" stroke-width="2"/><line x1="154" y1="342" x2="216" y2="342" stroke="#213033" stroke-width="8"/><text x="106" y="349" font-size="21" text-anchor="end" fill="#213033">1000</text><line x1="154" y1="422" x2="216" y2="422" stroke="#213033" stroke-width="8"/><text x="106" y="429" font-size="21" text-anchor="end" fill="#213033">600</text><line x1="154" y1="507" x2="216" y2="507" stroke="#213033" stroke-width="8"/><text x="106" y="514" font-size="21" text-anchor="end" fill="#213033">400</text><line x1="154" y1="614" x2="216" y2="614" stroke="#213033" stroke-width="8"/><text x="106" y="621" font-size="21" text-anchor="end" fill="#213033">200</text><line x1="356" y1="422" x2="418" y2="422" stroke="#176e6a" stroke-width="8"/><line x1="356" y1="507" x2="418" y2="507" stroke="#176e6a" stroke-width="8"/><line x1="558" y1="422" x2="620" y2="422" stroke="#176e6a" stroke-width="8"/><line x1="558" y1="507" x2="620" y2="507" stroke="#176e6a" stroke-width="8"/><line x1="760" y1="422" x2="822" y2="422" stroke="#176e6a" stroke-width="8"/><line x1="760" y1="507" x2="822" y2="507" stroke="#176e6a" stroke-width="8"/><path d="M1140,287 L1140,654" fill="none" stroke="#176e6a" stroke-width="3" marker-end="url(#arrow)"/><text x="1104" y="283" font-size="26" text-anchor="start" fill="#213033">−</text><text x="1104" y="664" font-size="26" text-anchor="start" fill="#213033">+</text><text x="50" y="725" font-size="22" text-anchor="start" fill="#213033">DNA migrates toward +; smaller fragments generally travel farther. Ladder sizes are in bp.</text><text x="50" y="772" font-size="21" text-anchor="start" fill="#213033">Reference and substitution: 600 + 400 bp; insertion: 600 + 401 bp in the supplied model.</text><text x="50" y="806" font-size="21" text-anchor="start" fill="#213033">The 400/401 difference is deliberately unresolved here. Matching bands do not prove identical DNA.</text><text x="50" y="840" font-size="21" text-anchor="start" fill="#213033">A clean no-template control checks contamination; a known positive and sample controls test assay function.</text></g></svg>
