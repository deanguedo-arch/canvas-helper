<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Random pairing from an allele pool</title><desc>Under Hardy–Weinberg assumptions, allele frequencies p and q combine into p², pq, qp and q²; the two heterozygous outcomes add to 2pq.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Random pairing from an allele pool</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><text x="430" y="230" font-family="Arial,sans-serif" font-size="30" fill="#367aaa" text-anchor="middle" font-weight="400">A: p</text><text x="800" y="230" font-family="Arial,sans-serif" font-size="30" fill="#c27832" text-anchor="middle" font-weight="400">a: q</text><text x="135" y="365" font-family="Arial,sans-serif" font-size="27" fill="#367aaa" text-anchor="middle" font-weight="400">A: p</text><text x="135" y="570" font-family="Arial,sans-serif" font-size="27" fill="#c27832" text-anchor="middle" font-weight="400">a: q</text><rect x="260" y="270" width="365" height="200" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="442.5" y="306" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">AA</text><circle cx="440" cy="398" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="440" y="406" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><rect x="630" y="270" width="365" height="200" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="812.5" y="306" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">Aa</text><circle cx="810" cy="398" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="810" y="406" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><rect x="260" y="475" width="365" height="200" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="442.5" y="511" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">Aa</text><circle cx="440" cy="603" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="440" y="611" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><rect x="630" y="475" width="365" height="200" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="812.5" y="511" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">aa</text><circle cx="810" cy="603" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="810" y="611" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">D</text><text x="1175" y="325" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">Two ways to</text><text x="1175" y="358" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">form Aa: pq +</text><text x="1175" y="391" font-family="Arial,sans-serif" font-size="25" fill="#171b1b" text-anchor="middle" font-weight="400">qp = 2pq</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">A · p²</text><text x="495" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">B · pq</text><text x="940" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">C · pq</text><text x="50" y="825" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">D · q²</text></svg>