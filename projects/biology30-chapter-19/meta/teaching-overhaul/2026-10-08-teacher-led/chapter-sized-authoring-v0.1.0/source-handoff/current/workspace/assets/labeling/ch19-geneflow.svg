<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Combine allele pools using their contributions</title><desc>Eighty residents at p = 0.25 and twenty immigrants at p = 0.75 contribute equally per breeder. Their combined A frequency is 70/200 = 0.35.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Combine allele pools using their contributions</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Constructed equal-contribution model — diploid autosomal locus</text><rect x="100" y="210" width="475" height="220" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="337.5" y="246" font-family="Arial,sans-serif" font-size="27" fill="#171b1b" text-anchor="middle" font-weight="400">80 residents</text><text x="337.5" y="281" font-family="Arial,sans-serif" font-size="27" fill="#171b1b" text-anchor="middle" font-weight="400">160 allele copies</text><text x="337.5" y="316" font-family="Arial,sans-serif" font-size="27" fill="#171b1b" text-anchor="middle" font-weight="400">40 A copies</text><rect x="820" y="210" width="475" height="220" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1057.5" y="246" font-family="Arial,sans-serif" font-size="27" fill="#171b1b" text-anchor="middle" font-weight="400">20 immigrants</text><text x="1057.5" y="281" font-family="Arial,sans-serif" font-size="27" fill="#171b1b" text-anchor="middle" font-weight="400">40 allele copies</text><text x="1057.5" y="316" font-family="Arial,sans-serif" font-size="27" fill="#171b1b" text-anchor="middle" font-weight="400">30 A copies</text><line x1="350" y1="455" x2="600" y2="565" stroke="#146c60" stroke-width="5"/><polygon points="600.0,565.0 583.1,566.5 589.6,551.5" fill="#146c60"/><line x1="1070" y1="455" x2="800" y2="565" stroke="#146c60" stroke-width="5"/><polygon points="800.0,565.0 810.7,551.8 816.9,566.9" fill="#146c60"/><rect x="440" y="575" width="520" height="115" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="700.0" y="611" font-family="Arial,sans-serif" font-size="27" fill="#171b1b" text-anchor="middle" font-weight="400">Combined: 200 copies, 70 A</text><line x1="190" y1="175" x2="350" y2="300" stroke="#171b1b" stroke-width="2.5"/><circle cx="350" cy="300" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="190" cy="175" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="190" y="183" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><line x1="1205" y1="175" x2="1060" y2="300" stroke="#171b1b" stroke-width="2.5"/><circle cx="1060" cy="300" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="1205" cy="175" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1205" y="183" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><line x1="1050" y1="660" x2="900" y2="625" stroke="#171b1b" stroke-width="2.5"/><circle cx="900" cy="625" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="1050" cy="660" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1050" y="668" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="790" font-family="Arial,sans-serif" font-size="21" fill="#5b635d">Use the lettered features and the nearby lesson explanation.</text></svg>