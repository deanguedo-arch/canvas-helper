<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Read the pattern before assigning a cause</title><desc id="desc">Samples36AA48Aa16aa,45AA45Aa10aa and42AA46Aa12aa givep0.60,0.675,0.65. A line joins points in sampling order on a zero-to-one frequency axis; intervals are not specified and no rate is inferred. The change is a rise followed by a decline, not a steady increase. Counts and denominator remain visible. The cause is unresolved without further evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">Read the pattern before assigning a cause</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Each sample contains 100 diploid individuals at the same autosomal locus.</tspan></text><path d="M180 510 L1100 510" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="152" y="518" text-anchor="end" font-size="22" font-weight="400"><tspan x="152" dy="0">0.0</tspan></text><path d="M180 445 L1100 445" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="152" y="453" text-anchor="end" font-size="22" font-weight="400"><tspan x="152" dy="0">0.2</tspan></text><path d="M180 380 L1100 380" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="152" y="388" text-anchor="end" font-size="22" font-weight="400"><tspan x="152" dy="0">0.4</tspan></text><path d="M180 315 L1100 315" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="152" y="323" text-anchor="end" font-size="22" font-weight="400"><tspan x="152" dy="0">0.6</tspan></text><path d="M180 250 L1100 250" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="152" y="258" text-anchor="end" font-size="22" font-weight="400"><tspan x="152" dy="0">0.8</tspan></text><path d="M180 185 L1100 185" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="152" y="193" text-anchor="end" font-size="22" font-weight="400"><tspan x="152" dy="0">1.0</tspan></text><text x="55" y="167" text-anchor="start" font-size="22" font-weight="400"><tspan x="55" dy="0">A allele frequency (p)</tspan></text><path d="M310 315.0 L635 290.625" fill="none" stroke="#16766b" stroke-width="3"/><path d="M635 290.625 L960 298.75" fill="none" stroke="#16766b" stroke-width="3"/><circle cx="310" cy="315.0" r="9" fill="#16766b"/><text x="310" y="292.0" text-anchor="middle" font-size="24" font-weight="700"><tspan x="310" dy="0">0.6</tspan></text><text x="310" y="550" text-anchor="middle" font-size="24" font-weight="400"><tspan x="310" dy="0">Sample 1</tspan></text><circle cx="635" cy="290.625" r="9" fill="#16766b"/><text x="635" y="267.625" text-anchor="middle" font-size="24" font-weight="700"><tspan x="635" dy="0">0.675</tspan></text><text x="635" y="550" text-anchor="middle" font-size="24" font-weight="400"><tspan x="635" dy="0">Sample 2</tspan></text><circle cx="960" cy="298.75" r="9" fill="#16766b"/><text x="960" y="275.75" text-anchor="middle" font-size="24" font-weight="700"><tspan x="960" dy="0">0.65</tspan></text><text x="960" y="550" text-anchor="middle" font-size="24" font-weight="400"><tspan x="960" dy="0">Sample 3</tspan></text><text x="650" y="591" text-anchor="middle" font-size="22" font-weight="400"><tspan x="650" dy="0">Sampling order; intervals were not supplied</tspan></text><text x="55" y="649" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Original counts (AA / Aa / aa):</tspan></text><text x="310" y="700" text-anchor="middle" font-size="25" font-weight="400"><tspan x="310" dy="0">36 / 48 / 16</tspan></text><text x="635" y="700" text-anchor="middle" font-size="25" font-weight="400"><tspan x="635" dy="0">45 / 45 / 10</tspan></text><text x="960" y="700" text-anchor="middle" font-size="25" font-weight="400"><tspan x="960" dy="0">42 / 46 / 12</tspan></text><text x="55" y="774" text-anchor="start" font-size="24" font-weight="400"><tspan x="55" dy="0">p = (2 × AA + Aa) / (2N). The frequency rises, then falls.</tspan><tspan x="55" dy="32.400000000000006">This pattern alone cannot distinguish selection, drift, migration or sampling.</tspan></text></g></svg>