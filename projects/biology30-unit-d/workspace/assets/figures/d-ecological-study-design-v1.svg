<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Use four conditions to separate two proposed influences</title><desc id="desc">A two-by-two design compares habitat restoration absent/present against usual/reduced predator access. The four conditions are reference, habitat restoration only, predator-access reduction only and both changes. Each needs repeated comparable sites and consistent recruitment measurements over sufficient time. Results can differ for combined versus single changes; no observations or agreement are invented. Biodiversity, water conditions, cost and respectfully sought Indigenous and local perspectives also inform a recommendation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Use four conditions to separate two proposed influences</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">A fictional wetland study compares two proposed influences independently.</tspan></text><text x="790" y="180" text-anchor="middle" font-size="26" font-weight="700"><tspan x="790" dy="0">Habitat restoration</tspan></text><text x="590" y="228" text-anchor="middle" font-size="24" font-weight="400"><tspan x="590" dy="0">Absent</tspan></text><text x="990" y="228" text-anchor="middle" font-size="24" font-weight="400"><tspan x="990" dy="0">Present</tspan></text><text x="55" y="310" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">Predator access</tspan></text><text x="185" y="372" text-anchor="middle" font-size="24" font-weight="700"><tspan x="185" dy="0">Usual</tspan></text><rect x="390" y="265" width="370" height="170" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="575" y="320" text-anchor="middle" font-size="23" font-weight="700"><tspan x="575" dy="0">Reference</tspan><tspan x="575" dy="31.05">Neither change</tspan></text><text x="575" y="402" text-anchor="middle" font-size="22" font-weight="400"><tspan x="575" dy="0">Measure recruitment</tspan></text><rect x="790" y="265" width="370" height="170" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="975" y="320" text-anchor="middle" font-size="23" font-weight="700"><tspan x="975" dy="0">Habitat only</tspan><tspan x="975" dy="31.05">Restoration alone</tspan></text><text x="975" y="402" text-anchor="middle" font-size="22" font-weight="400"><tspan x="975" dy="0">Measure recruitment</tspan></text><text x="185" y="562" text-anchor="middle" font-size="24" font-weight="700"><tspan x="185" dy="0">Reduced</tspan></text><rect x="390" y="455" width="370" height="170" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="575" y="510" text-anchor="middle" font-size="23" font-weight="700"><tspan x="575" dy="0">Predator access only</tspan><tspan x="575" dy="31.05">Reduction alone</tspan></text><text x="575" y="592" text-anchor="middle" font-size="22" font-weight="400"><tspan x="575" dy="0">Measure recruitment</tspan></text><rect x="790" y="455" width="370" height="170" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="975" y="510" text-anchor="middle" font-size="23" font-weight="700"><tspan x="975" dy="0">Both changes</tspan><tspan x="975" dy="31.05">Combined condition</tspan></text><text x="975" y="592" text-anchor="middle" font-size="22" font-weight="400"><tspan x="975" dy="0">Measure recruitment</tspan></text><text x="55" y="724" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Repeat comparable sites and measure consistently across enough time.</tspan><tspan x="55" dy="31.05">Compare biodiversity, water conditions, costs and community priorities as well.</tspan></text><text x="55" y="815" text-anchor="start" font-size="22" font-weight="400"><tspan x="55" dy="0">Engage Indigenous and local perspectives respectfully; this diagram assumes no agreement.</tspan></text></g></svg>