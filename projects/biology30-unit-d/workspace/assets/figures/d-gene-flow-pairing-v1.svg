<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Changing the pool versus changing the pairings</title><desc id="desc">Adding tenAA immigrants to100diploid individuals with120A80a produces140A80a among220copies, pabout0.6364. A separate fixed-pool illustration compares36AA48Aa16aa with48AA24Aa28aa; both have120A80a, p0.60. Genotype proportions can differ without allele-frequency change when copy totals are held fixed. Differential reproductive success is distinguished from rearranging pairings.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">Changing the pool versus changing the pairings</tspan></text><text x="55" y="111" text-anchor="start" font-size="24" font-weight="400"><tspan x="55" dy="0">Receiving group: 100 diploid individuals, initially p = 0.60.</tspan></text><rect x="55" y="168" width="315" height="155" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="212.5" y="203" text-anchor="middle" font-size="24" font-weight="700"><tspan x="212.5" dy="0">Original allele pool</tspan></text><text x="212.5" y="248" text-anchor="middle" font-size="24" font-weight="400"><tspan x="212.5" dy="0">120 A + 80 a</tspan><tspan x="212.5" dy="32.400000000000006">200 copies</tspan></text><rect x="447" y="168" width="270" height="155" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="582.0" y="203" text-anchor="middle" font-size="24" font-weight="700"><tspan x="582.0" dy="0">10 AA immigrants</tspan></text><text x="582.0" y="248" text-anchor="middle" font-size="24" font-weight="400"><tspan x="582.0" dy="0">20 A + 0 a</tspan><tspan x="582.0" dy="32.400000000000006">20 copies</tspan></text><rect x="795" y="168" width="350" height="155" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="970.0" y="203" text-anchor="middle" font-size="24" font-weight="700"><tspan x="970.0" dy="0">Combined pool</tspan></text><text x="970.0" y="248" text-anchor="middle" font-size="24" font-weight="400"><tspan x="970.0" dy="0">140 A + 80 a</tspan><tspan x="970.0" dy="32.400000000000006">220 copies</tspan></text><text x="407" y="255" text-anchor="middle" font-size="35" font-weight="400"><tspan x="407" dy="0">+</tspan></text><text x="755" y="255" text-anchor="middle" font-size="35" font-weight="400"><tspan x="755" dy="0">=</tspan></text><text x="55" y="386" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">New p = 140 / 220 ≈ 0.6364 before reproduction in the combined group.</tspan></text><text x="55" y="464" text-anchor="start" font-size="26" font-weight="700"><tspan x="55" dy="0">Contrast: same allele totals, different genotype pairings</tspan></text><rect x="55" y="510" width="310" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="210.0" y="555" text-anchor="middle" font-size="22" font-weight="700"><tspan x="210.0" dy="0">100 individuals</tspan></text><rect x="365" y="510" width="135" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="432.5" y="555" text-anchor="middle" font-size="22" font-weight="700"><tspan x="432.5" dy="0">AA</tspan></text><rect x="500" y="510" width="135" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="567.5" y="555" text-anchor="middle" font-size="22" font-weight="700"><tspan x="567.5" dy="0">Aa</tspan></text><rect x="635" y="510" width="135" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="702.5" y="555" text-anchor="middle" font-size="22" font-weight="700"><tspan x="702.5" dy="0">aa</tspan></text><rect x="770" y="510" width="195" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="867.5" y="555" text-anchor="middle" font-size="22" font-weight="700"><tspan x="867.5" dy="0">A copies</tspan></text><rect x="965" y="510" width="180" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="1055.0" y="555" text-anchor="middle" font-size="22" font-weight="700"><tspan x="1055.0" dy="0">a copies</tspan></text><rect x="55" y="582" width="310" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="210.0" y="627" text-anchor="middle" font-size="22" font-weight="400"><tspan x="210.0" dy="0">Pairing pattern 1</tspan></text><rect x="365" y="582" width="135" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="432.5" y="627" text-anchor="middle" font-size="22" font-weight="400"><tspan x="432.5" dy="0">36</tspan></text><rect x="500" y="582" width="135" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="567.5" y="627" text-anchor="middle" font-size="22" font-weight="400"><tspan x="567.5" dy="0">48</tspan></text><rect x="635" y="582" width="135" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="702.5" y="627" text-anchor="middle" font-size="22" font-weight="400"><tspan x="702.5" dy="0">16</tspan></text><rect x="770" y="582" width="195" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="867.5" y="627" text-anchor="middle" font-size="22" font-weight="400"><tspan x="867.5" dy="0">120</tspan></text><rect x="965" y="582" width="180" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="1055.0" y="627" text-anchor="middle" font-size="22" font-weight="400"><tspan x="1055.0" dy="0">80</tspan></text><rect x="55" y="654" width="310" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="210.0" y="699" text-anchor="middle" font-size="22" font-weight="400"><tspan x="210.0" dy="0">Pairing pattern 2</tspan></text><rect x="365" y="654" width="135" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="432.5" y="699" text-anchor="middle" font-size="22" font-weight="400"><tspan x="432.5" dy="0">48</tspan></text><rect x="500" y="654" width="135" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="567.5" y="699" text-anchor="middle" font-size="22" font-weight="400"><tspan x="567.5" dy="0">24</tspan></text><rect x="635" y="654" width="135" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="702.5" y="699" text-anchor="middle" font-size="22" font-weight="400"><tspan x="702.5" dy="0">28</tspan></text><rect x="770" y="654" width="195" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="867.5" y="699" text-anchor="middle" font-size="22" font-weight="400"><tspan x="867.5" dy="0">120</tspan></text><rect x="965" y="654" width="180" height="72" fill="#fff" stroke="#627b75" stroke-width="2"/><text x="1055.0" y="699" text-anchor="middle" font-size="22" font-weight="400"><tspan x="1055.0" dy="0">80</tspan></text><text x="55" y="780" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Both patterns still give p = 0.60 and q = 0.40. This contrast holds copy totals fixed.</tspan><tspan x="55" dy="31.05">Unequal mating success can change contributions; it is a different selection process.</tspan></text></g></svg>