<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Compare overlap when alone and when together</title><desc id="desc">Qualitative resource-use curves show broad overlapping use by speciesA andB when each is alone, and narrower less-overlapping use when together. Both panels use the same horizontal resource dimension; line styles distinguish species. The comparison assumes matched conditions and is illustrative rather than measured. A shift supports competition but does not exclude differences in resource availability or other site conditions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Compare overlap when alone and when together</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Compare resource use under matched conditions; curves are qualitative.</tspan></text><text x="55" y="190" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">Each species alone</tspan></text><path d="M180 385 L1110 385" fill="none" stroke="#526a66" stroke-width="3"/><polyline points="180.00,373.80 186.13,372.88 192.27,371.91 198.40,370.87 204.53,369.77 210.67,368.60 216.80,367.36 222.93,366.06 229.07,364.68 235.20,363.23 241.33,361.70 247.47,360.10 253.60,358.42 259.73,356.67 265.87,354.83 272.00,352.91 278.13,350.92 284.27,348.84 290.40,346.69 296.53,344.46 302.67,342.15 308.80,339.76 314.93,337.30 321.07,334.77 327.20,332.17 333.33,329.51 339.47,326.78 345.60,323.99 351.73,321.14 357.87,318.25 364.00,315.31 370.13,312.33 376.27,309.32 382.40,306.28 388.53,303.21 394.67,300.14 400.80,297.05 