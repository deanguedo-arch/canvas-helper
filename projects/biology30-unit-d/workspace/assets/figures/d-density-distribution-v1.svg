e-width="2"/><text x="690" y="294" text-anchor="middle" font-size="25" font-weight="400"><tspan x="690" dy="0">20</tspan></text><rect x="730" y="245" width="80" height="80" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="770" y="294" text-anchor="middle" font-size="25" font-weight="400"><tspan x="770" dy="0">20</tspan></text><rect x="810" y="245" width="80" height="80" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="850" y="294" text-anchor="middle" font-size="25" font-weight="400"><tspan x="850" dy="0">20</tspan></text><rect x="890" y="245" width="80" height="80" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="930" y="294" text-anchor="middle" font-size="25" font-weight="400"><tspan x="930" dy="0">20</tspan></text><rect x="970" y="245" width="80" height="80" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="1010" y="294" text-anchor="middle" font-size="25" font-weight="400"><tspan x="1010" dy="0">20</tspan></text><text x="850" y="456" text-anchor="middle" font-size="25" font-weight="700"><tspan x="850" dy="0">100 individuals / 5 ha</tspan><tspan x="850" dy="33.75">20 individuals/ha</tspan></text><text x="55" y="567" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">Equal density also allows different spatial distributions.</tspan></text><rect x="100" y="612" width="245" height="150" fill="#fff" stroke="#627b75" stroke-width="2"/><circle cx="135" cy="637" r="7" fill="#16766b"/><circle cx="205" cy="637" r="7" fill="#16766b"/><circle cx="275" cy="637" r="7" fill="#16766b"/><circle cx="135" cy="682" r="7" fill="#16766b"/><circle cx="205" cy="682" r="7" fill="#16766b"/><circle cx="275" cy="682" r="7" fill="#16766b"/><circle cx="135" cy="727" r="7" fill="#16766b"/><circle cx="205" cy="727" r="7" fill="#16766b"/><circle cx="275" cy="727" r="7" fill="#16766b"/><text x="222" y="804" text-anchor="middle" font-size="24" font-weight="700"><tspan x="222" dy="0">Uniform</tspan></text><rect x="475" y="612" width="245" height="150" fill="#fff" stroke="#627b75" stroke-width="2"/><circle cx="513" cy="642" r="7" fill="#16766b"/><circle cx="527" cy="655" r="7" fill="#16766b"/><circle cx="541" cy="640" r="7" fill="#16766b"/><circle cx="517" cy="669" r="7" fill="#16766b"/><circle cx="625" cy="702" r="7" fill="#16766b"/><circle cx="645" cy="694" r="7" fill="#16766b"/><circle cx="659" cy="709" r="7" fill="#16766b"/><circle cx="635" cy="722" r="7" fill="#16766b"/><circle cx="665" cy="728" r="7" fill="#16766b"/><text x="597" y="804" text-anchor="middle" font-size="24" font-weight="700"><tspan x="597" dy="0">Clumped</tspan></text><rect x="850" y="612" width="245" height="150" fill="#fff" stroke="#627b75" stroke-width="2"/><circle cx="881" cy="707" r="7" fill="#16766b"/><circle cx="909" cy="639" r="7" fill="#16766b"/><circle cx="1021" cy="666" r="7" fill="#16766b"/><circle cx="953" cy="723" r="7" fill="#16766b"/><circle cx="1038" cy="637" r="7" fill="#16766b"/><circle cx="979" cy="697" r="7" fill="#16766b"/><circle cx="928" cy="672" r="7" fill="#16766b"/><circle cx="890" cy="660" r="7" fill="#16766b"/><circle cx="1022" cy="727" r="7" fill="#16766b"/><text x="972" y="804" text-anchor="middle" font-size="24" font-weight="700"><tspan x="972" dy="0">Random example</tspan></text><text x="55" y="855" text-anchor="start" font-size="22" font-weight="400"><tspan x="55" dy="0">Lower panels have equal areas and nine dots each; one dot represents one individual.</tspan></text></g></svg>