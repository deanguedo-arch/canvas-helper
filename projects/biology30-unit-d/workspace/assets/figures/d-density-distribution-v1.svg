<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Separate population size, density and distribution</title><desc id="desc">The upper grids use equal one-hectare cells containing twenty individuals each. Twelve cells hold240 individuals and five hold100; both have density20 individuals per hectare. The lower three equal-area panels each contain nine individuals in uniform, clumped and illustrative random arrangements. Equal density does not imply equal total size or the same spatial pattern.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Separate population size, density and distribution</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Each square below represents 1 hectare and contains 20 individuals.</tspan></text><rect x="100" y="165" width="80" height="80" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="140" y="214" text-anchor="middle" font-size="25" font-weight="400"><tspan x="140" dy="0">20</tspan></text><rect x="180" y="165" width="80" height="80" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="220" y="214" text-anchor="middle" font-size="25" font-weight="400"><tspan x="220" dy="0">20</tspan></text><rect x="260" y="165" width="80" height="80" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="300" y="214" text-anchor="middle" font-size="25" font-weight="400"><tspan x="300" dy="0">20</tspan></text><rect x="340" y="165" width="80" height="80" fill="#f1f5f4" stroke="#627b75" stroke-width="2"/><text x="380" y="214" text-anchor="middle" font-size="25" font-w