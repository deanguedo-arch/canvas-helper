<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Read the peak lag and retain alternative explanations</title><desc id="desc">A fictional paired count series uses one common zero-to100 individual axis and time steps0–12. Prey peak at steps2 and8; predator peaks occur at4 and10, a two-step lag. Solid and dashed lines distinguish the populations. These invented counts are explicitly separate from historical pelt records. The lag is consistent with predator–prey effects but does not exclude food, weather, disease, movement or sampling as contributing causes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Read the peak lag and retain alternative explanations</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Original illustrative counts; these are not the historical hare/lynx pelt records.</tspan></text><path d="M160 550.0 L1110 550.0" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="135" y="558.0" text-anchor="end" font-size="22" font-weight="400"><tspan x="135" dy="0">0</tspan></text><path d="M160 465.0 L1110 465.0" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="135" y="473.0" text-anchor="end" font-size="22" font-weight="400"><tspan x="135" dy="0">25</tspan></text><path d="M160 380.0 L1110 380.0" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="135" y="388.0" text-anchor="end" font-size="22" font-weight="400"><tspan x="135" dy="0">50</tspan></text><path d="M160 295.0 L1110 295.0" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="135" y="303.0" text-anchor="end" font-size="22" font-weight="400"><tspan x="135" dy="0">75</tspan></text><path d="M160 210.0 L1110 210.0" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="135" y="218.0" text-anchor="end" font-size="22" font-weight="400"><tspan x="135" dy="0">100</tspan></text><text x="55" y="167" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Individuals (fictional)</tspan></text><polyline points="160.00,380.00 239.17,295.00 318.33,244.00 397.50,312.00 476.67,414.00 555.83,465.00 635.00,414.00 714.17,312.00 793.33,244.00 872.50,312.00 951.67,414.00 1030.83,465.00 1110.00,397.00" fill="none" stroke="#16766b" stroke-width="4"/><polyline points="160.00,465.00 239.17,448.00 318.33,397.00 397.50,329.00 476.67,295.00 555.83,346.00 635.00,414.00 714.17,448.00 793.33,414.00 872.50,346.00 951.67,295.00 1030.83,346.00 1110.00,414.00" fill="none" stroke="#ae682b" stroke-width="4" stroke-dasharray="10 7"/><text x="160.0" y="589" text-anchor="middle" font-size="22" font-weight="400"><tspan x="160.0" dy="0">0</tspan></text><text x="318.33333333333337" y="589" text-anchor="middle" font-size="22" font-weight="400"><tspan x="318.33333333333337" dy="0">2</tspan></text><text x="476.6666666666667" y="589" text-anchor="middle" font-size="22" font-weight="400"><tspan x="476.6666666666667" dy="0">4</tspan></text><text x="635.0" y="589" text-anchor="middle" font-size="22" font-weight="400"><tspan x="635.0" dy="0">6</tspan></text><text x="793.3333333333334" y="589" text-anchor="middle" font-size="22" font-weight="400"><tspan x="793.3333333333334" dy="0">8</tspan></text><text x="951.6666666666666" y="589" text-anchor="middle" font-size="22" font-weight="400"><tspan x="951.6666666666666" dy="0">10</tspan></text><text x="1110.0" y="589" text-anchor="middle" font-size="22" font-weight="400"><tspan x="1110.0" dy="0">12</tspan></text><text x="645" y="632" text-anchor="middle" font-size="23" font-weight="400"><tspan x="645" dy="0">Time steps</tspan></text><path d="M318.33333333333337 199 L476.6666666666667 199" fill="none" stroke="#526a66" stroke-width="3"/><text x="397.5" y="180" text-anchor="middle" font-size="22" font-weight="400"><tspan x="397.5" dy="0">2-step peak lag</tspan></text><path d="M100 687 L180 687" fill="none" stroke="#16766b" stroke-width="3"/><text x="195" y="695" text-anchor="start" font-size="23" font-weight="400"><tspan x="195" dy="0">Prey</tspan></text><path d="M405 687 L485 687" fill="none" stroke="#ae682b" stroke-width="3" stroke-dasharray="8 6"/><text x="500" y="695" text-anchor="start" font-size="23" font-weight="400"><tspan x="500" dy="0">Predator</tspan></text><text x="55" y="764" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">The lag is consistent with a predator–prey mechanism, not proof of a unique cause.</tspan><tspan x="55" dy="31.05">Food, weather, disease, movement and sampling can also affect both curves.</tspan></text></g></svg>