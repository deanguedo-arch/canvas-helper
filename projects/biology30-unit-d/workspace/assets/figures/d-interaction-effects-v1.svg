<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Compare both participants before naming the relationship</title><desc id="desc">An effect matrix shows mutualism+/+,commensalism+/0,antagonistic interaction+/− and competition−/− relative to suitable comparison conditions. The signs alone do not identify mechanism: predation, parasitism and herbivory can share+/− effects. The measured outcome, participant identities, biological mechanism and context are required. Two rising abundance curves alone cannot prove mutualism.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Compare both participants before naming the relationship</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Define the measured effect on each participant under the stated conditions.</tspan></text><text x="475" y="186" text-anchor="middle" font-size="24" font-weight="700"><tspan x="475" dy="0">Participant A</tspan></text><text x="675" y="186" text-anchor="middle" font-size="24" font-weight="700"><tspan x="675" dy="0">Participant B</tspan></text><text x="55" y="273" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Mutualism</tspan></text><rect x="420" y="230" width="110" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="475" y="278" text-anchor="middle" font-size="35" font-weight="700"><tspan x="475" dy="0">+</tspan></text><rect x="620" y="230" width="110" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="675" y="278" text-anchor="middle" font-size="35" font-weight="700"><tspan x="675" dy="0">+</tspan></text><text x="800" y="260" text-anchor="start" font-size="21" font-weight="400"><tspan x="800" dy="0">Both benefit</tspan></text><text x="55" y="380" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Commensalism</tspan></text><rect x="420" y="337" width="110" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="475" y="385" text-anchor="middle" font-size="35" font-weight="700"><tspan x="475" dy="0">+</tspan></text><rect x="620" y="337" width="110" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="675" y="385" text-anchor="middle" font-size="35" font-weight="700"><tspan x="675" dy="0">0</tspan></text><text x="800" y="367" text-anchor="start" font-size="21" font-weight="400"><tspan x="800" dy="0">One benefits</tspan><tspan x="800" dy="28.35">other effect is about neutral</tspan></text><text x="55" y="487" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Antagonistic interaction</tspan></text><rect x="420" y="444" width="110" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="475" y="492" text-anchor="middle" font-size="35" font-weight="700"><tspan x="475" dy="0">+</tspan></text><rect x="620" y="444" width="110" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="675" y="492" text-anchor="middle" font-size="35" font-weight="700"><tspan x="675" dy="0">−</tspan></text><text x="800" y="474" text-anchor="start" font-size="21" font-weight="400"><tspan x="800" dy="0">One benefits</tspan><tspan x="800" dy="28.35">the other is harmed</tspan></text><text x="55" y="594" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Competition</tspan></text><rect x="420" y="551" width="110" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="475" y="599" text-anchor="middle" font-size="35" font-weight="700"><tspan x="475" dy="0">−</tspan></text><rect x="620" y="551" width="110" height="72" fill="#edf3f1" stroke="#627b75" stroke-width="2"/><text x="675" y="599" text-anchor="middle" font-size="35" font-weight="700"><tspan x="675" dy="0">−</tspan></text><text x="800" y="581" text-anchor="start" font-size="21" font-weight="400"><tspan x="800" dy="0">Both are negatively affected</tspan></text><text x="55" y="740" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">The same +/− signs can describe different mechanisms:</tspan></text><text x="55" y="784" text-anchor="start" font-size="22" font-weight="400"><tspan x="55" dy="0">Predation consumes prey; parasitism exploits a host; herbivory consumes a producer.</tspan><tspan x="55" dy="29.700000000000003">Measure benefits and costs. Two rising population curves alone do not prove mutualism.</tspan></text></g></svg>