<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Separate variant origin from selection</title><desc id="desc">A synthetic bacterial example starts with nineteen susceptible cells and one resistant cell before exposure. Three susceptible and one resistant survive; a later model population has four susceptible and twelve resistant descendants. Labels distinguish cell type as well as colour. The pre-existing variant has greater representation through differential survival and reproductive contribution, not a purposeful mutation in response to need.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">Separate variant origin from selection</tspan></text><text x="55" y="112" text-anchor="start" font-size="24" font-weight="400"><tspan x="55" dy="0">Variant origin occurs before the exposure in this fictional example.</tspan></text><text x="55" y="172" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">Earlier mutation or inherited variation</tspan></text><path d="M55 205 L1120 205" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="1080" y="245" text-anchor="start" font-size="23" font-weight="400"><tspan x="1080" dy="0">Time</tspan></text><text x="180" y="303" text-anchor="middle" font-size="25" font-weight="700"><tspan x="180" dy="0">Before exposure</tspan></text><rect x="75" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="93.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="93.5" dy="0">S</tspan></text><rect x="123" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="141.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="141.5" dy="0">S</tspan></text><rect x="171" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="189.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="189.5" dy="0">S</tspan></text><rect x="219" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="237.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="237.5" dy="0">S</tspan></text><rect x="267" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="285.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="285.5" dy="0">S</tspan></text><rect x="75" y="397" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="93.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="93.5" dy="0">S</tspan></text><rect x="123" y="397" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="141.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="141.5" dy="0">S</tspan></text><rect x="171" y="397" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="189.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="189.5" dy="0">S</tspan></text><rect x="219" y="397" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="237.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="237.5" dy="0">S</tspan></text><rect x="267" y="397" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="285.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="285.5" dy="0">S</tspan></text><rect x="75" y="449" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="93.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="93.5" dy="0">S</tspan></text><rect x="123" y="449" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="141.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="141.5" dy="0">S</tspan></text><rect x="171" y="449" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="189.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="189.5" dy="0">S</tspan></text><rect x="219" y="449" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="237.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="237.5" dy="0">S</tspan></text><rect x="267" y="449" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="285.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="285.5" dy="0">S</tspan></text><rect x="75" y="501" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="93.5" y="523" text-anchor="middle" font-size="20" font-weight="700"><tspan x="93.5" dy="0">S</tspan></text><rect x="123" y="501" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="141.5" y="523" text-anchor="middle" font-size="20" font-weight="700"><tspan x="141.5" dy="0">S</tspan></text><rect x="171" y="501" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="189.5" y="523" text-anchor="middle" font-size="20" font-weight="700"><tspan x="189.5" dy="0">S</tspan></text><rect x="219" y="501" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="237.5" y="523" text-anchor="middle" font-size="20" font-weight="700"><tspan x="237.5" dy="0">S</tspan></text><rect x="267" y="501" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="285.5" y="523" text-anchor="middle" font-size="20" font-weight="700"><tspan x="285.5" dy="0">R</tspan></text><text x="180" y="600" text-anchor="middle" font-size="21" font-weight="400"><tspan x="180" dy="0">19 S + 1 R</tspan><tspan x="180" dy="28.35">A resistant cell is already present.</tspan></text><text x="590" y="303" text-anchor="middle" font-size="25" font-weight="700"><tspan x="590" dy="0">After survival</tspan></text><rect x="485" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="503.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="503.5" dy="0">S</tspan></text><rect x="533" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="551.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="551.5" dy="0">S</tspan></text><rect x="581" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="599.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="599.5" dy="0">S</tspan></text><rect x="629" y="345" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="647.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="647.5" dy="0">R</tspan></text><text x="590" y="600" text-anchor="middle" font-size="21" font-weight="400"><tspan x="590" dy="0">3 S + 1 R</tspan><tspan x="590" dy="28.35">R has the higher survival fraction.</tspan></text><text x="985" y="303" text-anchor="middle" font-size="25" font-weight="700"><tspan x="985" dy="0">Later descendants</tspan></text><rect x="880" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="898.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="898.5" dy="0">S</tspan></text><rect x="928" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="946.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="946.5" dy="0">S</tspan></text><rect x="976" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="994.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="994.5" dy="0">S</tspan></text><rect x="1024" y="345" width="37" height="30" rx="14" fill="#c4e2db" stroke="#526a66" stroke-width="2"/><text x="1042.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="1042.5" dy="0">S</tspan></text><rect x="1072" y="345" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="1090.5" y="367" text-anchor="middle" font-size="20" font-weight="700"><tspan x="1090.5" dy="0">R</tspan></text><rect x="880" y="397" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="898.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="898.5" dy="0">R</tspan></text><rect x="928" y="397" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="946.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="946.5" dy="0">R</tspan></text><rect x="976" y="397" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="994.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="994.5" dy="0">R</tspan></text><rect x="1024" y="397" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="1042.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="1042.5" dy="0">R</tspan></text><rect x="1072" y="397" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="1090.5" y="419" text-anchor="middle" font-size="20" font-weight="700"><tspan x="1090.5" dy="0">R</tspan></text><rect x="880" y="449" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="898.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="898.5" dy="0">R</tspan></text><rect x="928" y="449" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="946.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="946.5" dy="0">R</tspan></text><rect x="976" y="449" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="994.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="994.5" dy="0">R</tspan></text><rect x="1024" y="449" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="1042.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="1042.5" dy="0">R</tspan></text><rect x="1072" y="449" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="1090.5" y="471" text-anchor="middle" font-size="20" font-weight="700"><tspan x="1090.5" dy="0">R</tspan></text><rect x="880" y="501" width="37" height="30" rx="14" fill="#f1d7a9" stroke="#526a66" stroke-width="2"/><text x="898.5" y="523" text-anchor="middle" font-size="20" font-weight="700"><tspan x="898.5" dy="0">R</tspan></text><text x="985" y="600" text-anchor="middle" font-size="21" font-weight="400"><tspan x="985" dy="0">4 S + 12 R</tspan><tspan x="985" dy="28.35">R leaves more descendants.</tspan></text><path d="M315 438 L453 438" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="384" y="370" text-anchor="middle" font-size="21" font-weight="400"><tspan x="384" dy="0">Antibiotic</tspan><tspan x="384" dy="28.35">exposure</tspan></text><path d="M725 438 L852 438" fill="none" stroke="#16766b" stroke-width="3" marker-end="url(#arrow)"/><text x="789" y="370" text-anchor="middle" font-size="20" font-weight="400"><tspan x="789" dy="0">Reproductive</tspan><tspan x="789" dy="27.0">contribution</tspan></text><text x="55" y="707" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">S = susceptible; R = resistant. Each capsule represents one bacterial cell.</tspan></text><text x="55" y="759" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">The chosen counts illustrate differential survival and reproduction.</tspan><tspan x="55" dy="31.05">They are a teaching model, not measured treatment data or a guaranteed outcome.</tspan></text><text x="55" y="847" text-anchor="start" font-size="24" font-weight="700"><tspan x="55" dy="0">Exposure favours existing variation here; it does not specify a needed mutation.</tspan></text></g></svg>