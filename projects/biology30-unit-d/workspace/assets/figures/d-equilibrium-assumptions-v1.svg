<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Separate random combination from long-term stability</title><desc id="desc">Random mating supports the expected genotype combinations. Large population size, no mutation, no contributing gene flow and no selection constrain allele-frequency change. A fit alone does not establish every condition.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="55" text-anchor="start" font-size="32" font-weight="700"><tspan x="55" dy="0">Separate random combination from long-term stability</tspan></text><text x="55" y="114" text-anchor="start" font-size="25" font-weight="700"><tspan x="55" dy="0">Two questions need different model conditions</tspan></text><rect x="55" y="155" width="1090" height="140" fill="#f1f5f4" stroke="#718680" stroke-width="2"/><text x="80" y="193" text-anchor="start" font-size="26" font-weight="700"><tspan x="80" dy="0">How do alleles combine into genotypes?</tspan></text><text x="80" y="236" text-anchor="start" font-size="23" font-weight="400"><tspan x="80" dy="0">Random mating at the locus supports p², 2pq and q² genotype expectations.</tspan><tspan x="80" dy="29.900000000000002">This does not by itself guarantee that p and q stay constant across generations.</tspan></text><text x="55" y="354" text-anchor="start" font-size="26" font-weight="700"><tspan x="55" dy="0">What keeps the allele pool stable across generations?</tspan></text><rect x="55" y="388" width="330" height="82" fill="#edf3f1" stroke="#718680" stroke-width="2"/><rect x="385" y="388" width="760" height="82" fill="#fff" stroke="#718680" stroke-width="2"/><text x="75" y="436" text-anchor="start" font-size="23" font-weight="700"><tspan x="75" dy="0">Very large population</tspan></text><text x="410" y="436" text-anchor="start" font-size="22" font-weight="400"><tspan x="410" dy="0">Limits changes caused by random sampling.</tspan></text><rect x="55" y="470" width="330" height="82" fill="#edf3f1" stroke="#718680" stroke-width="2"/><rect x="385" y="470" width="760" height="82" fill="#fff" stroke="#718680" stroke-width="2"/><text x="75" y="518" text-anchor="start" font-size="23" font-weight="700"><tspan x="75" dy="0">No mutation</tspan></text><text x="410" y="518" text-anchor="start" font-size="22" font-weight="400"><tspan x="410" dy="0">Excludes allele changes that add to or alter the pool.</tspan></text><rect x="55" y="552" width="330" height="82" fill="#edf3f1" stroke="#718680" stroke-width="2"/><rect x="385" y="552" width="760" height="82" fill="#fff" stroke="#718680" stroke-width="2"/><text x="75" y="600" text-anchor="start" font-size="23" font-weight="700"><tspan x="75" dy="0">No contributing gene flow</tspan></text><text x="410" y="600" text-anchor="start" font-size="22" font-weight="400"><tspan x="410" dy="0">Excludes allele input or loss through reproduction and movement.</tspan></text><rect x="55" y="634" width="330" height="82" fill="#edf3f1" stroke="#718680" stroke-width="2"/><rect x="385" y="634" width="760" height="82" fill="#fff" stroke="#718680" stroke-width="2"/><text x="75" y="682" text-anchor="start" font-size="23" font-weight="700"><tspan x="75" dy="0">No selection</tspan></text><text x="410" y="682" text-anchor="start" font-size="22" font-weight="400"><tspan x="410" dy="0">Genotypes make no different reproductive contributions.</tspan></text><text x="55" y="780" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">A match at one locus and time cannot prove that every condition holds.</tspan><tspan x="55" dy="29.900000000000002">A mismatch calls for checking sampling and biology, not naming a cause from fit alone.</tspan></text></g></svg>