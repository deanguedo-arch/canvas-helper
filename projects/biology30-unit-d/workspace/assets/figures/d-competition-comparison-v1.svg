<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Control total density when comparing neighbour effects</title><desc id="desc">Three bars on a common zero-to-five-gram axis show mean mass per A plant:4.0g in five-A pots,3.0g in ten-A pots and2.4g in mixed five-A/five-B pots. The two ten-plant groups hold total starting density constant while changing neighbour composition. The first two groups compare intraspecific density. This supplied classroom dataset is not a complete causal demonstration; replication and resource evidence remain necessary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16766b"/></marker></defs><rect width="1200" height="900" fill="white"/><g fill="#202a2c" font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" text-anchor="start" font-size="31" font-weight="700"><tspan x="55" dy="0">Control total density when comparing neighbour effects</tspan></text><text x="55" y="111" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Supplied classroom comparison: mean mass per A plant, not total pot mass.</tspan></text><path d="M150 500 L1100 500" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="125" y="508" text-anchor="end" font-size="22" font-weight="400"><tspan x="125" dy="0">0</tspan></text><path d="M150 445 L1100 445" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="125" y="453" text-anchor="end" font-size="22" font-weight="400"><tspan x="125" dy="0">1</tspan></text><path d="M150 390 L1100 390" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="125" y="398" text-anchor="end" font-size="22" font-weight="400"><tspan x="125" dy="0">2</tspan></text><path d="M150 335 L1100 335" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="125" y="343" text-anchor="end" font-size="22" font-weight="400"><tspan x="125" dy="0">3</tspan></text><path d="M150 280 L1100 280" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="125" y="288" text-anchor="end" font-size="22" font-weight="400"><tspan x="125" dy="0">4</tspan></text><path d="M150 225 L1100 225" fill="none" stroke="#d5ddda" stroke-width="3"/><text x="125" y="233" text-anchor="end" font-size="22" font-weight="400"><tspan x="125" dy="0">5</tspan></text><text x="55" y="170" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">Mean A mass (g)</tspan></text><rect x="235" y="280.0" width="130" height="220.0" fill="#c4e2db" stroke="#627b75" stroke-width="2"/><text x="300" y="260.0" text-anchor="middle" font-size="25" font-weight="700"><tspan x="300" dy="0">4.0</tspan></text><text x="300" y="542" text-anchor="middle" font-size="24" font-weight="400"><tspan x="300" dy="0">5 A</tspan><tspan x="300" dy="32.400000000000006">5 plants total</tspan></text><rect x="570" y="335.0" width="130" height="165.0" fill="#c4e2db" stroke="#627b75" stroke-width="2"/><text x="635" y="315.0" text-anchor="middle" font-size="25" font-weight="700"><tspan x="635" dy="0">3.0</tspan></text><text x="635" y="542" text-anchor="middle" font-size="24" font-weight="400"><tspan x="635" dy="0">10 A</tspan><tspan x="635" dy="32.400000000000006">10 plants total</tspan></text><rect x="905" y="368.0" width="130" height="132.0" fill="#c4e2db" stroke="#627b75" stroke-width="2"/><text x="970" y="348.0" text-anchor="middle" font-size="25" font-weight="700"><tspan x="970" dy="0">2.4</tspan></text><text x="970" y="542" text-anchor="middle" font-size="24" font-weight="400"><tspan x="970" dy="0">5 A + 5 B</tspan><tspan x="970" dy="32.400000000000006">10 plants total</tspan></text><path d="M615 629 L990 629" fill="none" stroke="#ae682b" stroke-width="3"/><text x="800" y="675" text-anchor="middle" font-size="23" font-weight="700"><tspan x="800" dy="0">Same total starting density; different neighbours</tspan></text><text x="55" y="750" text-anchor="start" font-size="23" font-weight="400"><tspan x="55" dy="0">5 A versus 10 A addresses an intraspecific density contrast.</tspan><tspan x="55" dy="31.05">10 A versus 5 A + 5 B holds total count at ten while changing composition.</tspan><tspan x="55" dy="31.05">Replication and resource measurements are still needed to identify the mechanism.</tspan></text></g></svg>