<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Survivorship is not population size through time</title><desc>The curves compare survival across age: Type I has greater late loss, Type II a steadier risk on a log-survivor plot, and Type III strong early loss.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Survivorship is not population size through time</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Constructed patterns — vertical axis is log survivors</text><line x1="150" y1="660" x2="1260" y2="660" stroke="#171b1b" stroke-width="3"/><polygon points="1260.0,660.0 1245.1,668.2 1245.1,651.8" fill="#171b1b"/><line x1="150" y1="660" x2="150" y2="175" stroke="#171b1b" stroke-width="3"/><polygon points="150.0,175.0 158.2,189.9 141.8,189.9" fill="#171b1b"/><text x="710" y="725" font-family="Arial,sans-serif" font-size="28" fill="#171b1b" text-anchor="middle" font-weight="400">Age</text><text x="95" y="205" font-family="Arial,sans-serif" font-size="22" fill="#171b1b" text-anchor="middle" font-weight="400">log</text><text x="78" y="235" font-family="Arial,sans-serif" font-size="20" fill="#171b1b" text-anchor="middle" font-weight="400">survivors</text><polyline points="150,205 550,220 850,270 1000,420 1170,640" fill="none" stroke="#146c60" stroke-width="6"/><polyline points="150,205 1170,640" fill="none" stroke="#367aaa" stroke-width="6"/><polyline points="150,205 235,410 430,550 750,610 1170,640" fill="none" stroke="#c27832" stroke-width="6"/><line x1="780" y1="170" x2="720" y2="250" stroke="#171b1b" stroke-width="2.5"/><circle cx="720" cy="250" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="780" cy="170" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="780" y="178" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><line x1="820" y1="390" x2="740" y2="457" stroke="#171b1b" stroke-width="2.5"/><circle cx="740" cy="457" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="820" cy="390" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="820" y="398" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><line x1="430" y1="660" x2="420" y2="545" stroke="#171b1b" stroke-width="2.5"/><circle cx="420" cy="545" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="430" cy="660" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="430" y="668" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="790" font-family="Arial,sans-serif" font-size="21" fill="#5b635d">Use the lettered features and the nearby lesson explanation.</text></svg>