<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Classify the effects on both partners</title><desc>Each pair of signs records the effects on the two partners in the stated setting, not moral value. A plus indicates benefit, zero no appreciable effect and minus harm.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Classify the effects on both partners</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><rect x="110" y="280" width="355" height="250" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="288" y="400" font-family="Arial,sans-serif" font-size="64" fill="#146c60" text-anchor="middle" font-weight="400">+/+</text><circle cx="288" cy="610" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="288" y="618" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><rect x="560" y="280" width="355" height="250" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="738" y="400" font-family="Arial,sans-serif" font-size="64" fill="#146c60" text-anchor="middle" font-weight="400">+/0</text><circle cx="738" cy="610" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="738" y="618" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><rect x="1010" y="280" width="355" height="250" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="1188" y="400" font-family="Arial,sans-serif" font-size="64" fill="#146c60" text-anchor="middle" font-weight="400">+/−</text><circle cx="1188" cy="610" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1188" y="618" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="790" font-family="Arial,sans-serif" font-size="21" fill="#5b635d">Use the lettered features and the nearby lesson explanation.</text></svg>