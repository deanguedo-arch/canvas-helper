<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Succession depends on what remains</title><desc>The upper case starts on exposed rock without developed soil. The lower case retains soil, seeds and roots after disturbance. Local conditions influence the subsequent pathway.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Succession depends on what remains</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><rect x="80" y="185" width="850" height="150" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><line x1="115" y1="265" x2="880" y2="265" stroke="#c27832" stroke-width="5"/><polygon points="130,260 170,235 220,260" fill="#c2c9c2"/><polygon points="250,260 290,235 340,260" fill="#c2c9c2"/><polygon points="370,260 410,235 460,260" fill="#c2c9c2"/><polygon points="490,260 530,235 580,260" fill="#c2c9c2"/><polygon points="610,260 650,235 700,260" fill="#c2c9c2"/><polygon points="730,260 770,235 820,260" fill="#c2c9c2"/><text x="500" y="230" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">Exposed rock; little biological legacy</text><line x1="950" y1="245" x2="1080" y2="245" stroke="#146c60" stroke-width="5"/><polygon points="1080.0,245.0 1065.1,253.2 1065.1,236.8" fill="#146c60"/><circle cx="1180" cy="245" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1180" y="253" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><rect x="80" y="475" width="850" height="150" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><line x1="115" y1="555" x2="880" y2="555" stroke="#c27832" stroke-width="16"/><line x1="155" y1="545" x2="175" y2="515" stroke="#146c60" stroke-width="4"/><circle cx="170" cy="580" r="6" fill="#c27832" stroke="#c27832" stroke-width="3"/><line x1="250" y1="545" x2="270" y2="515" stroke="#146c60" stroke-width="4"/><circle cx="265" cy="580" r="6" fill="#c27832" stroke="#c27832" stroke-width="3"/><line x1="345" y1="545" x2="365" y2="515" stroke="#146c60" stroke-width="4"/><circle cx="360" cy="580" r="6" fill="#c27832" stroke="#c27832" stroke-width="3"/><line x1="440" y1="545" x2="460" y2="515" stroke="#146c60" stroke-width="4"/><circle cx="455" cy="580" r="6" fill="#c27832" stroke="#c27832" stroke-width="3"/><line x1="535" y1="545" x2="555" y2="515" stroke="#146c60" stroke-width="4"/><circle cx="550" cy="580" r="6" fill="#c27832" stroke="#c27832" stroke-width="3"/><line x1="630" y1="545" x2="650" y2="515" stroke="#146c60" stroke-width="4"/><circle cx="645" cy="580" r="6" fill="#c27832" stroke="#c27832" stroke-width="3"/><line x1="725" y1="545" x2="745" y2="515" stroke="#146c60" stroke-width="4"/><circle cx="740" cy="580" r="6" fill="#c27832" stroke="#c27832" stroke-width="3"/><line x1="820" y1="545" x2="840" y2="515" stroke="#146c60" stroke-width="4"/><circle cx="835" cy="580" r="6" fill="#c27832" stroke="#c27832" stroke-width="3"/><text x="500" y="520" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">Soil, seeds and roots remain</text><line x1="950" y1="535" x2="1080" y2="535" stroke="#146c60" stroke-width="5"/><polygon points="1080.0,535.0 1065.1,543.2 1065.1,526.8" fill="#146c60"/><circle cx="1180" cy="535" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1180" y="543" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">A · Primary succession</text><text x="495" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171