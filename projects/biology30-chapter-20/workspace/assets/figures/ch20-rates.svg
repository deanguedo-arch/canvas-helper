<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Choose the denominator that answers the question</title><desc>For N₀ = 200 and N₁ = 260 over three years, change is 60, average rate is 20 individuals/year and interval per-capita change is 0.30.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Choose the denominator that answers the question</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Constructed example — a three-year interval is not one year</text><rect x="120" y="190" width="1120" height="125" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="250" y="240" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="start" font-weight="400">260 − 200</text><text x="750" y="245" font-family="Arial,sans-serif" font-size="28" fill="#146c60" text-anchor="middle" font-weight="400">60 individuals</text><circle cx="1275" cy="250" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1275" y="258" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><rect x="120" y="360" width="1120" height="125" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="250" y="410" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="start" font-weight="400">(260 − 200) / 3</text><text x="750" y="415" font-family="Arial,sans-serif" font-size="28" fill="#146c60" text-anchor="middle" font-weight="400">20 individuals/year</text><circle cx="1275" cy="420" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1275" y="428" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">B</text><rect x="120" y="530" width="1120" height="125" rx="12" fill="#f0f6f3" stroke="#d9ded8" stroke-width="2"/><text x="250" y="580" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="start" font-weight="400">(260 − 200) / 200</text><text x="750" y="585" font-family="Arial,sans-serif" font-size="28" fill="#146c60" text-anchor="middle" font-weight="400">0.30 over three years</text><circle cx="1275" cy="590" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="1275" y="598" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">C</text><line x1="50" y1="757" x2="1350" y2="757" stroke="#d9ded8" stroke-width="2"/><text x="50" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">A · Net change</text><text x="495" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">B · Average growth rate</text><text x="940" y="782" font-family="Arial,sans-serif" font-size="19" fill="#171b1b">C · Interval per-capita change</text></svg>