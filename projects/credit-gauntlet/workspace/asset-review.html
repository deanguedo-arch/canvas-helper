<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credit Gauntlet — original assets</title><link rel="stylesheet" href="styles.css"><style>body{padding:30px}h1{font-size:26px}p{margin:12px 0 20px}.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px}.asset{background:#f5ebcb;color:#123532;padding:12px}.asset img{display:block;object-fit:contain;width:100%;height:110px;image-rendering:pixelated}.asset small{display:block;padding-top:8px}</style></head><body><h1>Original supplied art · 40 assets</h1><p>Original canvases and PNG bytes are preserved. All controls and financial text are native HTML. <a href="index.html">Return to game</a></p><div class="assets" id="assets"></div><script>const ids=['BG01','BG02','PN01','PN02','PN03','BP01','BP02','BP03','BP04','BS01','BS02','BS03','BS04','TB01','TB02','TB03','SL01','SL02','SL03','BD01','BD02','BD03',...Array.from({length:18},(_,i)=>'IC'+String(i+1).padStart(2,'0'))];for(const id of ids){const el=document.createElement('div');el.className='asset';const image=document.createElement('img');image.src='assets/'+id+'.png';image.alt=id+' original asset';const text=document.createElement('small');text.textContent=id;el.append(image,text);document.getElementById('assets').append(el);}</script></body></html>
