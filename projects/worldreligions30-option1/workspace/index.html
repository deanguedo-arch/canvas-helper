<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Religions 30 | Option 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Serif:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-project-slug="worldreligions30-option1" data-shell-variant="option-1">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand-lockup">
          <div class="brand-text">
            <h1>World Religions 30</h1>
          </div>
          <div class="sidebar-progress" aria-label="Course progress">
            <div id="sidebar-progress-track" class="sidebar-progress-track" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="sidebar-progress-fill" class="sidebar-progress-fill"></div>
            </div>
          </div>
        </div>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" title="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="Primary navigation">
        <div class="nav-group primary-nav">
          <button id="nav-home" class="nav-item active" type="button">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </button>
          <button id="nav-library" class="nav-item" type="button">
            <i class="fa-solid fa-book-open"></i>
            <span>Library</span>
          </button>
        </div>

        <div class="nav-group home-tabs" aria-label="Home sections">
          <button id="tab-chapters" class="home-tab active" type="button">
            <i class="fa-solid fa-scroll"></i>
            <span>Chapters</span>
          </button>
          <button id="tab-quizzes" class="home-tab" type="button">
            <i class="fa-solid fa-circle-question"></i>
            <span>Quizzes</span>
          </button>
          <button id="tab-assignments" class="home-tab" type="button">
            <i class="fa-solid fa-pen"></i>
            <span>Assignments</span>
          </button>
        </div>
      </nav>
    </aside>

    <main class="content">
      <div class="content-inner">
        <section class="progress-shell is-hero" aria-label="Course progress">
          <div class="progress-panel">
            <div class="progress-copy">
              <div class="progress-hero-top">
                <div class="progress-inline">
                  <span class="metric-label">Overall progress</span>
                  <strong id="progress-percent">0%</strong>
                </div>
                <div class="progress-inline-status">
                  <div>
                    <span class="metric-label">Unlocked chapters</span>
                    <strong id="chapter-progress">1/10</strong>
                  </div>
                  <div>
                    <span class="metric-label">Completed quizzes</span>
                    <strong id="quiz-progress">0/10</strong>
                  </div>
                </div>
              </div>
              <div id="progress-track" class="progress-track" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
              <h2 id="course-title">World Religions 30</h2>
              <p id="course-subtitle">A comparative course shell for chapter study, quiz review, and local library reading.</p>
            </div>
          </div>
        </section>

        <section class="content-shell">
          <div class="section-header">
            <h3 id="section-title">Chapters</h3>
            <p id="section-intro">Browse chapter shells, recreated quizzes, and the local chapter library.</p>
          </div>
          <div id="content-body" class="content-body"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="viewer-overlay" class="viewer-overlay" hidden>
    <div class="viewer-overlay-panel">
      <div class="viewer-overlay-bar">
        <div>
          <p id="overlay-code" class="overlay-code"></p>
          <h2 id="overlay-title" class="overlay-title"></h2>
        </div>
        <div class="viewer-overlay-actions">
          <a id="overlay-download" class="btn btn-primary" href="#" download>Download PDF</a>
          <button id="overlay-close" class="btn btn-secondary" type="button">Close viewer</button>
        </div>
      </div>
      <div class="viewer-overlay-frame">
        <iframe id="overlay-frame" title="Expanded PDF viewer"></iframe>
      </div>
    </div>
  </div>

  <script src="./course-data.js"></script>
  <script src="./main.js"></script>
</body>
</html>
