<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 1 | Religion in Popular Culture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Serif:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./chapter1interactive.css" />
</head>
<body>
  <div class="assignment-shell">
    <aside class="assignment-sidebar">
      <div class="sidebar-copy">
        <p class="assignment-code">Assignment 1</p>
        <h1>Religion in Popular Culture</h1>
        <p class="assignment-summary">Use one media text with religious themes and build a short analytical report for Chapter 1.</p>
      </div>

      <nav id="step-nav" class="step-nav" aria-label="Assignment steps"></nav>

      <div class="sidebar-note">
        Use reliable sources, name the media text clearly, and support your critique with two specific examples.
      </div>
    </aside>

    <main class="assignment-main">
      <header class="assignment-header">
        <div>
          <p id="step-code" class="section-code"></p>
          <h2 id="step-title"></h2>
          <p id="step-copy" class="step-copy"></p>
        </div>

        <div class="assignment-status" aria-live="polite">
          <div class="status-block">
            <span class="status-label">Progress</span>
            <strong id="progress-value">0/6</strong>
          </div>
          <div class="status-block">
            <span class="status-label">Saved</span>
            <strong id="save-state">Local only</strong>
          </div>
        </div>
      </header>

      <section id="step-panel" class="assignment-panel"></section>

      <footer class="assignment-footer">
        <button id="reset-work" class="button button-secondary" type="button">Reset work</button>
        <div class="footer-actions">
          <button id="prev-step" class="button button-secondary" type="button">Previous</button>
          <button id="generate-report" class="button button-report" type="button">Generate report</button>
        </div>
      </footer>
    </main>
  </div>

  <script src="./chapter1interactive.js"></script>
</body>
</html>
