<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Coding DNA, template DNA and mRNA</title><desc>RNA polymerase reads the template 3′ to 5′ to produce complementary RNA 5′ to 3′. Coding DNA matches the message apart from T versus U.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Coding DNA, template DNA and mRNA</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><rect x="350" y="185" width="970" height="105" rx="12" fill="#f7f8f4" stroke="#d9ded8" stroke-width="2"/><text x="835.0" y="221" font-family="Arial,sans-serif" font-size="32" fill="#171b1b" text-anchor="middle" font-weight="400">5′– ATG  AAA  GGG  TAA –3′</text><rect x="350" y="325" width="970" height="105" rx="12" fill="#f7f8f4" stroke="#d9ded8" stroke-width="2"/><text x="835.0" y="361" font-family="Arial,sans-serif" font-size="32" fill="#171b1b" text-anchor="middle" font-weight="400">3′– TAC  TTT  CCC  ATT –5′</text><rect x="350" y="570" width="970" height="105" rx="12" fill="#f7f8f4" stroke="#d9ded8" stroke-width="2"/><text x="835.0" y="606" font-family="Arial,sans-serif" font-size="32" fill="#171b1b" text-anchor="middle" font-weight="400">5′– AUG  AAA  GGG  UAA –3′</text><line x1="155" y1="230" x2="350" y2="230" stroke="#171b1b" stroke-width="2.5"/><circle cx="350" cy="230" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="155" cy="230" r="22" fill="white" stroke="#146c60" stroke-width="2.5"/><text x="155" y="238" font-family="Arial,sans-serif" font-size="23" fill="#171b1b" text-anchor="middle" font-weight="700">A</text><line x1="155" y1="370" x2="350" y2="370" stroke="#171b1b" stroke-width="2.5"/><circle cx="350" cy="370" r="5" fill="#171b1b" stroke="white" stroke-width="2"/><circle cx="155" cy="370" r="22