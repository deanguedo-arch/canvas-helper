<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Complementarity and antiparallel direction</title><desc>An upper 5′-ATGC-3′ strand aligns with a lower 3′-TACG-5′ strand. The bases pair A–T and G–C, while strand directions oppose each other.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Complementarity and antiparallel direction</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><line x1="200" y1="270" x2="1200" y2="270" stroke="#146c60" stroke-width="9"/><line x1="200" y1="535" x2="1200" y2="535" stroke="#146c60" stroke-width="9"/><text x="140" y="280" font-family="Arial,sans-serif" font-size="34" fill="#171b1b" text-anchor="middle" font-weight="400">5′</text><text x="1270" y="280" font-family="Arial,sans-serif" font-size="34" fill="#171b1b" text-anchor="middle" font-weight="400">3′</text><text x="140" y="545" font-family="Arial,sans-serif" font-size="34" fill="#171b1b" text-anchor="middle" font-weight="400">3′</text><text x="1270" y="545" font-family="Arial,sans-serif" font-size="34" fill="#171b1b" text-anchor="middle" font-weight="400">5′</text><line x1="340" y1="270" x2="340" y2="345" stroke="#171b1b" stroke-width="3"/><line x1="340" y1="455" x2="340" y2="535" stroke="#171b1b" stroke-width="3"/><rect x="285" y="345" width="110" height="110" rx="12" fill="#f6f0df" stroke="#d9ded8" stroke-width="2"/><text x="340.0" y="381" font-family="Arial,sans-serif" font-size="26" fill="#171b1b" text-anchor="middle" font-weight="400">A / T</text><line x1="305" y1="408" x2="375" y2="408" stroke="#146c60" stroke-width="2" stroke-dasharray="5 5"/><line x1="570" y1="270" x2="570" y2="345" stroke="#171b1b" stroke-width="3"/><line x1="570" y1="455" x2="570" y2="535" stroke="#171b1b" stroke-width="3"