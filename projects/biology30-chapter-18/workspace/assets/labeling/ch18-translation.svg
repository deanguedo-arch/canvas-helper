<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Read the message in codons</title><desc>A ribosome reads mRNA 5′ to 3′. A paired tRNA anticodon supplies its amino acid; the stop codon terminates rather than adding an amino acid.</desc><rect width="1400" height="900" fill="white"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#154212" text-anchor="start" font-weight="700">Read the message in codons</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" fill="#5b635d" text-anchor="start" font-weight="400">Schematic — not to scale</text><line x1="130" y1="490" x2="1260" y2="490" stroke="#146c60" stroke-width="7"/><rect x="140" y="450" width="200" height="82" rx="12" fill="#e7f1ea" stroke="#d9ded8" stroke-width="2"/><text x="240.0" y="486" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">AUG</text><rect x="380" y="450" width="200" height="82" rx="12" fill="#e7f1ea" stroke="#d9ded8" stroke-width="2"/><text x="480.0" y="486" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">UUU</text><rect x="620" y="450" width="200" height="82" rx="12" fill="#e7f1ea" stroke="#d9ded8" stroke-width="2"/><text x="720.0" y="486" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">GGC</text><rect x="980" y="450" width="200" height="82" rx="12" fill="#e7f1ea" stroke="#d9ded8" stroke-width="2"/><text x="1080.0" y="486" font-family="Arial,sans-serif" font-size="30" fill="#171b1b" text-anchor="middle" font-weight="400">UAA</text><text x="95" y="505" font-family="Arial,sans-serif" font-size="28" fill="#171b1b" text-anchor="start" font-weight="400">5′</text><text x="1300" y="505" font-family="Arial,sans-serif" font-size="28" fill="#171b1b" text-anchor="start" font-weight="400">3′</text><ellipse cx="720" cy="470" rx="165" ry="135" fill="none" stroke="#