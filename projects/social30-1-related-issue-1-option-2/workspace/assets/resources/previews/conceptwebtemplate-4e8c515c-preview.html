<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept Map Template</title>
  <style>
    html {
      background: #F9F9F8;
      color: #191C1C;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 28px;
      font-size: 16px;
      line-height: 1.6;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 1px solid #DDE2DD;
      border-radius: 10px;
      padding: 28px;
    }
    h1, h2, h3 {
      color: #155608;
      line-height: 1.15;
    }
    h1 {
      margin: 0 0 20px;
      color: #191C1C;
      font-size: 28px;
    }
    p {
      margin: 0 0 14px;
    }
    a {
      color: #155608;
      font-weight: 700;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
    }
    th, td {
      border: 1px solid #DDE2DD;
      padding: 8px;
      vertical-align: top;
    }
    th {
      background: #155608;
      color: #FFFFFF;
      text-align: left;
    }
    ul, ol {
      padding-left: 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Concept Map Template</h1>
    <p class="p1"><br></p>
  </main>
</body>
</html>
