<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Option Two review</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f7f8f5;color:#171b1b}header{display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid #d9ded8;background:white;min-height:60px}h1{font-size:18px;margin:0}label{display:flex;align-items:center;gap:10px}select,a{padding:8px}select{max-width:100%;border:1px solid #8e9c92;border-radius:3px;background:white}a{color:#146c60}iframe{display:block;border:0;width:100%;height:calc(100dvh - 61px)}@media(max-width:600px){header{flex-wrap:wrap;gap:8px;padding:10px}h1{width:100%}label{flex:1;min-width:0;font-size:12px}select{min-width:0;flex:1}iframe{height:calc(100dvh - 100px)}}</style></head><body><header><h1>Social Option Two review</h1><label>Course <select id="course"><optgroup label="Social Studies 10-1"><option value="social10-1-related-issue-1-option-2">Social 10-1 · Related Issue 1</option><option value="social10-1-related-issue-2-option-2">Social 10-1 · Related Issue 2</option><option value="social10-1-related-issue-3-option-2">Social 10-1 · Related Issue 3</option><option value="social10-1-related-issue-4-option-2">Social 10-1 · Related Issue 4</option></optgroup><optgroup label="Social Studies 20-1"><option value="social20-1-related-issue-1-option-2">Social 20-1 · Related Issue 1</option><option value="social20-1-related-issue-2-option-2">Social 20-1 · Related Issue 2</option><option value="social20-1-related-issue-3-option-2">Social 20-1 · Related Issue 3</option><option value="social20-1-related-issue-4-option-2">Social 20-1 · Related Issue 4</option></optgroup><optgroup label="Social Studies 30-1"><option value="social30-1-related-issue-1-option-2">Social 30-1 · Related Issue 1</option><option value="social30-1-related-issue-2-option-2">Social 30-1 · Related Issue 2</option><option value="social30-1-related-issue-3-option-2">Social 30-1 · Related Issue 3</option><option value="social30-1-related-issue-4-option-2">Social 30-1 · Related Issue 4</option></optgroup></select></label><a id="open" target="_blank" rel="noopener">Open course</a></header><iframe title="Selected Social course" id="preview"></iframe><script>const picker=document.getElementById('course'),frame=document.getElementById('preview'),link=document.getElementById('open');function select(){const slug=picker.value,url='../../'+slug+'/workspace/index.html';frame.src=url;link.href=url;history.replaceState(null,'','#'+slug);}const choice=location.hash.slice(1);if([...picker.options].some(o=>o.value===choice))picker.value=choice;picker.addEventListener('change',select);select();</script></body></html>
