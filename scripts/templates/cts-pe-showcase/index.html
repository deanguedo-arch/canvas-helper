<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Next Step course library · Teacher review</title>
  <link rel="stylesheet" href="showcase.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Next Step course library">
      <img src="assets/nxt-ce-logo-white-with-ce.png" alt="Next Step Continuing Education">
    </a>
    <div class="header-copy">
      <strong>Course library</strong>
      <span>Teacher review · six courses</span>
