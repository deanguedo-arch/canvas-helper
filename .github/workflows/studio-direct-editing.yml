name: Studio Direct Editing release gate

on:
  pull_request: {}
  push:
    branches:
      - codex/studio-direct-editing-v1

concurrency:
  group: studio-direct-editing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository and course assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and course OCR dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils tesseract-ocr
          pdftoppm -v
          tesseract --version

      - name: Run focused Direct Editing tests
        run: npm run test:course-editing

      - name: Record the expected raw TypeScript diagnostic baseline
        run: |
          mkdir -p .runtime
          set +e
          npm run typecheck -- --pretty false > .runtime/raw-typecheck.txt 2>&1
          typecheck_status=$?
          cat .runtime/raw-typecheck.txt
          if [[ "$typecheck_status" -ne 2 ]]; then
            echo "Expected the established raw typecheck exit code 2; received $typecheck_status." >&2
            exit 1
          fi

      - name: Verify no TypeScript diagnostic changed from the frozen baseline
        run: npm run verify:typecheck-baseline

      - name: Run editability census contracts
        run: npm run test:course-editability

      - name: Verify export evidence contracts
        run: npm run test:exports

      - name: Run Studio release gate
        run: npm run test:studio-release

      - name: Run real Direct, English, Social, and snapshot HTTP-route pilots
        run: npm run verify:course-editing-pilots

      - name: Verify the full onboarded catalog through public edit routes
        run: npm run verify:course-onboarding -- --all

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-direct-editing-release-evidence
          if-no-files-found: warn
          path: |
            .runtime/studio-release-report.json
            .runtime/course-editing-pilots.json
            .runtime/course-onboarding-verification.json
            .runtime/raw-typecheck.txt

  editability-census:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository and course assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and course OCR dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils tesseract-ocr
          pdftoppm -v
          tesseract --version

      - name: Build exact-head all-catalog editability evidence
        run: npm run report:course-editability -- --all --allow-incomplete --report .runtime/course-editability-report.json

      - name: Upload editability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-course-editability-evidence
          if-no-files-found: warn
          path: .runtime/course-editability-report.json
